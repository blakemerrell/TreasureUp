<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0a14">
<title>Title of Liberty</title>
<!-- A strategy game from the Book of Mormon. Each mission opens once its
     chapter has been read. The rules live in data.js?v=10, sim.js?v=10 and missions.js
     (tested by tools/test-liberty.mjs); this page draws them and takes orders. -->
<link rel="icon" href="../icons/icon-192.png">
<link rel="apple-touch-icon" href="../icons/apple-touch-icon.png">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #0a0a14; --panel: rgba(30, 20, 12, .93); --line: rgba(255, 255, 255, .12);
    --brass: #c9962e; --brass-hi: #ecc764; --trim: rgba(236, 199, 100, .3); --parch: #f4e8cc; --parch-dim: rgba(244, 232, 204, .7);
    --gold: #fcd34d; --gold-deep: #d97706; --sky: #7dd3fc; --good: #6ee7b7; --warn: #fca5a5; --dim: rgba(255, 255, 255, .6);
    --top: 48px; --drawer: clamp(210px, 40vh, 340px);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--ink); color: #fff; overflow: hidden; overscroll-behavior: none;
    font-family: 'Outfit', ui-sans-serif, system-ui, sans-serif; -webkit-tap-highlight-color: transparent; }
  /* The page itself never zooms or scrolls in a battle: fingers move the map instead. */
  body.playing { touch-action: none; -webkit-user-select: none; user-select: none; }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; touch-action: manipulation; }
  button:disabled { cursor: default; opacity: .45; }
  a { color: var(--gold); }
  [hidden] { display: none !important; }
  svg.i { width: 16px; height: 16px; vertical-align: -3px; flex: none; }

  #view { position: fixed; inset: 0; display: block; touch-action: none; cursor: default; }
  #view.placing { cursor: crosshair; }

  /* ---------------------------------------------------------------- top bar */
  #hud { position: fixed; left: 0; right: 0; top: 0; height: var(--top); display: flex; align-items: center; gap: 10px;
    padding: 0 10px; padding-left: max(10px, env(safe-area-inset-left)); padding-right: max(10px, env(safe-area-inset-right));
    background: linear-gradient(180deg, #2f2013, #22170d); border-bottom: 2px solid var(--brass); z-index: 10; color: var(--parch); }
  .hb { flex: none; height: 34px; min-width: 34px; padding: 0 10px; border-radius: 10px; background: rgba(255, 255, 255, .08);
    font-weight: 700; font-size: 14px; white-space: nowrap; }
  .hb:hover { background: rgba(255, 255, 255, .14); }
  .hb.gold { background: linear-gradient(#f2cf6b, #c9962e); color: #1d1206; }
  .hb.gold:disabled { background: rgba(236, 199, 100, .22); color: var(--parch); opacity: 1; }
  .res { display: flex; align-items: center; gap: 5px; font-weight: 800; font-size: 15px; font-variant-numeric: tabular-nums; white-space: nowrap; flex: none; }
  .res b { min-width: 2.2em; }
  #clock { font-size: 13px; color: var(--dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
  #clock b { color: #fff; font-size: 15px; font-variant-numeric: tabular-nums; }
  .res small { font-size: .78em; font-weight: 700; color: var(--parch-dim); }
  #food { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--warn); font-weight: 700; white-space: nowrap; }
  #food i { display: block; width: 90px; height: 8px; border-radius: 4px; background: rgba(255, 255, 255, .12); overflow: hidden; }
  #food em { display: block; height: 100%; width: 100%; background: linear-gradient(90deg, #ef4444, #f59e0b); }
  .grow { flex: 1; }

  #cry { position: fixed; left: 50%; top: calc(var(--top) + 14px); max-width: calc(100vw - 24px); transform: translateX(-50%); z-index: 12;
    padding: 12px 22px; border-radius: 999px; background: linear-gradient(180deg, #fde68a, #f59e0b); color: #1a1405;
    font-weight: 900; font-size: 17px; box-shadow: 0 6px 30px rgba(245, 158, 11, .55); animation: glow 1.4s ease-in-out infinite; }
  #cry small { display: block; font-weight: 700; font-size: 11px; opacity: .75; }
  @keyframes glow { 50% { box-shadow: 0 6px 44px rgba(253, 230, 138, .9); } }

  /* -------------------------------------------------------- goals and story */
  #goals { position: fixed; left: 8px; top: calc(var(--top) + 8px); width: min(300px, 46vw); z-index: 9;
    background: var(--panel); border: 1px solid var(--line); border-radius: 12px; font-size: 13px; }
  #goals summary { list-style: none; padding: 8px 12px; font-weight: 800; cursor: pointer; display: flex; justify-content: space-between; }
  #goals summary::-webkit-details-marker { display: none; }
  #goals summary::after { content: '▾'; color: var(--dim); }
  #goals:not([open]) summary::after { content: '▸'; }
  #goals ul { list-style: none; margin: 0; padding: 0 12px 10px; display: grid; gap: 6px; }
  #goals li { display: grid; grid-template-columns: 18px 1fr auto; gap: 4px; align-items: baseline; line-height: 1.25; }
  #goals li.done { color: var(--good); }
  #goals li.opt { color: var(--dim); }
  #goals li .n { font-variant-numeric: tabular-nums; font-weight: 700; }
  .ref { color: var(--gold); font-weight: 700; font-size: 11px; white-space: nowrap; text-decoration: underline; text-decoration-color: rgba(252, 211, 77, .35); text-underline-offset: 2px; }
  #goals .ref { font-size: 10px; padding: 0; }

  #feed { position: fixed; right: 8px; top: calc(var(--top) + 8px); width: min(360px, 50vw); z-index: 9; display: grid; gap: 6px; pointer-events: none; }
  .msg { pointer-events: none; background: var(--panel); border: 1px solid var(--line); border-left: 4px solid #fff; border-radius: 10px;
    padding: 7px 10px; font-size: 13px; line-height: 1.3; animation: in .25s ease-out; transition: opacity .6s; }
  .msg.tip { border-left-color: var(--sky); } .msg.warn { border-left-color: #ef4444; } .msg.good { border-left-color: #10b981; }
  .msg.rule { border-left-color: var(--gold); } .msg.me { border-left-color: #a78bfa; }
  .msg.old { opacity: 0; }
  .msg .ref { margin-left: 4px; pointer-events: auto; }
  @keyframes in { from { transform: translateY(-6px); opacity: 0; } }

  /* ------------------------------------------------------------ the command panel
     Wider than tall (body.side): a panel down the right, like Red Alert's sidebar.
     Held upright: a drawer along the bottom. ui.js decides which, in resize(). */
  #panel { position: fixed; z-index: 10; display: grid; gap: 8px; padding: 8px; color: var(--parch);
    background: linear-gradient(180deg, #2f2013, #1c130b); }
  body:not(.side) #panel { left: 0; right: 0; bottom: 0; height: var(--drawer);
    grid-template-columns: minmax(0, 1fr) 136px; grid-template-rows: auto minmax(0, 1fr); grid-template-areas: "info side" "cmds cmds";
    padding-bottom: max(8px, env(safe-area-inset-bottom)); padding-left: max(8px, env(safe-area-inset-left)); padding-right: max(8px, env(safe-area-inset-right));
    border-top: 2px solid var(--brass); box-shadow: 0 -6px 20px rgba(0, 0, 0, .5); }
  body.side #panel { top: 0; right: 0; bottom: 0; width: var(--sidebar-w);
    grid-template-columns: minmax(0, 1fr); grid-template-rows: auto auto minmax(0, 1fr); grid-template-areas: "side" "info" "cmds";
    padding-top: max(8px, env(safe-area-inset-top)); padding-right: max(8px, env(safe-area-inset-right)); padding-bottom: max(8px, env(safe-area-inset-bottom));
    border-left: 3px solid var(--brass); box-shadow: -8px 0 24px rgba(0, 0, 0, .6); }

  /* the radar and the three quick choices */
  #side { grid-area: side; display: flex; flex-direction: column; gap: 6px; min-width: 0; }
  #mini { display: block; width: 100%; border-radius: 8px; border: 2px solid var(--brass); background: #140d07; touch-action: none; cursor: pointer;
    box-shadow: inset 0 0 12px rgba(0, 0, 0, .8); }
  .quick { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 4px; }
  .quick button { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px; min-height: 36px; padding: 3px 2px;
    border-radius: 8px; background: linear-gradient(#3b2918, #25190f); border: 1px solid var(--trim); font-size: 10px; font-weight: 800; line-height: 1.05; }
  .quick button svg { width: 16px; height: 16px; color: var(--brass-hi); }
  .quick button.on { background: linear-gradient(#f2cf6b, #c9962e); color: #1d1206; } .quick button.on svg { color: #1d1206; }

  /* what's chosen: its picture, name, health and what it's doing */
  #selInfo { grid-area: info; min-width: 0; display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 4px 8px; align-items: center; align-content: start; }
  #selInfo .pic { width: 48px; height: 48px; border-radius: 8px; border: 1px solid var(--brass); object-fit: cover; object-position: 50% 0; background: #2a1c10; }
  #selInfo .pic.cameo { transform: none; }
  #selInfo h3 { margin: 0; font-size: 15px; font-weight: 800; line-height: 1.15; }
  #selInfo .doing { font-size: 12px; color: var(--parch-dim); }
  #selInfo .about { grid-column: 1 / -1; margin: 0; font-size: 12px; line-height: 1.35; color: var(--parch-dim);
    display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  #selInfo .about.only { -webkit-line-clamp: 5; }
  .hp { height: 6px; border-radius: 3px; background: rgba(255, 255, 255, .12); overflow: hidden; margin: 3px 0; }
  .hp em { display: block; height: 100%; background: #22c55e; }

  /* the buttons: a picture with its name on it, and its cost underneath */
  #cmds { grid-area: cmds; display: grid; grid-template-columns: repeat(auto-fill, minmax(66px, 1fr)); gap: 6px; align-content: start;
    overflow-y: auto; overscroll-behavior: contain; touch-action: pan-y; min-height: 0; padding: 1px; }
  body.side #cmds { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .cmd { display: flex; flex-direction: column; align-items: stretch; gap: 3px; padding: 3px; min-width: 0; border-radius: 10px; color: var(--parch); container-type: inline-size;
    background: linear-gradient(#3b2918, #25190f); border: 1px solid var(--trim); text-align: center; transition: transform .05s; }
  .cmd:active { transform: scale(.95); }
  .cmd .face { position: relative; display: block; aspect-ratio: 1; border-radius: 7px; overflow: hidden; background: #2a1c10; }
  .cmd .face img { display: block; width: 100%; height: 100%; object-fit: cover; transform: scale(1.08); }   /* past the picture's own frame */
  .cmd .face b { position: absolute; left: 0; right: 0; bottom: 0; padding: 10px 2px 3px; font-size: clamp(8.5px, min(15cqi, calc((100cqi - 8px) / (var(--n, 8) * .66))), 12.5px); font-weight: 800; line-height: 1.08; overflow-wrap: break-word;
    background: linear-gradient(rgba(15, 9, 4, 0), rgba(15, 9, 4, .92) 45%); text-shadow: 0 1px 1px #000; -webkit-hyphens: auto; hyphens: auto;
    display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .cmd .face .ic { position: absolute; inset: 0 0 26% 0; display: flex; align-items: center; justify-content: center; color: var(--brass-hi); }
  .cmd .face .ic svg { width: 44%; height: 44%; }
  .cmd small { display: flex; justify-content: center; align-items: center; flex-wrap: wrap; gap: 0 4px; min-height: 13px; font-size: 10px; font-weight: 700; line-height: 1.15; color: var(--parch-dim); }
  .cmd small .c { white-space: nowrap; }
  .cmd small svg.i { width: 11px; height: 11px; vertical-align: -1px; }
  .cmd.poor .face img { filter: grayscale(.8) brightness(.6); }
  .cmd.poor small { color: #eab38f; }
  .cmd.on { border-color: var(--brass-hi); box-shadow: 0 0 0 1px var(--brass-hi), 0 0 12px rgba(236, 199, 100, .45); }
  .cmd.wide { grid-column: 1 / -1; display: grid; grid-template-columns: 46px minmax(0, 1fr); grid-template-areas: "face name" "face cost"; align-items: center; gap: 0 8px;
    padding: 4px 8px 4px 4px; background: linear-gradient(#f2cf6b, #c9962e); color: #1d1206; text-align: left; }
  .cmd.wide .face { grid-area: face; }
  .cmd.wide .face b { display: none; }
  .cmd.wide::after { grid-area: name; content: attr(data-label); font-weight: 900; font-size: 16px; line-height: 1.1; align-self: end; }
  .cmd.wide small { grid-area: cost; justify-content: flex-start; align-self: start; color: #3b2a10; font-size: 11px; }
  .note { grid-column: 1 / -1; font-size: 12px; line-height: 1.35; color: var(--parch-dim); padding: 6px 8px; border-radius: 8px; background: rgba(0, 0, 0, .22); }
  .queue { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 4px; align-items: center; font-size: 12px; color: var(--parch-dim); }
  .queue span { padding: 2px 6px; border-radius: 6px; background: rgba(255, 255, 255, .08); }
  .queue span:first-of-type { background: linear-gradient(90deg, rgba(236, 199, 100, .5) var(--p, 0%), rgba(255, 255, 255, .08) var(--p, 0%)); }

  /* ------------------------------------------------ full screens and dialogs */
  #screen { position: fixed; inset: 0; z-index: 20; overflow-y: auto; touch-action: pan-y; background: radial-gradient(ellipse at top, #1d1b3a 0%, var(--ink) 60%); }
  #dialog { position: fixed; inset: 0; z-index: 30; overflow-y: auto; touch-action: pan-y; background: rgba(6, 7, 16, .78); backdrop-filter: blur(3px); padding: 0 12px 40px; }
  .wrap { max-width: 760px; margin: 0 auto; padding: 28px 18px 60px; }
  .kicker { color: var(--gold); font-weight: 800; letter-spacing: .12em; text-transform: uppercase; font-size: 12px; }
  h1 { font-size: clamp(34px, 7vw, 54px); line-height: 1; margin: 8px 0 6px; font-weight: 900; letter-spacing: -.01em; }
  h1 span { background: linear-gradient(90deg, #fde68a, #f59e0b); -webkit-background-clip: text; background-clip: text; color: transparent; }
  h2 { font-size: 24px; margin: 4px 0 8px; font-weight: 900; }
  .lede { color: var(--dim); font-size: 16px; line-height: 1.45; margin: 0 0 20px; }
  .cards { display: grid; gap: 14px; }
  h2.camp { font-size: 22px; margin: 26px 0 2px; color: var(--gold); }
  .camp-about { margin: 0 0 12px; color: var(--dim); font-size: 14px; line-height: 1.4; }
  .card { background: rgba(255, 255, 255, .05); border: 1px solid var(--line); border-radius: 16px; padding: 16px; }
  .card.locked { opacity: .92; }
  .card .row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
  .card p { margin: 6px 0 0; color: var(--dim); line-height: 1.4; font-size: 14px; }
  .stars { color: var(--gold); letter-spacing: 2px; font-size: 18px; }
  .stars .off { color: rgba(255, 255, 255, .2); }
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: 44px; padding: 0 18px; border-radius: 12px;
    background: rgba(255, 255, 255, .1); font-weight: 800; font-size: 15px; text-decoration: none; color: #fff; }
  .btn:hover { background: rgba(255, 255, 255, .16); }
  .btn.go { background: var(--gold); color: #1a1405; }
  .btn.go:disabled { background: rgba(252, 211, 77, .25); color: #fff; }
  .lock { font-size: 13px; color: var(--dim); margin-top: 8px; }
  details.how { margin-top: 22px; background: rgba(255, 255, 255, .04); border: 1px solid var(--line); border-radius: 14px; padding: 12px 16px; }
  details.how summary { font-weight: 800; cursor: pointer; }
  details.how li { margin: 6px 0; line-height: 1.4; color: rgba(255, 255, 255, .85); font-size: 14px; }
  .aside { margin-top: 18px; font-size: 13px; color: var(--dim); line-height: 1.45; }

  .brief li { margin: 10px 0; line-height: 1.45; font-size: 16px; }
  .goalbox { margin: 16px 0; padding: 12px 14px; border-radius: 12px; background: rgba(252, 211, 77, .1); border: 1px solid rgba(252, 211, 77, .3); line-height: 1.4; }

  /* the reader: the chapter, verse by verse */
  .reader { position: fixed; inset: 0; display: flex; flex-direction: column; background: #f7f1e3; color: #2a2218; }
  .reader header { display: flex; align-items: center; gap: 10px; padding: 10px 14px; border-bottom: 1px solid rgba(0, 0, 0, .1); background: #efe6d0; }
  .reader header h2 { margin: 0; font-size: 20px; }
  .reader header button { font-size: 22px; width: 40px; height: 40px; border-radius: 10px; }
  .reader .verses { flex: 1; overflow-y: auto; padding: 18px max(18px, calc(50% - 340px)) 40px; font-family: Georgia, 'Times New Roman', serif; font-size: 19px; line-height: 1.6; }
  .reader .verses p { margin: 0 0 12px; }
  .reader .verses b { font-family: 'Outfit', sans-serif; color: #9a6b12; font-size: 13px; margin-right: 6px; vertical-align: 2px; }
  .reader footer { padding: 12px 16px; padding-bottom: max(12px, env(safe-area-inset-bottom)); border-top: 1px solid rgba(0, 0, 0, .1); background: #efe6d0;
    display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; justify-content: center; }
  .reader footer .hint { width: 100%; text-align: center; font-size: 13px; color: #6b5a3f; }
  .reader footer .btn.go:disabled { background: #d9ceb5; color: #7a6a4f; }
  .reader footer a { color: #8a5a0a; font-weight: 700; font-size: 14px; }

  .dialog { max-width: 520px; margin: 10vh auto 0; padding: 20px; background: #15172b; border: 1px solid var(--line); border-radius: 18px; box-shadow: 0 20px 60px rgba(0, 0, 0, .5); }
  .dialog h2 { font-size: 21px; line-height: 1.25; }
  .choices { display: grid; gap: 8px; margin-top: 14px; }
  .choice { text-align: left; padding: 12px 14px; border-radius: 12px; background: rgba(255, 255, 255, .07); border: 1px solid var(--line); font-weight: 700; font-size: 15px; line-height: 1.3; }
  .choice:hover { background: rgba(255, 255, 255, .13); }
  .choice.right { background: rgba(16, 185, 129, .25); border-color: #10b981; }
  .choice.wrong { background: rgba(239, 68, 68, .22); border-color: #ef4444; }
  .verse { margin-top: 14px; padding: 12px 14px; border-radius: 12px; background: #f7f1e3; color: #2a2218; font-family: Georgia, serif; font-size: 16px; line-height: 1.5; }
  .verse b { font-family: 'Outfit', sans-serif; color: #9a6b12; font-size: 12px; margin-right: 4px; }
  .verse p { margin: 0 0 8px; } .verse p:last-child { margin: 0; }
  .say { margin-top: 12px; font-weight: 800; font-size: 16px; }
  .say.good { color: var(--good); } .say.bad { color: var(--warn); }
  .end h1 { font-size: 40px; }
  .quote { font-family: Georgia, serif; font-size: 19px; line-height: 1.5; margin: 14px 0 4px; color: rgba(255, 255, 255, .92); }

  #rotate { position: fixed; left: 50%; bottom: calc(var(--drawer) + 10px); transform: translateX(-50%); z-index: 11; font-size: 12px;
    background: var(--panel); padding: 6px 10px; border-radius: 999px; border: 1px solid var(--line); white-space: nowrap; pointer-events: none; }

  
  /* ------------------------------------------------------------ the panel's side, and small screens */
  body.side { --sidebar-w: clamp(220px, 27vw, 300px); }
  @media (min-width: 700px) {
    body:not(.side) { --drawer: clamp(210px, 36vh, 440px); }
    body:not(.side) #panel { grid-template-columns: minmax(0, 1fr) 220px; }
    body:not(.side) #cmds { grid-template-columns: repeat(auto-fill, minmax(84px, 1fr)); }
  }
  @media (min-height: 700px) and (min-width: 760px) {
    #selInfo .pic { width: 56px; height: 56px; }
    #selInfo h3 { font-size: 17px; } #selInfo .doing, #selInfo .about { font-size: 13px; }
    .cmd small { font-size: 12px; } .cmd small svg.i { width: 13px; height: 13px; }
    .quick button { font-size: 11.5px; min-height: 40px; } .quick button svg { width: 18px; height: 18px; }
    .note, .queue { font-size: 13px; }
  }
  body.side #hud { right: var(--sidebar-w); }
  body.side #feed { right: calc(var(--sidebar-w) + 8px); }
  /* a short screen (a phone on its side): the chosen one's card without its story, to leave room for the buttons */
  @media (max-height: 520px) {
    body.side #panel { gap: 6px; padding-top: max(6px, env(safe-area-inset-top)); padding-bottom: max(6px, env(safe-area-inset-bottom)); }
    body.side #selInfo .about:not(.only) { display: none; }
    #selInfo .pic { width: 40px; height: 40px; }
    /* the three quick choices stacked beside the radar, not under it */
    body.side #side { flex-direction: row; align-items: stretch; }
    body.side #mini { width: 60%; flex: none; }
    body.side .quick { flex: 1; grid-template-columns: minmax(0, 1fr); }
    body.side .quick button { flex-direction: row; justify-content: flex-start; gap: 4px; min-height: 0; padding: 2px 5px; text-align: left; }
    body.side .quick button svg { width: 14px; height: 14px; flex: none; }
  }
  @media (max-width: 760px), (max-height: 520px) {
    :root { --top: 42px; }
    #hud { gap: 6px; padding: 0 6px; }
    .hb { height: 32px; padding: 0 8px; font-size: 13px; }
    .res { font-size: 14px; gap: 3px; } .res b { min-width: 1.6em; }
    #food span { display: none; } #food i { width: 60px; }
    #goals { width: 210px; font-size: 12px; }
    #feed { width: min(280px, 46vw); }
    .msg { font-size: 12px; padding: 5px 8px; }
    .msg:nth-last-child(n+3) { display: none; }
  }
  @media (max-width: 560px) {
    #hud { gap: 3px; padding: 0 4px; }
    .hb { padding: 0 6px; min-width: 30px; }
    .res { gap: 2px; } .res b { min-width: 0; }
    #clock { flex: none; }
    #bCouncil .lbl { display: none; }
    #clock .lbl { display: none; }
    #clock b::before { content: '⏳'; font-size: .8em; margin-right: 1px; }
    .res small { display: none; }
    #goals { width: 168px; }
    #feed { width: 56vw; }
  }
</style>
</head>
<body>
<canvas id="view" aria-label="The battlefield"></canvas>

<header id="hud" hidden>
  <button id="bMenu" class="hb" title="Menu (Esc)" aria-label="Menu">☰</button>
  <div class="res" title="Grain: food for your people"><span id="iGrain"></span><b id="rGrain">0</b></div>
  <div class="res" title="Timber: for walls and buildings"><span id="iTimber"></span><b id="rTimber">0</b></div>
  <div class="res" title="Workers and guards"><span id="iPeople"></span><b id="rPeople">0</b></div>
  <div id="clock"></div>
  <div id="food" hidden title="The robbers' food (3 Nephi 4:18–20). When it runs out, they must go."><span>Robbers' food</span><i><em id="foodBar"></em></i></div>
  <span class="grow"></span>
  <button id="bCouncil" class="hb gold" title="Answer a question from the chapter for grain and timber">Council</button>
  <button id="bSpeed" class="hb" title="Game speed">1×</button>
  <button id="bPause" class="hb" title="Pause (Space)" aria-label="Pause">❚❚</button>
</header>

<button id="cry" hidden>Cry unto the Lord<small>3 Nephi 4:8–10</small></button>

<details id="goals" open hidden><summary>Goals</summary><ul id="goalList"></ul></details>
<div id="feed" aria-live="polite"></div>
<div id="rotate" hidden>Turn your phone sideways for more room</div>

<footer id="panel" hidden>
  <div id="side">
    <canvas id="mini" aria-label="Map: tap to look there"></canvas>
    <div class="quick">
      <button id="bArmy" title="Choose all your soldiers"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l7 3v5c0 5-3.5 8-7 10-3.5-2-7-5-7-10V6z"/></svg>Soldiers</button>
      <button id="bIdle" title="Choose workers with nothing to do"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 4l6 6M17 7l-11 11M4 20l2-2"/><path d="M14 4c3-1 5 0 6 2-2 0-3 1-3 1"/></svg>Idle workers</button>
      <button id="bBox" title="Drag a box on the map to choose people in it"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-dasharray="3 3"><rect x="4" y="5" width="16" height="14" rx="1"/></svg>Box select</button>
    </div>
  </div>
  <div id="selInfo"></div>
  <div id="cmds"></div>
</footer>

<div id="screen"></div>
<div id="dialog" hidden></div>


<div id="tvLobby" hidden style="position:fixed;inset:0;background:#15172b;color:white;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:100;">
  <h1>Liberty Couch Skirmish</h1>
  <div style="font-size:48px;margin:20px" id="tvCode"></div>
  <div id="tvQr" style="background:white;padding:20px;border-radius:10px;"></div>
  <p style="margin-top:20px;">Scan to join</p>
  <button id="tvStart" class="btn go" style="margin-top:40px;font-size:24px;padding:15px 30px;" disabled>Start Game</button>
  <div id="tvPlayers" style="margin-top:20px;font-size:18px;">Waiting for players...</div>
</div>

<div id="gamepad" hidden style="position:fixed;inset:0;background:#080911;color:white;display:flex;flex-direction:column;z-index:100;user-select:none;">
  <div style="padding:10px;text-align:center;background:#10121d;border-bottom:1px solid #3f3f46;font-weight:bold;" id="gpHeader">Controller</div>
  <div id="gpTrackpad" style="height:35vh;background:rgba(255,255,255,0.05);margin:10px;border-radius:20px;border:2px dashed rgba(255,255,255,0.2);display:flex;align-items:center;justify-content:center;touch-action:none;">
    <span style="opacity:0.3">TRACKPAD (Drag to move, Tap to click)</span>
  </div>
  <div style="flex:1;display:flex;flex-direction:column;border-top:1px solid #3f3f46;background:#15172b;">
    <div style="display:flex;border-bottom:1px solid #3f3f46;">
      <button id="gpTabBuildings" style="flex:1;padding:12px;background:rgba(255,255,255,0.1);border:none;color:white;font-weight:bold;border-right:1px solid #3f3f46;">Buildings</button>
      <button id="gpTabUnits" style="flex:1;padding:12px;background:none;border:none;color:white;font-weight:bold;">Infantry</button>
      <button id="gpActionStop" style="padding:12px 20px;background:#7f1d1d;border:none;color:white;font-weight:bold;">STOP</button>
    </div>
    <div id="gpBuildGrid" style="flex:1;overflow-y:auto;padding:12px;display:grid;grid-template-columns:repeat(4, 1fr);gap:10px;align-content:start;">
      <!-- Populated dynamically by multi.js?v=10 -->
    </div>
  </div>
</div>

<script src="../vendor/qrcode.js"></script>
<script src="webrtc.js?v=15"></script>
<script src="multi.js?v=15"></script>
<script src="data.js?v=17"></script>
<script src="sim.js?v=16"></script>
<script src="missions.js?v=17"></script>
<script src="scripture.js?v=15"></script>
<script src="ui.js?v=29"></script>
</body>
</html>
