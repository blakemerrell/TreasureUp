<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Best Self Discovery — Authentic Values Card Sort &amp; CliftonStrengths Engine</title>
<style>
  :root {
    --bg: #f4f1ea;
    --card: #ffffff;
    --ink: #1a202c;
    --muted: #646b78;
    --line: #e2dcd0;
    --gold: #b47d12;
    --gold-light: #fdf6e7;
    --gold-border: #e6c687;
    --accent: #1e3a5f;
    --accent-light: #ebf2f9;
    --green: #236c4e;
    --green-light: #e6f4ed;
    --coral: #c05621;
    --coral-light: #feebc8;
    --purple: #553c9a;
    --purple-light: #f3ebff;
    --radius: 16px;
    --shadow: 0 10px 28px rgba(26, 32, 44, 0.08);
    --font-serif: 'Georgia', 'Times New Roman', serif;
    --font-sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  }

  /* Child / Youth Theme Overrides */
  body.mode-youth.theme-nintendo {
    --bg: #eef4ff;
    --card: #ffffff;
    --ink: #1b2538;
    --muted: #5a6982;
    --line: #d4e0f5;
    --gold: #ff9f1c;
    --gold-light: #fff4e0;
    --gold-border: #ffd180;
    --accent: #e63946;
    --accent-light: #ffe8ea;
    --green: #2ec4b6;
    --green-light: #e6faf8;
    --radius: 20px;
  }
  body.mode-youth.theme-rpg {
    --bg: #1e1b2e;
    --card: #2b2740;
    --ink: #f4f1de;
    --muted: #b8b2cc;
    --line: #524b75;
    --gold: #ffd166;
    --gold-light: #3b3322;
    --gold-border: #ffd166;
    --accent: #06d6a0;
    --accent-light: #193835;
    --green: #4cc9f0;
    --green-light: #1d3145;
    --radius: 8px;
    --font-sans: 'Courier New', Courier, monospace;
  }
  body.mode-youth.theme-booklet {
    --bg: #f8f5ec;
    --card: #ffffff;
    --ink: #2c3539;
    --muted: #6c757d;
    --line: #dee2e6;
    --gold: #d97706;
    --gold-light: #fef3c7;
    --gold-border: #f59e0b;
    --accent: #0284c7;
    --accent-light: #e0f2fe;
    --green: #16a34a;
    --green-light: #dcfce7;
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--font-sans);
    line-height: 1.5;
  }

  /* Top Bar */
  .proto-bar {
    position: sticky;
    top: 0;
    z-index: 100;
    background: #141c24;
    color: #fff;
    padding: 10px 18px;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    box-shadow: 0 4px 14px rgba(0,0,0,0.22);
  }
  .proto-bar-left {
    display: flex;
    align-items: center;
    gap: 10px;
    font-weight: 700;
    font-size: 14px;
  }
  .proto-badge {
    background: #d97706;
    color: #fff;
    padding: 3px 9px;
    border-radius: 99px;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
  }
  .proto-controls {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 8px;
  }
  .proto-btn {
    background: rgba(255,255,255,0.1);
    color: #fff;
    border: 1px solid rgba(255,255,255,0.2);
    padding: 6px 12px;
    border-radius: 99px;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.15s;
  }
  .proto-btn:hover { background: rgba(255,255,255,0.22); }
  .proto-btn.active {
    background: #f59e0b;
    color: #111;
    border-color: #f59e0b;
  }

  .wrap {
    max-width: 1020px;
    margin: 22px auto 64px;
    padding: 0 16px;
  }

  /* Stepper */
  .stepper {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 8px;
    margin-bottom: 20px;
  }
  @media (max-width: 720px) {
    .stepper { grid-template-columns: 1fr 1fr; }
  }
  .step-tab {
    background: var(--card);
    border: 1.5px solid var(--line);
    border-radius: 12px;
    padding: 10px 12px;
    text-align: left;
    cursor: pointer;
    color: var(--ink);
    transition: all 0.15s;
  }
  .step-tab:hover { border-color: var(--gold); }
  .step-tab.active {
    background: var(--gold-light);
    border-color: var(--gold);
    box-shadow: 0 4px 12px rgba(180, 125, 18, 0.14);
  }
  .step-num {
    font-size: 10px;
    font-weight: 800;
    text-transform: uppercase;
    color: var(--gold);
    letter-spacing: 0.06em;
    display: block;
  }
  .step-title {
    font-size: 13px;
    font-weight: 800;
    margin-top: 2px;
    display: block;
  }

  /* Panels */
  .panel {
    background: var(--card);
    border: 1.5px solid var(--line);
    border-radius: var(--radius);
    padding: 24px;
    box-shadow: var(--shadow);
    margin-bottom: 20px;
  }
  .panel-header {
    display: flex;
    flex-wrap: wrap;
    justify-content: space-between;
    align-items: flex-start;
    gap: 12px;
    margin-bottom: 18px;
    padding-bottom: 14px;
    border-bottom: 1px solid var(--line);
  }
  .panel-title {
    font-family: var(--font-serif);
    font-size: 24px;
    font-weight: 700;
    margin: 0 0 4px;
  }
  .panel-sub {
    color: var(--muted);
    font-size: 14px;
    margin: 0;
    max-width: 680px;
  }

  /* Truth Callout Banner (Psychology / Non-Performative) */
  .truth-callout {
    background: var(--accent-light);
    border-left: 4px solid var(--accent);
    border-radius: 10px;
    padding: 12px 16px;
    margin-bottom: 18px;
    font-size: 13px;
    color: var(--ink);
  }
  .truth-callout strong {
    color: var(--accent);
  }

  /* Buttons */
  .btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 10px 16px;
    border-radius: 10px;
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
    border: 1.5px solid var(--line);
    background: var(--card);
    color: var(--ink);
    transition: all 0.15s;
  }
  .btn:hover { border-color: var(--gold); transform: translateY(-1px); }
  .btn-primary {
    background: var(--accent);
    color: #fff;
    border-color: var(--accent);
  }
  .btn-gold {
    background: var(--gold);
    color: #fff;
    border-color: var(--gold);
  }
  .btn-sm { padding: 6px 11px; font-size: 12px; border-radius: 8px; }

  /* Round Pills */
  .round-pills {
    display: flex;
    gap: 8px;
    margin-bottom: 18px;
    flex-wrap: wrap;
  }
  .round-pill {
    padding: 8px 14px;
    border-radius: 99px;
    font-size: 12px;
    font-weight: 800;
    border: 1.5px solid var(--line);
    background: var(--card);
    color: var(--muted);
    cursor: pointer;
  }
  .round-pill.active {
    background: var(--accent);
    color: #fff;
    border-color: var(--accent);
  }

  /* Physical Value Card Styling (Miller UNM + BestSelf Style) */
  .deck-stage {
    display: grid;
    grid-template-columns: 1.1fr 1fr;
    gap: 20px;
    align-items: stretch;
  }
  @media (max-width: 760px) {
    .deck-stage { grid-template-columns: 1fr; }
  }
  .physical-card {
    background: #fffdf9;
    border: 2px solid #2d3748;
    border-radius: 18px;
    padding: 28px 24px 22px;
    text-align: center;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    min-height: 310px;
    box-shadow: 0 12px 0 #d5cbb8, 0 16px 32px rgba(0,0,0,0.12);
    position: relative;
  }
  .card-top-meta {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 11px;
    font-weight: 800;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.08em;
    border-bottom: 1px solid var(--line);
    padding-bottom: 8px;
  }
  .card-main-word {
    font-family: var(--font-serif);
    font-size: 34px;
    font-weight: 800;
    letter-spacing: 0.03em;
    text-transform: uppercase;
    margin: 18px 0 8px;
    color: #1a202c;
  }
  .card-def {
    font-size: 16px;
    color: #4a5568;
    font-style: italic;
    margin: 0 auto 12px;
    max-width: 340px;
  }
  .card-truth-prompt {
    font-size: 12px;
    background: var(--bg);
    padding: 8px 12px;
    border-radius: 8px;
    color: var(--muted);
    margin: 0 auto 18px;
    max-width: 380px;
  }
  .sort-actions {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
  }
  .sort-btn {
    padding: 12px 8px;
    border-radius: 12px;
    font-weight: 800;
    font-size: 12px;
    cursor: pointer;
    border: 2px solid transparent;
    transition: transform 0.1s;
  }
  .sort-btn:hover { transform: translateY(-2px); }
  .sort-btn.core {
    background: var(--green-light);
    color: var(--green);
    border-color: var(--green);
  }
  .sort-btn.imp {
    background: var(--gold-light);
    color: var(--gold);
    border-color: var(--gold-border);
  }
  .sort-btn.pass {
    background: var(--bg);
    color: var(--muted);
    border-color: var(--line);
  }

  /* Piles Column */
  .piles-col {
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .pile-box {
    background: var(--bg);
    border: 1.5px solid var(--line);
    border-radius: 14px;
    padding: 12px 14px;
  }
  .pile-box.core-pile {
    background: var(--green-light);
    border-color: var(--green);
  }
  .pile-hdr {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 12px;
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    margin-bottom: 8px;
  }
  .pile-chips {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    max-height: 115px;
    overflow-y: auto;
  }
  .val-chip {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    padding: 5px 10px;
    border-radius: 99px;
    font-size: 12px;
    font-weight: 700;
    background: var(--card);
    color: var(--ink);
    border: 1px solid var(--line);
    cursor: pointer;
  }
  .val-chip:hover { border-color: var(--gold); }
  .val-chip.pillar-selected {
    background: var(--gold);
    color: #fff;
    border-color: var(--gold);
  }

  /* Grid of All Cards with Category Filter */
  .cat-filter-bar {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
    margin-bottom: 12px;
  }
  .all-cards-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(165px, 1fr));
    gap: 8px;
    max-height: 420px;
    overflow-y: auto;
    padding: 4px;
  }
  .mini-val-card {
    padding: 10px 12px;
    border-radius: 10px;
    border: 1.5px solid var(--line);
    background: var(--card);
    cursor: pointer;
    transition: all 0.12s;
  }
  .mini-val-card:hover { border-color: var(--gold); }
  .mini-val-card.is-core {
    background: var(--green-light);
    border-color: var(--green);
  }
  .mini-val-name {
    font-weight: 800;
    font-size: 13px;
    text-transform: uppercase;
    letter-spacing: 0.02em;
    display: block;
  }
  .mini-val-desc {
    font-size: 11px;
    color: var(--muted);
    display: block;
    margin-top: 3px;
  }

  /* 3-Pillar Board */
  .triad-board {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 14px;
    margin: 16px 0;
  }
  @media (max-width: 720px) {
    .triad-board { grid-template-columns: 1fr; }
  }
  .pillar-col {
    background: var(--bg);
    border: 2px solid var(--gold-border);
    border-radius: 16px;
    padding: 14px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    cursor: pointer;
  }
  .pillar-top-card {
    background: linear-gradient(135deg, #1e3a5f, #12243b);
    color: #fff;
    padding: 16px 14px;
    border-radius: 12px;
    text-align: center;
    box-shadow: 0 6px 16px rgba(0,0,0,0.14);
  }
  .pillar-slot-label {
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.12em;
    color: #f6ad55;
    font-weight: 800;
    display: block;
    margin-bottom: 4px;
  }
  .pillar-top-name {
    font-family: var(--font-serif);
    font-size: 22px;
    font-weight: 800;
    letter-spacing: 0.04em;
    text-transform: uppercase;
  }
  .subval-list {
    display: flex;
    flex-direction: column;
    gap: 6px;
    min-height: 110px;
  }
  .subval-card {
    background: var(--card);
    border: 1.5px solid var(--line);
    border-left: 4px solid var(--gold);
    border-radius: 9px;
    padding: 8px 11px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 13px;
    font-weight: 700;
  }
  .subval-remove {
    background: none;
    border: none;
    color: var(--muted);
    cursor: pointer;
    font-size: 15px;
  }

  /* CliftonStrengths Paired-Statement Assessment UI */
  .pair-row {
    background: var(--bg);
    border: 1.5px solid var(--line);
    border-radius: 14px;
    padding: 16px;
    margin-bottom: 12px;
  }
  .pair-num {
    font-size: 11px;
    font-weight: 800;
    text-transform: uppercase;
    color: var(--gold);
    letter-spacing: 0.06em;
    margin-bottom: 8px;
    display: block;
  }
  .pair-grid {
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    gap: 12px;
    align-items: center;
  }
  @media (max-width: 760px) {
    .pair-grid { grid-template-columns: 1fr; }
  }
  .pair-stmt {
    font-size: 14px;
    font-weight: 700;
    line-height: 1.4;
    padding: 10px 12px;
    background: var(--card);
    border-radius: 10px;
    border: 1px solid var(--line);
  }
  .pair-scale {
    display: flex;
    gap: 6px;
    justify-content: center;
  }
  .scale-btn {
    padding: 8px 10px;
    border-radius: 8px;
    border: 1.5px solid var(--line);
    background: var(--card);
    font-size: 11px;
    font-weight: 800;
    cursor: pointer;
    color: var(--muted);
    transition: all 0.12s;
  }
  .scale-btn:hover { border-color: var(--accent); }
  .scale-btn.active {
    background: var(--accent);
    color: #fff;
    border-color: var(--accent);
  }

  /* 34 CliftonStrengths Explorer with Genius + Blind Spot */
  .domains-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 14px;
  }
  @media (max-width: 720px) {
    .domains-grid { grid-template-columns: 1fr; }
  }
  .domain-card {
    background: var(--bg);
    border: 1.5px solid var(--line);
    border-radius: 14px;
    padding: 14px;
  }
  .theme-detail-card {
    background: var(--card);
    border: 1.5px solid var(--line);
    border-radius: 10px;
    padding: 10px 12px;
    margin-bottom: 8px;
    cursor: pointer;
    transition: all 0.12s;
  }
  .theme-detail-card:hover { border-color: var(--gold); }
  .theme-detail-card.selected {
    border-color: var(--accent);
    background: var(--accent-light);
  }

  .field-label {
    display: block;
    font-size: 12px;
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: var(--accent);
    margin-bottom: 6px;
  }
  .field-input {
    width: 100%;
    padding: 10px 12px;
    border-radius: 10px;
    border: 1.5px solid var(--line);
    background: var(--card);
    color: var(--ink);
    font-family: inherit;
    font-size: 14px;
    margin-bottom: 12px;
  }
</style>
</head>
<body class="mode-adult">

<div class="proto-bar">
  <div class="proto-bar-left">
    <span class="proto-badge">Research-Grounded Prototype</span>
    <span>Authentic Values Card Sort (UNM / BestSelf / Dare to Lead) + CliftonStrengths &amp; SIGN Engine</span>
  </div>
  <div class="proto-controls">
    <button class="proto-btn active" id="btnModeAdult" onclick="setPersona('adult')">👨 Adult Discovery</button>
    <button class="proto-btn" id="btnModeYouth" onclick="setPersona('youth')">👦 Youth Discovery (Age 11)</button>
    <button class="proto-btn" onclick="loadBlakeExactBoard()">⚡ Load Blake’s Exact Board</button>
    <button class="proto-btn" onclick="startFreshSort()">🔄 Start Fresh Blank Sort</button>
  </div>
</div>

<div class="wrap">
  <div class="stepper" id="stepperBar"></div>
  <div id="stepContent"></div>
</div>

<script>
  // =========================================================================
  // 1. RESEARCH-GROUNDED 68-CARD PERSONAL VALUES DECK
  // Combines:
  //  - Miller, C'de Baca, Matthews & Wilbourne (UNM Personal Values Card Sort)

  //  - Brené Brown's Dare to Lead Values List
  //  - Every single card on Blake's physical board (Faith, Adventure, Integrity + all 24 sub-values)
  // =========================================================================

    // Adventure, Vitality & Autonomy
    { id: 'adventure', name: 'Adventure', cat: 'Adventure & Autonomy', desc: 'To seek out new, daring, and exciting experiences.' },
    { id: 'awe', name: 'Awe', cat: 'Adventure & Autonomy', desc: 'To experience moments of breathtaking vastness that stop me in my tracks.' },

    { id: 'passion', name: 'Passion', cat: 'Adventure & Autonomy', desc: 'To feel deeply and bring intense energy to ideas, work, and people.' },

    // Relationships, Love & Contribution
    { id: 'family', name: 'Family', cat: 'Connection & Impact', desc: 'To build a happy, loving, deeply connected home and family.' },
    { id: 'friendship', name: 'Friendship', cat: 'Connection & Impact', desc: 'To have close, supportive, ride-or-die friends.' },
    { id: 'kindness', name: 'Kindness & Caring', cat: 'Connection & Impact', desc: 'To treat people with warmth, generosity, and care.' },
    { id: 'loving', name: 'Love & Intimacy', cat: 'Connection & Impact', desc: 'To give love deeply and share my innermost life with those closest to me.' },
    { id: 'generosity', name: 'Generosity', cat: 'Connection & Impact', desc: 'To share what I have—time, resources, and credit—freely with others.' },

  // =========================================================================
  // 6. INTERACTION HANDLERS
  // =========================================================================
  function sortCard(targetPile) {
    const card = ADULT_VALUE_DECK[state.dealIdx % ADULT_VALUE_DECK.length];
    ['core', 'important', 'pass'].forEach(p => {
      state.piles[p] = state.piles[p].filter(id => id !== card.id);
    });
    state.piles[targetPile].push(card.id);
    state.dealIdx = (state.dealIdx + 1) % ADULT_VALUE_DECK.length;
    render();
  }

  function toggleCoreCard(id) {
    if (state.piles.core.includes(id)) {
      state.piles.core = state.piles.core.filter(x => x !== id);
    } else {
      state.piles.core.push(id);
    }
    render();
  }

  function removeFromCore(id) {
    state.piles.core = state.piles.core.filter(x => x !== id);
    state.pillars = state.pillars.filter(x => x !== id);
    render();
  }

  function promoteToCore(id) {
    state.piles.important = state.piles.important.filter(x => x !== id);
    if (!state.piles.core.includes(id)) state.piles.core.push(id);
    render();
  }

  function addCustomValue() {
    const inp = document.getElementById('customValInput');
    const val = (inp && inp.value || '').trim();
    if (!val) return;
    const id = val.toLowerCase().replace(/[^a-z0-9]+/g, '_');
    ADULT_VALUE_DECK.push({ id, name: val, cat: 'Custom', desc: 'Personal core value card.' });
    if (!state.piles.core.includes(id)) state.piles.core.push(id);
    inp.value = '';
    render();
  }

  function togglePillar(id) {
    if (state.pillars.includes(id)) {
      state.pillars = state.pillars.filter(x => x !== id);
    } else {
      if (state.pillars.length >= 3) state.pillars.shift();
      state.pillars.push(id);
      if (!state.subValues[id]) state.subValues[id] = [];
    }
    state.activeTargetPillar = state.pillars[0] || 'faith';
    render();
  }

  function assignSubValue(id) {
    const target = state.activeTargetPillar || state.pillars[0];
    if (!target) return;
    Object.keys(state.subValues).forEach(k => {
      state.subValues[k] = (state.subValues[k] || []).filter(x => x !== id);
    });
    if (!state.subValues[target]) state.subValues[target] = [];
    state.subValues[target].push(id);
    render();
  }

  function removeSubValue(pillarId, subId) {
    state.subValues[pillarId] = (state.subValues[pillarId] || []).filter(x => x !== subId);
    render();
  }

  function autoDistributeSubvalues() {
    const assigned = new Set([...state.pillars, ...Object.values(state.subValues).flat()]);
    const unassigned = state.piles.core.filter(id => !assigned.has(id));
    unassigned.forEach((id, idx) => {
      const p = state.pillars[idx % state.pillars.length];
      if (p) {
        if (!state.subValues[p]) state.subValues[p] = [];
        state.subValues[p].push(id);
      }
    });
    render();
  }

  function setPairScore(pairId, score) {
    state.pairScores[pairId] = score;
    render();
  }

  function scorePairedInstincts() {
    const scores = {};
    INSTINCT_PAIRS.forEach(p => {
      const val = state.pairScores[p.id] || 0;
      if (val < 0) {
        const weight = Math.abs(val);
        p.leftThemes.forEach(t => { scores[t] = (scores[t] || 0) + weight; });
      } else if (val > 0) {
        const weight = val;
        p.rightThemes.forEach(t => { scores[t] = (scores[t] || 0) + weight; });
      }
    });
    const ranked = Object.keys(scores).sort((a, b) => scores[b] - scores[a]);
    if (ranked.length >= 5) {
      state.topStrengths = ranked.slice(0, 5);
    }
    render();
  }

  function toggleStrength(s) {
    if (state.topStrengths.includes(s)) {
      state.topStrengths = state.topStrengths.filter(x => x !== s);
    } else if (state.topStrengths.length < 5) {
      state.topStrengths.push(s);
    }
    render();
  }

  render();
</script>
</body>
