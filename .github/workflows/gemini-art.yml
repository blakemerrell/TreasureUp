# Gemini, the art helper. A comment on a pull request that mentions
# @gemini-cli, written by the repository's owner, runs Gemini CLI with the
# Nano Banana image extension. Gemini reads GEMINI.md and the art requests
# the comment names, draws into nanobanana-output/, and this workflow commits
# the pictures to the pull request's branch under liberty/art/incoming/ and
# posts Gemini's reply on the pull request.
#
# Gemini gets no GitHub token (it stays on the steps around Gemini) and none
# of its own file or shell tools: it can only make pictures. Its reply is
# posted with this run's token, and comments made with that token never start
# another run, so it can't set itself off.
#
# Needs the repository secret GEMINI_API_KEY, a Gemini API key from Google
# AI Studio (billed per picture). Without it the run says so and stops.
name: Gemini art

on:
  issue_comment:
    types: [created]

permissions:
  contents: write         # commit the pictures to the pull request's branch
  pull-requests: write
  issues: write           # comments on a pull request are issue comments

# One request at a time on each pull request.
concurrency:
  group: gemini-art-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  draw:
    if: >-
      github.event.issue.pull_request &&
      contains(github.event.comment.body, '@gemini-cli') &&
      github.event.comment.author_association == 'OWNER'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PR: ${{ github.event.issue.number }}
      REPO: ${{ github.repository }}
    steps:
      - name: Say it's started
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api "repos/$REPO/issues/comments/${{ github.event.comment.id }}/reactions" -f content=eyes >/dev/null

      - name: Check for the key
        id: key
        env:
          GH_TOKEN: ${{ github.token }}
          HAS_KEY: ${{ secrets.GEMINI_API_KEY != '' }}
        run: |
          if [ "$HAS_KEY" = "true" ]; then echo "ok=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          gh pr comment "$PR" --repo "$REPO" --body "Gemini can't draw yet: the repository has no \`GEMINI_API_KEY\` secret. Add a key from Google AI Studio under Settings → Secrets and variables → Actions, then ask again."
          echo "ok=false" >> "$GITHUB_OUTPUT"

      - name: Find the pull request's branch
        if: steps.key.outputs.ok == 'true'
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          head_repo=$(gh api "repos/$REPO/pulls/$PR" --jq '.head.repo.full_name')
          if [ "$head_repo" != "$REPO" ]; then
            gh pr comment "$PR" --repo "$REPO" --body "Gemini only draws on branches in this repository."
            exit 1
          fi
          echo "ref=$(gh api "repos/$REPO/pulls/$PR" --jq '.head.ref')" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        if: steps.key.outputs.ok == 'true'
        with:
          ref: ${{ steps.pr.outputs.ref }}
          persist-credentials: false    # nothing Gemini runs can push

      # The comment names the request files (liberty/art/requests/*.md); their
      # text goes into Gemini's prompt, since Gemini can't open files itself.
      - name: Gather the request
        if: steps.key.outputs.ok == 'true'
        id: request
        env:
          COMMENT: ${{ github.event.comment.body }}
        run: |
          {
            echo "This is an art request on pull request #$PR. Follow GEMINI.md."
            echo
            echo "The comment that asked:"
            echo "$COMMENT"
            for f in $(printf '%s\n' "$COMMENT" | grep -oE 'liberty/art/requests/[A-Za-z0-9._-]+\.md' | sort -u); do
              if [ -f "$f" ]; then echo; echo "----- $f -----"; cat "$f"; fi
            done
          } > "$RUNNER_TEMP/prompt.txt"
          end="END_$(openssl rand -hex 12)"
          { echo "text<<$end"; cat "$RUNNER_TEMP/prompt.txt"; echo "$end"; } >> "$GITHUB_OUTPUT"

      - name: Run Gemini
        if: steps.key.outputs.ok == 'true'
        id: gemini
        uses: google-github-actions/run-gemini-cli@v0
        env:
          GEMINI_CLI_TRUST_WORKSPACE: 'true'
          NANOBANANA_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        with:
          gemini_api_key: ${{ secrets.GEMINI_API_KEY }}
          extensions: |
            ["https://github.com/gemini-cli-extensions/nanobanana"]
          settings: |-
            {
              "model": { "maxSessionTurns": 15 },
              "tools": { "core": [] }
            }
          prompt: ${{ steps.request.outputs.text }}

      - name: Commit the pictures
        if: always() && steps.key.outputs.ok == 'true' && steps.pr.outputs.ref != ''
        id: commit
        env:
          GH_TOKEN: ${{ github.token }}
          REF: ${{ steps.pr.outputs.ref }}
          RUN: ${{ github.run_number }}
        run: |
          dest="liberty/art/incoming/pr$PR"
          shopt -s nullglob
          files=(nanobanana-output/*.png nanobanana-output/*.jpg nanobanana-output/*.jpeg nanobanana-output/*.webp)
          if [ ${#files[@]} -eq 0 ]; then echo "count=0" >> "$GITHUB_OUTPUT"; exit 0; fi
          mkdir -p "$dest"
          names=()
          for src in "${files[@]}"; do      # run number first: a later round never overwrites
            names+=("r$RUN-$(basename "$src")")
            mv "$src" "$dest/${names[-1]}"
          done
          git config user.name "Gemini art (bot)"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "$dest"
          git commit -q -m "Gemini art for #$PR: ${#files[@]} picture(s)"
          git push -q "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git" "HEAD:${REF}"
          echo "count=${#files[@]}" >> "$GITHUB_OUTPUT"
          end="END_$(openssl rand -hex 12)"
          {
            echo "list<<$end"
            for name in "${names[@]}"; do
              echo "**\`$name\`**"
              echo
              echo "<img src=\"https://github.com/${REPO}/raw/$(git rev-parse HEAD)/${dest}/${name}\" width=\"240\">"
              echo
            done
            echo "$end"
          } >> "$GITHUB_OUTPUT"

      - name: Post Gemini's reply
        if: always() && steps.key.outputs.ok == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          SUMMARY: ${{ steps.gemini.outputs.summary }}
          ERROR: ${{ steps.gemini.outputs.error }}
          COUNT: ${{ steps.commit.outputs.count }}
          LIST: ${{ steps.commit.outputs.list }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          {
            echo "**Gemini (art helper):**"
            echo
            if [ -n "$SUMMARY" ]; then echo "$SUMMARY"; else echo "_Gemini didn't reply._"; fi
            if [ -n "$ERROR" ]; then echo; echo "Errors: $ERROR"; fi
            echo
            if [ "${COUNT:-0}" != "0" ]; then echo "$COUNT picture(s) in \`liberty/art/incoming/pr$PR/\`:"; echo; echo "$LIST"; else echo "No pictures this time."; fi
            echo
            echo "<sub>[Run log]($RUN_URL)</sub>"
          } > "$RUNNER_TEMP/reply.md"
          gh pr comment "$PR" --repo "$REPO" --body-file "$RUNNER_TEMP/reply.md"
