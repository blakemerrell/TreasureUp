# Publishes the app to GitHub Pages. Every push to main redeploys it.
#
# Pages must already be switched on with source "GitHub Actions"
# (Settings → Pages). The run's token cannot switch it on itself:
# `enablement: true` fails with "Resource not accessible by integration".
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:        # lets you re-run it by hand from the Actions tab
  schedule:
    - cron: '30 7 * * 1'    # Mondays at 07:30 UTC, just after midnight in Utah: last week's turn to move out, the next week's to come in

permissions:
  contents: write     # the deploy saves new recordings, and weeks moved in or out, back to the repo
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it midway.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04   # pinned: ubuntu-latest moves to a new Ubuntu on its own
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      # Nothing ships unless every quote matches the scripture text, every
      # reference exists, and every bonus answer is on the page it cites.
      # See tools/verify.mjs.
      - uses: actions/setup-node@v7
        with:
          node-version: 22

      # One stray brace in index.html would ship a blank app: every script
      # the site has must parse before anything else runs (tools/check-parse.mjs).
      - name: Every script parses
        run: node tools/check-parse.mjs

      # Wika's Hebrew and Greek courses (amigo/course-he.js, course-el.js),
      # made from every week's treasure words, approved or not: each word says
      # whether its fingerprint matches, and the live app shows only those
      # (tools/wika-words.mjs). Both sites, before the recording.
      - name: Make Wika's Hebrew and Greek courses
        run: node tools/wika-words.mjs

      # Wika's Tagalog, Spanish, Hebrew and Greek: record any line that has no
      # recording yet, in the Filipino voice, the Spanish one, or the Hebrew
      # and Greek ones (tools/amigo-voice.mjs), and save the recordings
      # to the repo; this deploy publishes them. The test site only: the
      # Google key lives there as the secret GOOGLE_TTS_JSON, on no computer.
      # Recordings reach the live app in the PR that brings their lines. If
      # Google can't be reached, the deploy goes on, and the game uses the
      # phone's voice for those lines; a line that fails is a warning on the
      # run, and the ones already made are kept.
      - name: Record new Wika lines (Tagalog, Spanish, Hebrew, Greek)
        if: github.repository == 'blakemerrell/TreasureUp-test'
        continue-on-error: true
        env:
          GOOGLE_TTS_JSON: ${{ secrets.GOOGLE_TTS_JSON }}
        run: |
          node tools/amigo-voice.mjs
          git add amigo/audio amigo/course-he.js amigo/course-el.js
          if git diff --cached --quiet; then echo "Nothing new to record."; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Wika: record the new Tagalog, Spanish, Hebrew and Greek"
          git push origin HEAD:main
      # content/weeks.js stays under the 1 MB developer mode can read through
      # the GitHub API: weeks that ended before last week move to content/past/
      # (tools/archive-weeks.mjs), and the weeks written ahead come in from
      # content/upcoming/ as room allows (tools/upcoming-weeks.mjs): on the live
      # app too since Blake had the rest of 2026 approved at once (2026-10-05).
      # Committed here, and saved back to the repo only once every check below
      # has passed (Save the moved weeks), so a week that fails a check never
      # reaches main. The week's date is Utah's (tools/week-dates.mjs).
      - name: Move weeks in and out of weeks.js
        run: |
          node tools/archive-weeks.mjs
          node tools/upcoming-weeks.mjs
          git add content
          if git diff --cached --quiet; then echo "Nothing to move."; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Move weeks in and out of content/weeks.js (tools/archive-weeks.mjs, tools/upcoming-weeks.mjs)"
          echo "MOVED=1" >> "$GITHUB_ENV"

      # The scripture data the checks and the chapters are built from (about
      # 120 MB, pinned to one commit of each source): kept between runs.
      - name: Name the scripture data by its commits
        run: echo "DATA_KEY=$(grep -ho "_COMMIT = '[0-9a-f]*'" tools/verify.mjs tools/original.mjs | sha1sum | cut -c1-16)" >> "$GITHUB_ENV"
      - uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/scripture
          key: scripture-${{ env.DATA_KEY }}

      # The live app (this repo) also requires every piece of a new week to
      # be approved in developer mode; the test site shows drafts.
      - name: Check the week's content
        run: node tools/verify.mjs --online $([ "$GITHUB_REPOSITORY" = "blakemerrell/TreasureUp" ] && echo --require-approval)
        env:
          SCRIPTURE_CACHE: ${{ runner.temp }}/scripture   # keep the data out of the published site

      # Title of Liberty (liberty/): both missions play through, and every
      # quotation in the game matches the verse it cites.
      - name: Check Title of Liberty
        run: node tools/test-liberty.mjs
        env:
          SCRIPTURE_CACHE: ${{ runner.temp }}/scripture

      # Wika (amigo/): the courses follow their rules, every lesson builds and
      # can be answered, Baybayin spells words right, the Hebrew and Greek
      # courses are up to date with the weeks, and the letters quests teach
      # every letter. The live app refuses Tagalog the game would say without
      # a recording (Hebrew, Greek and Spanish fall back to the phone's voice).
      - name: Check Wika
        run: node tools/test-amigo.mjs $([ "$GITHUB_REPOSITORY" = "blakemerrell/TreasureUp" ] && echo --require-recordings)

      # The chapters of each week's reading, so he can read them in the app
      # (tools/build-reading.mjs, from the data the check just downloaded).
      # It goes on by itself without a source that's down (the Hebrew and
      # Greek words, a chapter's Listen button), so a failure here is a bug,
      # and stops the deploy rather than ship the app without its reader.
      - name: Build the week's chapters
        run: node tools/build-reading.mjs
        env:
          SCRIPTURE_CACHE: ${{ runner.temp }}/scripture

      # The browser tests (tests/): the app opens on today's week with no
      # errors, and a week of study on one device goes Monday to Sunday, with
      # the chapters just built. A failure stops the deploy; the site keeps
      # the last good one. Pull requests also run the family test on the
      # Firebase emulators (tests.yml).
      - name: Install the test packages and the browser
        working-directory: tests
        run: |
          npm ci --omit=dev --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Test the app
        working-directory: tests
        run: |
          node run.mjs
          rm -rf node_modules   # the site is the whole repo folder: the test packages stay out of it

      # Every check passed: the moved weeks go to the repo. If main moved on
      # meanwhile, the save goes on top of it (three tries); if it still can't,
      # the site goes out with them moved, and the next deploy saves them.
      - name: Save the moved weeks
        if: env.MOVED == '1'
        run: |
          for i in 1 2 3; do
            git push origin HEAD:main && exit 0
            git pull --rebase origin main || { git rebase --abort; break; }
          done
          echo "::warning title=Weeks not saved::The weeks moved in and out of content/weeks.js couldn't be saved to the repo; the next deploy moves them again."

      # Wika's script links get this deploy's commit (?v=…), so a phone never
      # runs a new page with old cached scripts or an old list of recordings
      # (GitHub Pages lets a phone keep a file for 10 minutes).
      - name: Stamp this deploy on Wika's scripts
        run: sed -i "s/?v=dev\"/?v=${GITHUB_SHA::8}\"/g" amigo/index.html

      - uses: actions/configure-pages@v6

      # The app is a single self-contained index.html at the repo root,
      # so the repo is the site, less what only builds and checks it.
      - name: Leave the tools and tests out of the site
        run: rm -rf tools tests firebase.json
      - uses: actions/upload-pages-artifact@v5
        with:
          path: .

      - id: deployment
        uses: actions/deploy-pages@v5
