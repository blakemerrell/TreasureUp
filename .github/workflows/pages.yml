# Publishes the app to GitHub Pages. Every push to main redeploys it.
#
# Pages must already be switched on with source "GitHub Actions"
# (Settings → Pages). The run's token cannot switch it on itself:
# `enablement: true` fails with "Resource not accessible by integration".
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:        # lets you re-run it by hand from the Actions tab

permissions:
  contents: write     # the test site's deploy saves new Tagalog recordings back to the repo
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it midway.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # Nothing ships unless every quote matches the scripture text, every
      # reference exists, and every bonus answer is on the page it cites.
      # See tools/verify.mjs.
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Amigo · Kaibigan's Tagalog and Spanish: record any line that has no
      # recording yet, in the Filipino voice or the Spanish one
      # (tools/amigo-voice.mjs), and save the recordings
      # to the repo; this deploy publishes them. The test site only: the
      # Google key lives there as the secret GOOGLE_TTS_JSON, on no computer.
      # Recordings reach the live app in the PR that brings their lines. If
      # Google can't be reached, the deploy goes on, and the game uses the
      # phone's voice for those lines.
      - name: Record new Tagalog and Spanish
        if: github.repository == 'blakemerrell/TreasureUp-test'
        continue-on-error: true
        env:
          GOOGLE_TTS_JSON: ${{ secrets.GOOGLE_TTS_JSON }}
        run: |
          node tools/amigo-voice.mjs
          git add amigo/audio
          if git diff --cached --quiet; then echo "Nothing new to record."; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Amigo · Kaibigan: record the new Tagalog and Spanish"
          git push origin HEAD:main
      # The live app (this repo) also requires every piece of a new week to
      # be approved in developer mode; the test site shows drafts.
      - name: Check the week's content
        run: node tools/verify.mjs --online $([ "$GITHUB_REPOSITORY" = "blakemerrell/TreasureUp" ] && echo --require-approval)
        env:
          SCRIPTURE_CACHE: ${{ runner.temp }}/scripture   # keep the data out of the published site

      # Title of Liberty (liberty/): both missions play through, and every
      # quotation in the game matches the verse it cites.
      - name: Check Title of Liberty
        run: node tools/test-liberty.mjs
        env:
          SCRIPTURE_CACHE: ${{ runner.temp }}/scripture

      # Amigo · Kaibigan (amigo/): the courses follow their rules, every lesson
      # builds and can be answered, and Baybayin spells words right.
      # The live app refuses Tagalog the game would say without a recording.
      - name: Check Amigo · Kaibigan
        run: node tools/test-amigo.mjs $([ "$GITHUB_REPOSITORY" = "blakemerrell/TreasureUp" ] && echo --require-recordings)

      # The chapters of each week's reading, so he can read them in the app
      # (tools/build-reading.mjs, from the data the check just downloaded).
      # If it can't, the app still works and sends him to Gospel Library.
      - name: Build the week's chapters
        run: node tools/build-reading.mjs
        continue-on-error: true
        env:
          SCRIPTURE_CACHE: ${{ runner.temp }}/scripture

      # Amigo's script links get this deploy's commit (?v=…), so a phone never
      # runs a new page with old cached scripts or an old list of recordings
      # (GitHub Pages lets a phone keep a file for 10 minutes).
      - name: Stamp this deploy on Amigo's scripts
        run: sed -i "s/?v=dev\"/?v=${GITHUB_SHA::8}\"/g" amigo/index.html

      - uses: actions/configure-pages@v5

      # The app is a single self-contained index.html at the repo root,
      # so the whole repo is the site. No build step.
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: deployment
        uses: actions/deploy-pages@v4
