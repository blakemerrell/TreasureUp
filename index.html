<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Treasure Up</title>
<meta name="description" content="Come, Follow Me, one idea at a time. Each reel ends with a question.">
<meta name="theme-color" content="#0a0a14">

<!-- Add-to-home-screen: iOS runs this full-screen with no browser chrome. -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Treasure Up">
<meta name="mobile-web-app-capable" content="yes">
<!-- Android: installs full-screen from Chrome's "Add to Home screen". -->
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<!-- Verse Word's dictionary: every 4–7 letter word in the Bible and Book of Mormon. -->
<script src="fullscreen.js"></script>
<script src="scripture-words.js" defer></script>

<style>
  /* Core layout lives in plain CSS (not Tailwind) so the page still
     lays out even if the compiled block above were missing. */
  :root {
    --sat: env(safe-area-inset-top, 0px);
    --sab: env(safe-area-inset-bottom, 0px);
    --ink: #0a0a14;
    --right: #34d399;
    --wrong: #fb7185;
    --gold: #fcd34d;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body {
    margin: 0; padding: 0; height: 100%;
    background: var(--ink); color: #fff;
    font-family: 'Outfit', ui-sans-serif, system-ui, sans-serif;
    overscroll-behavior: none;
  }

  /* Hide every scrollbar; this should feel like an app, not a web page. */
  ::-webkit-scrollbar { display: none !important; width: 0 !important; }
  * { scrollbar-width: none !important; -ms-overflow-style: none !important; }

  /* The page: one column, the same on a phone and a tablet. */
  #home {
    height: 100dvh;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    overscroll-behavior-y: contain;
    background: linear-gradient(165deg, #1e1b4b 0%, #3b1a6e 38%, #0a0a14 88%);
  }
  .home-in { max-width: 600px; margin: 0 auto; padding: calc(var(--sat) + 92px) 20px calc(var(--sab) + 48px); }
  .home-sec { margin-top: 26px; }
  .home-win { margin-top: 6px; font-size: 15px; font-weight: 800; color: var(--right); }
  .dev-link { display: inline-block; margin-bottom: 10px; padding: 6px 12px; border-radius: 999px; font-size: 13px; font-weight: 800;
              color: var(--gold); background: rgba(252,211,77,.1); border: 1px solid rgba(252,211,77,.35); }
  .lb-help { margin-top: 4px; font-size: 12.5px; color: rgba(255,255,255,.6); }
  .lb-sec { margin-top: 16px; font-size: 13px; font-weight: 800; color: var(--gold); }
  .report-row.todo { color: rgba(255,255,255,.55); }

  /* A past week on its own screen; a reel or chapter from it opens over it, in #view. */
  #past { position: fixed; inset: 0; z-index: 85; overflow-y: auto; background: var(--ink); -webkit-overflow-scrolling: touch; }
  #past[hidden] { display: none; }
  #past .view-back { position: fixed; }
  .past-note { margin-top: 14px; padding: 12px 14px; border-radius: 14px; background: rgba(0,0,0,.3); border: 1px solid rgba(255,255,255,.12); }
  .past-note p { margin-top: 4px; font-size: 15px; line-height: 1.5; color: rgba(255,255,255,.9); white-space: pre-wrap; }
  /* Caught up on since the week ended: an outlined mark. Answered that week,
     but which answer wasn't saved: a grey one. */
  .report-row.is-right.late .st { background: none; color: var(--right); }
  .report-row.is-wrong.late .st { background: none; color: var(--wrong); }
  .report-row.is-done .st { background: rgba(255,255,255,.7); border-color: rgba(255,255,255,.7); color: #0b1024; }
  .past-legend b { font-weight: 800; color: rgba(255,255,255,.85); }

  /* One reel on its own screen, over the page and its top bar. */
  #view { position: fixed; inset: 0; z-index: 90; background: var(--ink); }
  #view[hidden] { display: none; }
  #view .content-pad { max-width: 640px; margin: 0 auto; width: 100%; }
  .view-back {
    position: absolute; z-index: 30; top: calc(var(--sat) + 12px); left: 12px;
    padding: 8px 14px; border-radius: 999px; cursor: pointer;
    font: inherit; font-size: 14px; font-weight: 800; color: #fff;
    background: rgba(0,0,0,.55); border: 1px solid rgba(255,255,255,.2); backdrop-filter: blur(6px);
  }
  .reel {
    position: relative;
    height: 100dvh;
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    overflow: hidden;
    touch-action: manipulation;
  }

  /* Soft moving blobs behind the text, so each reel has depth. */
  .blob {
    position: absolute; border-radius: 9999px;
    filter: blur(70px); opacity: .5; pointer-events: none;
    animation: drift 14s ease-in-out infinite alternate;
  }
  @keyframes drift {
    from { transform: translate3d(0,0,0) scale(1); }
    to   { transform: translate3d(8%, -6%, 0) scale(1.25); }
  }

  /* Legibility scrim: text sits over gradients, so darken top and bottom. */
  .scrim {
    position: absolute; inset: 0; pointer-events: none;
    background:
      linear-gradient(to bottom, rgba(5,5,12,.72) 0%, rgba(5,5,12,0) 26%),
      linear-gradient(to top,   rgba(5,5,12,.9) 0%, rgba(5,5,12,0) 60%);
  }

  /* XP bar fill. */
  #xpFill { transition: width .6s cubic-bezier(.22,1,.36,1); }

  /* Toasts sit under the HUD so they never cover the answer buttons, and
     above the lesson and the game screens, where most of them happen. */
  #toasts {
    position: fixed; z-index: 125; left: 0; right: 0;
    top: calc(var(--sat) + 62px);
    display: flex; flex-direction: column; align-items: center; gap: 7px;
    pointer-events: none;
  }
  .toast { animation: toastIn .35s cubic-bezier(.22,1,.36,1), toastOut .4s ease 1.9s forwards; }
  @keyframes toastIn  { from { transform: translateY(-10px) scale(.9); opacity: 0; } }
  @keyframes toastOut { to   { transform: translateY(-8px); opacity: 0; } }

  /* Level-up celebration. */
  #levelup {
    position: fixed; inset: 0; z-index: 124;
    display: none; align-items: center; justify-content: center;
    background: radial-gradient(circle at 50% 45%, rgba(251,191,36,.22), rgba(3,3,10,.94));
  }
  #levelup.show { display: flex; animation: fadeIn .3s ease; }
  @keyframes fadeIn { from { opacity: 0; } }
  .lv-card { animation: lvPop .6s cubic-bezier(.22,1,.36,1); }
  @keyframes lvPop {
    0%   { transform: scale(.6) translateY(20px); opacity: 0; }
    100% { transform: scale(1) translateY(0); opacity: 1; }
  }

  /* Safe-area offsets as plain CSS: `calc(var(--sab)+10px)` without
     spaces is invalid, so these can't be Tailwind arbitrary values. */
  .hud-pad  { padding-top: calc(var(--sat) + 10px); }
  /* Long level titles ("Prophet's Apprentice") wrap to two lines instead of
     squeezing the XP bar out of the top row; narrow phones get tighter gaps. */
  #levelTitle { max-width: 72px; line-height: 1.1; }
  #hudRow { gap: 10px; }
  @media (max-width: 380px) { #hudRow { gap: 6px; } }

  /* The text column. A reel with its question can be taller than a small
     phone, so it scrolls inside the reel. */
  .content-pad {
    padding-top: calc(var(--sat) + 68px);   /* clears the HUD */
    padding-bottom: calc(var(--sab) + 40px);
    max-height: 100dvh;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
  }

  /* Type scales with viewport HEIGHT, so a 640px Android gets smaller text
     instead of a wall to scroll. Checked at 360x640, 390x844 and 430x932. */
  .eyebrow {
    font-size: 10.5px; font-weight: 800; letter-spacing: .12em;
    text-transform: uppercase; color: rgba(255,255,255,.62);
  }
  .reel-hook {
    font-size: clamp(21px, 3.1vh, 28px);
    line-height: 1.13; font-weight: 900;
    letter-spacing: -0.02em; margin: 8px 0 10px;
    text-wrap: balance;
  }
  .reel-body {
    font-size: clamp(14px, 1.9vh, 16px);
    line-height: 1.5; color: rgba(255,255,255,.9);
  }
  .verse-text { font-size: clamp(13.5px, 1.8vh, 15px); line-height: 1.42; }

  /* ---- The question at the end of each reel ---- */
  .quiz { margin-top: 16px; }
  .quiz-q {
    font-size: clamp(15px, 2vh, 17px); font-weight: 800;
    line-height: 1.3; margin: 6px 0 10px;
  }
  .quiz-choices { display: flex; flex-direction: column; gap: 8px; }
  .choice {
    display: flex; align-items: center; gap: 10px;
    width: 100%; min-height: 46px; padding: 10px 14px;
    border-radius: 14px; text-align: left;
    font: inherit; font-size: 14.5px; font-weight: 600; line-height: 1.3;
    color: #fff; background: rgba(0,0,0,.38);
    border: 1.5px solid rgba(255,255,255,.22);
    cursor: pointer; transition: transform .12s ease, background .2s ease, border-color .2s ease, opacity .2s ease;
  }
  .choice:active { transform: scale(.98); }
  .choice:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
  .choice .mark {
    flex: 0 0 22px; height: 22px; border-radius: 999px;
    display: grid; place-items: center;
    font-size: 12px; font-weight: 900;
    border: 1.5px solid rgba(255,255,255,.35);
  }
  .quiz.done .choice { cursor: default; opacity: .45; }
  .quiz.done .choice:active { transform: none; }
  .quiz .choice.is-right { opacity: 1; background: rgba(52,211,153,.2); border-color: var(--right); }
  .quiz .choice.is-right .mark { background: var(--right); border-color: var(--right); color: #052e1c; }
  .quiz .choice.is-wrong { opacity: 1; background: rgba(251,113,133,.18); border-color: var(--wrong); }
  .quiz .choice.is-wrong .mark { background: var(--wrong); border-color: var(--wrong); color: #3b0512; }
  .quiz-why {
    margin-top: 10px; padding: 10px 14px; border-radius: 14px;
    font-size: 14px; line-height: 1.45; background: rgba(0,0,0,.4);
    animation: whyIn .3s ease;
  }
  .quiz-why b { font-weight: 900; }
  .quiz-why .ok { color: var(--right); }
  .quiz-why .no { color: var(--wrong); }
  @keyframes whyIn { from { opacity: 0; transform: translateY(-4px); } }

  /* A picture gets its own space at the top of its reel, whole and not
     dimmed: the picture fits inside the space (nothing cropped), over a
     blurred copy of itself that fills the rest, and the HUD sits over the
     blurred part. The text follows below it, so the reel scrolls inside
     itself on most phones. */
  .has-photo .content-pad { padding-top: 0; min-height: 100dvh; }
  .reel-pic {
    position: relative; overflow: hidden;
    margin: 0 -28px 0 -20px;                    /* full width: undo the column's px-5 pr-7 */
    padding-top: calc(var(--sat) + 58px);
    height: calc(var(--sat) + 58px + clamp(190px, 36vh, 380px));
  }
  .reel-pic .reel-photo-fill {
    position: absolute; inset: -24px; width: calc(100% + 48px); height: calc(100% + 48px);
    object-fit: cover; filter: blur(18px) brightness(.5);
  }
  .reel-pic .reel-photo { position: relative; display: block; width: 100%; height: 100%; object-fit: contain; }
  .has-photo .credit { margin: 6px 0 10px; }
  /* The page scrolls up under the HUD: it gets a solid bar that fades out
     at its bottom edge. */
  header { background: linear-gradient(to bottom, rgba(17,14,42,.97) 0%, rgba(17,14,42,.95) 80%, rgba(17,14,42,0) 100%); }
  .credit { font-size: 11px; color: rgba(255,255,255,.55); margin-top: 3px; }
  /* A scripture reference in text: a link to it in Gospel Library. */
  .ref-link { color: inherit; text-decoration: underline; text-decoration-color: rgba(252,211,77,.8); text-decoration-thickness: 1.5px; text-underline-offset: 2px; }
  .ref-link:hover, .ref-link:focus-visible { color: var(--gold); }
  .credit a { color: inherit; text-decoration: underline; text-decoration-color: rgba(255,255,255,.3); }

  /* Tap-to-play clip. Nothing loads from YouTube until he taps. */
  .clip {
    margin-top: 14px; display: flex; align-items: center; gap: 12px;
    width: 100%; padding: 10px 12px; border-radius: 14px; text-align: left;
    font: inherit; color: #fff; cursor: pointer; text-decoration: none;
    background: rgba(0,0,0,.45); border: 1.5px solid rgba(255,255,255,.22);
  }
  .clip:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
  .clip-play {
    flex: 0 0 44px; height: 44px; border-radius: 999px;
    display: grid; place-items: center; background: #fff; color: #111; font-size: 16px;
  }
  .clip.watched { border-color: rgba(52,211,153,.6); }
  .clip.watched .clip-play { background: var(--right); color: #052e1c; font-weight: 900; }
  .clip-title { font-size: 14px; font-weight: 800; line-height: 1.25; }
  .clip-meta  { font-size: 11.5px; color: rgba(255,255,255,.6); margin-top: 2px; }
  .clip-frame { margin-top: 14px; width: 100%; aspect-ratio: 16 / 9; border-radius: 14px; overflow: hidden; background: #000; }
  .clip-frame iframe { width: 100%; height: 100%; border: 0; display: block; }

  /* Bonus question: the answer is only in the chapter or the lesson. */
  .quiz.bonus { margin-top: 18px; padding-top: 14px; border-top: 1px dashed rgba(255,255,255,.25); }
  .find-link {
    display: inline-flex; align-items: center; gap: 6px; margin: 2px 0 10px;
    font-size: 13px; font-weight: 700; color: var(--gold);
    text-decoration: underline; text-decoration-color: rgba(252,211,77,.4);
  }

  /* ---- Family rewards (set by a parent) ---- */
  .reward { margin-top: 8px; padding: 10px 12px; border-radius: 12px; background: rgba(0,0,0,.35); font-size: 14px; border: 1.5px solid transparent; }
  .reward.unlocked { border-color: var(--right); }
  .reward-bar { margin-top: 7px; height: 6px; border-radius: 999px; background: rgba(255,255,255,.12); overflow: hidden; }
  .reward-bar div { height: 100%; border-radius: 999px; background: linear-gradient(90deg, #a78bfa, var(--gold)); }
  .reward.unlocked .reward-bar div { background: var(--right); }
  .parent-link, .board-link {
    display: block; margin-top: 10px; padding: 0; border: 0; background: none; cursor: pointer;
    font: inherit; font-size: 13px; font-weight: 700; text-align: left;
    color: rgba(255,255,255,.7); text-decoration: underline; text-decoration-color: rgba(255,255,255,.3);
  }
  .board-link {
    margin-top: 16px; padding: 12px 16px; border-radius: 14px; text-decoration: none; width: 100%;
    font-size: 15px; font-weight: 800; color: #fff;
    background: linear-gradient(90deg, rgba(124,58,237,.55), rgba(217,119,6,.45));
    border: 1.5px solid rgba(255,255,255,.22);
  }
  .board-link small { display: block; font-size: 12px; font-weight: 600; color: rgba(255,255,255,.7); margin-top: 2px; }

  /* ---- Overlays: the family board and the parent screen ---- */
  .overlay {
    position: fixed; inset: 0; z-index: 120;
    display: flex; align-items: flex-end; justify-content: center;
    padding: calc(var(--sat) + 16px) 16px calc(var(--sab) + 16px);
    background: rgba(3,3,10,.82); backdrop-filter: blur(4px);
  }
  .overlay[hidden], #board[hidden], #play[hidden], #live[hidden], #fam[hidden], #dev[hidden], #risk[hidden], #snake[hidden], #look[hidden], #ammon[hidden] { display: none; }
  .overlay-card {
    width: 100%; max-width: 520px; max-height: 88dvh; overflow-y: auto;
    padding: 18px; border-radius: 22px; background: #12121f; border: 1px solid rgba(255,255,255,.12);
  }
  .field {
    width: 100%; font: inherit; font-size: 16px; color: #fff;   /* 16px stops iOS zooming in */
    background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.18);
    border-radius: 12px; padding: 10px 12px;
  }
  .field:focus-visible { outline: 2px solid var(--gold); outline-offset: 1px; }
  .reward-row { display: grid; grid-template-columns: 86px 1fr auto; gap: 8px; align-items: center; }
  .claim { display: flex; align-items: center; gap: 6px; font-size: 13px; color: rgba(255,255,255,.75); white-space: nowrap; }
  .parent-msg { margin-top: 10px; font-size: 14px; font-weight: 700; color: var(--gold); }
  .btn {
    font: inherit; font-weight: 800; font-size: clamp(14px, 1.6vw, 22px);
    padding: 12px 20px; border-radius: 999px; border: 0; cursor: pointer;
    background: #fff; color: #111;
  }
  .btn.ghost { background: rgba(255,255,255,.1); color: #fff; border: 1px solid rgba(255,255,255,.22); }
  .btn:focus-visible, .tile:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }

  #board, #play, #live, #fam, #dev, #risk, #snake, #look, #ammon {
    position: fixed; inset: 0; z-index: 110; overflow-y: auto;
    display: flex; flex-direction: column;
    padding: calc(var(--sat) + 14px) 16px calc(var(--sab) + 16px);
    background: radial-gradient(120% 90% at 50% 0%, #1e1b4b 0%, var(--ink) 70%);
  }
  .board-top { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  .board-title { font-weight: 900; font-size: clamp(18px, 2.4vw, 32px); line-height: 1.1; }
  .board-scores { display: flex; gap: 8px; flex-wrap: wrap; margin-left: auto; }
  .score-chip {
    padding: 6px 12px; border-radius: 999px; font-weight: 800; font-size: clamp(13px, 1.4vw, 20px);
    background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.15);
  }
  .score-chip b, .score-row b { color: var(--gold); margin-left: 8px; font-variant-numeric: tabular-nums; }
  .board-grid { display: grid; gap: 10px; margin-top: 16px; }
  .board-cat {
    display: flex; align-items: center; justify-content: center; min-height: 64px;
    padding: 10px 6px; border-radius: 12px; text-align: center; text-wrap: balance;
    font-weight: 900; font-size: clamp(11px, 1.3vw, 18px); letter-spacing: .04em; text-transform: uppercase;
    background: rgba(76,29,149,.55);
  }
  .tile {
    min-height: clamp(56px, 11vh, 120px); border-radius: 12px; cursor: pointer;
    font: inherit; font-weight: 900; font-size: clamp(22px, 3.4vw, 54px); font-variant-numeric: tabular-nums;
    color: var(--gold); background: linear-gradient(160deg, #312e81, #1e1b4b); border: 1px solid rgba(255,255,255,.15);
  }
  .tile:disabled { cursor: default; font-size: clamp(12px, 1.3vw, 18px); color: rgba(255,255,255,.4); background: rgba(255,255,255,.04); }
  .tile.empty { visibility: hidden; }
  .clue { width: 100%; max-width: 1100px; margin: 20px auto 0; }
  .clue-q { font-weight: 900; font-size: clamp(22px, 3.6vw, 52px); line-height: 1.2; margin: 8px 0 16px; text-wrap: balance; }
  .clue-choices .choice { cursor: default; font-size: clamp(15px, 1.9vw, 28px); min-height: clamp(46px, 7vh, 80px); }
  .clue .quiz-why { font-size: clamp(14px, 1.7vw, 24px); }
  .dd-banner {
    display: inline-block; margin-bottom: 10px; padding: 6px 14px; border-radius: 999px;
    font-weight: 900; letter-spacing: .06em; text-transform: uppercase; font-size: clamp(12px, 1.4vw, 20px);
    color: #1c1406; background: var(--gold);
  }
  .board-help { font-size: clamp(14px, 1.5vw, 20px); color: rgba(255,255,255,.72); line-height: 1.45; max-width: 60ch; }
  .board-names { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 8px; margin-top: 16px; }
  .board-actions { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 18px; }
  .score-row {
    display: flex; justify-content: space-between; padding: 12px 16px; border-radius: 14px;
    font-weight: 800; font-size: clamp(16px, 2vw, 28px); background: rgba(255,255,255,.06);
  }

  /* ---- Games: the menu, the weekly puzzle, Who said it? ---- */
  .game-row {
    display: flex; align-items: center; gap: 12px; width: 100%; margin-top: 10px;
    padding: 12px 14px; border-radius: 16px; text-align: left; cursor: pointer;
    font: inherit; color: #fff; background: rgba(255,255,255,.06); border: 1.5px solid rgba(255,255,255,.14);
  }
  .game-row:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
  .game-row .gi { flex: 0 0 42px; height: 42px; border-radius: 12px; display: grid; place-items: center; font-size: 22px; background: rgba(255,255,255,.08); }
  .game-row .gt { font-weight: 800; font-size: 15px; }
  .game-row .gd { font-size: 12.5px; color: rgba(255,255,255,.65); margin-top: 2px; line-height: 1.35; }
  .game-row .gs { font-size: 12px; font-weight: 800; margin-top: 4px; color: var(--gold); }
  .game-row.locked { opacity: .6; }
  .shop-card { width: 100%; display: flex; align-items: center; gap: 12px; margin: 10px 0 4px; padding: 12px 14px; border-radius: 16px; border: 1px solid rgba(252,211,77,.35); background: linear-gradient(135deg, rgba(252,211,77,.14), rgba(244,114,182,.10)); color: #fff; font: inherit; text-align: left; cursor: pointer; }
  .shop-card > span:first-child { font-size: 26px; } .shop-card > span:nth-child(2) { flex: 1; font-weight: 800; font-size: 16px; } .shop-card small { display: block; font-weight: 600; font-size: 13px; color: var(--gold); margin-top: 2px; } .shop-card > span:last-child { color: rgba(255,255,255,.5); font-size: 20px; }
  .shop-have { display: flex; align-items: baseline; gap: 8px; margin: 6px 0 2px; } .shop-have b { font-size: 34px; font-weight: 900; color: var(--gold); line-height: 1; } .shop-have span { font-weight: 800; color: rgba(255,255,255,.75); }
  .shop-msg { margin: 10px 0 0; padding: 10px 12px; border-radius: 12px; background: rgba(134,239,172,.12); color: #d1fae5; font-size: 14px; }
  .shop-list { display: grid; gap: 8px; margin-top: 12px; }
  .shop-row { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 14px; background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.1); flex-wrap: wrap; }
  .shop-row.dim { opacity: .6; }
  .shop-ico { font-size: 26px; flex: 0 0 auto; } .shop-name { flex: 1 1 140px; font-weight: 800; font-size: 15px; } .shop-name small { display: block; font-weight: 600; font-size: 12.5px; color: var(--gold); margin-top: 2px; }
  .shop-why { font-size: 12.5px; font-weight: 700; color: rgba(255,255,255,.6); } .shop-buy { padding: 8px 14px; font-size: 14px; }
  .shop-ask { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; font-size: 13px; font-weight: 700; }
  .shop-mine { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 8px 2px; border-bottom: 1px solid rgba(255,255,255,.08); font-size: 14px; flex-wrap: wrap; } .shop-mine small { display: block; font-size: 12px; color: rgba(255,255,255,.55); }
  .shop-mine.approved > span:last-child { color: #86efac; font-weight: 800; } .shop-mine.given > span:last-child { color: var(--gold); font-weight: 800; } .shop-mine.declined, .shop-mine.cancelled { opacity: .6; }
  .req-row { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 8px 0; border-bottom: 1px solid rgba(255,255,255,.08); flex-wrap: wrap; font-size: 14px; } .req-row:last-child { border-bottom: 0; } .req-row small { display: block; font-size: 12px; color: rgba(255,255,255,.55); } .req-btns { display: flex; gap: 4px; }
  /* My Season */
  .sea-card { margin-top: 14px; padding: 14px 16px; border-radius: 18px; background: linear-gradient(135deg, rgba(134,239,172,.10), rgba(14,165,233,.06)); border: 1px solid rgba(134,239,172,.32); }
  .sea-top { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }
  .sea-link { font: inherit; font-size: 12.5px; font-weight: 800; color: #86efac; background: none; border: 0; cursor: pointer; padding: 2px 0; }
  .sea-intro { margin: 8px 0 4px; font-size: 14.5px; line-height: 1.45; color: rgba(255,255,255,.8); }
  .sea-go { margin-top: 8px; }
  .sea-tick, .sea-check { width: 100%; display: flex; align-items: center; gap: 12px; margin-top: 8px; padding: 10px 12px; border-radius: 14px; font: inherit; text-align: left; color: #fff; cursor: pointer; background: rgba(0,0,0,.22); border: 1px solid rgba(255,255,255,.12); }
  .sea-tick i { flex: 0 0 auto; width: 26px; height: 26px; border-radius: 8px; border: 2px solid rgba(134,239,172,.6); display: grid; place-items: center; font-style: normal; font-weight: 900; color: #052e16; }
  .sea-tick.on i { background: #86efac; border-color: #86efac; }
  .sea-tick > span, .sea-check { font-weight: 800; font-size: 15px; } .sea-tick small, .sea-check small { display: block; font-weight: 600; font-size: 12.5px; color: rgba(255,255,255,.58); margin-top: 2px; }
  .sea-tick.on > span { color: rgba(255,255,255,.75); }
  .sea-check { justify-content: space-between; border-color: rgba(252,211,77,.4); background: rgba(252,211,77,.08); } .sea-check small { color: var(--gold); margin: 0; }
  .sea-goal { display: flex; gap: 10px; align-items: center; margin-top: 8px; font-weight: 800; } .sea-goal small { display: block; font-weight: 600; font-size: 12.5px; color: rgba(255,255,255,.55); }
  .sea-g { margin-top: 14px; padding: 12px 14px; border-radius: 16px; background: rgba(0,0,0,.25); border: 1px solid rgba(255,255,255,.1); }
  .sea-g-top { display: flex; align-items: center; gap: 8px; } .sea-g-top .today-alt { margin: 0 0 0 auto; }
  .sea-area { font-size: 12px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; color: #86efac; } .sea-lock { font-size: 12px; font-weight: 700; color: rgba(255,255,255,.6); }
  .sea-g-text { margin-top: 4px; font-size: 17px; font-weight: 900; }
  .sea-why { margin-top: 4px; font-size: 13px; color: rgba(255,255,255,.62); }
  .sea-step { margin-top: 10px; font-size: 14px; font-weight: 700; } .sea-step small { display: block; font-size: 12px; font-weight: 600; color: rgba(255,255,255,.55); }
  .sea-meta { margin-top: 8px; font-size: 12.5px; color: rgba(255,255,255,.6); } .sea-meta:empty { display: none; }
  .sea-grid { display: flex; gap: 3px; margin-top: 6px; overflow-x: auto; padding-bottom: 2px; }
  .sg-col { display: grid; grid-template-rows: repeat(7, 1fr); gap: 3px; padding: 2px; border-radius: 5px; } .sg-col.full { background: rgba(134,239,172,.14); }
  .sg-d { width: 14px; height: 14px; padding: 0; border-radius: 3px; border: 0; background: rgba(255,255,255,.12); cursor: pointer; display: block; }
  .sg-d.on { background: #86efac; } .sg-d.now { outline: 2px solid var(--gold); outline-offset: 0; } .sg-d.later { background: rgba(255,255,255,.04); cursor: default; }
  .sg-cap { display: flex; justify-content: space-between; max-width: calc(13 * 23px); font-size: 11px; color: rgba(255,255,255,.45); margin-top: 2px; }
  .sea-fam { margin: 10px 0 2px; padding: 8px 12px; border-radius: 12px; font-size: 14px; background: rgba(252,211,77,.08); border: 1px solid rgba(252,211,77,.25); }
  .sea-imp { margin-top: 8px; }

  .rk-chapter-who { display: inline-flex; align-items: center; gap: 10px; justify-self: start; padding: 6px 16px; border-radius: 999px; border: 3px solid var(--k); font-size: clamp(14px, 1.8vw, 30px); font-weight: 900; }

  .rk-chapters li { display: flex; align-items: center; gap: 6px; padding: 6px 12px; border-radius: 999px; background: rgba(10,10,20,.85); border: 1px solid rgba(255,255,255,.16); font-size: clamp(11px, 1.1vw, 18px); font-weight: 800; color: rgba(255,255,255,.65); }
  .rk-chapters li.now { border: 2px solid var(--gold); color: var(--gold); } .rk-chapters li.done { color: #fff; } .rk-chapters li.done b { color: var(--right); }
  /* Flick to roll: a tray of dice on the phone; flick them up, or tap. */
  .rk-tray { display: grid; justify-items: center; gap: 6px; margin-top: 8px; padding: 16px 10px 12px; border-radius: 18px; border: 2px solid var(--gold); background: rgba(252,211,77,.08); touch-action: none; user-select: none; -webkit-user-select: none; cursor: grab; }
  .rk-tray[disabled] { opacity: .45; cursor: default; border-color: rgba(255,255,255,.2); }
  .rk-tray:focus-visible { outline: 3px solid #fff; outline-offset: 3px; }
  .rk-tray-dice { display: flex; gap: 10px; min-height: 46px; align-items: center; }
  .rk-tray-die, .rk-flyer { display: block; width: 46px; height: 46px; border-radius: 11px; box-shadow: inset 0 -3px 0 rgba(0,0,0,.2), 0 3px 8px rgba(0,0,0,.45); }
  .rk-tray-die.att, .rk-flyer.att { background: #dc2626; } .rk-tray-die.def, .rk-flyer.def { background: #f8fafc; }
  .rk-tray-hint { font-weight: 900; font-size: 18px; text-align: center; }
  .rk-tray small { display: flex; align-items: center; gap: 5px; font-weight: 800; color: var(--gold); }

  @keyframes rkNudge { 0%, 100% { transform: translateY(2px); } 50% { transform: translateY(-5px); } }
  .rk-flyer { position: fixed; z-index: 150; pointer-events: none; }
  .rk-watchtv { padding: 12px 14px; border-radius: 16px; background: rgba(252,211,77,.1); border: 1px solid rgba(252,211,77,.5); }
  .rk-watchtv .rk-big { margin: 0 0 4px; }
  /* A battle, played out over the big screen's map: zoomed in, fighters, numbered shots. */
  .rk-scene { position: absolute; z-index: 5; overflow: hidden; border-radius: 16px; background: #16324f; animation: rkSceneIn .3s ease both; }
  @keyframes rkSceneIn { from { opacity: 0; } to { opacity: 1; } }
  .rk-scene.out { opacity: 0; transition: opacity .45s; }
  .rk-scene-world { position: absolute; inset: 0; transform-origin: 0 0; transition: transform var(--zoom, 1.4s) cubic-bezier(.33,.05,.2,1); }
  .rk-scene-world svg { display: block; width: 100%; height: 100%; }
  .rk-sc-line { fill: none; stroke-width: 11; stroke-linejoin: round; transition: stroke .8s; }
  .rk-sc-dim { transition: opacity 1s; }
  .rk-sc-walls { fill: none; stroke: #e7d8b0; stroke-width: 5; stroke-dasharray: 10 6; }
  .rk-sc-army, .rk-sc-fx { transition: opacity .5s; }
  .rk-sc-badge circle { fill: #0a0a14; stroke-width: 5; } .rk-sc-badge text { fill: #fff; font-weight: 900; font-size: 21px; text-anchor: middle; }
  .rk-sc-fig > g, .rk-sc-shot > g { transform-box: fill-box; transform-origin: 50% 100%; }
  .rk-sc-shot > g { transform-origin: 50% 50%; }
  .rk-sc-shot circle { stroke-width: 3; }
  .rk-sc-shot.def circle { fill: #f8fafc; } .rk-sc-shot.att circle { fill: #dc2626; stroke: #fde68a; filter: drop-shadow(0 0 5px rgba(252,211,77,.9)); }
  .rk-sc-shot text { font-weight: 900; font-size: 15px; text-anchor: middle; } .rk-sc-shot.def text { fill: #0b1020; } .rk-sc-shot.att text { fill: #fff; }
  .rk-sc-shot.bench > g { opacity: .4; }
  .rk-sc-pair { stroke: var(--gold); stroke-width: 2.4; stroke-dasharray: 5 5; stroke-linecap: round; }
  .rk-sc-pop { font-weight: 900; font-size: 17px; text-anchor: middle; fill: #6ee7b7; stroke: #0a0a14; stroke-width: 4; paint-order: stroke; } .rk-sc-pop.lose { fill: #fda4af; }
  .rk-sc-burst { fill: none; stroke: #fde68a; stroke-width: 3; transform-box: fill-box; transform-origin: center; }
  .rk-sc-shard { fill: #fde68a; }
  .rk-sc-bench { font-weight: 800; font-size: 10px; text-anchor: middle; letter-spacing: .06em; fill: #e9d5ff; stroke: #0a0a14; stroke-width: 3; paint-order: stroke; }
  .rk-die.rk-sc-die { position: absolute; z-index: 2; width: 30px; height: 30px; padding: 4px; margin: -15px 0 0 -15px; border-radius: 8px; pointer-events: none; box-shadow: 0 3px 8px rgba(0,0,0,.5); }
  .rk-scene-skip { position: absolute; right: 10px; bottom: 10px; z-index: 3; padding: 6px 14px; border-radius: 999px; border: 1px solid rgba(255,255,255,.3); background: rgba(5,5,15,.78); color: #fff; font: inherit; font-weight: 800; font-size: 14px; cursor: pointer; }
  @media (prefers-reduced-motion: reduce) { .rk-tray small b { animation: none; } }

  .rk-advice p { margin: 0 0 6px; }

  /* The lobby and the one-screen setup. */

  .rk-king { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding: 10px 12px; border-radius: 12px; background: rgba(255,255,255,.08); border: 2px solid transparent; font: inherit; font-weight: 800; color: #fff; text-align: left; }

  /* ---- Family: people, join links and the family chat ---- */

  .sea-tab { padding-top: 6px; }

  /* ---- A day's lesson ---- */
  #lesson { position: fixed; inset: 0; z-index: 115; display: flex; flex-direction: column; background: #0f1020; }
  #lesson[hidden] { display: none; }
  .ls-top { display: flex; align-items: center; gap: 12px; padding: calc(var(--sat) + 12px) 16px 8px; }
  .ls-x { width: 36px; height: 36px; border: 0; border-radius: 999px; font-size: 18px; color: rgba(255,255,255,.7); background: rgba(255,255,255,.08); cursor: pointer; }
  .ls-prog { flex: 1; height: 14px; border-radius: 999px; background: rgba(255,255,255,.12); overflow: hidden; }
  .ls-prog div { height: 100%; width: 0; border-radius: 999px; background: #58cc02; transition: width .35s ease; }
  .ls-tag { font-size: 11px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; color: rgba(255,255,255,.45); }
  .ls-body { flex: 1; overflow-y: auto; padding: 8px 18px 20px; width: 100%; max-width: 560px; margin: 0 auto; }
  .ls-kind { font-size: 12px; font-weight: 900; letter-spacing: .08em; text-transform: uppercase; color: #c084fc; margin-top: 8px; }

  .ls-read img { display: block; width: 100%; max-height: 32vh; object-fit: contain; border-radius: 14px; background: #000; margin-bottom: 12px; }
  .ls-read .reel-body { font-size: 16px; }
  .ls-verse { margin-top: 12px; padding: 12px 14px; border-radius: 14px; background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.12); font-size: 16px; line-height: 1.5; }
  .ls-verse span.ref { display: block; margin-top: 6px; font-size: 12.5px; font-weight: 800; color: var(--gold); }
  .ls-ref-row { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
  .ls-ref-row a { font-size: 12px; font-weight: 700; color: rgba(255,255,255,.65); text-decoration: underline; text-decoration-color: rgba(255,255,255,.3); white-space: nowrap; }
  .ls-reads { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin: -6px 0 16px; font-size: 13px; color: rgba(255,255,255,.65); }
  .ls-reads a { padding: 6px 12px; border-radius: 999px; font-weight: 800; color: #1c1406; background: var(--gold); text-decoration: none; }
  .ls-blank { display: inline-block; min-width: 4.5em; border-bottom: 3px solid #c084fc; color: #e9d5ff; font-weight: 900; text-align: center; }
  .ls-opts { display: grid; gap: 10px; }
  .ls-opt {
    width: 100%; padding: 14px 16px; border-radius: 16px; cursor: pointer; text-align: left;
    font: inherit; font-size: 16px; font-weight: 800; color: #fff;
    background: rgba(255,255,255,.06); border: 2px solid rgba(255,255,255,.18); border-bottom-width: 4px;
  }

  .ls-opt.bad { background: rgba(255,75,75,.18); border-color: #ff4b4b; }
  .ls-opt:disabled { cursor: default; }
  /* Reading the chapter: the scripture itself, in a size he reads easily. */
  .ls-chapter .ls-prompt { margin-bottom: 6px; }
  .ls-gl { display: inline-block; margin: 0 0 14px; padding: 10px 0; font-size: 14px; font-weight: 800; color: var(--gold); text-decoration: underline; text-decoration-color: rgba(253,230,138,.35); }

  .ls-ch-end { margin: 18px 0 8px; text-align: center; font-size: 12px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: rgba(255,255,255,.45); }
  /* A verse: the texts he has on (KJV, plain words, BSB, Spanish or Tagalog), the first one full size, then its notes. */

  .ls-orig .ow { display: inline-flex; flex-direction: column; align-items: center; text-align: center; direction: ltr; min-width: 2.2em; max-width: 9.5em;
    font: inherit; color: inherit; padding: 2px 4px; border: 0; border-radius: 10px; background: none; cursor: pointer; }
  .ls-orig .ow:active, .ls-orig .ow:focus-visible { background: rgba(192,132,252,.18); outline: none; }
  .ls-orig .ow:disabled { cursor: default; }
  .sh-title { padding-right: 44px; font-size: 21px; font-weight: 900; }

  /* The buttons at the top of a chapter, each with the colour its lines have. */
  /* What he reads a chapter in: one row of buttons that always fits, each

     All in one row. Shorten the name if you need"). A draft's mark (the test

  .plain-bar { display: flex; flex-wrap: wrap; align-items: center; gap: 4px; margin: 0 0 14px; }

    flex: 1 1 0; min-width: 0; padding: 8px 2px; border-radius: 12px; cursor: pointer; text-align: center; white-space: nowrap;
    font: inherit; font-size: clamp(11.5px, 3.4vw, 13.5px); font-weight: 800; color: rgba(255,255,255,.5);
    background: rgba(255,255,255,.04); border: 1px solid rgba(255,255,255,.14);

  .plain-bar.many .lay { font-size: clamp(10px, 3.05vw, 13.5px); padding-left: 1px; padding-right: 1px; }   /* six buttons (ES·TL as well): "Hebrew" still fits a 320px phone */
  .lay.on { color: #fff; background: rgba(255,255,255,.1); border-color: var(--dot); box-shadow: inset 0 -3px 0 var(--dot); }

<!-- ==================================================================
     ENGINE
     Scoring, recall, gestures, persistence. Nothing below needs editing
     to change the weekly lesson: that's content/weeks.js.

     How XP works, on purpose:
       - XP comes ONLY from answering questions right. Scrolling, tapping
         and opening the app earn nothing.
       - Each reel's question pays once, on the first try.
       - On a new day, up to 3 earlier questions come back as a warm-up,
         missed ones first. Remembering one pays again.
       - A bonus question, shown after the reel's own, can only be answered
         from the chapter or the lesson page. It pays the most.
       - The streak counts days in a row with at least one answer.
       - A lesson records the same answers as the cards, so nothing pays
         twice. Its practice steps (fill in the word, put the words in
         order, match, who said it) pay nothing.
     ================================================================== -->
<script>
const TreasureUp = (function () {
  'use strict';

  // The live app and the test site share one web address, so they'd share
  // this browser's storage. The test site keeps its own names.
  const NS = /\/TreasureUp-test\//.test(location.pathname) ? 'treasureup-test.' : 'treasureup.';
  const STORE_KEY = NS + 'v1';

  // Errors on this device (Blake, 2026-10-02, trying the app out with the
  // family for a month or two: so breakage reaches him instead of being
  // silent). Kept on the device, at most 10 a day and each kind once, and
  // sent to the family (families/{fid}/errors, which only parents read) once
  // the device is in one. Nothing goes anywhere else.
  const ERR_KEY = NS + 'errors';
  let sendErrors = () => {};
  function noteError(msg, where, stack) {
    msg = String(msg || '').slice(0, 300);
    if (!msg || msg === 'Script error.') return;
    try {
      const q = JSON.parse(localStorage.getItem(ERR_KEY) || '{"day":"","n":0,"seen":[],"queue":[]}');
      const day = new Date().toISOString().slice(0, 10), sig = msg + '|' + where;
      if (q.day !== day) { q.day = day; q.n = 0; q.seen = []; }
      if (q.n >= 10 || q.seen.includes(sig)) return;
      q.n++; q.seen.push(sig);
      q.queue = q.queue.concat([{ msg, where: String(where || '').slice(0, 200), stack: String(stack || '').slice(0, 1500), at: Date.now() }]).slice(-20);
      localStorage.setItem(ERR_KEY, JSON.stringify(q));
    } catch (e) { return; }
    try { sendErrors(); } catch (e) {}
  }
  window.addEventListener('error', e => noteError(e.message, (e.filename || '').replace(/^.*\//, '') + ':' + e.lineno + ':' + e.colno, e.error && e.error.stack));
  window.addEventListener('unhandledrejection', e => { const r = e.reason || {}; noteError(r.message || String(r), 'a promise', r.stack); });

  const XP = { firstTry: 20, recall: 15, bonus: 25 };
  const RECALL_PER_DAY = 3;

  // Level titles double as the level cap: 20 levels (Blake, 2026-10-04: more
  // levels, since a week or two of steady play reached the old top, 8).
  const LEVEL_TITLES = [
    'Seeker', 'Reader', 'Truth Tracker', 'Rod Holder',
    'Searcher', 'Watchman', "Prophet's Apprentice", 'Disciple',
    'Scribe', 'Lamp Bearer', 'Pathfinder', 'Stripling Warrior',
    'Treasure Keeper', 'Shepherd', 'Standard Bearer', 'Witness',
    'Herald', 'Mighty in the Word', 'Valiant', 'Faithful Disciple'
  ];

  // Cumulative XP needed to *reach* level L. Levels 1–8 as they always were
  // (40·(L−1)·L: 0, 80, 240, 480 … 2,240), so nobody's level drops; from 9 on,
  // each takes 200 more than the one before, starting at 1,000 (level 9 at
  // 3,240, 10 at 4,440 … 20 at 27,440).
  const xpAt = L => L <= 8 ? 40 * (L - 1) * L : 2240 + (L - 8) * 1000 + 100 * (L - 8) * (L - 9);
  const levelFor = xp => {
    let L = 1;
    while (L < LEVEL_TITLES.length && xpAt(L + 1) <= xp) L++;
    return L;
  };

  // Every book of the standard works, as its Gospel Library path, so any
  // reference anywhere can be a link (tools/verify.mjs checks none is missing).
  const BOOK_PATHS = {
    'Genesis': 'ot/gen', 'Exodus': 'ot/ex', 'Leviticus': 'ot/lev', 'Numbers': 'ot/num', 'Deuteronomy': 'ot/deut',
    'Joshua': 'ot/josh', 'Judges': 'ot/judg', 'Ruth': 'ot/ruth', '1 Samuel': 'ot/1-sam', '2 Samuel': 'ot/2-sam',
    '1 Kings': 'ot/1-kgs', '2 Kings': 'ot/2-kgs', '1 Chronicles': 'ot/1-chr', '2 Chronicles': 'ot/2-chr',
    'Ezra': 'ot/ezra', 'Nehemiah': 'ot/neh', 'Esther': 'ot/esth', 'Job': 'ot/job', 'Psalms': 'ot/ps', 'Psalm': 'ot/ps',
    'Proverbs': 'ot/prov', 'Ecclesiastes': 'ot/eccl', 'Song of Solomon': 'ot/song', "Solomon's Song": 'ot/song',
    'Solomon’s Song': 'ot/song', 'Isaiah': 'ot/isa',
    'Jeremiah': 'ot/jer', 'Lamentations': 'ot/lam', 'Ezekiel': 'ot/ezek', 'Daniel': 'ot/dan', 'Hosea': 'ot/hosea',
    'Joel': 'ot/joel', 'Amos': 'ot/amos', 'Obadiah': 'ot/obad', 'Jonah': 'ot/jonah', 'Micah': 'ot/micah',
    'Nahum': 'ot/nahum', 'Habakkuk': 'ot/hab', 'Zephaniah': 'ot/zeph', 'Haggai': 'ot/hag', 'Zechariah': 'ot/zech',
    'Malachi': 'ot/mal',
    'Matthew': 'nt/matt', 'Mark': 'nt/mark', 'Luke': 'nt/luke', 'John': 'nt/john', 'Acts': 'nt/acts',
    'Romans': 'nt/rom', '1 Corinthians': 'nt/1-cor', '2 Corinthians': 'nt/2-cor', 'Galatians': 'nt/gal',
    'Ephesians': 'nt/eph', 'Philippians': 'nt/philip', 'Colossians': 'nt/col', '1 Thessalonians': 'nt/1-thes',
    '2 Thessalonians': 'nt/2-thes', '1 Timothy': 'nt/1-tim', '2 Timothy': 'nt/2-tim', 'Titus': 'nt/titus',
    'Philemon': 'nt/philem', 'Hebrews': 'nt/heb', 'James': 'nt/james', '1 Peter': 'nt/1-pet', '2 Peter': 'nt/2-pet',
    '1 John': 'nt/1-jn', '2 John': 'nt/2-jn', '3 John': 'nt/3-jn', 'Jude': 'nt/jude', 'Revelation': 'nt/rev',
    '1 Nephi': 'bofm/1-ne', '2 Nephi': 'bofm/2-ne', 'Jacob': 'bofm/jacob', 'Enos': 'bofm/enos', 'Jarom': 'bofm/jarom',
    'Omni': 'bofm/omni', 'Words of Mormon': 'bofm/w-of-m', 'Mosiah': 'bofm/mosiah', 'Alma': 'bofm/alma',
    'Helaman': 'bofm/hel', '3 Nephi': 'bofm/3-ne', '4 Nephi': 'bofm/4-ne', 'Mormon': 'bofm/morm',
    'Ether': 'bofm/ether', 'Moroni': 'bofm/moro',
    'Doctrine and Covenants': 'dc-testament/dc', 'D&C': 'dc-testament/dc',
    'Moses': 'pgp/moses', 'Abraham': 'pgp/abr', 'Joseph Smith—Matthew': 'pgp/js-m',
    'Joseph Smith—History': 'pgp/js-h', 'Articles of Faith': 'pgp/a-of-f'
  };

  /* ---------------- state ---------------- */

  let WEEK = null;
  let S = null;
  let booted = false;

  const freshState = () => ({
    xp: 0,
    streak: 0, lastStudy: null,  // the streak's length and its last day (from days, filled and frozen), for the family's screens
    days: {},     // days he studied (reading, when reading was due; else an answer): day -> 1
    filled: {},   // days whose planned chapters are all read, that day or later: day -> 1
    frozen: {},   // days a streak freeze covered: day -> 1 (the freeze comes back if the day is filled later)
    daysFrom: null,  // the day days, filled and frozen started (the streak before it was moved into them)
    answers: {},  // reelId -> { right, day }   first try at the reel's question
    bonus: {},    // reelId -> { right, day }   first try at its bonus question
    recall: {},   // reelId -> { last, misses } last day it came back, times missed
    daily: null,  // { day, ids: [...], done: { reelId: right } }
    freezes: 0,   // streak freezes: each covers one missed day, used automatically
    deep: {},     // Go-deeper questions: id -> { right, day, picked }  first try
    puzzle: null, // this week's puzzle: { week, day, solved: [groups], mistakes, status, rewarded }
    sayings: {},  // Who said it?: sayingId -> { right }  first try
    notes: {},    // his journal: reelId -> { text, day, hook, ref, rewarded }; kept across weeks
    words: {},    // Verse Word by day: { word, guesses, status, paid }
    climbDay: null,  // last day a Scripture Climb paid XP
    sayRecall: {},   // sayingId -> last day it came back in a warm-up
    sayPos: null,    // Who said it?: where the current round was left { week, idx, right, seed }
    history: [],     // finished weeks, for the year trail: { title, num, right, answered, read, chapters, rec }
    late: {},        // past weeks' questions answered since they ended: weekNum -> { answers, bonus, deep: id -> { right, picked, day, xp } }
    weekTitle: null, weekNum: null,
    read: {},        // this week's chapters he has read: "Isaiah 40" -> the day
    readLog: {},     // this week's reading clock: "Isaiah 40" -> { start, secs, said, xp, day }: when he first
                     // opened it, the time until "I read it", whether he said yes to "Did you read all of it?"
    found: {},       // Find it in the chapter: reelId -> { right, day }  first try
    insights: {},    // insight cards he has read (Go further): id -> the day; kept across weeks
    sunday: {},      // the youth's Sunday lessons: cardId -> { right, picked, day, xp }  first try; kept across weeks
    talks: {},       // conference talks studied: talkId -> { day, xp }; kept across weeks
    picks: {},       // each Sunday's talks for elders quorum and Relief Society: "2026-10-11" -> { eq, rs } (the family's, mirrored)
    readPos: {},     // where he was in a chapter not read yet: ref -> { v: first verse showing, at }
    weekChapters: 0  // how many chapters this week's reading has, for the year's count
  });

  // Every storage access is wrapped: private windows and blocked site data
  // throw here, and the app should still work when they do.
  function load() {
    try {
      const raw = localStorage.getItem(STORE_KEY);
      if (raw) return Object.assign(freshState(), JSON.parse(raw));
    } catch (e) { /* fall through to a fresh profile */ }
    return freshState();
  }
  function save() {
    saveLocal();
    queueSync();   // and to the family, if this device is in one
    queueSeasonSum();
  }
  function saveLocal() {
    try { localStorage.setItem(STORE_KEY, JSON.stringify(S)); } catch (e) {}
  }

  /* ---------------- dates ---------------- */

  const dayKey = (d = new Date()) =>
    d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');

  const dayDiff = (a, b) =>
    Math.round((new Date(b + 'T00:00:00') - new Date(a + 'T00:00:00')) / 86400000);

  /* ---------------- the streak ---------------- */

  // The streak (Blake, 2026-10-01: "if it is broken, it can be fixed and
  // restored by simply filling the readings etc for the missed days"): days
  // in a row kept. A day is kept when he studied that day (S.days: reading,
  // when reading was due; else an answer), or once the chapters planned for
  // it are all read, that day or later (S.filled): a missed day comes back
  // the moment its chapters are read, and the streak with it. A day with no
  // chapters planned (Sunday) is kept by doing something that day (Blake:
  // "Need something done"); a missed one only a streak freeze covers.
  // Freezes cover missed days when he next studies (S.frozen), and come back
  // if a day they covered is filled later. Today counts once it's kept;
  // until then the streak runs to yesterday.
  const dayAdd = (k, n) => { const d = new Date(k + 'T12:00:00'); d.setDate(d.getDate() + n); return dayKey(d); };
  // What gets used (Blake, 2026-10-02: a month or two with the family, then
  // decide what's worth keeping): a count a day of each thing opened, in his
  // own saved progress (so it reaches the family with it, where parents can
  // read it), the last 60 days kept. Nothing else is recorded.
  const USE_NAMES = { 'tab:study': 'Study tab', 'tab:scriptures': 'Scriptures tab', 'tab:family': 'Family tab', lesson: 'Lessons',
    chapter: 'Chapters opened', library: 'Scripture chapters', card: 'Cards', word: 'Word studies', listen: 'Listen',
    sunday: 'Sunday lessons', talk: 'Conference talks', shop: 'Rewards shop', season: 'My Season', seasonTick: 'Season ticks', impression: 'Impressions' };
  function use(key) {
    if (!S) return;
    const u = S.usage || (S.usage = {}), d = dayKey(), day = u[d] || (u[d] = {});
    day[key] = (day[key] || 0) + 1;
    const keep = dayAdd(d, -60);
    for (const k of Object.keys(u)) if (k < keep) delete u[k];
    saveLocal();
  }
  const keptDay = k => !!((S.days || {})[k] || (S.filled || {})[k]);
  const frozenDay = k => !!(S.frozen || {})[k];
  // The missed days that end the streak, newest first: back from today
  // (which still has time) through the days kept or frozen, the next ones
  // missed, as far as a kept day before them. None when no kept day comes
  // within 60 days before them: nothing for them to join up with.
  function streakGap() {
    let k = dayKey();
    if (!keptDay(k)) k = dayAdd(k, -1);
    for (let i = 0; i < 1500 && (keptDay(k) || frozenDay(k)); i++) k = dayAdd(k, -1);
    const gap = [];
    for (let i = 0; i < 60; i++, k = dayAdd(k, -1)) {
      if (keptDay(k) || frozenDay(k)) return gap;
      gap.push(k);
    }
    return [];
  }
  // Kept days in a row back from `from`, through frozen days (which add
  // none), and through `also` (days counted as kept or covered).
  function streakFrom(from, also) {
    let n = 0;
    for (let k = from, i = 0; i < 1500; i++, k = dayAdd(k, -1)) {
      const a = also && also.get(k);
      if (keptDay(k) || a === 'kept') n++;
      else if (!frozenDay(k) && a !== 'covered') break;
    }
    return n;
  }
  // The streak now: a gap the freezes he has would cover (spent when he
  // next studies) doesn't break it.
  function streakNow() {
    const today = dayKey(), gap = streakGap();
    const also = gap.length && gap.length <= (S.freezes || 0) ? new Map(gap.map(k => [k, 'covered'])) : null;
    return streakFrom(keptDay(today) ? today : dayAdd(today, -1), also);
  }
  // The supercharge (Blake, 2026-10-01: "the longer the streaks, the more
  // powerful the power up is! Like in video games when you supercharge"):
  // every XP he earns, times this, the steady climb he chose.
  const CHARGE = [[30, 3], [14, 2.5], [7, 2], [3, 1.5]];
  const chargeOf = n => (CHARGE.find(([d]) => n >= d) || [0, 1])[1];
  const nextCharge = n => CHARGE.slice().reverse().find(([d]) => n < d) || null;

  // After anything that might keep a day: the days whose chapters are now
  // all read (fillDays), freezes given back for days filled since, and, when
  // today is kept, freezes spent on the gap they cover. Then the streak's
  // length and last day, which the family's screens read.
  function updateStreak() {
    fillDays();
    const fr = S.frozen = S.frozen || {};
    let back = 0;
    for (const k of Object.keys(fr)) if (keptDay(k)) { delete fr[k]; back++; }
    if (back) { S.freezes = (S.freezes || 0) + back; toast('❄️ Streak freeze back', 'You caught up on the ' + (back === 1 ? 'day it covered' : 'days they covered')); }
    const gap = streakGap();
    if (keptDay(dayKey()) && gap.length && gap.length <= (S.freezes || 0)) {
      gap.forEach(k => { fr[k] = 1; });
      S.freezes -= gap.length;
      toast('❄️ Streak saved', gap.length === 1 ? 'Used a streak freeze' : 'Used ' + gap.length + ' streak freezes');
    }
    S.streak = streakNow();
    for (let k = dayKey(), i = 0; i < 60; i++, k = dayAdd(k, -1)) if (keptDay(k) || frozenDay(k)) { S.lastStudy = k; break; }
  }

  // Reading first: a day counts once he reads. With no reading left to do
  // (Sunday, or all caught up), an answer counts, as before.
  function markStudied(read) {
    const today = dayKey(), days = S.days = S.days || {};
    if (!days[today] && (read || !readingDue())) days[today] = 1;
    updateStreak();
  }

  // Pick today's warm-up: questions answered on an earlier day, missed ones
  // first, then the ones that have gone longest without coming back.
  function rollDay() {
    const today = dayKey();
    const live = new Set(WEEK.reels.map(r => r.id));
    // Today's, unless it was rolled from last week's reels (the app was open
    // across Sunday night): then this week's is rolled instead.
    if (S.daily && S.daily.day === today && S.daily.ids.every(id => live.has(id)) &&
        (!S.daily.say || (WEEK.sayings || []).some(x => x.id === S.daily.say))) return;
    const ids = Object.keys(S.answers)
      .filter(id => live.has(id) && S.answers[id].day < today)
      .map(id => {
        const a = S.answers[id], rc = S.recall[id];
        // Missed: its last try was wrong. Once it has come back, that's the
        // warm-up's answer, so one he remembers stops crowding out the rest.
        const missed = rc ? (rc.misses || 0) > 0 : !a.right;
        return { id, missed, last: rc ? rc.last : a.day };
      })
      .sort((x, y) => (y.missed - x.missed) || (x.last < y.last ? -1 : x.last > y.last ? 1 : 0))
      .slice(0, RECALL_PER_DAY)
      .map(x => x.id);
    let say = null;
    if (ids.length && WEEK.sayings && WEEK.sayings.length) {
      const seen = S.sayRecall || {};
      say = WEEK.sayings
        .map(x => ({ id: x.id, missed: !(S.sayings[x.id] && S.sayings[x.id].right), last: seen[x.id] || '' }))
        .sort((a, b) => (b.missed - a.missed) || (a.last < b.last ? -1 : a.last > b.last ? 1 : 0))[0].id;
    }
    S.daily = { day: today, ids, done: {}, say, sayDone: null };
  }

  /* ---------------- helpers ---------------- */

  const $ = id => document.getElementById(id);

  const esc = s => String(s == null ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;')
    .replace(/>/g, '&gt;').replace(/"/g, '&quot;');

  const reduceMotion = () =>
    window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  const reelById = id => WEEK.reels.find(r => r.id === id);

  // "Isaiah 14:13–14" -> the chapter page, scrolled to the first verse.
  // `chapterOnly` opens the top of the chapter instead, for bonus questions,
  // so the link doesn't point straight at the answer.
  function readLink(ref, chapterOnly) {
    const m = /^(.+?) (\d+)(?::(\d+))?/.exec(ref || '');
    return m ? scriptureUrl(m[1], m[2], chapterOnly ? null : m[3]) : null;
  }
  // A chapter, or a verse in it, in Gospel Library. Null for a book it doesn't know.
  function scriptureUrl(book, chapter, verse) {
    if (!BOOK_PATHS[book]) return null;
    return 'https://www.churchofjesuschrist.org/study/scriptures/' + BOOK_PATHS[book] + '/' + chapter +
      '?lang=eng' + (verse ? '&id=p' + verse + '#p' + verse : '');
  }
  const isRef = s => !!readLink(s);

  // Every scripture reference in a piece of text, as a link to Gospel Library:
  // "Isaiah 28:16", "D&C 133:14", "1 Peter 2:6", "Isaiah 22", lists like
  // "Isaiah 13–14; 22; 24–30; 35", and "verse 22" or "chapter 40", which mean
  // `home`'s chapter (the verse the text belongs to), the same way
  // tools/verify.mjs reads them when it checks quotes. Returns safe HTML.
  const BOOK_ALT = Object.keys(BOOK_PATHS).sort((a, b) => b.length - a.length)
    .map(b => b.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')).join('|');
  const REF_RE = new RegExp('(' + BOOK_ALT + ') (\\d+)(?::(\\d+)(?:[–-]\\d+)?)?(?:[–-]\\d+)?' +
    '|\\b([Vv]erses?|[Cc]hapter) (\\d+)(?:[–-]\\d+)?', 'g');
  const LIST_RE = /^(; ?)(\d+)(?::(\d+)(?:[–-]\d+)?)?(?:[–-]\d+)?(?! ?[A-Za-z])/;
  const refA = (href, label) => `<a class="ref-link" href="${esc(href)}" target="_blank" rel="noopener noreferrer">${esc(label)}</a>`;
  function linkRefs(text, home) {
    const t = String(text == null ? '' : text);
    const h = /^(.+?) (\d+)/.exec(home || '');
    const hb = h && BOOK_PATHS[h[1]] ? h[1] : null;
    let out = '', at = 0, m;
    REF_RE.lastIndex = 0;
    while ((m = REF_RE.exec(t))) {
      if (m[1] && m.index > 0 && /[A-Za-z0-9]/.test(t[m.index - 1])) continue;   // part of another word
      const href = m[1] ? scriptureUrl(m[1], m[2], m[3])
        : !hb ? null : /^c/i.test(m[4]) ? scriptureUrl(hb, m[5]) : scriptureUrl(hb, h[2], m[5]);
      if (!href) continue;
      out += esc(t.slice(at, m.index)) + refA(href, m[0]);
      at = m.index + m[0].length;
      for (let x; m[1] && (x = LIST_RE.exec(t.slice(at)));) {      // the rest of a list, same book
        out += esc(x[1]) + refA(scriptureUrl(m[1], x[2], x[3]), x[0].slice(x[1].length));
        at += x[0].length;
      }
      REF_RE.lastIndex = at;
    }
    return out + esc(t.slice(at));
  }
  // The verse a reel's question belongs to: a bonus's own verse, or the reel's.
  const homeOf = (r, b) => b && isRef(b.source) ? b.source : r.verse.ref;
  // The same for a game's question id: "reelId:q" or "reelId:b0".
  function homeOfId(id) {
    const [rid, part] = String(id).split(':'), r = reelById(rid);
    return !r ? null : part && part[0] === 'b' ? homeOf(r, bonusesOf(r)[Number(part.slice(1))]) : r.verse.ref;
  }
  // A Go-deeper reading's passage, and the verse its question belongs to.
  const deepPassage = d => isRef(d.read) ? d.read : null;
  const deepHome = d => isRef(d.source) ? d.source : deepPassage(d);

  // Answer order is shuffled so the right one isn't always first. Seeded,
  // so a reel shows the same order every time; recall uses a different seed
  // so he has to read the choices again, not remember a position.
  function hash(str) {
    let h = 2166136261;
    for (let i = 0; i < str.length; i++) { h ^= str.charCodeAt(i); h = Math.imul(h, 16777619); }
    return h >>> 0;
  }
  function choicesFor(q, seed) {
    const list = [q.right].concat(q.wrong);
    let h = hash(seed);
    for (let i = list.length - 1; i > 0; i--) {
      h = Math.imul(h ^ (h >>> 15), 2246822507) >>> 0;
      const j = h % (i + 1);
      const t = list[i]; list[i] = list[j]; list[j] = t;
    }
    return list;
  }

  /* ---------------- rendering ---------------- */

  function backdrop(r) {
    return `
      <div class="absolute inset-0" style="background-image:${r.gradient || 'linear-gradient(150deg,#1e293b,#0f172a)'}"></div>
      <div class="blob" style="width:58vw;height:58vw;left:-14vw;top:8vh;background:${r.blobA || 'rgba(255,255,255,.28)'}"></div>
      <div class="blob" style="width:48vw;height:48vw;right:-10vw;top:42vh;background:${r.blobB || 'rgba(0,0,0,.3)'};animation-delay:-6s"></div>
      <div class="scrim"></div>`;
  }

  const fmtTime = s => Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0');

  // Where a page can't embed players (the private preview), the card is a
  // plain link that opens YouTube at the clip's start instead.
  function clipHtml(v) {
    const inner = `
        <span class="clip-play">▶</span>
        <span>
          <span class="clip-title block">${esc(v.title)}</span>
          <span class="clip-meta block">${fmtTime(v.end - v.start)} clip · ${esc(v.channel)}${window.TU_NO_EMBED ? ' · opens YouTube' : ''}${v.previewed === true ? '' : ' · not approved yet, hidden in the app'}</span>
        </span>`;
    return window.TU_NO_EMBED
      ? `<a class="clip" href="https://www.youtube.com/watch?v=${encodeURIComponent(v.youtube)}&t=${v.start}s" target="_blank" rel="noopener noreferrer">${inner}</a>`
      : `<button class="clip" data-clip="${esc(v.youtube)}" data-start="${v.start}" data-end="${v.end}" aria-label="Play clip: ${esc(v.title)}">${inner}</button>`;
  }

  // A reel can have one bonus or several; each shows once the one before it
  // is answered. A bonus's `source` is a verse ("Isaiah 22:15"), "lesson",
  // or a Gospel Library page (the Friend, For the Strength of Youth, the
  // Liahona, the manual).
  const bonusesOf = r => !r.bonus ? [] : Array.isArray(r.bonus) ? r.bonus : [r.bonus];
  const bonusKey = (id, n) => id + '#' + n;

  function sourceLabel(src) {
    if (src === 'lesson' || /\/study\/manual\//.test(src)) return "this week's lesson";
    if (/\/study\/friend\//.test(src)) return 'the Friend';
    if (/\/study\/ftsoy\//.test(src)) return 'For the Strength of Youth';
    if (/\/study\/liahona\//.test(src)) return 'the Liahona';
    if (/^https:\/\//.test(src)) return 'Gospel Library';
    return src.replace(/:.*/, '');            // "Isaiah 22:15" -> "Isaiah 22"
  }
  function sourceLink(src) {
    if (src === 'lesson') return WEEK.lesson;
    if (/^https:\/\//.test(src)) return src;
    return readLink(src, true);
  }

  // One question block on a reel. `kind` is 'reel' or 'bonus' (with its
  // index `n`); `picked` is the choice he already made, if any.
  function quizHtml(r, kind, picked, n) {
    const q = kind === 'bonus' ? bonusesOf(r)[n] : r.question;
    const home = kind === 'bonus' ? homeOf(r, q) : r.verse.ref;
    const seed = kind === 'bonus' ? r.id + '|bonus' + n : r.id;
    const choices = choicesFor(q, seed);
    const done = picked != null;
    const where = kind === 'bonus' ? sourceLabel(q.source) : '';
    const label = kind === 'bonus' ? 'Bonus · find it in ' + refA(sourceLink(q.source), where) + ' · +' + XP.bonus + ' XP'
      : 'Quick check · +' + XP.firstTry + ' XP if right';
    const findLink = kind === 'bonus' && !done
      ? `<a class="find-link" href="${esc(sourceLink(q.source))}" target="_blank" rel="noopener noreferrer">Open ${esc(where)} ↗</a>`
      : '';

    const buttons = choices.map(c => {
      const right = c === q.right;
      const cls = done ? (right ? ' is-right' : c === picked ? ' is-wrong' : '') : '';
      const mark = done ? (right ? '✓' : c === picked ? '✕' : '') : '';
      return `<button class="choice${cls}" data-choice="${esc(c)}" ${done ? 'disabled' : ''}>
                <span class="mark">${mark}</span><span>${esc(c)}</span></button>`;
    }).join('');

    let why = '';
    if (done) {
      const ok = picked === q.right;
      why = `<p class="quiz-why">${ok ? '<b class="ok">Right.</b> ' : '<b class="no">Not quite.</b> '}${linkRefs(q.why, home)}` +
            (!ok && kind === 'reel' ? `<br><span class="text-white/55 text-[12px]">You'll see this one again in a warm-up.</span>` : '') +
            `</p>`;
    }

    return `
      <div class="quiz${done ? ' done' : ''}${kind === 'bonus' ? ' bonus' : ''}" data-quiz="${esc(r.id)}" data-kind="${kind}"${kind === 'bonus' ? ` data-n="${n}"` : ''}>
        <div class="eyebrow" style="color:var(--gold)">${label}</div>
        <p class="quiz-q">${linkRefs(q.q, home)}</p>
        ${findLink}
        <div class="quiz-choices">${buttons}</div>
        ${why}
      </div>`;
  }

  function reelHtml(r, i) {
    const a = S.answers[r.id];
    const picked = a ? a.picked : null;
    // Bonuses show once he's answered the reel's own question, one at a
    // time: the next appears after he answers the one before.
    let bonus = '';
    if (a) {
      for (let n = 0; n < bonusesOf(r).length; n++) {
        const b = S.bonus[bonusKey(r.id, n)];
        bonus += quizHtml(r, 'bonus', b ? b.picked : null, n);
        if (!b) break;
      }
    }
    return `
    <article class="reel${r.media && r.media.image ? ' has-photo' : ''}" data-id="${esc(r.id)}" data-index="${i}">
      ${backdrop(r)}
      <div class="relative z-20 px-5 pr-7 content-pad">
        ${reelFaceHtml(r, WEEK.sections[r.section])}
        ${quizHtml(r, 'reel', picked)}
        ${bonus}
        ${a ? noteHtml(r) : ''}
      </div>
    </article>`;
  }
  // A reel's picture, section, headline, text, clip and verse: everything
  // but its questions. (A past week's reels show the same face.)
  function reelFaceHtml(r, section) {
    const link = readLink(r.verse.ref);
    const media = r.media || {};
    const photo = media.image;
    const pic = photo ? `
        <div class="reel-pic">
          <img class="reel-photo-fill" src="${esc(photo.src)}" alt="" aria-hidden="true" decoding="async">
          <img class="reel-photo" src="${esc(photo.src)}" alt="${esc(photo.alt)}" decoding="async">
        </div>
        <div class="credit">Picture: <a href="${esc(photo.link)}" target="_blank" rel="noopener noreferrer">${esc(photo.credit)}</a></div>` : '';
    return `
        ${pic}
        <div class="eyebrow">${esc(section)}</div>
        <h2 class="reel-hook">${linkRefs(r.hook, r.verse.ref)}</h2>
        <p class="reel-body">${linkRefs(r.body, r.verse.ref)}</p>
        ${media.video && (media.video.previewed === true || window.TU_NO_EMBED) ? clipHtml(media.video) : ''}

        <div class="mt-4 rounded-2xl bg-black/35 backdrop-blur-sm ring-1 ring-white/15 px-4 py-3">
          <p class="verse-text font-medium text-white/95">“${esc(r.verse.text)}”</p>
          <div class="mt-2 flex items-center justify-between gap-3">
            <span class="text-[11px] font-bold tracking-wide text-amber-300">${linkRefs(r.verse.ref)}</span>
            ${link ? `<a href="${esc(link)}" target="_blank" rel="noopener noreferrer"
                         class="text-[11px] font-semibold text-white/60 underline decoration-white/30 shrink-0">read the chapter ↗</a>` : ''}
          </div>
        </div>`;
  }

  /* ---------------- home ---------------- */

  // The app is one page: the week, today's lesson, the week map, how the
  // week is going, and every reel to look back at. A day's work happens in
  // its lesson; this page is where it starts and where it shows.
  /* ---------------- the page: one timeline ---------------- */

  // The page (Blake, 2026-10-02, after the Scripture Central app: "the
  // chapters can merge into the week ... past weeks just fold into now
  // timeline"): the year's weeks, every day across a strip he scrolls back
  // through, and one card for the day picked (today at first), with its
  // chapters, reels and lesson, and its best cards folded under "More from
  // this day". Tabs at the bottom: Today, Study (every card of the week), and
  // Scriptures. On a wide screen (the Kindle) the timeline and the day card
  // sit side by side.
  let selDay = null;        // the day the card shows; today when null
  let homeTab = 'today';
  function homeHtml() {
    return `
      <div class="home-in">
        ${TEST_SITE ? testNoteHtml() : ''}
        ${homeTab === 'study' ? studyHtml() : homeTab === 'scriptures' ? scripturesHtml() : homeTab === 'games' ? gamesTabHtml() : homeTab === 'season' ? seasonTabHtml() : homeTab === 'family' ? `<div id="familyTab">${familyTabHtml()}</div>` : todayTabHtml()}
      </div>`;
  }
  function todayTabHtml() {
    return `
      <div class="tt-grid">
        <div class="tt-side">
          <div class="wk-line"><b>${esc(WEEK.title)}</b> · ${linkRefs(WEEK.reference)}</div>
          ${yearHtml()}
          ${stripHtml()}
        </div>
        <div class="tt-main">
          ${dayCardHtml(selDay || dayKey())}
          ${weekRowHtml()}
        </div>
      </div>`;
  }

  // The year: 52 weeks, done or to come; a tap on one the app has opens its Monday.
  function yearHtml() {
    const now = S.weekNum || weekNumOf(WEEK);
    if (!now) return '';
    const did = new Set((S.history || []).map(h => h.num)), have = new Map(allWeeks().map(w => [w.num, w]));
    const read = (S.history || []).reduce((n, h) => n + (h.read || 0), 0) + Object.keys(S.read || {}).length +
      Object.values(S.late || {}).reduce((n, w) => n + Object.keys((w && w.read) || {}).length, 0);
    const dots = Array.from({ length: YEAR_WEEKS }, (_, k) => {
      const n = k + 1, w = have.get(n), cls = n === now ? 'now' : did.has(n) ? 'did' : n < now ? 'past' : '';
      return w ? `<button class="yd ${cls}" data-day="${w.start}" aria-label="Week ${n}: ${esc(w.title)}"></button>` : `<i class="yd ${cls}" title="Week ${n}"></i>`;
    }).join('');
    return `<div class="year"><div class="eyebrow">Your year · week ${now} of ${YEAR_WEEKS}${read ? ' · ' + read + (read === 1 ? ' chapter' : ' chapters') + ' read' : ''}</div><div class="year-dots">${dots}</div></div>`;
  }
  // The weeks the app has, oldest first: { num, start, dates, title, week (null until an archived one loads) }.
  function allWeeks() {
    const out = [];
    for (const w of window.TU_WEEKS || []) { const start = weekStart(w.dates); if (start) out.push({ num: weekNumOf(w), start, dates: w.dates, title: w.title, week: w }); }
    for (const x of window.TU_PAST_INDEX || []) { const start = weekStart(x.dates); if (start && !out.some(o => o.num === x.num)) out.push({ num: x.num, start, dates: x.dates, title: x.title, week: null }); }
    return out.sort((a, b) => a.start.localeCompare(b.start));
  }
  const weekOfDay = k => allWeeks().find(w => k >= w.start && dayDiff(w.start, k) <= 6) || null;
  // Every day the app has, across a strip he scrolls back through; kept ✓
  // (missed days aren't marked: Blake, "Hide them"); today ringed.
  function stripHtml() {
    const ws = allWeeks();
    if (!ws.length) return '';
    const today = dayKey(), sel = selDay || today, MON = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
    const out = [];
    for (let k = ws[0].start, i = 0, end = dayAdd(ws[ws.length - 1].start, 6); k <= end && i < 800; k = dayAdd(k, 1), i++) {
      const d = new Date(k + 'T12:00:00');

    const deep = deepItems(), deepRight = deep.filter(d => S.deep[d.id] && S.deep[d.id].right).length;
    const notes = WEEK.reels.filter(r => S.notes[r.id]).length;
    const ins = insightsOf(WEEK), insRead = ins.filter(i => (S.insights || {})[i.x.id]).length;
    const pz = S.puzzle && S.puzzle.week === WEEK.title ? S.puzzle : null;
    const left = total - answered.length;
    const done = !left;
    const finished = !done ? ''
      : right === total ? `A perfect week! All ${total} right the first time.` : `You finished the week! ${right} of ${total} right the first time.`;

    const tile = (icon, label, n, of) => `
      <div class="kpi${of && n >= of ? ' full' : ''}">
        <div class="k-top"><span>${icon}</span>${label}</div>
        <div class="k-num">${n}<small> / ${of}</small></div>
        <div class="k-bar"><div style="width:${of ? Math.round(n / of * 100) : 0}%"></div></div>
      </div>`;
    const word = (icon, label, big, note, full) => `
      <div class="kpi${full ? ' full' : ''}">
        <div class="k-top"><span>${icon}</span>${label}</div>
        <div class="k-num word">${big}</div>
        <div class="k-note">${note}</div>
      </div>`;
    const puzzle = !WEEK.puzzle ? '' : left ? word('🧩', 'Puzzle', '🔒', `Opens when all ${total} reels are done`)
      : pz && pz.status === 'won' ? word('🧩', 'Puzzle', 'Solved!', 'Nice work', true)
      : pz && pz.status === 'lost' && pz.day === dayKey() && pzMode() === 'hard' ? word('🧩', 'Puzzle', 'Try Easy', 'Out of Hard tries today')
      : word('🧩', 'Puzzle', 'Ready', 'It unlocked. Give it a try!');
    const units = readingAll(), readN = units.filter(u => S.read[u.ref]).length;
    const tiles = [
      units.length ? tile('📜', 'Chapters read', readN, units.length) : '',
      tile('📖', 'Reels', answered.length, total),
      tile('✅', 'Right first time', right, total),
      allBonus.length ? tile('🔎', 'Bonus finds', found, allBonus.length) : '',
      deep.length ? tile('🧭', 'Went deeper', deepRight, deep.length) : '',
      ins.length ? tile('💡', 'Insights read', insRead, ins.length) : '',
      word('✏️', 'Notes', String(notes), notes ? `${notes * NOTE_XP} XP from notes` : 'Write one on a reel below'),
      puzzle
    ].join('');

    return `
      <div class="home-sec">
        <div class="eyebrow">Your week</div>
        ${finished ? `<p class="home-win">${esc(finished)}</p>` : ''}
        <div class="kpis">${tiles}</div>
      </div>`;
  }


  function renderHome() {
    const was = $('home').querySelector('.strip'), left = was ? was.scrollLeft : null;
    $('home').innerHTML = homeHtml();
    document.querySelectorAll('#tabs [data-tab]').forEach(b => b.classList.toggle('on', b.dataset.tab === homeTab));
    // The strip stays where he left it (Blake, 2026-10-02: tapping a day "does
    // a weird auto scroll"); the day picked comes to the middle only when it's
    // off screen (the first time, or a week's dot).
    const strip = $('home').querySelector('.strip'), sel = strip && strip.querySelector('.sel');
    if (!strip) return;
    if (left != null) strip.scrollLeft = left;
    if (sel && (left == null || sel.offsetLeft < strip.scrollLeft || sel.offsetLeft + sel.offsetWidth > strip.scrollLeft + strip.clientWidth))
      strip.scrollLeft = sel.offsetLeft - strip.clientWidth / 2 + sel.offsetWidth / 2;
  }
  // Redraw the page after something changed, keeping its place.
  function refreshHome() {
    const h = $('home');
    const top = h.scrollTop;
    renderHome();
    h.scrollTop = top;
  }

  // Today's warm-up questions (and Who said it?) not answered yet.
  const warmupsLeft = () =>
    S.daily.ids.filter(id => !S.daily.done[id]).concat(S.daily.say && !S.daily.sayDone ? ['say'] : []);

  // Redraw one card in place after an answer, keeping its inner scroll.
  function redrawCard(dataId, html) {
    const old = document.querySelector('.reel[data-id="' + dataId + '"]');
    if (!old) return;
    const pad = old.querySelector('.content-pad');
    const top = pad ? pad.scrollTop : 0;
    const tmp = document.createElement('div');
    tmp.innerHTML = html.trim();
    const card = tmp.firstElementChild;
    old.replaceWith(card);
    const pad2 = card.querySelector('.content-pad');
    if (pad2) pad2.scrollTop = top;
  }

  /* ---------------- looking back at one reel ---------------- */

  // A reel he has answered, on its own screen as it was in its lesson: the
  // picture, clip, verse and his answer, then its bonus questions and a
  // note. A Go-deeper reading shows its link and his answer.
  function openView(id) {
    const d = /^deep-/.test(id) && deepItems().find(x => 'deep-' + x.id === id);
    const r = !d && reelById(id);
    if (!d && !r) return;

  }

  // This week's chapters, each a tap from the reader with its buttons (KJV,
  // plain words, BSB, notes, Hebrew), to read again or ahead (Blake,
  // 2026-10-01: "How do I get back to reading the scriptures that you
  // translated? … It just wasn't intuitive"). One not read yet starts its
  // reading clock when it opens, and is marked read in its lesson.
  let readUnit = null;
  // The week map's part (its key) where a chapter is read.
  function chapterLesson(ref) {
    const d = readingPlan().findIndex(day => day.some(u => u.ref === ref));
    const k = d < 0 ? -1 : weekPlan()[d].findIndex(e => e.kind === 'day');
    return k < 0 ? null : d + '.' + k;
  }
  function openChapter(ref) {
    const u = readingAll().find(x => x.ref === ref);
    if (!u) return;
    if (!S.read[u.ref]) {
      const log = S.readLog || (S.readLog = {});
      if (!(log[u.ref] && log[u.ref].start)) { log[u.ref] = { start: Date.now() }; saveLocal(); }
    }

    $('viewBody').innerHTML = readerHtml(u, WEEK, key ? `<div class="ch-mark"><p>Not marked read yet.</p>
      <button class="btn" data-mark-lesson="${esc(key)}">Mark it read in its lesson ›</button></div>` : '');
    $('view').hidden = false;
