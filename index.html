  // Restart the app with another person's progress on this device, setting
  // the current progress aside in its own slot.
  function switchProgress(to, name, note) {
    try {
      localStorage.setItem(slotKey(S.owner), JSON.stringify(S));
      const raw = localStorage.getItem(slotKey(to));
      localStorage.setItem(STORE_KEY, JSON.stringify(Object.assign(raw ? JSON.parse(raw) : {}, { owner: to, ownerName: name })));
      localStorage.removeItem(slotKey(to));
      if (note) sessionStorage.setItem(NS + 'adopted', note);
    } catch (e) { toast("👪 Couldn't switch", 'This device is out of storage space'); return; }
    location.reload();
  }

  // Before anything is saved to the family, the progress on this device
  // must be the signed-in person's. True when it is; otherwise it asks.
  function claimProgress() {
    if (S.owner === F.pid) return true;
    if (!hasProgress(S)) { S.owner = F.pid; S.ownerName = F.name; saveLocal(); return true; }
    if (stored(slotKey(F.pid))) { switchProgress(F.pid, F.name); return false; }   // they've used this device before
    if (fam) { fam.claim = true; renderFam(); }
    else if (!claimAsked) { claimAsked = true; toast('👪 One question first', 'Open 👪 to finish setting up this device'); }
    return false;
  }
  function claimAnswer(yes) {
    fam.claim = false;
    if (!yes) return switchProgress(F.pid, F.name);
    S.owner = F.pid; S.ownerName = F.name;
    save();
    watchBackup();
    renderFam();
  }

  // Saving to the family. The family keeps one copy per person. Each
  // device remembers the last progress of its own that the family's copy
  // is known to include. If only this device changed since, it saves; if
  // only the family's copy changed (another device), this device takes it;
  // if both changed, they're merged, so nothing done on either is lost.
  const synced = () => (F ? stored(syncKey(F.pid)) : null);
  function setSynced(json) { store(syncKey(F.pid), json); store(NS + 'savedAt', String(Date.now())); }

  function queueSync(ms) {
    if (!F || syncTimer) return;
    syncTimer = setTimeout(syncNow, ms == null ? 3000 : ms);
  }
  function syncNow() {
    clearTimeout(syncTimer); syncTimer = null;
    syncChain = syncChain.then(syncProgress).then(() => { syncFails = 0; }, syncFailed);
    return syncChain;
  }
  async function syncProgress() {
    try { return await syncOnce(); } catch (e) {
      if (!leanSummary && e && e.code === 'permission-denied') { leanSummary = true; return syncOnce(); }
      throw e;
    }
  }
  async function syncOnce() {
    const u = authUser();
    if (!F || F.pending || !u || u.uid !== F.uid || S.owner !== F.pid) return;
    const ref = famCol(F.fid, 'backup').doc(F.pid), sumRef = famCol(F.fid, 'progress').doc(F.pid);
    const mine = canon(S), base = synced();
    let wrote = null, take = null;
    await fs().runTransaction(async t => {
      wrote = take = null;
      const snap = await t.get(ref);
      const theirs = snap.exists ? snap.data().state : null;
      if (theirs === mine) return;
      let next;
      if (theirs == null || theirs === base) next = S;                                   // only this device changed
      else if (mine === base) { take = theirs; return; }                                  // only the family's copy changed
      else next = mergeProgress(JSON.parse(theirs), S, base ? JSON.parse(base) : null);    // both changed
      next = Object.assign({}, next, { owner: F.pid, ownerName: F.name });
      wrote = canon(next);
      t.set(ref, { xp: next.xp, state: wrote, by: F.uid, updated: TS() });
      t.set(sumRef, summaryOf(next));
    });
    if (take) { adopt(take, mine, 'Progress synced|From your other device'); return; }
    setSynced(mine);                   // the family's copy now includes everything here
    if (wrote && wrote !== mine) adopt(wrote, mine, 'Progress merged|With your other device');
    if ($('famPeople')) renderPeople();
  }
  function syncFailed(e) {
    if (e && e.code === 'permission-denied') return recheckMembership(e);   // most likely taken out of the family
    // No connection, or Firestore busy: try again, less often each time.
    syncFails++;
    clearTimeout(syncTimer);
    syncTimer = setTimeout(syncNow, Math.min(300000, 15000 * Math.pow(2, syncFails - 1)));
    if ($('famPeople')) renderPeople();
  }

  // Another device saved: catch up without waiting for a restart.
  function watchBackup() {
    if (backupOff) backupOff();
    if (!F || S.owner !== F.pid) return;
    backupOff = famCol(F.fid, 'backup').doc(F.pid).onSnapshot(snap => {
      if (!snap.metadata.hasPendingWrites && snap.exists && snap.data().state !== synced()) queueSync(300);
    }, recheckMembership);
  }

  // Put the family's copy on this device: restart the app with it once
  // nothing is being used (a game, the TV board, typed text). If this
  // device's progress changed in the meantime, sync again instead (merge).
  function adopt(json, from, note) {
    pendingAdopt = { json, from, note };
    tryAdopt();
  }
  function tryAdopt() {
    clearTimeout(adoptTimer);
    const a = pendingAdopt;
    if (!a || !F) return;
    if (canon(S) !== a.from) { pendingAdopt = null; queueSync(0); return; }
    const typing = [...document.querySelectorAll('textarea, input.field')].some(t => t.value.trim() && !t.readOnly);
    const busy = ['play', 'live', 'board', 'parent', 'lesson', 'view', 'risk', 'snake', 'look'].some(id => !$(id).hidden) || typing;
    if (busy) { adoptTimer = setTimeout(tryAdopt, 10000); return; }
    try {
      localStorage.setItem(STORE_KEY, a.json);
      store(syncKey(F.pid), a.json);
      sessionStorage.setItem(NS + 'adopted', a.note);
    } catch (e) { return; }
    location.reload();
  }

  // Two copies of one person's progress that both changed since they last
  // agreed (base): keep everything from both. The family's copy (theirs)
  // wins where both did the same thing; XP is the family's plus what this
  // device earned since base, not counting anything the family's copy
  // already has.
  function mergeProgress(R, L, B) {
    B = B || {};
    const has = (o, k) => !!o && Object.prototype.hasOwnProperty.call(o, k);
    const M = JSON.parse(JSON.stringify(R));
    let gained = Math.max(0, (L.xp || 0) - (B.xp || 0));
    // What a record paid (it keeps that since the supercharge), or the base amount.
    const xpOf = (rec, base) => typeof rec.xp === 'number' ? rec.xp : base;
    for (const k in L.answers || {}) if (!has(B.answers, k) && has(R.answers, k) && L.answers[k].right) gained -= xpOf(L.answers[k], XP.firstTry);
    for (const k in L.bonus || {}) if (!has(B.bonus, k) && has(R.bonus, k) && L.bonus[k].right) gained -= xpOf(L.bonus[k], XP.bonus);
    for (const k in L.deep || {}) if (!has(B.deep, k) && has(R.deep, k) && L.deep[k].right) gained -= xpOf(L.deep[k], XP.bonus);
    for (const k in L.found || {}) if (!has(B.found, k) && has(R.found, k) && L.found[k].right) gained -= xpOf(L.found[k], FIND_XP);
    for (const k in L.sunday || {}) if (!has(B.sunday, k) && has(R.sunday, k) && L.sunday[k].right) gained -= xpOf(L.sunday[k], XP.firstTry);
    for (const k in L.talks || {}) if (!has(B.talks, k) && has(R.talks, k)) gained -= xpOf(L.talks[k], TALK_XP);
    const paid = (o, k) => has(o, k) && !!o[k].xp;
    for (const k in L.readLog || {}) if (paid(L.readLog, k) && !paid(B.readLog, k) && paid(R.readLog, k)) gained -= xpOf(L.readLog[k], READ_XP);
    for (const k in L.notes || {}) {
      if (L.notes[k].rewarded && !(has(B.notes, k) && B.notes[k].rewarded) && has(R.notes, k) && R.notes[k].rewarded) gained -= xpOf(L.notes[k], NOTE_XP);
    }
    // The games, the same way: a Who said it? line, the week's puzzle, or a
    // day's Verse Word that both devices were paid for since they last met.
    for (const k in L.sayings || {}) if (!has(B.sayings, k) && has(R.sayings, k) && L.sayings[k].right) gained -= SAY_XP;
    const pzPaid = p => !!(p && p.rewarded && p.week === (L.puzzle && L.puzzle.week));
    if (pzPaid(L.puzzle) && pzPaid(R.puzzle) && !pzPaid(B.puzzle)) gained -= PUZZLE_XP;
    for (const d in L.words || {}) {
      const a = L.words[d], r = (R.words || {})[d], b0 = (B.words || {})[d];
      if (a && a.paid && r && r.paid && !(b0 && b0.paid)) gained -= typeof a.paid === 'number' ? a.paid : 10;
    }
    // Past weeks caught up on: each question's first try from either device,
    // its XP paid once.
    if (L.late || R.late) {
      M.late = {};
      for (const w of new Set(Object.keys(L.late || {}).concat(Object.keys(R.late || {})))) {
        const l = (L.late || {})[w] || {}, r = (R.late || {})[w] || {}, b = (B.late || {})[w] || {};
        M.late[w] = {};
        for (const kind of new Set(Object.keys(l).concat(Object.keys(r)))) {
          M.late[w][kind] = Object.assign({}, l[kind] || {}, r[kind] || {});
          for (const k in l[kind] || {}) if (!has(b[kind], k) && has(r[kind], k) && l[kind][k].xp) gained -= l[kind][k].xp;
        }
      }
    }
    // Chapters read from the library, and the week's reading bonus: paid once.
    for (const k in L.libRead || {}) if (!has(B.libRead, k) && has(R.libRead, k)) gained -= xpOf(L.libRead[k], READ_XP);
    const wb = o => o && o.weekBonus && o.weekBonus.week;
    if (wb(L) && wb(L) === wb(R) && wb(B) !== wb(L)) gained -= xpOf(L.weekBonus, WEEK_READ_XP);
    // My Season: a check-in or a Season's reflection pays once, whichever device did it first.
    const sea = o => (o && o.seasons) || {};
    for (const id in sea(L)) {
      const l = sea(L)[id], r = sea(R)[id], b = sea(B)[id];
      for (const w in (l && l.checks) || {}) if (!(b && b.checks && b.checks[w]) && r && r.checks && r.checks[w]) gained -= xpOf(l.checks[w], SEASON_CHECK_XP);
      if (l && l.reflected && !(b && b.reflected) && r && r.reflected) gained -= xpOf(l.reflected, SEASON_REFLECT_XP);
    }
    M.xp = (R.xp || 0) + Math.max(0, gained);
    M.libRead = Object.assign({}, L.libRead || {}, R.libRead || {});
    const lo = (L.shop && L.shop.orders) || {}, ro = (R.shop && R.shop.orders) || {};
    M.shop = { orders: Object.assign({}, lo, ro) };
    for (const k in lo) if (!ro[k] || (lo[k].upd || 0) > (ro[k].upd || 0)) M.shop.orders[k] = lo[k];
    M.libClock = Object.assign({}, L.libClock || {}, R.libClock || {});
    M.weekBonus = [L.weekBonus, R.weekBonus].find(b => b && b.week === WEEK.title) || R.weekBonus || L.weekBonus || null;
    M.seasons = mergeSeasons(R.seasons, L.seasons);
    M.impressions = newerById(R.impressions, L.impressions);
    M.seasonWho = R.seasonWho || L.seasonWho;
    for (const key of ['answers', 'bonus', 'deep', 'sayings', 'recall', 'sayRecall', 'read', 'found', 'insights', 'sunday', 'talks', 'picks']) M[key] = Object.assign({}, L[key] || {}, R[key] || {});
    // The reading clock: a chapter finished on either device keeps its record.
    M.readLog = Object.assign({}, L.readLog || {}, R.readLog || {});
    for (const k in L.readLog || {}) if (L.readLog[k].day && !M.readLog[k].day) M.readLog[k] = L.readLog[k];
    // Where he was in a chapter: the later place.
    M.readPos = Object.assign({}, R.readPos || {}, L.readPos || {});
    for (const k in R.readPos || {}) if (L.readPos && L.readPos[k] && R.readPos[k].at > L.readPos[k].at) M.readPos[k] = R.readPos[k];
    // Notes: the later edit wins.
    if (L.usage || R.usage) {
      M.usage = JSON.parse(JSON.stringify(R.usage || {}));
      for (const d in L.usage || {}) for (const k in L.usage[d]) {
        const add = Math.max(0, L.usage[d][k] - (((B.usage || {})[d] || {})[k] || 0));
        if (add) (M.usage[d] || (M.usage[d] = {}))[k] = (M.usage[d][k] || 0) + add;
      }
    }
    M.notes = Object.assign({}, L.notes || {}, R.notes || {});
    for (const k in L.notes || {}) if (!has(R.notes, k) || (L.notes[k].at || 0) > (R.notes[k].at || 0)) M.notes[k] = L.notes[k];
    // Verse Word: the day's game that got further.
    M.words = Object.assign({}, L.words || {}, R.words || {});
    for (const d in L.words || {}) {
      const a = L.words[d], b = (R.words || {})[d];
      if (b && (a.guesses || []).length > (b.guesses || []).length) M.words[d] = a;
    }
    // Streak: every day either kept or a freeze covered (the length is
    // worked out again from these when the app opens), and the freezes left
    // from whichever studied more recently.
    for (const key of ['days', 'filled', 'frozen']) M[key] = Object.assign({}, L[key] || {}, R[key] || {});
    M.daysFrom = [L.daysFrom, R.daysFrom].filter(Boolean).sort()[0] || null;
    if ((L.lastStudy || '') > (R.lastStudy || '')) Object.assign(M, { lastStudy: L.lastStudy, streak: L.streak, freezes: L.freezes });
    else if (L.lastStudy === R.lastStudy) M.streak = Math.max(L.streak || 0, R.streak || 0);
    // Today's warm-up: both sets of answers.
    if (L.daily && (!R.daily || L.daily.day > R.daily.day)) M.daily = L.daily;
    else if (L.daily && R.daily && L.daily.day === R.daily.day) {
      M.daily = Object.assign({}, R.daily, { done: Object.assign({}, L.daily.done, R.daily.done), sayDone: R.daily.sayDone != null ? R.daily.sayDone : L.daily.sayDone });
    }
    // The weekly puzzle: the one that got further this week.
    const pzAhead = (a, b) => {
      if (!a) return false;
      if (!b) return true;
      if (a.week !== b.week) return a.week === WEEK.title;
      if ((a.status === 'won') !== (b.status === 'won')) return a.status === 'won';
      const n = x => (x.solved || []).length * 4 + Object.keys(x.placed || {}).length;
      return n(a) > n(b);
    };
    if (pzAhead(L.puzzle, R.puzzle)) M.puzzle = L.puzzle;
    M.climbDay = [L.climbDay, R.climbDay].filter(Boolean).sort().pop() || null;
    // Finished weeks: every week either device has. For one both have, the
    // copy that kept what he did in it (a device that changed weeks on an
    // older app kept only the totals).
    const weekOf = h => h.num || h.title;
    M.history = (R.history || []).slice();
    for (const h of L.history || []) {
      const i = M.history.findIndex(x => weekOf(x) === weekOf(h));
      if (i < 0) M.history.push(h);
      else if (h.rec && !M.history[i].rec) M.history[i] = h;
    }
    return M;
  }

  // Two maps of records, each with its time (upd): each key's later one.
  function newerById(a, b) {
    const out = Object.assign({}, a || {});
    for (const k in b || {}) if (!out[k] || (b[k].upd || 0) > (out[k].upd || 0)) out[k] = b[k];
    return out;
  }
  // Two devices' Seasons: goals by their later change, each day's tick by
  // its later tap, a week's check-in by its later save (keeping what the
  // family's copy paid), and every reflection answer either one has.
  function mergeSeasons(R, L) {
    const out = JSON.parse(JSON.stringify(R || {}));
    for (const id in L || {}) {
      const l = L[id], r = out[id];
      if (!r) { out[id] = JSON.parse(JSON.stringify(l)); continue; }
      const goals = new Map((r.goals || []).map(g => [g.id, g]));
      for (const g of l.goals || []) { const x = goals.get(g.id); if (!x || (g.upd || 0) > (x.upd || 0)) goals.set(g.id, g); }
      r.goals = [...goals.values()];
      if (l.ticks) {
        r.ticks = r.ticks || {};
        for (const st in l.ticks) { const t = r.ticks[st] || (r.ticks[st] = {}); for (const d in l.ticks[st]) if (!t[d] || Math.abs(l.ticks[st][d]) > Math.abs(t[d])) t[d] = l.ticks[st][d]; }
      }
      r.checks = r.checks || {};
      for (const w in l.checks || {}) { const a = r.checks[w], c = l.checks[w]; r.checks[w] = !a ? c : (c.upd || 0) > (a.upd || 0) ? Object.assign({}, c, { xp: a.xp }) : a; }
      r.reflect = r.reflect || {};
      for (const g in l.reflect || {}) for (const k in l.reflect[g]) if (!(r.reflect[g] || {})[k]) (r.reflect[g] = r.reflect[g] || {})[k] = l.reflect[g][k];
      if (!r.reflected && l.reflected) r.reflected = l.reflected;
      if (!r.tickN && l.tickN) r.tickN = l.tickN;
    }
    return out;
  }

  // What the whole family sees about one person.
  // `read`, this week's chapters read, is for the family's leaderboard; until
  // a family's rules allow it (firestore.rules, 2026-10-02), the summary goes without it.
  let leanSummary = false;
  function summaryOf(s) {
    const vals = Object.values(s.answers || {});
    const out = {
      name: F.name, role: F.role === 'kid' ? 'kid' : 'grownup', xp: s.xp || 0, streak: s.streak || 0,
      lastStudy: s.lastStudy || '', week: WEEK.title, right: vals.filter(a => a.right).length, answered: vals.length, updated: TS()
    };
    if (!leanSummary) out.read = readingAll().filter(u => (s.read || {})[u.ref]).length;
    return out;
  }

  /* ----- the new-message dot ----- */

  function watchLatest() {
    if (famLatestOff) famLatestOff();
    famLatestOff = famCol(F.fid, 'messages').orderBy('at', 'desc').limit(1).onSnapshot(q => {
      const d = q.docs[0];
      const m = d ? d.data({ serverTimestamps: 'estimate' }) : null;
      famLatest = { at: m ? tsMs(m.at) : 0, mine: !m || m.uid === F.uid };
      updateFamDot();
    }, recheckMembership);
    watchHome();
  }
  function updateFamDot() {
    const reading = fam && fam.tab === 'chat' && F && !fam.invite;
    if (reading && famLatest.at) store(NS + 'chatSeen', String(famLatest.at));
    const unread = !!F && !famLatest.mine && famLatest.at > (Number(stored(NS + 'chatSeen')) || 0);
    $('chatDot').hidden = !unread;
    const tabDot = $('famChatDot');
    if (tabDot) tabDot.hidden = !unread;
  }

  /* ----- the family on the home page ----- */

  // Blake, 2026-10-02: a leaderboard of this week's chapters, the family
  // goal (everyone reads all of them, once a parent turns it on), and for a
  // parent, a card on each child: what was read today and how, new notes,
  // and something to ask about. From the family's summaries (progress) and,
  // for a parent, each child's saved progress (backup), watched while this
  // device is in a family. Redrawn in place, so an open More stays open.
  let famHome = null, famHomeOff = [];
  function watchHome() {
    stopHome();
    if (!F || !FIREBASE_CONFIG) return;
    const h = famHome = { progress: [], goal: false, kids: {}, watching: {}, errors: [], feedback: [], prizes: null, orders: [], seasons: [], seasonGoal: null };
    sendErrors = flushErrors; flushErrors();
    famHomeOff.push(famDoc(F.fid).onSnapshot(d => {
      h.goal = !!(d.exists && d.data().goal);
      const pz = d.exists && d.data().prizes;
      h.prizes = Array.isArray(pz) ? pz : null;
      const sg = d.exists && d.data().seasonGoal;
      h.seasonGoal = sg && typeof sg.text === 'string' && sg.text ? sg : null;
      famRedraw(); if (shopOpen()) openSheet(shopHtml());
    }, () => {}));
    // Prize requests: a parent sees everyone's; anyone sees their own, which keeps this device's list in step.
    const oq = F.role === 'parent' ? famCol(F.fid, 'orders').orderBy('at', 'desc').limit(60) : famCol(F.fid, 'orders').where('pid', '==', F.pid);
    famHomeOff.push(oq.onSnapshot(q => {
      h.orders = q.docs.map(d => Object.assign({ id: d.id }, d.data({ serverTimestamps: 'estimate' })));
      syncOrders(h.orders); famRedraw();
    }, () => {}));
    // Everyone's Season (families/{fid}/seasons), and cheers sent to this person (each shown once, then cleared).
    famHomeOff.push(famCol(F.fid, 'seasons').onSnapshot(q => {
      h.seasons = q.docs.map(d => Object.assign({ pid: d.id }, d.data()));
      seasonHelpToasts(); famRedraw();
    }, () => {}));
    famHomeOff.push(famCol(F.fid, 'cheers').where('to', '==', F.pid).onSnapshot(q => {
      q.docs.forEach(d => { const c = d.data(); toast('👏 ' + (c.name || 'Someone') + ' cheered you on', 'Your Season goals'); d.ref.delete().catch(() => {}); });
    }, () => {}));
    queueSeasonSum();
    // This Sunday's and next Sunday's conference talks, as the family picked them.
    for (const k of sundaysAround()) famHomeOff.push(famCol(F.fid, 'talks').doc(k).onSnapshot(d => {
      if (!d.exists || !S) return;
      const v = d.data(), now = { eq: v.eq || '', rs: v.rs || '' }, P = S.picks || (S.picks = {});
      if (P[k] && P[k].eq === now.eq && P[k].rs === now.rs) return;
      P[k] = now; saveLocal(); refreshHome();
    }, () => {}));
    famHomeOff.push(famCol(F.fid, 'progress').onSnapshot(q => {
      h.progress = q.docs.map(d => Object.assign({ pid: d.id }, d.data()));
      // A parent reads each person's saved progress: a child's for its card, and everyone's for what gets used.
      if (F && F.role === 'parent') for (const x of h.progress) {
        if (x.pid === F.pid || h.watching[x.pid]) continue;
        h.watching[x.pid] = true;
        famHomeOff.push(famCol(F.fid, 'backup').doc(x.pid).onSnapshot(b => {
          try { h.kids[x.pid] = b.exists ? JSON.parse(b.data().state) : null; } catch (e) { h.kids[x.pid] = null; }
          famRedraw();
        }, () => {}));
      }
      famRedraw();
    }, () => {}));
    if (F.role === 'parent') for (const kind of ['errors', 'feedback'])
      famHomeOff.push(famCol(F.fid, kind).orderBy('at', 'desc').limit(20).onSnapshot(q => {
        h[kind] = q.docs.map(d => Object.assign({ id: d.id }, d.data({ serverTimestamps: 'estimate' })));
        famRedraw();
      }, () => {}));
  }
  // This device's errors, to the family (only parents read them).
  function flushErrors() {
    const u = authUser();
    if (!F || F.pending || !u || u.uid !== F.uid) return;
    let q;
    try { q = JSON.parse(localStorage.getItem(ERR_KEY) || 'null'); } catch (e) { return; }
    if (!q || !q.queue || !q.queue.length) return;
    const send = q.queue;
    q.queue = []; try { localStorage.setItem(ERR_KEY, JSON.stringify(q)); } catch (e) {}
    // One that doesn't go (offline, or rules not published yet) waits on the device for next time.
    for (const x of send) famCol(F.fid, 'errors').add({ uid: F.uid, name: F.name, msg: x.msg, where: x.where, stack: x.stack,
