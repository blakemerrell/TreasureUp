    if (boardView) {
      const t = all.find(c => c.id === boardView.tile);
      const shown = boardView.revealed;
      const choices = choicesFor(t.q, 'board|' + t.id + '|' + (g.seed || '')).map((c, n) => {
        const right = shown && c === t.q.right;
        return `<div class="choice${right ? ' is-right' : ''}"><span class="mark">${right ? '✓' : 'ABC'[n]}</span><span>${esc(c)}</span></div>`;
      }).join('');
      body.innerHTML = `
        <div class="clue">
          ${t.id === dd ? '<div class="dd-banner">Daily Double · worth double</div>' : ''}
          <div class="eyebrow">${esc(cols[t.col].name)} · ${worthOf(t, dd)}${t.bonus ? ' · from the reading' : ''}</div>
          <p class="clue-q">${shown ? linkRefs(t.q.q, homeOfId(t.id)) : esc(t.q.q)}</p>
          <div class="quiz clue-choices${shown ? ' done' : ''}"><div class="quiz-choices">${choices}</div></div>
          ${shown
            ? `<p class="quiz-why"><b class="ok">Answer:</b> ${esc(t.q.right)}. ${linkRefs(t.q.why, homeOfId(t.id))}</p>
               <p class="board-help" style="margin-top:16px">Who got it? Tap everyone who did (${worthOf(t, dd)} points each).</p>
               <div class="board-actions">${g.players.map((p, n) => `<button class="btn${(boardView.award || []).includes(n) ? '' : ' ghost'}" data-award="${n}" aria-pressed="${(boardView.award || []).includes(n)}">${(boardView.award || []).includes(n) ? '✓ ' : ''}${esc(p.name)}</button>`).join('')}</div>
               <div class="board-actions"><button class="btn" data-act="give">${(boardView.award || []).length ? 'Give the points' : 'Nobody got it'}</button></div>`
            : `<div class="board-actions"><button class="btn" data-act="reveal">Show answer</button>
                 <button class="btn ghost" data-act="back">Back to the board</button></div>`}
        </div>`;
      return;
    }

    if (Object.keys(g.done).length >= all.length) {
      const total = g.players.reduce((n, p) => n + p.score, 0);
      const ranked = g.players.slice().sort((a, b) => b.score - a.score);
      body.innerHTML = `
        <div class="clue">
          <div class="eyebrow">Game over</div>
          <p class="clue-q">Family total: ${total}</p>
          <p class="board-help">${g.newBest ? 'New family best for this week!' : 'Family best this week: ' + boardBest()}</p>
          <div class="grid gap-2" style="margin-top:16px">${ranked.map(p => `<div class="score-row"><span>${esc(p.name)}</span><b>${p.score}</b></div>`).join('')}</div>
          <div class="board-actions">
            <button class="btn" data-act="again">Play again</button>
            <button class="btn ghost" data-act="players">Change players</button>
            <button class="btn ghost" data-act="exit">Done</button>
          </div>
        </div>`;
      return;
    }

    const rows = Math.max(...cols.map(c => c.clues.length));
    let grid = cols.map(c => `<div class="board-cat">${esc(c.name)}</div>`).join('');
    for (let k = 0; k < rows; k++) {
      grid += cols.map(c => {
        const t = c.clues[k];
        if (!t) return '<div class="tile empty"></div>';
        const d = g.done[t.id];
        return d
          ? `<button class="tile" disabled>${byList(d).length ? byList(d).map(i => esc(g.players[i].name)).join(', ') : '—'}</button>`
          : `<button class="tile" data-tile="${esc(t.id)}" aria-label="${esc(c.name)} for ${t.value}">${t.value}</button>`;
      }).join('');
    }
    body.innerHTML = `
      <div class="board-grid" style="grid-template-columns:repeat(${cols.length},minmax(0,1fr))">${grid}</div>
      <div class="board-actions"><button class="btn ghost" data-act="players">${Date.now() - boardSure < 4000 ? 'This clears the game. Tap again' : 'Change players'}</button></div>`;
  }

  function boardClick(e) {
    const el = e.target.closest('[data-tile],[data-act],[data-award]');
    if (!el) return;
    const g = game();

    if (el.dataset.tile) {
      boardView = { tile: el.dataset.tile, revealed: false };
    } else if (el.dataset.award != null) {
      const n = Number(el.dataset.award), a = boardView.award = boardView.award || [];
      if (a.includes(n)) a.splice(a.indexOf(n), 1); else a.push(n);
    } else if (el.dataset.act === 'give') {
      const { all, dd } = boardTiles();
      const t = all.find(c => c.id === boardView.tile), by = (boardView.award || []).slice().sort();
      by.forEach(i => { g.players[i].score += worthOf(t, dd); });
      g.done[t.id] = { by };
      boardView = null;
      if (Object.keys(g.done).length >= all.length) {
        const total = g.players.reduce((n, p) => n + p.score, 0);
        g.newBest = total > boardBest();
        if (g.newBest) G.bests = Object.assign({}, G.bests, { [WEEK.title]: total });
      }
      saveBoard();
    } else {
      const act = el.dataset.act;
      if (act === 'start') {
        const names = [0, 1, 2, 3, 4, 5].map(n => $('pl' + n).value.trim()).filter(Boolean);
        if (!names.length) {
          const m = $('boardMsg'); m.textContent = 'Type at least one name.'; m.hidden = false;
          return;
        }
        G.names = names;
        G.games[WEEK.title] = { players: names.map(name => ({ name, score: 0 })), done: {} };
        saveBoard();
      } else if (act === 'reveal') {
        boardView.revealed = true;
      } else if (act === 'back') {
        boardView = null;
      } else if (act === 'again') {
        g.players.forEach(p => { p.score = 0; });
        g.done = {}; delete g.newBest;
        g.seed = Math.random().toString(36).slice(2, 8);
        saveBoard();
      } else if (act === 'players') {
        // In the middle of a game this clears it, so it asks first.
        const playing = g && Object.keys(g.done).length && Object.keys(g.done).length < boardTiles().all.length;
        if (playing && Date.now() - boardSure > 4000) { boardSure = Date.now(); setTimeout(() => { if (!$('board').hidden && !boardView) renderBoard(); }, 4100); renderBoard(); return; }
        boardSure = 0;
        delete G.games[WEEK.title];
        saveBoard();
      } else if (act === 'exit') {
        closeBoard();
        return;
      }
    }
    renderBoard();
    $('board').scrollTop = 0;
  }

  /* ---------------- notes ---------------- */

  // After a reel's question he can write a note in his own words. Saving
  // one pays XP once per reel. "Put it in my scriptures" copies it and
  // opens the verse in Gospel Library to paste as a note there: no outside
  // app can read Gospel Library notes, so the XP has to come from here.
  // Notes are kept across weeks, so they add up to a journal on his phone;
  // a parent can read them in the parent screen.
  const NOTE_XP = 10, NOTE_MIN_WORDS = 12;
  const noteEditing = new Set();
  const wordsIn = t => t.trim().match(/\S+/g) || [];

  function noteHtml(r) {
    const n = S.notes[r.id];
    const link = readLink(r.verse.ref);
    if (n && !noteEditing.has(r.id)) {
      return `
        <div class="note-box">
          <div class="eyebrow">Your note · ${linkRefs(r.verse.ref)}</div>
          <p class="note-text">${esc(n.text)}</p>
          <div class="note-actions">
            ${link ? `<a class="note-btn" href="${esc(link)}" target="_blank" rel="noopener noreferrer" data-note-copy="${esc(r.id)}">Put it in my scriptures ↗</a>` : ''}
            <button class="note-btn ghost" data-note-edit="${esc(r.id)}">Edit</button>
          </div>
          <p class="note-help">Copies your note and opens ${linkRefs(r.verse.ref)} in Gospel Library. Select the verse, add a note, and paste.</p>
        </div>`;
    }
    return `
      <div class="note-box">
        <div class="eyebrow" style="color:var(--gold)">Write a note · +${NOTE_XP} XP</div>
        <label class="note-q" for="note-${esc(r.id)}">${linkRefs(r.note || 'What does this mean for you? Write it in your own words.', r.verse.ref)}</label>
        <textarea id="note-${esc(r.id)}" class="field note-input" rows="3" maxlength="600" placeholder="At least ${NOTE_MIN_WORDS} words">${esc(n ? n.text : '')}</textarea>
        <p class="note-msg" data-note-msg="${esc(r.id)}"></p>
        <div class="note-actions"><button class="note-btn" data-note-save="${esc(r.id)}">Save note</button></div>
        <p class="note-help">Your parents can read your notes.</p>
      </div>`;
  }

  // Why a note can't be saved yet, or '' when it can.
  function noteProblem(text) {
    const words = wordsIn(text);
    if (words.length < NOTE_MIN_WORDS) return 'Write at least ' + NOTE_MIN_WORDS + ' words (' + words.length + ' so far).';
    if (new Set(words.map(w => w.toLowerCase())).size < 6) return 'Use your own words: say what it means to you.';
    return '';
  }
  // Keep a note on reel `r` (from its card, or Go further), with its XP the first time.
  function storeNote(r, text) {
    const id = r.id, old = S.notes[id] || {};
    S.notes[id] = { text, day: old.day || dayKey(), at: Date.now(), hook: r.hook, ref: r.verse.ref, rewarded: !!old.rewarded };
    noteEditing.delete(id);
    markStudied();
    if (!S.notes[id].rewarded) { S.notes[id].rewarded = true; payXp(S.notes[id], NOTE_XP, 'Wrote a note'); }
    save();
  }
  function saveNote(id) {
    const r = reelById(id);
    const text = $('note-' + id).value.trim();
    const msg = document.querySelector('[data-note-msg="' + id + '"]');
    const problem = noteProblem(text);
    if (problem) { msg.textContent = problem; return; }
    storeNote(r, text);
    redrawCard(id, reelHtml(r, 0));
  }

  function editNote(id) {
    noteEditing.add(id);
    redrawCard(id, reelHtml(reelById(id), 0));
    const box = $('note-' + id);
    if (box) box.focus();
  }

  // Copy inside the tap itself (browsers only allow it there); the link
  // then opens Gospel Library as normal.
  function copyNote(id) {
    const n = S.notes[id];
    try {
      navigator.clipboard.writeText(n.text).then(
        () => toast('Note copied', 'Paste it into your note in Gospel Library'),
        () => toast("Couldn't copy", 'Hold on your note to copy it'));
    } catch (e) { toast("Couldn't copy", 'Hold on your note to copy it'); }
  }

  /* ---------------- games ---------------- */

  // The 🎮 button opens the games menu: the weekly puzzle and Who said it?
  // (solo) and the family board (together, on the TV).
  const PUZZLE_XP = 40, SAY_XP = 5, PUZZLE_MISTAKES = 4;

  const reelsLeft = () => WEEK.reels.filter(r => !S.answers[r.id]).length;

  function shuffled(list, seed) {
    const out = list.slice();
    let h = hash(seed);
    for (let i = out.length - 1; i > 0; i--) {
      h = Math.imul(h ^ (h >>> 15), 2246822507) >>> 0;
      const j = h % (i + 1);
      const t = out[i]; out[i] = out[j]; out[j] = t;
    }
    return out;
  }

  // This week's puzzle progress. A lost try resets the next day; a try still
  // going gets its 4 mistakes back each day, and keeps the groups it found
  // and its wrong guesses (trying one again stays free).
  function puzzleState() {
    const today = dayKey();
    let pz = S.puzzle;
    if (!pz || pz.week !== WEEK.title) {
      pz = S.puzzle = { week: WEEK.title, day: today, solved: [], mistakes: 0, status: 'playing', rewarded: false };
    }
    if (pz.status === 'lost' && pz.day !== today) {
      Object.assign(pz, { day: today, solved: [], mistakes: 0, guesses: [], status: 'playing' });
    } else if (pz.status === 'playing' && pz.day !== today) {
      Object.assign(pz, { day: today, mistakes: 0 });
    }
    return pz;
  }

  function puzzleStatus() {
    if (reelsLeft()) return 'Answer all ' + WEEK.reels.length + ' reels to unlock · ' + reelsLeft() + ' left';
    const pz = puzzleState();
    if (pz.status === 'won') return 'Solved ✓';
    if (pz.status === 'lost' && pzMode() === 'hard') return 'Out of Hard tries today · try Easy';
    return pz.rewarded ? 'Ready' : 'Ready · ' + PUZZLE_XP + ' XP and a streak freeze';
  }

  const gameRow = (id, icon, title, desc, status, locked) => `
    <button class="game-row${locked ? ' locked' : ''}" data-game="${id}">
      <span class="gi">${icon}</span>
      <span><span class="gt block">${esc(title)}</span><span class="gd block">${esc(desc)}</span><span class="gs block">${esc(status)}</span></span>
    </button>`;

  function gamesHtml() {
    const rows = [], family = [];
    if (WEEK.puzzle) {
      rows.push(gameRow('puzzle', '🧩', 'Weekly puzzle', "Sort 16 ideas into this week's 4 lesson sections.", puzzleStatus(), reelsLeft() > 0));
    }
    if (WEEK.sayings && WEEK.sayings.length) {
      const got = WEEK.sayings.filter(x => S.sayings[x.id] && S.sayings[x.id].right).length;
      rows.push(gameRow('sayings', '🗣️', 'Who said it?', 'Match ' + WEEK.sayings.length + ' lines from this week to who said them.', got + ' of ' + WEEK.sayings.length + ' right · ' + SAY_XP + ' XP each', false));
    }
    if (WEEK.words && WEEK.words.length) {
      rows.push(gameRow('word', '🔤', 'Verse Word', "Today's word is hiding in a verse. Six tries.", wordStatus(), false));
    }
    rows.push(gameRow('climb', '🪜', 'Scripture Climb', 'Ten questions, each worth more. Three lifelines.', climbStatus(), reelsLeft() > 0));
    family.push(gameRow('live', '📡', 'Live game', 'A quiz on the TV, and everyone answers on their own phone. Quick right answers score a bit more.', 'Phones needed · host or join with a code', false));
    family.push(gameRow('board', '📺', 'Scripture Showdown', 'A quiz-show board on one screen. A parent reads each question and gives the points; no phones needed.', 'One screen · play together', false));
    if (BOARD()) family.push(gameRow('babylon', '🏰', BOARD().title, 'A Risk-style map game for 2 to 4: the map on the TV and everyone on their own phone, or one screen passed around.', 'Put up the map, join with a code, or play on one screen', false));
    // Title of Liberty lives at liberty/, with its own progress (localStorage liberty.v1).
    let lib = {};
    try { lib = JSON.parse(localStorage.getItem('liberty.v1')) || {}; } catch (e) { /* storage blocked */ }
    const libWon = Object.keys(lib.won || {}).length;
    const strategy = gameRow('liberty', '🛡️', 'Title of Liberty', 'A strategy game from the Book of Mormon: Captain Moroni at the river Sidon, the Nephites against the Gadianton robbers, and a free battle where you build a city. Read each chapter to open its mission.',
      libWon ? libWon + (libWon > 1 ? ' missions' : ' mission') + ' won · no XP, just for fun' : 'Read a chapter to open its mission · no XP, just for fun', false);
    // Amigo · Kaibigan lives at amigo/, with its own progress (localStorage amigo.v1).
    let amigo = {};
    try { amigo = JSON.parse(localStorage.getItem('amigo.v1')) || {}; } catch (e) { /* storage blocked */ }
    const lessonsDone = Object.values(amigo.courses || {}).reduce((n, c) => n + Object.keys(c.done || {}).length, 0);
    const language = gameRow('amigo', '🌎', 'Amigo · Kaibigan', 'Spanish for friends at school and Tagalog from Tatay: five-minute lessons, a streak, and Baybayin, the old Filipino script.',
      lessonsDone ? lessonsDone + (lessonsDone > 1 ? ' lessons' : ' lesson') + ' done · its own XP, apart from Treasure Up’s' : 'Five minutes a day · its own XP, apart from Treasure Up’s', false);
    const arcade = gameRow('snake', '🐍', 'Wilderness Snake', 'Arcade Snake in the camp of Israel: gather manna, and eat the jar with the right answer to this week’s questions. 1 player, or 2 on one screen.', arcadeStatus('snake'), false)
      + gameRow('ammon', '⚔️', 'Ammon at Sebus', 'Robbers come to scatter king Lamoni’s flock at the waters of Sebus (Alma 17). Stand against them with your sword and sling, and gather the sheep back. A question from this week after each level.', arcadeStatus('ammon'), false)
      + gameRow('look', '👀', 'Look and Live', 'Dodge the fiery serpents, and stop to look at the brass serpent on Moses’s pole to heal (Numbers 21). Each level brings more serpents.', arcadeStatus('look'), false);
    return `<div class="games-head">Every day</div>${rows.join('')}<div class="games-head">Arcade</div>${arcade}<div class="games-head">Family night</div>${family.join('')}<div class="games-head">Book of Mormon</div>${strategy}<div class="games-head">Languages</div>${language}`;
  }
  // The Games tab: every game, in its groups.
  function gamesTabHtml() {
    return `<div class="eyebrow">Games</div><h1 class="reel-hook lib-h">Play</h1>
      <button class="shop-card" data-shop><span>🎁</span><span>Rewards shop<small>${fmtN(xpToSpend())} XP to spend on prizes</small></span><span>›</span></button>
      <div class="games-tab">${gamesHtml()}</div>`;
  }
  // A link to the games (Today's "Family games") opens the Games tab.
  function openGames() { homeTab = 'games'; renderHome(); $('home').scrollTop = 0; }

  const GAME_NAMES = { board: 'Showdown', puzzle: 'Puzzle', sayings: 'Who said it?', word: 'Verse Word', climb: 'Climb', live: 'Live game', babylon: 'Babylon Falls', liberty: 'Title of Liberty', amigo: 'Amigo · Kaibigan', snake: 'Wilderness Snake', look: 'Look and Live', ammon: 'Ammon at Sebus' };
  function startGame(id) {
    use('game:' + id);
    if (id === 'board') openBoard();
    else if (id === 'puzzle') openPuzzle();
    else if (id === 'sayings') openSayings();
    else if (id === 'word') openWord();
    else if (id === 'climb') openClimb();
    else if (id === 'live') liveStart();
    else if (id === 'babylon') riskChooser();
    else if (id === 'liberty') location.href = 'liberty/';
    else if (id === 'amigo') location.href = 'amigo/';
    else if (id === 'snake' || id === 'look' || id === 'ammon') openArcade(id);
  }

  /* ----- the arcade: Wilderness Snake and Look and Live ----- */

  // Each game is its own file (snake.js, looklive.js), loaded the first time
  // it opens with its words (content/arcade.js). This side hands it a host:
  // the week's questions, who's playing, scripture links, and the family's
  // best scores. No XP: just for fun.
  const ARCADE = { snake: { file: 'snake.js', api: 'TUSnake' }, look: { file: 'looklive.js', api: 'TULook' }, ammon: { file: 'ammon.js', api: 'TUAmmon' } };
  function arcadeSaved(id) { try { return JSON.parse(localStorage.getItem(NS + id + '.v1')) || {}; } catch (e) { return {}; } }
  function arcadeStatus(id) {
    const s = arcadeSaved(id), top = (s.fam || []).slice().sort((a, b) => b.best - a.best)[0], n = x => Number(x || 0).toLocaleString('en-US');
    const bits = [s.best ? 'Your best ' + n(s.best) : '', top && top.best && !top.me ? 'family best: ' + top.name + ' ' + n(top.best) : ''].filter(Boolean);
    return (bits.length ? bits.join(' · ') + ' · ' : '') + 'no XP, just for fun';
  }
  async function openArcade(id) {
    const g = ARCADE[id];
    try {
      await loadOnce('content/arcade.js');
      await loadOnce(g.file);
    } catch (e) { toast("The game didn't load", 'Check the connection and try again'); return; }
    window[g.api].open(arcadeHost);
  }
  // A question for Wilderness Snake: about half this week's reels and half
  // earlier weeks' (a review), none twice in a game.
  function arcadeAsk(used) {
    const pools = riskPools(), fresh = ids => ids.filter(id => !used.has(id) && gameQuestion(id));
    let pool = pools.review.length && Math.random() < 0.5 ? fresh(pools.review) : fresh(pools.easy);
    if (!pool.length) pool = fresh(pools.easy.concat(pools.review));
    if (!pool.length) return null;
    const id = pool[Math.floor(Math.random() * pool.length)], Q = gameQuestion(id);
    used.add(id);
    return { id, q: Q.text, right: Q.q.right, choices: shuffled([Q.q.right].concat(Q.q.wrong), id + '|' + Date.now()), why: Q.q.why || '', ref: Q.home || '', review: Q.week && Q.week !== WEEK ? Q.week.title : '' };
  }
  // The family's best scores: one record a person (families/{fid}/scores),
  // with their best in each arcade game. Until firestore.rules with
  // /scores is published, reading and saving them just fail, quietly: this
  // device keeps its own best either way, and nothing else is touched.
  async function arcadeFamily(field) {
    if (!F || F.pending) return null;
    try {
      await fbInit();
      const u = authUser();
      if (!u || u.uid !== F.uid) return null;
      const snap = await famCol(F.fid, 'scores').get();
      return snap.docs.map(d => ({ name: d.data().name, best: d.data()[field] || 0, me: d.id === F.pid })).filter(x => x.best > 0);
    } catch (e) { return null; }
  }
  async function arcadeSaveBest(field, score) {
    if (!F || F.pending || !(score > 0)) return;
    try {
      await fbInit();
      const u = authUser();
      if (!u || u.uid !== F.uid) return;
      const ref = famCol(F.fid, 'scores').doc(F.pid);
      await fs().runTransaction(async t => {
        const snap = await t.get(ref), d = snap.exists ? snap.data() : {};
        if ((d[field] || 0) >= score) return;
        t.set(ref, { name: F.name, snake: d.snake || 0, look: d.look || 0, [field]: score, updated: TS() });
      });
    } catch (e) { /* not published yet, or offline */ }
  }
  const arcadeHost = {
    ns: NS,
    ask: arcadeAsk,
    player: () => ({ name: (F && F.name) || (S && S.ownerName) || '' }),
    html: (text, home) => linkRefs(text, home),
    familyBests: arcadeFamily,
    saveBest: arcadeSaveBest,
    closed: () => { refreshHome(); renderHud(); }
  };

  let playing = null;   // 'puzzle' | 'sayings'
  // Each game's start screen (Blake, 2026-10-04: "better start screens with
  // art. Like we have with snake"): its painting (media/games/<id>.jpg,
  // painted by Gemini like Snake's, see media/games/README.md), a line of
  // scripture, and how to play, above the game's own choices.
  const GAME_START = {
    puzzle: { alt: 'A grandfather, a boy and his little sister sort clay tablets and scroll pieces into four baskets tied with yellow, green, blue and purple ribbons.',
      hook: 'Isaiah taught the Lord’s word “line upon line, line upon line; here a little, and there a little” (Isaiah 28:10). Sort this week’s ideas into the lesson’s sections.',
      how: ['<b>16 ideas</b> from this week, and <b>4 sections</b> of the lesson. Put each idea where it belongs.', '<b>Easy</b>: one idea at a time, with its verse and a few “place one for me” helps. <b>Hard</b>: find a whole group of four at once, with 4 mistakes a day.', 'Solve it for XP and a <b>❄️ streak freeze</b>.'] },
    sayings: { alt: 'Isaiah speaks on the steps of a gate of Jerusalem to a king, a shepherd, a mother and child, a merchant and a boy who listens closely.',
      hook: '“Hear, O heavens, and give ear, O earth: for the LORD hath spoken” (Isaiah 1:2). Who said each line in this week’s reading: the Lord, a prophet, or a king?',
      how: ['Read a <b>line</b> from this week, and pick <b>who said it</b>.', 'Each right answer is <b>XP</b>, the first time.', 'One line comes back in each day’s warm-up.'] },
    word: { alt: 'An old scribe writes on a long scroll by lamplight while a boy leans in to watch.',
      hook: '“Now go, write it before them in a table, and note it in a book” (Isaiah 30:8). Today’s word is hiding in a verse of this week’s reading.',
      how: ['Guess the word in <b>six tries</b>. 🟩 right letter, right spot · 🟨 in the word, wrong spot.', '<b>Easy</b> shows the verse with a blank and can show you a letter. <b>Hard</b> is real Wordle: the chapter, then the verse, open up after a few guesses.', 'A <b>new word</b> every day.'] },
    climb: { alt: 'Families of many nations climb a winding path up a green mountain toward a shining temple at the top; a father helps his son up a step.',
      hook: '“Come ye, and let us go up to the mountain of the LORD … and he will teach us of his ways” (Isaiah 2:3). Ten questions, each one higher up the mountain.',
      how: ['<b>Ten questions</b> from this week, each worth more than the last.', '<b>Three lifelines</b>: 50:50 takes away a wrong answer, Read it opens the passage, and Ask a parent.', 'A wrong answer ends the climb. XP once a day; climb for fun any time.'] },
    live: { alt: 'A family sits in a lantern-lit courtyard at night, every one raising a hand to answer at once.',
      hook: '“And all thy children shall be taught of the LORD; and great shall be the peace of thy children” (Isaiah 54:13). A quiz for the whole family, live.',
      how: ['The <b>TV or laptop</b> hosts and shows each question.', 'Everyone answers on their <b>own phone or tablet</b> with the code.', 'A right answer scores 700, and a <b>quick</b> one up to 300 more.'] },
    board: { alt: 'A family game night under lanterns: the mother points to a tile on a big painted board while the family cheers.',
      hook: '“Cry out and shout, thou inhabitant of Zion: for great is the Holy One of Israel in the midst of thee” (Isaiah 12:6). A quiz-show board for family night.',
      how: ['<b>One screen</b>, best on the TV. A parent hosts and reads each question out loud.', 'Players answer out loud; the host taps <b>Show answer</b> and picks who got it.', 'The <b>bonus questions</b> are the high-value tiles, and one is a <b>Daily Double</b>.'] },
    babylon: { alt: 'By night, the soldiers of Cyrus walk through the open bronze gates of Babylon beside the lowered river, while the palace glows with a feast.' }
  };
  const gameHeroHtml = id => `<img class="gs-hero" src="media/games/${id}.jpg" width="960" height="480" alt="${esc(GAME_START[id].alt)}">`;
  const gameHowHtml = id => (GAME_START[id].how || []).length ? `<ul class="gs-how">${GAME_START[id].how.map(h => `<li>${h}</li>`).join('')}</ul>` : '';
  // The start screen of a game on the play screen: Start (or Keep going), or why it's locked.
  function renderGameStart(kind, status, locked, going) {
    const g = GAME_START[kind];
    $('playBody').innerHTML = `<div class="gs-start">${gameHeroHtml(kind)}<p class="gs-hook">${linkRefs(g.hook)}</p>
      ${locked ? `<div class="gs-lock"><b>🔒 Locked for now</b><span>${esc(locked)}</span></div><div class="board-actions"><button class="btn" data-gs="back">Back</button></div>`
        : `<div class="board-actions"><button class="btn" data-gs="start">▶ ${going ? 'Keep going' : 'Start'}</button></div>`}
      ${status ? `<p class="gs-status">${esc(status)}</p>` : ''}${gameHowHtml(kind)}</div>`;
  }

  function openPlay(kind, eyebrow) {
    playing = kind;
    $('playEyebrow').textContent = eyebrow;
    $('playTitle').textContent = WEEK.title;
    $('play').hidden = false;
  }
  function closePlay() {
    $('play').hidden = true;
    playing = null;
    refreshHome();
    renderHud();
  }

  /* ----- weekly puzzle: four groups of four, one per lesson section ----- */

  // Two ways to play (Blake, 2026-10-04: "The daily puzzle is to hard. I
  // can't figure it out"). Easy, the first: tap an idea, then the section it
  // goes in, right or wrong at once, as many tries as it takes. Hard, the
  // Connections-style game as it was: four groups of four, 4 mistakes a day.
  // Both have 💡 hints (the verse each idea comes from), and Easy can place
  // up to 3 ideas for you. Either pays the same: 40 XP and a streak freeze.
  // A group solved one way counts the other way too.
  const PZ_GIVES = 3;
  let pzSel = [], pzOrder = null, pzMsg = '', pzVerses = false;
  const pzMode = () => S.pzMode === 'hard' ? 'hard' : 'easy';
  const pzGroupOf = t => WEEK.puzzle.groups.findIndex(g => g.tiles.some(x => x.text === t));
  const pzTile = t => WEEK.puzzle.groups.flatMap(g => g.tiles).find(x => x.text === t);
  // Where an idea has been put (Easy), or its group, once found (Hard); null if not yet.
  const pzPlaced = (pz, t) => (pz.placed || {})[t] != null ? pz.placed[t] : pz.solved.includes(pzGroupOf(t)) ? pzGroupOf(t) : null;
  const pzSolvedGroups = pz => WEEK.puzzle.groups.map((g, gi) => gi).filter(gi => pz.solved.includes(gi) || WEEK.puzzle.groups[gi].tiles.every(x => pzPlaced(pz, x.text) === gi));
  // A verse's words from this week's chapters ("Isaiah 40:31", "Isaiah 14:13–14"); '' without the text.
  function verseWords(ref) {
    const m = /^(.+) (\d+):(\d+)(?:[–-](\d+))?$/.exec(String(ref || ''));
    const all = m && (window.TU_READING || {})[m[1] + ' ' + m[2]];
    return Array.isArray(all) ? all.slice(Number(m[3]) - 1, Number(m[4] || m[3])).join(' ') : '';
  }

  function openPuzzle() {
    pzSel = []; pzOrder = null; pzMsg = ''; pzVerses = false;
    openPlay('puzzle', 'Weekly puzzle');
    const pz = !reelsLeft() && puzzleState();
    renderGameStart('puzzle', reelsLeft() ? '' : puzzleStatus(), reelsLeft() ? `Answer all ${WEEK.reels.length} reels this week to unlock the puzzle. ${reelsLeft()} left.` : '', pz && pz.status === 'playing' && (pz.solved.length || pz.mistakes));
  }

  function pzWin(pz) {
    pz.status = 'won';
    markStudied();
    if (!pz.rewarded) {
      pz.rewarded = true;
      S.freezes = (S.freezes || 0) + 1;
      grantXp(PUZZLE_XP, 'Solved the weekly puzzle');
      toast('❄️ Streak freeze earned', 'Saves your streak if you miss a day');
    }
  }

  function renderPuzzle() {
    const body = $('playBody');
    if (reelsLeft()) {
      body.innerHTML = `
        <div class="pz-wrap">
          <p class="clue-q">Locked for now</p>
          <p class="board-help">Answer all ${WEEK.reels.length} reels this week to unlock the puzzle. ${reelsLeft()} left.</p>
          <div class="board-actions"><button class="btn" data-pz="exit">Back</button></div>
        </div>`;
      return;
    }
    const pz = puzzleState(), groups = WEEK.puzzle.groups, mode = pzMode();
    const solved = pzSolvedGroups(pz);
    const solvedBox = (gi, refs) => {
      const g = groups[gi];
      return `<div class="pz-solved pz-c${gi}"><b>${esc(WEEK.sections[g.section])}</b>
        <span>${g.tiles.map(t => esc(t.text)).join(' · ')}</span>
        ${refs ? `<small>${g.tiles.map(t => linkRefs(t.ref)).join(' · ')}</small>` : ''}</div>`;
    };
    if (pz.status === 'won') {
      body.innerHTML = `
        <div class="pz-wrap">
          <p class="clue-q">Solved!</p>
          <p class="board-help">Every idea is in its section. You earned ${PUZZLE_XP} XP and a streak freeze ❄️.</p>
          <div style="margin-top:14px">${groups.map((_, gi) => solvedBox(gi, true)).join('')}</div>
          <div class="board-actions"><button class="btn" data-pz="exit">Back</button></div>
        </div>`;
      return;
    }
    const modes = `<div class="pz-modes"><button class="sh-pill${mode === 'easy' ? ' on' : ''}" data-pz="easy">Easy · one at a time</button><button class="sh-pill${mode === 'hard' ? ' on' : ''}" data-pz="hard">Hard · find the groups</button></div>`;
    const verseBox = ts => ts.length ? `<div class="pz-verses">${ts.map(t => { const x = pzTile(t), v = verseWords(x.ref);
      return `<p><b>${esc(t)}</b> · ${esc(x.ref)}${v ? `<br>“${esc(v)}”` : ''}</p>`; }).join('')}</div>` : '';

    if (mode === 'easy') {
      const left = groups.flatMap(g => g.tiles.map(t => t.text)).filter(t => pzPlaced(pz, t) == null);
      if (!pzOrder || pzOrder.length !== left.length || !left.every(t => pzOrder.includes(t))) pzOrder = shuffled(left, WEEK.title + '|easy|' + left.length);
      const sel = pzSel[0], tried = sel ? ((pz.tried || {})[sel] || []) : [], gives = PZ_GIVES - (pz.gave || 0);
      const boxes = groups.map((g, gi) => {
        const ins = g.tiles.filter(t => pzPlaced(pz, t.text) === gi);
        const no = sel && tried.includes(gi);
        return `<button class="pz-box pz-b${gi}${sel && !no ? ' ready' : ''}${no ? ' no' : ''}" data-pz-sec="${gi}"${ins.length === 4 ? ' disabled' : ''}>
          <b>${esc(WEEK.sections[g.section])}</b><small>${ins.length} of 4${no ? ' · not this one' : ''}</small>
          ${ins.length ? `<span>${ins.map(t => `<i>${esc(t.text)}</i>`).join('')}</span>` : ''}</button>`;
      }).join('');
      body.innerHTML = `
        <div class="pz-wrap">
          ${modes}
          <div class="pz-boxes">${boxes}</div>
          <p class="pz-msg">${pzMsg}</p>
          <p class="board-help pz-now">${sel ? `Now tap the section <b>“${esc(sel)}”</b> belongs in, above.` : 'Tap an idea, then the section it belongs in.'}</p>
          ${pzVerses && sel ? verseBox([sel]) : ''}
          <div class="pz-grid">${pzOrder.map(t => `<button class="ptile${t === sel ? ' sel' : ''}" data-pt="${esc(t)}">${esc(t)}</button>`).join('')}</div>
          <div class="pz-hints">
            <button class="btn ghost" data-pz="verse"${sel ? '' : ' disabled style="opacity:.4"'}>💡 Show its verse</button>
            <button class="btn ghost" data-pz="give"${gives > 0 ? '' : ' disabled style="opacity:.4"'}>🪄 Place one for me (${gives} left)</button>
          </div>
        </div>`;
      return;
    }

    // Hard
    if (pz.status === 'lost') {
      body.innerHTML = `
        <div class="pz-wrap">
          ${modes}
          <p class="clue-q">Out of tries for today</p>
          <p class="board-help">Hard comes back tomorrow with 4 more tries, or try it the easy way now. The four sections to sort into:</p>
          <ul class="pz-targets">${groups.map((g, gi) => `<li class="${solved.includes(gi) ? 'done' : ''}">${solved.includes(gi) ? '✓ ' : ''}${esc(WEEK.sections[g.section])}</li>`).join('')}</ul>
          <div style="margin-top:14px">${solved.map(gi => solvedBox(gi, false)).join('')}</div>
          <div class="board-actions"><button class="btn" data-pz="easy">Try it the easy way</button><button class="btn ghost" data-pz="exit">Back</button></div>
        </div>`;
      return;
    }
    const left = groups.flatMap((g, gi) => solved.includes(gi) ? [] : g.tiles.map(t => t.text));
    if (!pzOrder || pzOrder.length !== left.length || !left.every(t => pzOrder.includes(t))) {
      pzOrder = shuffled(left, WEEK.title + '|' + pz.day + '|' + solved.length);
    }
    body.innerHTML = `
      <div class="pz-wrap">
        ${modes}
        <p class="board-help">Find four groups of four. Each group is one of this week's lesson sections:</p>
        <ul class="pz-targets">${groups.map((g, gi) => `<li class="${solved.includes(gi) ? 'done' : ''}">${solved.includes(gi) ? '✓ ' : ''}${esc(WEEK.sections[g.section])}</li>`).join('')}</ul>
        <div style="margin-top:12px">${solved.map(gi => solvedBox(gi, false)).join('')}</div>
        <div class="pz-grid">${pzOrder.map(t =>
          `<button class="ptile${pzSel.includes(t) ? ' sel' : ''}" data-pt="${esc(t)}">${esc(t)}</button>`).join('')}</div>
        <p class="pz-msg">${pzMsg}</p>
        <div class="pz-lives">Mistakes left: ${[0, 1, 2, 3].map(i => `<i class="${i < PUZZLE_MISTAKES - pz.mistakes ? '' : 'gone'}"></i>`).join('')}</div>
        <div class="board-actions" style="justify-content:center">
          <button class="btn ghost" data-pz="verse"${pzSel.length ? '' : ' disabled style="opacity:.4"'}>💡 Verses</button>
          <button class="btn ghost" data-pz="shuffle">Shuffle</button>
          <button class="btn ghost" data-pz="clear">Deselect</button>
          <button class="btn" data-pz="submit"${pzSel.length === 4 ? '' : ' disabled style="opacity:.4"'}>Submit</button>
        </div>
        ${pzVerses ? verseBox(pzSel) : ''}
      </div>`;
  }

  function puzzleAction(el) {
    const pz = puzzleState();
    const act = el.dataset.pz, mode = pzMode(), groups = WEEK.puzzle.groups;
    if (act === 'exit') { closePlay(); return; }
    if (act === 'easy' || act === 'hard') {
      S.pzMode = act; pzSel = []; pzOrder = null; pzMsg = ''; pzVerses = false;
      save();
    } else if (act === 'verse') {
      pzVerses = !pzVerses;
    } else if (el.dataset.pt != null) {
      const t = el.dataset.pt;
      if (mode === 'easy') pzSel = pzSel[0] === t ? [] : [t];
      else if (pzSel.includes(t)) pzSel = pzSel.filter(x => x !== t);
      else if (pzSel.length < 4) pzSel.push(t);
      pzMsg = '';
    } else if (el.dataset.pzSec != null && mode === 'easy') {
      const t = pzSel[0], gi = Number(el.dataset.pzSec);
      if (!t) pzMsg = 'Tap an idea first.';
      else if (pzGroupOf(t) === gi) {
        (pz.placed = pz.placed || {})[t] = gi;
        pzSel = []; pzVerses = false;
        pzMsg = '✓ Yes! ' + esc(pzTile(t).ref);
        if (groups.every(g => g.tiles.every(x => pzPlaced(pz, x.text) != null))) pzWin(pz);
        save();
      } else {
        const tr = (pz.tried = pz.tried || {})[t] = ((pz.tried || {})[t] || []).concat(gi);
        pz.misses = (pz.misses || 0) + 1;
        pzMsg = tr.length >= 2 ? 'Not that one either. 💡 Its verse might help.' : 'Not that one. Try another section.';
        save();
      }
    } else if (act === 'give' && mode === 'easy' && (pz.gave || 0) < PZ_GIVES) {
      const left = groups.flatMap(g => g.tiles.map(x => x.text)).filter(t => pzPlaced(pz, t) == null);
      const t = pzSel[0] || left[hash(WEEK.title + left.length) % left.length];
      if (t) {
        (pz.placed = pz.placed || {})[t] = pzGroupOf(t);
        pz.gave = (pz.gave || 0) + 1;
        pzSel = []; pzVerses = false;
        pzMsg = '🪄 “' + esc(t) + '” goes in “' + esc(WEEK.sections[groups[pzGroupOf(t)].section]) + '.”';
        if (groups.every(g => g.tiles.every(x => pzPlaced(pz, x.text) != null))) pzWin(pz);
        save();
      }
    } else if (act === 'shuffle') {
      pzOrder = shuffled(pzOrder, String(Date.now()));
    } else if (act === 'clear') {
      pzSel = []; pzMsg = ''; pzVerses = false;
    } else if (act === 'submit' && mode === 'hard' && pz.status === 'playing' && pzSel.length === 4) {
      const inGroup = (g, t) => g.tiles.some(x => x.text === t);
      const gi = groups.findIndex(g => pzSel.every(t => inGroup(g, t)));
      if (gi >= 0) {
        pz.solved.push(gi);
        pzSel = []; pzMsg = ''; pzVerses = false;
        if (pzSolvedGroups(pz).length === groups.length) pzWin(pz);
      } else if ((pz.guesses || []).includes(pzSel.slice().sort().join('|'))) {
        pzMsg = 'You already tried that one.';     // a repeat guess costs nothing
      } else {
        pz.guesses = (pz.guesses || []).concat(pzSel.slice().sort().join('|'));
        pz.mistakes += 1;
        const best = Math.max(...groups.map(g => pzSel.filter(t => inGroup(g, t)).length));
        pzMsg = best === 3 ? 'One away…' : 'Not a group.';
        if (pz.mistakes >= PUZZLE_MISTAKES) { pz.status = 'lost'; pzSel = []; pzVerses = false; }
      }
      save();
    }
    renderPuzzle();
    renderHud();
  }

  /* ----- Who said it? ----- */

  // Where he is in a round, kept with his progress so a reload picks up at
  // the same line; the round's own score; and a seed so each round shuffles.
  let sayIdx = 0, sayPicked = null, sayRight = 0, saySeed = '';
  const sayKeep = () => { S.sayPos = { week: WEEK.title, idx: sayIdx, right: sayRight, seed: saySeed }; save(); };

  function openSayings() {
    const p = S.sayPos && S.sayPos.week === WEEK.title && S.sayPos.idx < WEEK.sayings.length ? S.sayPos : null;
    sayIdx = p ? p.idx : 0; sayRight = p ? p.right || 0 : 0; saySeed = p && p.seed ? p.seed : Math.random().toString(36).slice(2, 8); sayPicked = null;
    openPlay('sayings', 'Who said it?');
    const got = WEEK.sayings.filter(x => S.sayings[x.id] && S.sayings[x.id].right).length;
    renderGameStart('sayings', got + ' of ' + WEEK.sayings.length + ' right · ' + SAY_XP + ' XP each', '', sayIdx > 0 && sayIdx < WEEK.sayings.length);
  }

  function renderSayings() {
    const list = WEEK.sayings;
    const body = $('playBody');
    if (sayIdx >= list.length) {
      const got = list.filter(x => S.sayings[x.id] && S.sayings[x.id].right).length;
      body.innerHTML = `
        <div class="clue">
          <p class="clue-q">${sayRight} of ${list.length} right</p>
          <p class="board-help">XP counts your first try at each line: ${got} of ${list.length} right the first time. Play again any time to practice.</p>
          <div class="board-actions">
            <button class="btn" data-say="again">Play again</button>
            <button class="btn ghost" data-say="exit">Done</button>
          </div>
        </div>`;
      return;
    }
    const x = list[sayIdx];
    const shown = sayPicked != null;
    const buttons = shuffled([x.speaker].concat(x.wrong), x.id + '|say|' + saySeed).map(c => {
      const cls = shown ? (c === x.speaker ? ' is-right' : c === sayPicked ? ' is-wrong' : '') : '';
      const mark = shown ? (c === x.speaker ? '✓' : c === sayPicked ? '✕' : '') : '';
      return `<button class="choice${cls}" data-say-pick="${esc(c)}"${shown ? ' disabled' : ''}><span class="mark">${mark}</span><span>${esc(c)}</span></button>`;
    }).join('');
    const why = shown
      ? `<p class="quiz-why">${sayPicked === x.speaker ? '<b class="ok">Right.</b> ' : '<b class="no">Not quite.</b> '}${linkRefs(x.why, x.ref)}</p>
         <div class="board-actions"><button class="btn" data-say="next">${sayIdx + 1 < list.length ? 'Next line' : 'See how you did'}</button></div>`
      : '';
    body.innerHTML = `
      <div class="clue">
        <div class="eyebrow">Line ${sayIdx + 1} of ${list.length}${shown ? ' · ' + linkRefs(x.ref) : ''}</div>
        <p class="say-quote">${esc(x.text)}</p>
        <div class="quiz${shown ? ' done' : ''}"><div class="quiz-choices">${buttons}</div></div>
        ${why}
      </div>`;
  }

  function sayingsAction(el) {
    const x = WEEK.sayings[sayIdx];
    if (el.dataset.sayPick != null && sayPicked == null) {
      sayPicked = el.dataset.sayPick;
      if (sayPicked === x.speaker) sayRight += 1;
      if (!S.sayings[x.id]) {                    // XP on the first try only
        const right = sayPicked === x.speaker;
        S.sayings[x.id] = { right };
        markStudied();
        if (right) grantXp(SAY_XP, 'Who said it?');
        save();
      }
    } else if (el.dataset.say === 'next') {
      sayIdx += 1; sayPicked = null;
      sayKeep();
    } else if (el.dataset.say === 'again') {
      sayIdx = 0; sayPicked = null; sayRight = 0; saySeed = Math.random().toString(36).slice(2, 8);
      sayKeep();
    } else if (el.dataset.say === 'exit') {
      closePlay();
      return;
    }
    renderSayings();
    renderHud();
  }

  /* ----- Verse Word: a Wordle-style daily word from the week's reading ----- */

  // Real Wordle rules to start: six tries, colors only. Hints unlock as you
  // go: after 2 guesses the chapter, after 4 the verse with a blank. Solving
  // sooner pays more (15 / 10 / 5 XP). A guess must be a word from the
  // Bible or the Book of Mormon (scripture-words.js); if that list didn't
  // load, any letters count rather than blocking the game.
  // Easy (the first; Blake, 2026-10-04: too hard): the verse with its blank
  // from the start, any letters count as a guess, and 💡 shows up to 2
  // letters. Hard: as above. The XP is the same either way.
  const WORD_TRIES = 6, WORD_SHOWS = 2;
  const wordXp = guesses => guesses <= 2 ? 15 : guesses <= 4 ? 10 : 5;
  const vwMode = () => S.vwMode === 'hard' ? 'hard' : 'easy';
  let vwTyped = '', vwMsg = '', wordSet = null;
  const isScriptureWord = w => {
    if (!wordSet && window.SCRIPTURE_WORDS) wordSet = new Set(window.SCRIPTURE_WORDS.split(' '));
    return !wordSet || wordSet.has(w);
  };

  const todaysWord = () => {
    const list = WEEK.words || [];
    return list.length ? list[new Date().getDay() % list.length] : null;
  };

  function wordState() {
    const today = dayKey(), w = todaysWord();
    S.words = S.words || {};
    Object.keys(S.words).forEach(d => { if (dayDiff(d, today) > 14) delete S.words[d]; });
    // A day already solved or lost keeps its word, even if the week changed
    // under it, so a day's word never pays twice.
    const had = S.words[today];
    if (!had || (had.word !== w.word && had.status === 'playing' && !had.paid)) S.words[today] = { word: w.word, guesses: [], status: 'playing' };
    return S.words[today];
  }

  // Wordle's rule: greens first, then yellows only for letters still unused.
  function scoreGuess(guess, word) {
    const res = Array(word.length).fill('x'), left = {};
    for (let i = 0; i < word.length; i++) {
      if (guess[i] === word[i]) res[i] = 'g';
      else left[word[i]] = (left[word[i]] || 0) + 1;
    }
    for (let i = 0; i < word.length; i++) {
      if (res[i] !== 'g' && left[guess[i]]) { res[i] = 'y'; left[guess[i]] -= 1; }
    }
    return res;
  }

  function wordStatus() {
    if (!todaysWord()) return '';
    const st = wordState();
    return st.status === 'won' ? 'Solved today ✓' : st.status === 'lost' ? 'New word tomorrow' : 'Up to 15 XP · a new word every day';
  }

  function openWord() { vwTyped = ''; vwMsg = ''; openPlay('word', 'Verse Word'); renderGameStart('word', wordStatus(), '', wordState().guesses.length > 0 && wordState().status === 'playing'); }

  function renderWord() {
    const w = todaysWord(), st = wordState(), L = w.word.length;
    const rows = [];
    for (let r = 0; r < WORD_TRIES; r++) {
      const g = st.guesses[r];
      const letters = g || (r === st.guesses.length && st.status === 'playing' ? vwTyped : '');
      const marks = g ? scoreGuess(g, w.word) : [];
      rows.push(`<div class="vw-row" style="grid-template-columns:repeat(${L},auto)">${Array.from({ length: L }, (_, i) =>
        `<div class="vw-cell${marks[i] ? ' ' + marks[i] : letters[i] ? ' filled' : ''}">${esc(letters[i] || '')}</div>`).join('')}</div>`);
    }
    const best = {}, rank = { g: 3, y: 2, x: 1 };
    st.guesses.forEach(g => scoreGuess(g, w.word).forEach((m, i) => {
      if (!best[g[i]] || rank[m] > rank[best[g[i]]]) best[g[i]] = m;
    }));
    const kb = ['QWERTYUIOP', 'ASDFGHJKL', 'ZXCVBNM'].map((row, n) => `<div class="vw-kr">
      ${n === 2 ? '<button class="vw-key wide" data-vk="enter">Enter</button>' : ''}
      ${[...row].map(c => `<button class="vw-key ${best[c] || ''}" data-vk="${c}">${c}</button>`).join('')}
      ${n === 2 ? '<button class="vw-key wide" data-vk="back" aria-label="Delete">⌫</button>' : ''}</div>`).join('');
    const n = st.guesses.length, done = st.status !== 'playing', easy = vwMode() === 'easy';
    const shown = st.shown || [];
    const blank = done ? esc(w.word) : Array.from({ length: L }, (_, i) => shown.includes(i) ? w.word[i] : '_').join(' ');
    const verse = `<p class="vw-clue">“${esc(w.clue).replace('____', '<b>' + blank + '</b>')}” <span class="text-white/55 text-[13px]">${done ? linkRefs(w.ref) : esc(w.ref)}</span></p>`;
    const left = WORD_SHOWS - shown.length;
    const hints = done ? verse + (w.mean ? `<p class="board-help" style="text-align:center;margin:0 auto 12px">${linkRefs(w.mean, w.ref)}</p>` : '')
      : easy ? verse + `<div class="board-actions" style="justify-content:center;margin:-4px 0 12px"><button class="btn ghost" data-vk="show"${left > 0 ? '' : ' disabled style="opacity:.4"'}>💡 Show a letter (${left} left)</button></div>`
      : (n >= 2 ? `<p class="vw-clue">Hint: it's in <b>${esc(w.ref.replace(/:.*/, ''))}</b></p>` : '')
        + (n >= 4 || shown.length ? verse : `<p class="board-help" style="text-align:center;margin:0 auto 12px">${n < 2 ? 'A hint after 2 guesses' : 'Another hint after 4 guesses'}</p>`);
    const modes = done ? '' : `<div class="pz-modes" style="margin:0 0 8px"><button class="sh-pill${easy ? ' on' : ''}" data-vk="mode-easy">Easy · verse + hints</button><button class="sh-pill${easy ? '' : ' on'}" data-vk="mode-hard">Hard · Wordle</button></div>`;
    const paid = typeof st.paid === 'number' ? st.paid : st.paid ? 10 : 0;   // days solved before the XP tiers paid 10
    const msg = st.status === 'won' ? 'Solved in ' + n + '!' + (paid ? ' +' + paid + ' XP' : '')
      : st.status === 'lost' ? 'The word was ' + w.word + '. A new word tomorrow.' : vwMsg;
    $('playBody').innerHTML = `
      <div class="pz-wrap">
        ${modes}
        <p class="board-help" style="text-align:center;margin:0 auto">Today's word is from this week's reading. Six tries.</p>
        ${done ? '' : '<p class="board-help" style="text-align:center;margin:2px auto 0;font-size:12.5px">🟩 right letter, right spot · 🟨 in the word, wrong spot · ⬛ not in the word</p>'}
        ${hints}
        <div class="vw-grid">${rows.join('')}</div>
        <p class="pz-msg">${esc(msg)}</p>
        ${st.status === 'playing'
          ? `<div class="vw-kb">${kb}</div>`
          : '<div class="board-actions" style="justify-content:center"><button class="btn" data-vk="exit">Back</button></div>'}
      </div>`;
  }

  function wordKey(k) {
    if (k === 'exit') { closePlay(); return; }
    const w = todaysWord(), st = wordState(), L = w.word.length;
    if (st.status !== 'playing') return;
    vwMsg = '';
    if (k === 'mode-easy' || k === 'mode-hard') { S.vwMode = k.slice(5); save(); renderWord(); return; }
    if (k === 'show') {
      // The next letter not already found in its spot, left to right.
      const sh = st.shown = st.shown || [];
      const green = new Set(st.guesses.flatMap(g => scoreGuess(g, w.word).map((m, i) => m === 'g' ? i : -1)));
      const i = [...w.word].findIndex((_, i) => !sh.includes(i) && !green.has(i));
      if (sh.length < WORD_SHOWS && i >= 0) { sh.push(i); save(); }
      renderWord(); return;
    }
    if (k === 'back') vwTyped = vwTyped.slice(0, -1);
    else if (k === 'enter') {
      if (vwTyped.length < L) vwMsg = 'The word has ' + L + ' letters.';
      else if (vwMode() === 'hard' && vwTyped !== w.word && !isScriptureWord(vwTyped)) vwMsg = 'Not a word in the scriptures. Try another.';
      else {
        st.guesses.push(vwTyped);
        const won = vwTyped === w.word;
        vwTyped = '';
        if (won || st.guesses.length >= WORD_TRIES) {
          st.status = won ? 'won' : 'lost';
          markStudied();
          if (won && !st.paid) { st.paid = wordXp(st.guesses.length); grantXp(st.paid, 'Verse Word'); }
        }
        save();
      }
    } else if (/^[A-Z]$/.test(k) && vwTyped.length < L) vwTyped += k;
    renderWord();
    renderHud();
  }

  /* ----- Scripture Climb: ten questions, each worth more, three lifelines ----- */

  // Easy reel questions first, then the reading-only bonuses. A miss ends
  // the climb and you keep the highest rung you reached (no Millionaire-style
  // drop to a safe level: the ladder and the score should say the same
  // thing). The first climb each day pays 2 XP per right answer; more
  // climbs are practice.
  const CLIMB_VALUES = [100, 200, 300, 500, 1000, 2000, 4000, 8000, 16000, 32000];
  let climb = null;

  function climbQuestions() {
    const seed = WEEK.title + '|' + dayKey();
    const easy = shuffled(WEEK.reels.map(r => ({ q: r.question, src: r.verse.ref, home: r.verse.ref })), seed + '|easy');
    // Only bonuses he has already answered: a climb shows each answer, and an
    // unanswered bonus's answer would then be free XP on its reel.
    const hard = shuffled(WEEK.reels.flatMap(r => bonusesOf(r).map((b, n) => ({ q: b, src: b.source, home: homeOf(r, b), key: bonusKey(r.id, n) })))
      .filter(x => S.bonus[x.key]), seed + '|hard').slice(0, 5);
    return easy.slice(0, CLIMB_VALUES.length - hard.length).concat(hard);
  }

  const climbStatus = () => reelsLeft() ? 'Answer all ' + WEEK.reels.length + ' reels to unlock · ' + reelsLeft() + ' left'
    : S.climbDay === dayKey() ? 'Climbed today · more climbs are practice' : 'Up to 20 XP today';

  // The first climb each day pays 2 XP for each right answer, as he gives
  // it; the day's climb is taken from the first answer on, so leaving and
  // starting over is practice. It opens once the week's reels are answered,
  // so it can't give their answers away first.
  function openClimb() {
    climb = { qs: climbQuestions(), at: 0, picked: null, hidden: null, used: {}, over: false, xp: 0,
              paid: S.climbDay !== dayKey(), seed: Math.random().toString(36).slice(2, 8) };
    openPlay('climb', 'Scripture Climb');
    renderGameStart('climb', reelsLeft() ? '' : climbStatus(), reelsLeft() ? `Answer all ${WEEK.reels.length} reels this week to unlock Scripture Climb. ${reelsLeft()} left.` : '');
  }

  function renderClimb() {
    const c = climb, body = $('playBody');
    if (reelsLeft()) {
      body.innerHTML = `
        <div class="clue">
          <p class="clue-q">Locked for now</p>
          <p class="board-help">Answer all ${WEEK.reels.length} reels this week to unlock Scripture Climb. ${reelsLeft()} left.</p>
          <div class="board-actions"><button class="btn" data-climb="exit">Back</button></div>
        </div>`;
      return;
    }
    const ladder = c.qs.map((_, i) => {
      const cls = i < c.at || (c.over && i < c.rungs) ? 'done'
        : (c.over && i === c.rungs && c.rungs < c.qs.length) ? 'missed'
        : (!c.over && i === c.at) ? 'now' : '';
      return `<span class="${cls}">${CLIMB_VALUES[i].toLocaleString('en-US')}</span>`;
    }).join('');
    if (c.over) {
      body.innerHTML = `
        <div class="clue">
          <div class="climb-ladder">${ladder}</div>
          <p class="clue-q">${c.rungs === c.qs.length ? 'To the top! ' : ''}You climbed to ${c.final.toLocaleString('en-US')} points</p>
          <p class="board-help">${c.rungs} of ${c.qs.length} right. ${!c.paid ? 'This climb was practice: the first climb each day earns XP.' : c.xp ? '+' + c.xp + ' XP.' : 'No XP this time. More climbs today are practice.'}</p>
          <div class="board-actions">
            <button class="btn" data-climb="again">Climb again</button>
            <button class="btn ghost" data-climb="exit">Done</button>
          </div>
        </div>`;
      return;
    }
    const cur = c.qs[c.at], shown = c.picked != null;
    const choices = shuffled([cur.q.right].concat(cur.q.wrong), cur.q.q + '|climb|' + c.seed).filter(x => x !== c.hidden).map(ch => {
      const cls = shown ? (ch === cur.q.right ? ' is-right' : ch === c.picked ? ' is-wrong' : '') : '';
      const mark = shown ? (ch === cur.q.right ? '✓' : ch === c.picked ? '✕' : '') : '';
      return `<button class="choice${cls}" data-climb-pick="${esc(ch)}"${shown ? ' disabled' : ''}><span class="mark">${mark}</span><span>${esc(ch)}</span></button>`;
    }).join('');
    const right = shown && c.picked === cur.q.right;
    body.innerHTML = `
      <div class="clue">
        <div class="climb-ladder">${ladder}</div>
        <div class="eyebrow">Question ${c.at + 1} of ${c.qs.length} · for ${CLIMB_VALUES[c.at].toLocaleString('en-US')} points</div>
        <p class="clue-q">${shown ? linkRefs(cur.q.q, cur.home) : esc(cur.q.q)}</p>
        ${shown ? '' : `<div class="lifelines">
          <button class="lifeline${c.used.half ? ' used' : ''}" data-life="half">50:50</button>
          <a class="lifeline${c.used.read ? ' used' : ''}" data-life="read" href="${esc(sourceLink(cur.src))}" target="_blank" rel="noopener noreferrer">Read it ↗</a>
          <button class="lifeline${c.used.parent ? ' used' : ''}" data-life="parent">Ask a parent</button>
        </div>`}
        ${c.askParent === c.at ? '<p class="parent-msg" style="margin-bottom:12px">Ask a parent! Talk it through together, then choose.</p>' : ''}
        <div class="quiz${shown ? ' done' : ''}"><div class="quiz-choices">${choices}</div></div>
        ${shown ? `<p class="quiz-why">${right ? '<b class="ok">Right.</b> ' : '<b class="no">Not quite.</b> '}${linkRefs(cur.q.why, cur.home)}</p>
          ${sourceLink(cur.src) ? `<p class="board-help">Read it: <a class="ref-link" href="${esc(sourceLink(cur.src))}" target="_blank" rel="noopener noreferrer">${esc(sourceLabel(cur.src))} ↗</a></p>` : ''}
          <div class="board-actions"><button class="btn" data-climb="next">${right && c.at + 1 < c.qs.length ? 'Next question' : 'See how you did'}</button></div>` : ''}
      </div>`;
  }

  function finishClimb(allRight) {
    const c = climb;
    c.rungs = allRight ? c.qs.length : c.at;
    c.final = c.rungs ? CLIMB_VALUES[c.rungs - 1] : 0;   // the highest rung reached
    c.over = true;
    markStudied();
    save();
  }

  function climbAction(el) {
    const c = climb;
    if (el.dataset.climb === 'exit') { closePlay(); return; }
    if (el.dataset.climb === 'again') { openClimb(); return; }
    if (c.over) return;
    const cur = c.qs[c.at];
    if (el.dataset.climbPick != null && c.picked == null) {
      c.picked = el.dataset.climbPick;
      markStudied();                     // an answer counts, even if he leaves the climb partway
      if (c.paid) {
        if (S.climbDay !== dayKey()) S.climbDay = dayKey();
        if (c.picked === cur.q.right) { c.xp += 2; grantXp(2, 'Scripture Climb'); }
        save();
      }
    } else if (el.dataset.climb === 'next') {
      const right = c.picked === cur.q.right;
      if (right && c.at + 1 < c.qs.length) { c.at += 1; c.picked = null; c.hidden = null; }
      else finishClimb(right);
    } else if (el.dataset.life === 'half' && !c.used.half) {
      c.used.half = true;
      c.hidden = shuffled(cur.q.wrong, cur.q.q + '|half')[0];   // hide one wrong answer
    } else if (el.dataset.life === 'parent' && !c.used.parent) {
      c.used.parent = true;
      c.askParent = c.at;
    } else if (el.dataset.life === 'read' && !c.used.read) {
      c.used.read = true;
      setTimeout(renderClimb, 0);                  // let the link open first
      return;
    }
    renderClimb();
    renderHud();
  }

  /* ----- Who said it? in the daily warm-up ----- */

  // On warm-up days one line comes back too (see rollDay), in the lesson.
  function recordSayWarm(picked) {
    const x = S.daily.say && (WEEK.sayings || []).find(s => s.id === S.daily.say);
    if (!x || S.daily.sayDone) return false;
    const right = picked === x.speaker;
    S.daily.sayDone = { picked, right };
    S.sayRecall = S.sayRecall || {};
    S.sayRecall[x.id] = dayKey();
    // XP counts a line's first answer only, here or in the game.
    const first = !S.sayings[x.id];
    if (first) S.sayings[x.id] = { right };
    markStudied();
    if (right && first) grantXp(SAY_XP, 'Who said it?');
    save();
    return true;
  }
  /* ----- the year trail on the home page ----- */

  // Come, Follow Me 2026 (Old Testament) runs 52 weeks. Each finished week
  // becomes a green dot; the lesson link's number says which week this is.
  const YEAR_WEEKS = 52;

  /* ----- past weeks ----- */

  // Every week before this one, to read again, newest first: the ones still
  // in weeks.js, then the ones moved to content/past/ (tools/archive-weeks.mjs),
  // whose file loads when it's opened. Each shows what he did in it, when
  // that was saved (every week that ended from September 28, 2026 on).
  const weekNumOf = w => Number((/\/(\d+)\?/.exec((w && w.lesson) || '') || [])[1]) || null;
  const recordOf = num => (S.history || []).find(h => h.num === num) || null;
  function pastWeeks() {
    const start = weekStart(WEEK.dates);
    const here = (window.TU_WEEKS || []).filter(w => weekStart(w.dates) < start)
      .map(w => ({ num: weekNumOf(w), dates: w.dates, title: w.title, week: w }));
    const moved = (window.TU_PAST_INDEX || []).filter(x => x && x.num && weekStart(x.dates) < start && !here.some(h => h.num === x.num))
      .map(x => ({ num: x.num, dates: x.dates, title: x.title, week: null }));
    return here.concat(moved).sort((a, b) => (weekStart(b.dates) || '').localeCompare(weekStart(a.dates) || ''));
  }

  // One past week on its own screen: its chapters (in the app when their
  // text is here, or in Gospel Library), then each section's reels and
  // Go-deeper readings, marked with his first try. A reel, reading or
  // chapter opens over it. A question he didn't answer that week he can
  // answer now: the first try only, with the XP it pays this week, kept
  // apart from the week's own record (S.late) and marked as caught up.
  let past = null;   // the week open: { p, week, text }
  let pastUnit = null;   // the chapter open over it, if one is
  const pastSourceLink = src => src === 'lesson' ? past.week.lesson : sourceLink(src);
  const shortDay = k => new Date(k + 'T12:00:00').toLocaleDateString([], { month: 'short', day: 'numeric' });

  // His try at one question of the open week (`kind` is answers, bonus or
  // deep, keyed as in S): what was saved when the week ended, else what he
  // answered since. A week that ended before each answer was saved (the
  // first weeks, up to the morning of September 28, 2026) kept only its
  // totals: all its reels answered means each one was, and all right (or
  // none) says how each went; `right` is null when they don't say.
  // Null when nothing says he answered it.
  function pastTry(kind, id) {
    const { p, week } = past, h = recordOf(p.num), rec = h && h.rec;
    const a = rec && (rec[kind] || {})[id];
    if (a) return { right: a.right, picked: a.picked };
    const l = (((S.late || {})[p.num] || {})[kind] || {})[id];
    if (l) return { right: l.right, picked: l.picked, late: l.day };
    if (h && !rec && kind === 'answers' && week.reels.length && h.answered >= week.reels.length) {
      const r = week.reels.find(x => x.id === id), right = h.right >= h.answered ? true : h.right ? null : false;
      return r ? { right, picked: right ? r.question.right : null, unsaved: true } : null;
    }
    return null;
  }
  // A chapter of the open week he read: saved with the week, or, for a week
  // with only its totals, when he read all of them; or read since (lateRead).
  function pastReadDone(ref, units) {
    if (lateRead(ref) || (S.libRead && S.libRead[ref])) return true;
    const h = recordOf(past.p.num), rec = h && h.rec;
    if (rec) return (Array.isArray(rec.read) ? rec.read : Object.keys(rec.read || {})).includes(ref);
    return !!(h && units.length && h.read >= units.length);
  }
  // A chapter of the open week read since it ended (Blake, 2026-10-01: "I want
  // to catch up with all the reading of even the past weeks"): { day, secs, said, xp }.
  const lateRead = ref => (((S.late || {})[past.p.num] || {}).read || {})[ref] || null;
  // Answering a past week's question he hadn't: XP as this week pays it,
  // when it's right.
  function recordPast(kind, id, q, picked) {
    if (!past || pastTry(kind, id)) return false;            // first try only
    const right = picked === q.right, xp = right ? (kind === 'answers' ? XP.firstTry : XP.bonus) : 0;
    const w = (S.late = S.late || {})[past.p.num] = S.late[past.p.num] || {};
    const rec = (w[kind] = w[kind] || {})[id] = { right, picked, day: dayKey(), xp };
    markStudied();
    if (xp) { const before = S.xp; grantXp(xp, 'Caught up on a past week'); rec.xp = S.xp - before; }
    save();
    return true;
  }
  // Reading a past week's chapter: the reading clock and the honest question
  // as in a lesson, and the reading XP (Blake, 2026-09-30: reading pays the most).
  // It fills the day it was planned for, if that was its last chapter left,
  // which can mend a broken streak.
  function pastClock(ref) {
    const w = (S.late = S.late || {})[past.p.num] = S.late[past.p.num] || {}, c = w.clock = w.clock || {};
    if (!c[ref]) { c[ref] = Date.now(); saveLocal(); }
    return c[ref];
  }
  function recordPastRead(u, said) {
    if (!past || pastReadDone(u.ref, readingUnits(past.week.reference, past.text))) return false;
    const w = S.late[past.p.num] = S.late[past.p.num] || {}, start = (w.clock || {})[u.ref] || null;
    const rec = (w.read = w.read || {})[u.ref] = { day: dayKey(), secs: start ? Math.round((Date.now() - start) / 1000) : null, said: !!said, xp: 0 };
    if (w.clock) delete w.clock[u.ref];
    if (S.readPos) delete S.readPos[u.ref];
    markStudied(true);
    const before = S.xp;
    grantXp(READ_XP, 'Caught up: read ' + u.ref);
    rec.xp = S.xp - before;
    save();
    return true;
  }
  let pastAsk = null;    // the chapter he tapped "I read it" on too quickly, asked about
  function pastReadEndHtml(u) {
    const done = pastReadDone(u.ref, readingUnits(past.week.reference, past.text)), late = lateRead(u.ref);
    if (done) return `<div class="ch-mark"><p>✓ Read${late ? ' on ' + esc(shortDay(late.day)) : ' that week'}.</p></div>`;
    pastClock(u.ref);
    return `<div class="ch-mark">${pastAsk === u.ref ? `<p>That was quick. Did you read all of ${esc(u.ref)}?</p>
      <button class="btn" data-past-readyes="${esc(u.ref)}">Yes, I read every verse</button>
      <button class="today-alt" data-past-readnot>Not yet</button>`
      : `<p>Caught up on it? Mark it read for ${READ_XP} XP.</p><button class="btn" data-past-mark="${esc(u.ref)}">I read ${esc(u.ref)}</button>`}</div>`;
  }
  // "I read it": quicker than a real read asks him first, as in a lesson.
  function pastMark(ref, said) {
    const u = past && readingUnits(past.week.reference, past.text).find(x => x.ref === ref);
    if (!u) return;
    const secs = (Date.now() - pastClock(ref)) / 1000;
    if (!said && secs < readMinSecs(u)) pastAsk = ref;
    else { pastAsk = null; recordPastRead(u, said); }
    const end = $('viewBody').querySelector('.ch-mark');
    if (end) end.outerHTML = pastReadEndHtml(u);
    renderHud();
  }
  function answerPast(quiz, picked) {
    if (!past) return;
    const kind = quiz.dataset.pq, id = quiz.dataset.pid, week = past.week;
    const d = kind === 'deep' && (week.deep || []).find(x => x.id === id);
    const r = !d && week.reels.find(x => x.id === id.split('#')[0]);
    const q = d || (r && (kind === 'bonus' ? bonusesOf(r)[Number(id.split('#')[1])] : r.question));
    if (!q || !recordPast(kind, id, q, picked)) return;
    const pad = $('viewBody').querySelector('.content-pad'), top = pad ? pad.scrollTop : 0;
    $('viewBody').innerHTML = r ? pastReelHtml(r) : pastDeepHtml(d);
    const pad2 = $('viewBody').querySelector('.content-pad');
    if (pad2) pad2.scrollTop = top;
    renderHud();
  }
  // The week again, keeping its place, after something in it changed.
  function refreshPast() {
    if (!past) return;
    const top = $('past').scrollTop;
    $('pastBody').innerHTML = pastWeekHtml();
    $('past').scrollTop = top;
  }
  function loadScript(src) {
    return new Promise((ok, no) => { const s = document.createElement('script'); s.src = src; s.onload = ok; s.onerror = no; document.head.appendChild(s); });
  }
  async function pastWeekData(p) {
    if (p.week) return { week: p.week, text: window.TU_READING || {} };
    window.TU_PAST = window.TU_PAST || {};
    window.TU_PAST_READING = window.TU_PAST_READING || {};
    if (!window.TU_PAST[p.num]) await loadScript('content/past/week-' + p.num + '.js');
    if (!window.TU_PAST[p.num]) throw new Error('no week ' + p.num);
    // Its chapters' text is built at deploy; without it they open in Gospel Library.
    if (!window.TU_PAST_READING[p.num]) await loadScript('content/past/reading-' + p.num + '.js').catch(() => {});
    return { week: window.TU_PAST[p.num], text: window.TU_PAST_READING[p.num] || {} };
  }
  async function openPast(num) {
    const p = pastWeeks().find(x => x.num === num);
    if (!p) return;
    past = null;
    $('pastBody').innerHTML = `<div class="home-in"><p class="lb-help">Opening ${esc(p.title)}…</p></div>`;
    $('past').hidden = false;
    $('past').scrollTop = 0;
    try {
      const d = await pastWeekData(p);

    }

  // Exit on the TV ends the game for everyone, so mid-game it asks twice.
  function liveExit() {
    const s = lv && lv.role === 'host' && lv.game && lv.game.state;
    if ((s === 'question' || s === 'reveal') && !lv.sure) {
      lv.sure = true;
      $('liveExit').textContent = 'End the game? Tap again';
      setTimeout(() => { if (lv) lv.sure = false; $('liveExit').textContent = 'Exit'; }, 4000);
      return;
    }
    closeLive();
  }
  // A TV tab that was hosting picks its game back up after a reload.
  async function liveResume() {
    let code = null;
    try { code = sessionStorage.getItem(NS + 'live.host'); } catch (e) {}
    if (!code) return;
    const L = liveConn();
    try { await L.init(); } catch (e) { return; }
    const g = await new Promise(ok => { const off = L.watchGame(code, g => { ok(g); setTimeout(() => off && off(), 0); }); });
    if (g && g.host === L.uid()) hostLive();
    else try { sessionStorage.removeItem(NS + 'live.host'); } catch (e) {}
  }

  const modeNote = () => liveConn().kind === 'local'
    ? '<p class="live-mode">Test mode: players join from other tabs of this browser. Playing across phones turns on once the live-game server is set up.</p>'
    : '';

  function liveStart() {   // the chooser
    stopLive();
    openLive();
    liveBody(`
      <div class="gs-start">${gameHeroHtml('live')}<p class="gs-hook">${linkRefs(GAME_START.live.hook)}</p>
        <div class="board-actions">
          <button class="btn" data-live="host">▶ Host on this screen</button>
          <button class="btn ghost" data-live="join">Join with a code</button>
        </div>
        ${modeNote()}${gameHowHtml('live')}
      </div>`);
  }

  /* ----- host (the TV) ----- */

  async function hostLive() {
    stopLive();
    openLive();
    liveBody('<p class="board-help">Starting a game…</p>');
    const L = liveConn();
    try { await L.init(); } catch (e) { liveBody(`<div class="clue"><p class="clue-q">Can't start the game</p><p class="board-help">${esc(e.message)}</p></div>`); return; }
    let code = null;
    try { code = sessionStorage.getItem(NS + 'live.host'); } catch (e) {}
    if (code) {
      const g = await new Promise(ok => { const off = L.watchGame(code, g => { ok(g); setTimeout(() => off && off(), 0); }); });
      if (!g || g.host !== L.uid()) code = null;
    }
    for (let i = 0; i < 20 && !code; i++) {
      const c = String(1000 + Math.floor(Math.random() * 9000));
      if (await L.createGame(c, { week: WEEK.title, gid: liveGid(), qs: liveQuestionIds(c), state: 'lobby', qi: -1, seconds: LIVE_SECONDS })) code = c;
    }
    if (!code) { liveBody('<div class="clue"><p class="clue-q">Couldn&rsquo;t get a game code. Try again.</p></div>'); return; }
    try { sessionStorage.setItem(NS + 'live.host', code); } catch (e) {}
    lv = { role: 'host', code, game: null, players: [], answers: [], unsub: [] };
    lv.unsub.push(L.watchGame(code, g => {
      if (!lv) return;
      const first = !lv.game;
      lv.game = g;
      // Picked back up in the middle of a question or its answer: watch its
      // answers again, and give the question a fresh clock.
      if (first && g && (g.state === 'question' || g.state === 'reveal')) {
        watchAnswersFor(g.qi);
        if (g.state === 'question') { lv.localStart = Date.now(); liveClock(); }
      }
      renderHost();
    }));
    lv.unsub.push(L.watchPlayers(code, ps => { if (!lv) return; lv.players = ps; renderHost(); checkAllAnswered(); }));
  }

  function watchAnswersFor(qi) {
    if (lv.offAnswers) lv.offAnswers();
    lv.answers = [];
    lv.offAnswers = liveConn().watchAnswers(lv.code, qi, as => { if (!lv) return; lv.answers = as; renderHost(); checkAllAnswered(); });
    lv.unsub.push(lv.offAnswers);
  }

  async function askQuestion(qi) {
    lv.localStart = Date.now();
    lv.revealedQi = null;                        // a new question (or a new game) starts unrevealed
    watchAnswersFor(qi);
    await liveConn().updateGame(lv.code, { state: 'question', qi, qStart: 'now' });
    liveClock();
  }
  function liveClock() {
    clearInterval(lv.tick);
    lv.tick = setInterval(() => {
      if (!lv || !lv.game || lv.game.state !== 'question') return;
      const left = LIVE_SECONDS - Math.floor((Date.now() - lv.localStart) / 1000);
      const el = document.getElementById('liveClock');
      if (el) el.textContent = Math.max(0, left);
      if (left <= 0) reveal();
    }, 250);
  }

  // Everyone is waited for unless they've missed two questions in a row: a
  // player who has left holds up two questions at most, and one who is just
  // slow once is still waited for.
  const liveExpected = () => lv.players.filter(p => !(p.missed >= 2) || lv.answers.some(a => a.uid === p.uid));
  function checkAllAnswered() {
    if (!lv || lv.role !== 'host' || !lv.game || lv.game.state !== 'question' || !lv.players.length) return;
    const exp = liveExpected();
    if (exp.length && exp.every(p => lv.answers.some(a => a.uid === p.uid))) reveal();
  }

  // Reveal once per question. The guard is per question, not a single busy
  // flag: Firebase shows the new state before it confirms the save, so the
  // host can already be on the next question while this one's save finishes.
  async function reveal() {
    if (!lv || !lv.game || lv.game.state !== 'question' || lv.revealedQi === lv.game.qi) return;
    const g = lv.game, q = liveQuestion(g.qs[g.qi]);
    lv.revealedQi = g.qi;
    clearInterval(lv.tick);
    const scores = {};
    lv.players.forEach(p => {
      const a = lv.answers.find(x => x.uid === p.uid);
      const right = !!a && a.choice === q.right;
      let pts = 0;
      if (right) {
        const secs = Math.max(0, ((a.at || 0) - (g.qStart || 0)) / 1000);
        pts = 700 + Math.round(300 * Math.max(0, 1 - secs / LIVE_SECONDS));
      }
      scores[p.uid] = { score: (p.score || 0) + pts, last: pts, lastRight: right, lastAnswered: !!a, missed: a ? 0 : (p.missed || 0) + 1 };
    });
    try {
      await liveConn().setScores(lv.code, scores);
      await liveConn().updateGame(lv.code, { state: 'reveal' });
    } catch (e) {
      if (lv && lv.revealedQi === g.qi) lv.revealedQi = null;   // let the button or the timer try again
      toast("Couldn't reach the game", 'Check the internet and tap Show the answer again');
    }
  }

  async function hostAction(act) {
    const L = liveConn(), g = lv && lv.game;
    if (!g) return;
    if (act === 'start' && g.state === 'lobby' && lv.players.length) await askQuestion(0);
    else if (act === 'reveal') await reveal();
    else if (act === 'next' && g.state === 'reveal') {
      if (g.qi + 1 < g.qs.length) await askQuestion(g.qi + 1);
      else await L.updateGame(lv.code, { state: 'final' });
    } else if (act === 'again') {
      // A new game: last game's answers go first, or its first question
      // would count them and reveal at once.
      const code = lv.code;
      await L.clearAnswers(code);
      lv.answers = [];
      await L.setScores(code, Object.fromEntries(lv.players.map(p => [p.uid, { score: 0, last: 0, lastRight: false, lastAnswered: true, missed: 0 }])));
      await L.updateGame(code, { state: 'lobby', qi: -1, gid: liveGid(), qs: liveQuestionIds(code + '|' + Date.now()) });
    } else if (act === 'end') {
      await closeLive();
    }
  }

  const ranked = ps => ps.slice().sort((a, b) => (b.score || 0) - (a.score || 0));
  const placeOf = (ps, p) => 1 + ps.filter(x => (x.score || 0) > (p.score || 0)).length;   // ties share a place
  const fmt = n => Number(n || 0).toLocaleString('en-US');

  function choicesHtml(id, g, counts) {
    const q = liveQuestion(id);
    const shown = g.state !== 'question';
    return `<div class="live-choices${shown ? ' shown' : ''}">${liveChoices(id).map((c, n) => {
      const right = c === q.right;
      const cls = shown ? (right ? ' right' : ' dim') : '';
      const count = counts ? `<span style="margin-left:auto;font-variant-numeric:tabular-nums">${counts[c] || 0}</span>` : '';
      return `<div class="live-choice${cls}" style="background:${LIVE_COLORS[n]}"><span class="lt">${'ABC'[n]}</span><span>${esc(c)}</span>${count}</div>`;
    }).join('')}</div>`;
  }

  function renderHost() {
    if (!lv || lv.role !== 'host') return;
    const g = lv.game;
    if (!g) { liveBody('<div class="live-big">The game has ended.</div>'); return; }
    const players = ranked(lv.players);
    if (g.state === 'lobby') {
      liveBody(`
        <div class="clue">
          <div class="eyebrow">Join code</div>
          <div class="live-code">${esc(lv.code)}</div>
          <p class="board-help">On each phone or tablet: open Treasure Up, tap 🎮, choose <b>Live game</b>, then <b>Join with a code</b>.</p>
          <div class="live-players">${players.map(p => `<span>${esc(p.name)}</span>`).join('') || '<span style="opacity:.5">Waiting for players…</span>'}</div>
          <div class="board-actions">
            <button class="btn" data-host="start"${players.length ? '' : ' disabled style="opacity:.4"'}>Start · ${g.qs.length} questions</button>
            <button class="btn ghost" data-host="end">Cancel</button>
          </div>
          ${modeNote()}
        </div>`);
      return;
    }
    if (g.state === 'question' || g.state === 'reveal') {
      const id = g.qs[g.qi], q = liveQuestion(id);
      const counts = {};
      if (g.state === 'reveal') lv.answers.forEach(a => { counts[a.choice] = (counts[a.choice] || 0) + 1; });
      const board = g.state === 'reveal' ? `
        <p class="quiz-why" style="margin-top:14px"><b class="ok">Answer:</b> ${esc(q.right)}. ${linkRefs(q.why, homeOfId(id))}</p>
        <div class="live-scores">${players.map(p =>
          `<span>${placeOf(players, p)}. ${esc(p.name)} <b>${fmt(p.score)}</b>${p.last ? ` <i>+${fmt(p.last)}</i>` : ''}</span>`).join('')}</div>
        <div class="board-actions"><button class="btn" data-host="next">${g.qi + 1 < g.qs.length ? 'Next question' : 'Final scores'}</button></div>` : `
        <div class="board-actions"><button class="btn ghost" data-host="reveal">Show the answer now</button></div>`;
      liveBody(`
        <div class="clue">
          <div class="live-row">
            <div class="eyebrow">Question ${g.qi + 1} of ${g.qs.length}${g.state === 'question' ? ` · ${lv.answers.length} of ${Math.max(liveExpected().length, lv.answers.length)} answered` : ''}</div>
            ${g.state === 'question' ? `<div class="live-clock" id="liveClock">${Math.max(0, LIVE_SECONDS - Math.floor((Date.now() - (lv.localStart || Date.now())) / 1000))}</div>` : ''}
          </div>
          <p class="clue-q">${g.state === 'reveal' ? linkRefs(q.q, homeOfId(id)) : esc(q.q)}</p>
          ${choicesHtml(id, g, g.state === 'reveal' ? counts : null)}
          ${board}
        </div>`);
      return;
    }
    if (g.state === 'final') {
      const total = players.reduce((n, p) => n + (p.score || 0), 0);
      liveBody(`
        <div class="clue">
          <div class="eyebrow">Final scores</div>
          <p class="clue-q">Together you scored ${fmt(total)}</p>
          <div class="grid gap-2" style="margin-top:12px">${players.map(p => { const n = placeOf(players, p);
            return `<div class="score-row"><span>${['🥇', '🥈', '🥉'][n - 1] || n + '.'} ${esc(p.name)}</span><b>${fmt(p.score)}</b></div>`; }).join('')}</div>
          <div class="board-actions">
            <button class="btn" data-host="again">Play again</button>
            <button class="btn ghost" data-host="end">Done</button>
          </div>
        </div>`);
    }
  }

  /* ----- player (a phone or tablet) ----- */

  function joinForm(code, err) {
    stopLive();
    openLive();
    let name = '';
    try { name = localStorage.getItem(NS + 'live.name') || ''; } catch (e) {}
    if (!name && F) name = F.name.slice(0, 16);
    liveBody(`
      <div class="clue" style="max-width:420px">
        <p class="clue-q">Join a live game</p>
        <label class="block text-[12px] text-white/60" for="liveCode">Code on the TV</label>
        <input id="liveCode" class="field" inputmode="numeric" maxlength="4" autocomplete="off" value="${esc(code || '')}" style="font-size:28px;letter-spacing:.2em;text-align:center">
        <label class="block mt-3 text-[12px] text-white/60" for="liveName">Your name</label>
        <input id="liveName" class="field" maxlength="16" autocomplete="off" value="${esc(name)}">
        ${err ? `<p class="parent-msg">${esc(err)}</p>` : ''}
        <div class="board-actions"><button class="btn" data-live="joinnow">Join</button></div>
