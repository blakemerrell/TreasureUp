    if (realAccount(u) && u.emailVerified && (u.email || '').toLowerCase() === d.email) return head + `
      <p class="board-help">You're signed in as ${esc(u.email)}. You'll join ${as}.</p>
      <div class="board-actions"><button class="btn" data-fam="join">Join ${esc(d.family)}</button></div>
      <p id="famNote" class="parent-msg"></p>`;
    if (realAccount(u)) return head + `
      <p class="board-help">This invite is for ${esc(d.email)}, but you're signed in as ${esc(u.email || 'another account')}.</p>
      <div class="board-actions"><button class="btn" data-fam="signout">Sign out</button></div>
      <p class="fam-note">If ${esc(d.email)} isn't the right address, ask for a new invite with the right one.</p>`;
    return head + `
      <p class="board-help">You'll join ${as}. Sign in with <b>${esc(d.email)}</b>:</p>
      ${signInOptions(d.email)}
      <p id="famNote" class="parent-msg"></p>`;
  }

  async function joinFamily() {
    const { fid, token, data: d } = fam.invite;
    const u = await fbUser();
    const pid = d.role === 'kid' ? d.kidId : u.uid;
    const b = fs().batch();
    b.set(famCol(fid, 'members').doc(u.uid), { name: d.name, role: d.role, pid, invite: token, joined: TS() });
    b.update(famCol(fid, 'invites').doc(token), { usedBy: u.uid });
    b.set(fs().collection('users').doc(u.uid), { fid });
    // Remembered before it's sent, so a phone closed mid-join finishes it
    // (or forgets it, if it never reached the family) next time.
    F = { fid, uid: u.uid, pid, name: d.name, role: d.role, family: d.family, project: FIREBASE_CONFIG.projectId, pending: true };
    saveFam();
    try { await b.commit(); } catch (e) { F = null; saveFam(); throw e; }
    delete F.pending;
    saveFam();
    store(LOST_KEY, null);
    clearInvite();
    toast('👪 Welcome to ' + d.family, 'Joined as ' + d.name);
    watchLatest();
    if (claimProgress()) { watchBackup(); await syncNow(); }
  }

  async function startFamily() {
    const family = $('famNewFamily').value.trim(), name = $('famMyName').value.trim();
    if (!family) return famSay('Give the family a name.'), false;
    if (!name) return famSay('Type your name, as the family will see it.'), false;
    const u = authUser();
    const ref = fs().collection('families').doc();
    const b = fs().batch();
    b.set(ref, { name: family, createdBy: u.uid, created: TS() });
    b.set(ref.collection('members').doc(u.uid), { name, role: 'parent', pid: u.uid, invite: '', joined: TS() });
    b.set(fs().collection('users').doc(u.uid), { fid: ref.id });
    await b.commit();
    F = { fid: ref.id, uid: u.uid, pid: u.uid, name, role: 'parent', family, project: FIREBASE_CONFIG.projectId };
    saveFam();
    store(LOST_KEY, null);
    watchLatest();
    if (claimProgress()) { watchBackup(); await syncNow(); }
    return true;
  }

  /* ----- signing in (grown-ups) ----- */

  async function googleSignIn() {
    const provider = new firebase.auth.GoogleAuthProvider();
    provider.setCustomParameters({ prompt: 'select_account' });
    try { await firebase.auth().signInWithPopup(provider); }
    catch (e) {
      if (e.code === 'auth/popup-blocked' || e.code === 'auth/operation-not-supported-in-this-environment') return firebase.auth().signInWithRedirect(provider);
      if (e.code === 'auth/popup-closed-by-user' || e.code === 'auth/cancelled-popup-request') return;
      throw e;
    }
  }

  async function emailLink() {
    const email = ($('famEmail').value || '').trim().toLowerCase();
    if (!/^[^@ ]+@[^@ ]+\.[^@ ]+$/.test(email)) return famSay("That email address doesn't look right.");
    const inv = fam.invite && fam.invite.token ? fam.invite.fid + '.' + fam.invite.token : '';
    await firebase.auth().sendSignInLinkToEmail(email, { url: appUrl() + (inv ? '?invite=' + inv : ''), handleCodeInApp: true });
    store(NS + 'signinEmail', email);
    if (inv) store(NS + 'pendingInvite', inv);
    fam.sent = email;
    renderFam();
  }

  async function finishEmail() {
    const email = ($('famEmail').value || '').trim().toLowerCase();
    if (!email) return famSay('Type your email address.');
    await signInWithLink(email);
    fam.needEmail = false;
    fam.busy = 'Connecting…'; renderFam();
    famConnect();
  }

  // Finish an email sign-in link, then take its codes out of the address
  // (a used link can't be used twice), keeping any join link.
  async function signInWithLink(email) {
    const drop = () => {
      const q = new URLSearchParams(location.search);
      ['apiKey', 'oobCode', 'mode', 'lang', 'continueUrl', 'tenantId'].forEach(k => q.delete(k));
      const rest = q.toString();
      history.replaceState(null, '', location.pathname + (rest ? '?' + rest : ''));
    };
    try { await firebase.auth().signInWithEmailLink(email, location.href); }
    catch (e) { if (/action-code/.test(e.code || '')) drop(); throw e; }
    store(NS + 'signinEmail', null);
    drop();
  }

  // Their progress goes with their account: the device goes back to what
  // it had before they signed in (or starts fresh), and theirs is set
  // aside on the device for when they sign in again.
  async function famSignOut() {
    await syncNow();
    const owner = S.owner;
    leaveLocally();
    if (fam) fam.sent = null;
    await firebase.auth().signOut();   // the auth listener redraws
    if (owner) switchProgress(null, null);
  }

  /* ----- a member's view: People and Chat ----- */

  function memberHtml() {
    const tab = (id, label) => `<button class="fam-tab${fam.tab === id ? ' on' : ''}" data-fam="tab" data-tab="${id}">${label}</button>`;
    const u = authUser();
    return `
      <div class="fam-tabs">${tab('people', 'People')}${tab('chat', 'Chat<span id="famChatDot" class="hud-dot" hidden></span>')}</div>
      ${fam.tab === 'chat' ? `
        <div id="chatList" class="chat-list"></div>
        <div class="chat-form">
          <textarea id="chatText" class="field" maxlength="500" rows="2" placeholder="Message the family"></textarea>
          <button class="btn" data-fam="send">Send</button>
        </div>
        <p id="famNote" class="parent-msg"></p>
        <p class="fam-note">Everyone in the family sees every message, and parents can hide any message. Text and emoji only: no links or photos.</p>`
      : `
        <div id="famPeople"></div>
        ${F.role === 'parent' ? addHtml() : ''}
        <p class="fam-note" style="margin-top:22px">${realAccount(u)
          ? `Signed in as ${esc(u.email || 'Google')} · <button class="fam-link" data-fam="signout">Sign out</button>`
          : `This device is ${esc(F.name)}'s.`}</p>`}`;
  }

  function famWatch() {
    if (!fam || fam.watching === F.fid) return;
    stopFamWatch();
    fam.watching = F.fid;
    const on = (ref, cb) => fam.unsub.push(ref.onSnapshot(cb, famLost));
    on(famDoc(F.fid), s => {
      if (!s.exists || !F) return;
      F.family = s.data().name; saveFam();
      fam.createdBy = s.data().createdBy;
      if (!fam.invite) $('famTitle').textContent = F.family;
      renderPeople();
    });
    on(famCol(F.fid, 'members'), q => {
      fam.members = q.docs.map(d => Object.assign({ uid: d.id }, d.data({ serverTimestamps: 'estimate' })));
      const mine = fam.members.find(m => m.uid === F.uid);
      if (mine && mine.role !== F.role) { F.role = mine.role; saveFam(); stopFamWatch(); renderFam(); return; }
      renderPeople();
    });
    on(famCol(F.fid, 'progress'), q => { fam.progress = q.docs.map(d => Object.assign({ pid: d.id }, d.data())); renderPeople(); });
    on(famCol(F.fid, 'messages').orderBy('at', 'desc').limit(100), q => {
      fam.messages = q.docs.map(d => { const m = d.data({ serverTimestamps: 'estimate' }); return Object.assign(m, { id: d.id, at: tsMs(m.at) }); }).reverse();
      renderChat(false);
    });
    if (F.role === 'parent') {
      // All of the family's links, not just unused ones: a listener on
      // "usedBy == null" sometimes missed a link being used (seen in tests).
      // Used and expired links are tidied away from here.
      on(famCol(F.fid, 'invites'), q => {
        const all = q.docs.map(d => { const i = d.data(); return Object.assign(i, { id: d.id, expires: tsMs(i.expires) }); });
        fam.invites = all.filter(i => !i.usedBy && i.expires > Date.now());
        if (fam.link && !fam.invites.some(i => i.id === fam.link.token)) { fam.link = null; renderLink(); }   // used or cancelled
        all.filter(i => i.usedBy || i.expires < Date.now() - 86400000).forEach(i => famCol(F.fid, 'invites').doc(i.id).delete().catch(() => {}));
        renderPending();
      });
      on(famCol(F.fid, 'hidden'), q => { fam.hidden = {}; q.docs.forEach(d => { fam.hidden[d.id] = d.data().text; }); renderChat(false); });
    }
  }
  // A listener was refused: either this device was taken out of the
  // family, or its role changed (a parent-only list). Find out which.
  function famLost() {
    if (!fam || !F) return;
    stopFamWatch();
    famQueue = famQueue.then(() => F && checkMembership()).catch(() => {}).then(() => renderFam());
  }

  // People, one row each; a child's devices are listed under them.
  function people() {
    const by = new Map();
    fam.members.forEach(m => {
      const p = by.get(m.pid) || { pid: m.pid, name: m.name, role: m.role, devices: [] };
      p.devices.push({ uid: m.uid, joined: tsMs(m.joined) || 0 });
      by.set(m.pid, p);
    });
    const prog = new Map(fam.progress.map(g => [g.pid, g]));
    const order = { kid: 0, parent: 1, adult: 2 };
    return [...by.values()].map(p => Object.assign(p, {
      prog: prog.get(p.pid) || null,
      founder: !!fam.createdBy && p.devices.some(d => d.uid === fam.createdBy),
      devices: p.devices.sort((a, b) => a.joined - b.joined)
    })).sort((a, b) => (order[a.role] - order[b.role]) || a.name.localeCompare(b.name));
  }

  function renderPeople() {
    const el = $('famPeople');
    if (!el || !F || !fam) return;
    const ps = people();
    const total = ps.reduce((n, p) => n + (p.prog && p.prog.week === WEEK.title ? p.prog.right || 0 : 0), 0);
    el.innerHTML = `
      <div class="fam-total">Together this week
        <b>${total} right answer${total === 1 ? '' : 's'}</b>
        <small>${esc(WEEK.title)}</small></div>
      ${dupesHtml(ps)}
      ${ps.map(personHtml).join('')}
      ${takenOutHtml()}
      <p class="fam-note">${esc(savedLine())}</p>`;
  }

  // Two children with the same name are usually one child whose new phone or
  // tablet joined as someone new (Add someone, not Link another device), so
  // their progress doesn't add up (Blake, 2026-10-01: "Make this easier").
  // Combine: the one with less progress leaves; its saved progress is deleted
  // only when the other already has all of it (else it waits under Taken out);
  // and a link for the other is ready for that device, if it's still used.
  const sameName = (a, b) => String(a || '').trim().toLowerCase() === String(b || '').trim().toLowerCase();
  function dupesHtml(ps) {
    if (F.role !== 'parent') return '';
    const kids = ps.filter(p => p.role === 'kid'), xp = p => (p.prog && p.prog.xp) || 0;
    const last = p => Math.max(0, ...p.devices.map(d => d.joined || 0));
    return kids.filter((p, i) => kids.findIndex(q => sameName(q.name, p.name)) === i).map(p => {
      const twins = kids.filter(q => sameName(q.name, p.name));
      if (twins.length < 2) return '';
      const keep = twins.slice().sort((a, b) => xp(b) - xp(a) || last(b) - last(a))[0];
      const go = twins.filter(q => q !== keep).sort((a, b) => xp(a) - xp(b))[0];
      const key = 'combine:' + go.pid + ':' + keep.pid;
      return `<div class="fam-box"><b>${twins.length} people named ${esc(p.name)}</b>
        <div class="fam-note">One child on ${twins.length} devices doesn't add up. Combine them into the ${esc(p.name)} with ${xp(keep)} XP.</div>
        <div class="board-actions"><button class="btn${fam.confirm === key ? ' warn' : ''}" data-fam="confirm" data-key="${esc(key)}">${fam.confirm === key ? 'Tap again to combine' : 'Combine them'}</button></div></div>`;
    }).join('');
  }
  // What a person's saved progress (a) has that another's (b) doesn't.
  function notIn(a, b) {
    if (!a) return [];
    if (!b) return a.xp > 0 ? ['all of it'] : [];
    const out = [];
    for (const k of ['answers', 'bonus', 'deep', 'found', 'sayings', 'notes', 'read']) for (const id in a[k] || {}) if (!(b[k] || {})[id]) out.push(k + ':' + id);
    const weeks = new Set((b.history || []).map(h => h.title));
    for (const h of a.history || []) if (!weeks.has(h.title)) out.push('week:' + h.title);
    if (a.puzzle && a.puzzle.status === 'won' && !(b.puzzle && b.puzzle.week === a.puzzle.week && b.puzzle.status === 'won')) out.push('puzzle');
    for (const d in a.words || {}) if (a.words[d].paid && !((b.words || {})[d] || {}).paid) out.push('words:' + d);
    return out;
  }
  async function combine(fromPid, intoPid) {
    const from = people().find(p => p.pid === fromPid), into = people().find(p => p.pid === intoPid);
    if (!from || !into) return;
    const saved = async pid => { const d = await famCol(F.fid, 'backup').doc(pid).get(); try { return d.exists ? JSON.parse(d.data().state) : null; } catch (e) { return null; } };
    const [a, b] = await Promise.all([saved(fromPid), saved(intoPid)]);
    const keepIt = notIn(a, b).length > 0;
    const batch = fs().batch();
    from.devices.forEach(d => batch.delete(famCol(F.fid, 'members').doc(d.uid)));
    if (!keepIt) { batch.delete(famCol(F.fid, 'progress').doc(fromPid)); batch.delete(famCol(F.fid, 'backup').doc(fromPid)); }
    await batch.commit();
    await makeInvite('kid', into.name, '', intoPid);
    const joined = Math.max(0, ...from.devices.map(d => d.joined || 0));
    famSay(`Combined. If ${into.name} still uses the device that joined ${joined ? when(joined) : 'before'}, open this link on it: it joins ${into.name} here, and what's on it is added.` +
      (keepIt ? ` Until then, its saved progress waits under Taken out.` : ''));
    $('famLink').scrollIntoView({ block: 'center', behavior: reduceMotion() ? 'auto' : 'smooth' });
  }

  // Whether this device's progress has reached the family.
  function savedLine() {
    if (S.owner !== F.pid) return 'This device saves to the family once the question about its progress is answered.';
    const at = Number(stored(NS + 'savedAt')) || 0;
    if (canon(S) === synced()) return "This device's progress is saved to the family" + (at ? ' (' + when(at) + ').' : '.');
    return "Some progress on this device isn't saved to the family yet" + (at ? ' (last saved ' + when(at) + ')' : '') +
      '. It saves by itself when there’s a connection.';
  }

  function personHtml(p) {
    const g = p.prog, parent = F.role === 'parent', me = p.pid === F.pid;
    const L = g ? levelFor(g.xp) : 0;
    const streak = g && g.lastStudy && dayDiff(g.lastStudy, dayKey()) <= 1 ? g.streak : 0;
    const week = !g ? "Hasn't played on a linked device yet"
      : g.week === WEEK.title ? `This week: ${g.right} of ${WEEK.reels.length} right` : 'This week: not started';
    const confirm = (key, label, ask) => `<button class="fam-link${fam.confirm === key ? ' warn' : ''}" data-fam="confirm" data-key="${esc(key)}">${fam.confirm === key ? ask : label}</button>`;
    const acts = [];
    let devices = '';
    // Parents see every device joined as a child, so one nobody recognizes stands out.
    if (parent && p.role === 'kid') {
      devices = `<div class="fam-devices">${p.devices.map(d => `
        <div class="fam-device"><span>📱 Device joined ${esc(d.joined ? when(d.joined) : 'just now')}</span>
          ${confirm('dev:' + d.uid, 'Remove', p.devices.length === 1 ? 'Tap again: ' + esc(p.name) + ' leaves the family' : 'Tap again to remove this device')}</div>`).join('')}</div>`;
      acts.push(`<button class="fam-link" data-fam="device" data-pid="${esc(p.pid)}">Link another device</button>`);
    }
    // Whoever started the family stays a parent.
    if (parent && !me && p.role !== 'kid' && !p.founder) {
      acts.push(p.role === 'adult'
        ? `<button class="fam-link" data-fam="role" data-pid="${esc(p.pid)}" data-role="parent">Make a parent</button>`
        : `<button class="fam-link" data-fam="role" data-pid="${esc(p.pid)}" data-role="adult">Not a parent</button>`);
      acts.push(confirm('person:' + p.pid, 'Remove', 'Tap again to take ' + esc(p.name) + ' out of the family'));
    }
    return `
      <div class="fam-person">
        <div class="fp-top">
          <span class="fp-name">${esc(p.name)}${p.role === 'parent' ? '<span class="fam-role">Parent</span>' : ''}${me ? ' <span class="fam-you">(you)</span>' : ''}</span>
          ${g ? `<span class="fp-lv">Level ${L} · ${esc(LEVEL_TITLES[L - 1])}</span>` : ''}
        </div>
        <div class="fp-sub">${g ? `${g.xp} XP · 🔥 ${streak} · ` : ''}${esc(week)}</div>
        ${devices}
        ${acts.length ? `<div class="fam-actions">${acts.join('')}</div>` : ''}
      </div>`;
  }

  // People whose saved progress is still in the family after they were
  // taken out: a parent can bring a child back with it, or delete it.
  function takenOutHtml() {
    if (F.role !== 'parent') return '';
    const inFamily = new Set(fam.members.map(m => m.pid));
    const gone = fam.progress.filter(g => !inFamily.has(g.pid));
    if (!gone.length) return '';
    return `<div class="eyebrow" style="margin-top:22px">Taken out of the family</div>` + gone.map(g => {
      const kid = g.role ? g.role === 'kid' : g.pid.length < 20;
      const key = 'saved:' + g.pid;
      return `
        <div class="fam-person">
          <div class="fp-top"><span class="fp-name">${esc(g.name)}</span><span class="fp-lv">${g.xp} XP saved</span></div>
          <div class="fp-sub">${kid ? `Adding ${esc(g.name)} back brings this progress with them.` : 'Inviting them again by email brings this progress back.'}</div>
          <div class="fam-actions">
            ${kid ? `<button class="fam-link" data-fam="device" data-pid="${esc(g.pid)}">Add ${esc(g.name)} back</button>` : ''}
            <button class="fam-link${fam.confirm === key ? ' warn' : ''}" data-fam="confirm" data-key="${esc(key)}">${fam.confirm === key ? 'Tap again to delete it for good' : 'Delete saved progress'}</button>
          </div>
        </div>`;
    }).join('');
  }

  function addHtml() {
    const kind = (v, label, sub, on) => `
      <label><input type="radio" name="famKind" value="${v}"${on ? ' checked' : ''}><span>${label}<small>${sub}</small></span></label>`;
    return `
      <div class="eyebrow" style="margin-top:24px">Add someone</div>
      <div class="fam-kinds">
        ${kind('kid', 'A child', 'Joins with a link opened on their own phone or tablet. No email needed.', true)}
        ${kind('adult', 'A grown-up', 'A grandparent, friend or roommate. Signs in with their email.', false)}
        ${kind('parent', 'Another parent', 'Signs in with their email. Can add people and hide messages.', false)}
      </div>
      <label for="famNewName">First name</label>
      <input id="famNewName" class="field" maxlength="24" autocomplete="off">
      <div id="famEmailRow" hidden>
        <label for="famNewEmail">Their email address</label>
        <input id="famNewEmail" class="field" type="email" autocomplete="off">
      </div>
      <div class="board-actions"><button class="btn" data-fam="invite">Make a join link</button></div>
      <p id="famNote" class="parent-msg"></p>
      <div id="famLink"></div>
      <div id="famPending"></div>`;
  }

  async function makeInvite(role, name, email, kidId) {
    const token = newId(24);
    await famCol(F.fid, 'invites').doc(token).set({
      role, name, email: role === 'kid' ? '' : email, kidId: role === 'kid' ? kidId || newId(16) : '',
      family: F.family, createdBy: F.uid, usedBy: null,
      expires: firebase.firestore.Timestamp.fromMillis(Date.now() + INVITE_DAYS * 86400000)
    });
    fam.link = { token, name, role, email };
    renderLink();
  }

  async function inviteFromForm() {
    const role = (document.querySelector('input[name="famKind"]:checked') || {}).value || 'kid';
    const name = $('famNewName').value.trim();
    const email = role === 'kid' ? '' : $('famNewEmail').value.trim().toLowerCase();
    if (!name) return famSay('Type their first name.');
    if (role !== 'kid' && !/^[^@ ]+@[^@ ]+\.[^@ ]+$/.test(email)) return famSay('Type their email address: they sign in with it.');
    famSay('');
    // A child already here, on a new phone or tablet, is linked to themselves, not added again.
    const same = role === 'kid' && people().find(p => p.role === 'kid' && sameName(p.name, name));
    if (same) {
      fam.link = null;
      $('famLink').innerHTML = `<div class="fam-box"><b>${esc(same.name)} is already in the family.</b>
        <div class="fam-note">A new phone or tablet for ${esc(same.name)}? Link it, and it's the same ${esc(same.name)}, with the same progress.</div>
        <div class="board-actions"><button class="btn" data-fam="device" data-pid="${esc(same.pid)}">Link it to ${esc(same.name)}</button>
          <button class="btn ghost" data-fam="newkid" data-name="${esc(name)}">No, a different child</button></div></div>`;
      return;
    }
    await makeInvite(role, name, email);
    $('famNewName').value = ''; $('famNewEmail').value = '';
  }

  function renderLink() {
    const el = $('famLink');
    if (!el || !fam) return;
    const l = fam.link;
    if (!l) { el.innerHTML = ''; return; }
    const url = inviteUrl(l.token), who = esc(l.name);
    const mail = 'mailto:' + encodeURIComponent(l.email) +
      '?subject=' + encodeURIComponent('Join ' + F.family + ' on Treasure Up') +
      '&body=' + encodeURIComponent(F.name + ' added you to ' + F.family + ' on Treasure Up.\n\nOpen this link and sign in with ' + l.email + ':\n' + url +
                                    '\n\nThe link works once, for ' + INVITE_DAYS + ' days.');
    el.innerHTML = `
      <div class="fam-box">
        <b>${l.role === 'kid' ? `Open this link on ${who}'s phone or tablet.` : `Send this to ${who}. They'll sign in with ${esc(l.email)}.`}</b>
        <div class="fam-note" style="margin-top:2px">It works once, for ${INVITE_DAYS} days.</div>
        <input id="famLinkText" class="field" readonly value="${esc(url)}">
        <div class="board-actions">
          ${navigator.share ? '<button class="btn" data-fam="share">Share</button>' : ''}
          <button class="btn ghost" data-fam="copy">Copy link</button>
          ${l.role !== 'kid' ? `<a class="btn ghost" href="${esc(mail)}" style="text-decoration:none">Email it</a>` : ''}
        </div>
      </div>`;
  }

  function renderPending() {
    const el = $('famPending');
    if (!el || !fam) return;
    const list = fam.invites.filter(i => i.expires > Date.now()).sort((a, b) => a.expires - b.expires);
    const until = ms => new Date(ms).toLocaleDateString([], { month: 'short', day: 'numeric' });
    el.innerHTML = !list.length ? '' : `
      <div class="eyebrow" style="margin-top:22px">Waiting to join</div>
      ${list.map(i => `
        <div class="fam-person">
          <div class="fp-top"><span class="fp-name">${esc(i.name)}${i.role === 'parent' ? '<span class="fam-role">Parent</span>' : ''}</span>
            <span class="fp-lv">Link works until ${until(i.expires)}</span></div>
          <div class="fp-sub">${i.role === 'kid' ? 'A link for their phone or tablet' : 'Signs in with ' + esc(i.email)}</div>
          <div class="fam-actions">
            <button class="fam-link" data-fam="showlink" data-token="${esc(i.id)}">Show the link</button>
            <button class="fam-link" data-fam="cancel" data-token="${esc(i.id)}">Cancel it</button>
          </div>
        </div>`).join('')}`;
  }

  // Remove a device or a person, or delete saved progress: the first tap
  // asks, the second does it.
  async function confirmAction(key) {
    if (fam.confirm !== key) { fam.confirm = key; renderPeople(); return; }
    fam.confirm = null;
    const [what, id] = [key.slice(0, key.indexOf(':')), key.slice(key.indexOf(':') + 1)];
    if (what === 'combine') return combine(...id.split(':'));
    const b = fs().batch();
    if (what === 'dev') b.delete(famCol(F.fid, 'members').doc(id));
    if (what === 'person') { const p = people().find(x => x.pid === id); if (p) p.devices.forEach(d => b.delete(famCol(F.fid, 'members').doc(d.uid))); }
    if (what === 'saved') { b.delete(famCol(F.fid, 'progress').doc(id)); b.delete(famCol(F.fid, 'backup').doc(id)); }
    await b.commit();
  }

  async function setRole(pid, role) {
    const p = people().find(x => x.pid === pid);
    if (!p) return;
    const b = fs().batch();
    p.uids.forEach(uid => b.update(famCol(F.fid, 'members').doc(uid), { role }));
    await b.commit();
  }

  /* ----- chat ----- */

  function when(ms) {
    if (!ms) return '';
    const d = new Date(ms);
    const t = d.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
    return dayKey(d) === dayKey() ? t : d.toLocaleDateString([], { month: 'short', day: 'numeric' }) + ', ' + t;
  }

  function msgHtml(m) {
    const parent = F.role === 'parent', orig = m.hidden && parent ? fam.hidden[m.id] : null;
    return `
      <div class="msg${m.uid === F.uid ? ' mine' : ''}${m.hidden ? ' gone' : ''}">
        <div class="mh"><b>${esc(m.name)}</b><span>${esc(when(m.at))}</span>
          ${parent ? `<button class="fam-link" data-fam="${m.hidden ? 'unhide' : 'hide'}" data-mid="${esc(m.id)}">${m.hidden ? 'Unhide' : 'Hide'}</button>` : ''}</div>
        <div class="mt">${m.hidden ? 'Hidden by a parent' : esc(m.text)}</div>
        ${orig != null ? `<div class="orig">${esc(orig)}</div>` : ''}
      </div>`;
  }

  function renderChat(first) {
    const el = $('chatList');
    if (!el || !fam) return;
    const sc = $('fam');
    const nearBottom = sc.scrollHeight - sc.scrollTop - sc.clientHeight < 160;
    el.innerHTML = fam.messages.length ? fam.messages.map(msgHtml).join('')
      : '<p class="fam-note">No messages yet. Say hello, or share something you learned this week.</p>';
    if (first || nearBottom) sc.scrollTop = sc.scrollHeight;
    updateFamDot();
  }

  async function sendMsg() {
    const box = $('chatText'), text = box.value.trim();
    if (!text) return;
    if (LINKS.test(text)) return famSay("Links can't be sent in the family chat.");
    famSay('');
    box.value = '';
    try { await famCol(F.fid, 'messages').add({ uid: F.uid, name: F.name, text, at: TS(), hidden: false }); }
    catch (e) { box.value = text; famSay("Couldn't send. Check the internet and try again."); }
  }

  // Hiding blanks the message for everyone and keeps its text where only
  // parents can read it; unhiding puts it back.
  async function hideMsg(mid, hide) {
    const m = fam.messages.find(x => x.id === mid);
    if (!m || m.hidden === hide) return;
    const b = fs().batch();
    if (hide) {
      b.set(famCol(F.fid, 'hidden').doc(mid), { text: m.text, by: F.uid, at: TS() });
      b.update(famCol(F.fid, 'messages').doc(mid), { hidden: true, text: '' });
    } else {
      if (fam.hidden[mid] == null) return;
      b.update(famCol(F.fid, 'messages').doc(mid), { hidden: false, text: fam.hidden[mid] });
      b.delete(famCol(F.fid, 'hidden').doc(mid));
    }
    await b.commit();
  }

  async function famAction(el) {
    const act = el.dataset.fam;
    try {
      if (act === 'retry') { fam.err = null; fam.busy = 'Connecting…'; renderFam(); return famConnect(); }
      if (act === 'dismiss') { clearInvite(); return renderFam(); }
      if (act === 'google') return await googleSignIn();
      if (act === 'email') return await emailLink();
      if (act === 'finish') return await finishEmail();
      if (act === 'signout') return await inQueue(famSignOut);
      if (act === 'start') {
        el.disabled = true;
        if (await inQueue(startFamily)) renderFam(); else el.disabled = false;
        return;
      }
      if (act === 'join') { el.disabled = true; await inQueue(joinFamily); return renderFam(); }
      if (act === 'claim-yes' || act === 'claim-no') return claimAnswer(act === 'claim-yes');
      if (act === 'tab') { fam.tab = el.dataset.tab; return renderFam(); }
      if (act === 'invite') return await inviteFromForm();
      if (act === 'newkid') { await makeInvite('kid', el.dataset.name, ''); $('famNewName').value = ''; return; }
      if (act === 'device') {        // another device for a child, or a child taken out coming back
        const p = people().find(x => x.pid === el.dataset.pid) || fam.progress.find(g => g.pid === el.dataset.pid);
        if (!p) return;
        await makeInvite('kid', p.name, '', el.dataset.pid);
        $('famLink').scrollIntoView({ block: 'center', behavior: reduceMotion() ? 'auto' : 'smooth' });
        return;
      }
      if (act === 'showlink') {
        const i = fam.invites.find(x => x.id === el.dataset.token);
        if (i) { fam.link = { token: i.id, name: i.name, role: i.role, email: i.email }; renderLink(); }
        return;
      }
      if (act === 'cancel') {
        if (fam.link && fam.link.token === el.dataset.token) { fam.link = null; renderLink(); }
        return await famCol(F.fid, 'invites').doc(el.dataset.token).delete();
      }
      if (act === 'copy') {
        const url = $('famLinkText').value;
        try { await navigator.clipboard.writeText(url); famSay('Link copied.'); }
        catch (e) { $('famLinkText').select(); famSay('Select the link and copy it.'); }
        return;
      }
      if (act === 'share') {
        const l = fam.link;
        try { await navigator.share({ title: 'Join ' + F.family + ' on Treasure Up', text: l.role === 'kid' ? 'Open this on ' + l.name + "'s phone or tablet:" : 'Open this and sign in with ' + l.email + ':', url: inviteUrl(l.token) }); }
        catch (e) {}
        return;
      }
      if (act === 'role') return await setRole(el.dataset.pid, el.dataset.role);
      if (act === 'confirm') return await confirmAction(el.dataset.key);
      if (act === 'send') return await sendMsg();
      if (act === 'hide' || act === 'unhide') return await hideMsg(el.dataset.mid, act === 'hide');
    } catch (e) {
      el.disabled = false;
      if ($('famNote')) famSay(friendly(e));
      else toast('👪 Family', friendly(e));
    }
  }

  /* ---------------- a day's lesson ---------------- */

  // The main way through a day, Duolingo-style: one step at a time, with a
  // progress bar, Check, and right or wrong with the why. A lesson is one
  // part of the week's plan (a section, Friday's deep dive, Saturday's
  // puzzle), after whatever is left of today's warm-up. It records each
  // answer the first time only, and the plan, the streak, XP and the
  // family's copy all see it. The practice steps (fill
  // in the word, put the words in order, match, who said it) are built from
  // the week's checked text and pay nothing. A missed step comes back at
  // the end until he gets it right; only the first try counts.
  const LESSON_SKIP = new Set(('shall their which there these those thee thine unto them with from have that this will when what ' +
    'they were into upon your also hath doth said saith every because before after again being where whose shalt').split(' '));
  const wordsOf = t => t.match(/[A-Za-z’']+/g) || [];
  const keyWord = w => w.length >= 5 && !LESSON_SKIP.has(w.toLowerCase());
  let lesson = null;

  // The part of the plan the Today card starts: the first one, from today
  // or an earlier day, that isn't finished.
  const lessonNow = () => todayEntries().find(e => entryItems(e).some(x => !x.done)) || null;
  // What a lesson holds, for the button that starts it.
  function lessonParts(e) {
    const parts = warmupsLeft().length ? ['Warm-up'] : [];
    if (e && e.kind === 'day') {
      const toRead = readingPlan()[e.d].filter(u => !S.read[u.ref]), min = minutesOf(toRead);
      if (toRead.length) parts.push('Read ' + unitsLabel(toRead) + (min ? ' (' + min + ' min)' : ''));
      const n = dayReels(e.d).filter(r => !S.answers[r.id]).length;
      if (n) parts.push(n === 1 ? '1 reel' : n + ' reels');
      if (dayDeep(e.d).some(d => !S.deep[d.id])) parts.push('Go deeper');
    } else if (e && e.kind === 'friday') {
      const n = fridayItems().filter(d => !S.deep[d.id]).length;
      parts.push(n === 1 ? '1 reading' : n + ' readings');
    } else if (e && e.kind === 'puzzle') parts.push('The weekly puzzle');
    return parts.join(' · ');
  }

  // Fill in the missing word: one word of the verse, and two from the week's other verses.
  function blankStep(r) {
    const all = wordsOf(r.verse.text), once = w => all.filter(x => x.toLowerCase() === w.toLowerCase()).length === 1;
    const keys = all.filter(keyWord), words = keys.filter(once).length ? keys.filter(once) : keys;
    if (!words.length) return null;
    const right = words[hash(r.id + '|blank') % words.length], cap = w => /^[A-Z]/.test(w);
    const pool = [...new Map(WEEK.reels.filter(x => x.id !== r.id).flatMap(x => wordsOf(x.verse.text)).filter(keyWord)
      .filter(w => w.toLowerCase() !== right.toLowerCase() && cap(w) === cap(right)).map(w => [w.toLowerCase(), w])).values()];
    const near = pool.sort((a, b) => Math.abs(a.length - right.length) - Math.abs(b.length - right.length) || hash(a) - hash(b)).slice(0, 6);
    const wrong = shuffled(near, r.id + '|near').slice(0, 2);
    if (wrong.length < 2) return null;
    // The word itself, not the same letters inside a longer word.
    const m = new RegExp('(^|[^A-Za-z’\'])' + right + '(?![A-Za-z’\'])').exec(r.verse.text);
    const at = m.index + m[1].length;
    return { kind: 'blank', ref: r.verse.ref, home: r.verse.ref, before: r.verse.text.slice(0, at), after: r.verse.text.slice(at + right.length),
             right, choices: shuffled([right].concat(wrong), r.id + '|blankc') };
  }
  // Find it in the chapter: a reel's headline (or its `seek`, a clue in plain
  // words) and the verses around its verse; he taps the one it describes.
  // The clue that shares the fewest words with its verse, so it takes
  // reading, not matching words. Needs the chapter's text.
  const FIND_XP = 10;
  const clueWords = t => new Set(wordsOf(String(t).toLowerCase()).map(w => w.replace(/[’']s$/, '')).filter(w => w.length >= 4 && !LESSON_SKIP.has(w)));
  function findStep(d, practice) {
    const text = window.TU_READING || {};
    if (!practice && dayReels(d).some(r => S.found[r.id])) return null;   // one a day
    const cands = dayReels(d).map(r => {
      const m = /^(.+? \d+):(\d+)(?:[–-](\d+))?$/.exec(r.verse.ref), all = m && text[m[1]];
      if (!Array.isArray(all)) return null;
      const from = Number(m[2]), to = Number(m[3] || m[2]);
      if (to > all.length) return null;
      const clue = r.seek || r.hook, v = clueWords(all.slice(from - 1, to).join(' '));
      return { r, ch: m[1], all, from, to, clue, overlap: [...clueWords(clue)].filter(w => v.has(w)).length };
    }).filter(Boolean);
    if (!cands.length) return null;
    const c = cands.sort((a, b) => a.overlap - b.overlap || hash(a.r.id + '|find') - hash(b.r.id + '|find'))[0];
    if (!c) return null;
    // About 7 verses, with the answer somewhere in them (not always the middle).
    const span = Math.min(c.all.length, Math.max(7, c.to - c.from + 1));
    const lo = Math.max(1, c.to - span + 1), hi = Math.min(c.from, c.all.length - span + 1);
    const start = lo + hash(c.r.id + '|findat') % (hi - lo + 1);
    const verses = c.all.slice(start - 1, start - 1 + span).map((t, k) => ({ n: String(start + k), t }));
    const right = verses.filter(v => Number(v.n) >= c.from && Number(v.n) <= c.to).map(v => v.n);
    // After he answers: the verse itself, so he sees how the clue says it in plain words.
    const said = c.all.slice(c.from - 1, c.to).join(' '), cut = said.split(/\s+/);
    return { kind: 'find', id: c.r.id, practice, clue: c.clue, ch: c.ch, home: c.r.verse.ref, verses, right,
             answer: 'Verse ' + c.from + (c.to > c.from ? '–' + c.to : ''),
             why: '“' + (cut.length > 30 ? cut.slice(0, 30).join(' ') + '…' : said) + '” (' + c.r.verse.ref + ')' };
  }
  function recordFind(id, right) {
    if (S.found[id]) return false;
    S.found[id] = { right, day: dayKey() };
    markStudied();
    if (right) payXp(S.found[id], FIND_XP, 'Found it in the chapter');
    save();
    return true;
  }
  // The chapters a day's practice comes from: its reading, or its reels' chapters.
  const dayChapters = d => new Set(readingPlan()[d].map(u => u.ch).concat(dayReels(d).map(r => r.verse.ref.replace(/:.*/, ''))));
  // Match each idea to its verse: the puzzle's tiles from today's chapters.
  function matchStep(d) {
    const chs = dayChapters(d), seen = new Set();
    const tiles = ((WEEK.puzzle && WEEK.puzzle.groups) || []).flatMap(g => g.tiles || []).filter(t => chs.has(String(t.ref).replace(/:.*/, '')));
    const pairs = shuffled(tiles.filter(t => !seen.has(t.ref) && seen.add(t.ref)), WEEK.title + '|match' + d).slice(0, 4).map(t => ({ a: t.text, b: t.ref }));
    return pairs.length < 3 ? null : { kind: 'match', pairs, left: shuffled(pairs.map(p => p.a), 'L' + d), right: shuffled(pairs.map(p => p.b), 'R' + d) };
  }
  // Who said it?: a line from today's chapters.
  function sayStep(d) {
    const chs = dayChapters(d), x = (WEEK.sayings || []).find(y => chs.has(y.ref.replace(/:.*/, '')));
    return !x ? null : { kind: 'say', text: x.text, ref: x.ref, home: x.ref, right: x.speaker, choices: shuffled([x.speaker].concat(x.wrong), x.id + '|say'), why: x.why };
  }
  const deepStep = d => ({ kind: 'deep', id: d.id, d, home: deepHome(d), q: d.q, right: d.right, why: d.why, choices: choicesFor(d, 'deep|' + d.id) });

  // A finished part plays again as practice: everything in it, nothing to earn.
  function buildLesson(entry) {
    const steps = [], further = !!entry && entry.kind === 'further', sunday = !!entry && entry.kind === 'sunday';
    // The day's warm-up comes first, but not in Go further (extra, after the lesson) or a Sunday class's lesson.
    if (!further && !sunday) S.daily.ids.filter(id => !S.daily.done[id]).map(reelById).filter(Boolean).forEach(r => steps.push({
      kind: 'recall', id: r.id, r, home: r.verse.ref, q: r.question.q, right: r.question.right, why: r.question.why, choices: choicesFor(r.question, r.id + '|' + S.daily.day) }));
    const x = !further && !sunday && S.daily.say && !S.daily.sayDone && (WEEK.sayings || []).find(y => y.id === S.daily.say);
    if (x) steps.push({ kind: 'saywarm', text: x.text, ref: x.ref, home: x.ref, right: x.speaker, why: x.why, choices: shuffled([x.speaker].concat(x.wrong), x.id + '|' + S.daily.day) });
    const practice = !!entry && entryItems(entry).every(i => i.done);
    if (entry && entry.kind === 'day') {
      // Reading first: the day's chapters, then finding a verse in them, then
      // the reels about what he just read.
      const d = entry.d;
      readingPlan()[d].filter(u => practice || !S.read[u.ref]).forEach(u => steps.push({ kind: 'chapter', u }));
      const f = findStep(d, practice);
      if (f) steps.push(f);
      dayReels(d).filter(r => practice || !S.answers[r.id]).forEach(r => {
        steps.push({ kind: 'read', r });
        steps.push({ kind: 'reel', id: r.id, home: r.verse.ref, q: r.question.q, right: r.question.right, why: r.question.why, choices: choicesFor(r.question, r.id) });
        const b = blankStep(r);
        if (b) steps.push(b);
      });
      [matchStep(d), x ? null : sayStep(d)].forEach(y => { if (y) steps.push(y); });
      dayDeep(d).filter(g => practice || !S.deep[g.id]).forEach(g => steps.push(deepStep(g)));
    } else if (further) {
      // Go further: the day's insight cards, then the bonus questions of its
      // answered reels, then a note on one of them that has none.
      const d = entry.d, open = dayReels(d).filter(r => S.answers[r.id]);
      bestCards(d).filter(i => practice || !(S.insights || {})[i.x.id]).forEach(i => steps.push({ kind: 'insight', x: i.x, draft: i.draft }));
      open.forEach(r => bonusesOf(r).forEach((q, n) => {
        if (practice || !S.bonus[bonusKey(r.id, n)]) steps.push({ kind: 'bonus', id: r.id, n, q, home: homeOf(r, q), right: q.right, why: q.why, choices: choicesFor(q, r.id + '|bonus' + n) });
      }));
      const r = open.find(y => !S.notes[y.id]);
      if (r) steps.push({ kind: 'note', r });
    } else if (sunday) {
      // The youth's Sunday class: what it's about and where to read it, then
      // each card and its question.
      steps.push({ kind: 'sunintro', l: entry.l, m: entry.m });
      sunCards(entry.l).filter(c => practice || !(S.sunday || {})[c.id]).forEach(c => {
        steps.push({ kind: 'sunread', c });
        steps.push({ kind: 'sunq', id: c.id, q: c.q, right: c.right, why: c.why, choices: choicesFor(c, 'sun|' + c.id) });
      });
    } else if (entry && entry.kind === 'friday') {
      fridayItems().filter(d => practice || !S.deep[d.id]).forEach(d => steps.push(deepStep(d)));
    } else if (entry && entry.kind === 'puzzle') steps.push({ kind: 'puzzle' });
    return { entry, practice, steps, at: 0, right: 0, scored: 0, start: Date.now(), xp0: S.xp, rewards: [], level: 0 };
  }

  // `key` is a part of the week map ("day.part"), a Sunday class's lesson
  // ("sun:<id>"), or '' for today's.
  function openLesson(key) {
    use('lesson');
    const m = /^(\d)\.(\d+)$/.exec(key || ''), sun = /^sun:(.+)$/.exec(key || '');
    const plan = weekPlan(), found = sun && sunLessonById(sun[1]);
    if (sun && !found) return;
    if (sun) use('sunday');
    // Today's: the next unfinished part; the warm-up alone if that's all
    // that's left; with nothing left, today's part again as practice.
    const entry = found ? { kind: 'sunday', l: found.l, m: found.m } : m ? (plan[m[1]] || [])[m[2]]
      : lessonNow() || (warmupsLeft().length ? null : plan[todayIndex()].find(e => e.kind !== 'family')) || null;
    const L = buildLesson(entry || null);
    if (!L.steps.length && entry && entry.kind === 'further') { toast('Do the day’s lesson first', 'Its bonus questions open after its reels'); return; }
    if (!L.steps.length) { toast('Nothing planned today', 'Catch up, or read ahead on the week map'); return; }
    lesson = L;
    lessonReset();
    $('lesson').hidden = false;
    renderLesson();
  }
  // Back to the page, where the Today card and the map show what's done.
  function closeLesson() {
    const L = lesson;
    lesson = null;
    $('lesson').hidden = true;
    if (location.hash === '#lesson') history.replaceState(null, '', location.pathname + location.search);
    stopClips();
    if (!L) return;
    renderHome();
    $('home').scrollTop = 0;
    renderHud();
    if (L.level) levelUp(L.level);
    if (L.at < L.steps.length) L.rewards.forEach(t => toast('🎁 Reward unlocked', t + ' · show a parent'));
  }
  function lessonReset() { Object.assign(lesson, { picked: null, matched: {}, sel: null, missR: null, misses: 0, checked: false, ok: null, earned: 0, readOk: false, askRead: false }); }

  // Checking a step records it, the first time only.
  function recordStep(step, picked, ok) {
    if (step.retry) return 0;
    const before = S.xp;
    if (step.kind === 'reel') recordReel(step.id, picked);
    else if (step.kind === 'recall') recordRecall(step.id, picked);
    else if (step.kind === 'saywarm') recordSayWarm(picked);
    else if (step.kind === 'deep') recordDeep(step.id, picked);
    else if (step.kind === 'bonus') recordBonus(step.id, step.n, picked);
    else if (step.kind === 'find' && !step.practice) recordFind(step.id, ok);
    else if (step.kind === 'sunq') recordSun(step.id, picked);
    return S.xp - before;
  }

  // "Right first time" on the last screen counts the questions, not the practice.
  const SCORED = { recall: 1, saywarm: 1, reel: 1, deep: 1, find: 1, bonus: 1, sunq: 1 };
  const LESSON_KIND = { recall: 'Warm-up · remember this?', saywarm: 'Warm-up · who said it?', reel: 'Choose the right answer',
    blank: 'Fill in the missing word', find: 'Find it in the chapter', match: 'Match each idea to its verse', say: 'Who said it?', deep: 'Go deeper',
    insight: '💡 Insight', bonus: 'Bonus · find it in the reading · +' + XP.bonus + ' XP', note: 'Write a note · +' + NOTE_XP + ' XP',
    sunintro: 'Sunday class · For the Strength of Youth', sunread: 'Read', sunq: 'Choose the right answer' };

  function renderLesson() {
    if (!lesson) return;
    const L = lesson, step = L.steps[L.at], xp = S.xp - L.xp0;
    L.bar = Math.max(L.bar || 0, Math.round(L.at / L.steps.length * 100));   // a miss queued for the end never moves it back
    $('lessonBar').style.width = L.bar + '%';
    $('lessonXp').textContent = xp ? '+' + xp + ' XP' : '';
    const body = $('lessonBody'), foot = $('lessonFoot');
    foot.className = 'ls-foot' + (L.checked ? (L.ok ? ' good' : ' bad') : '');
    body.dataset.step = step ? step.kind : 'end';
    if (!step) return renderLessonEnd(body, foot);
    const opt = (v, cls) => `<button class="ls-opt${cls}" data-ls="pick" data-v="${esc(v)}"${L.checked ? ' disabled' : ''}>${esc(v)}</button>`;
    const optCls = v => !L.checked ? (L.picked === v ? ' on' : '') : v === step.right ? ' good' : v === L.picked ? ' bad' : '';
    const opts = () => `<div class="ls-opts">${step.choices.map(c => opt(c, optCls(c))).join('')}</div>`;
    const min = step.kind === 'chapter' ? minutesOf([step.u]) : 0;
    let html = `<div class="ls-kind">${step.retry ? '↻ Try it again' : step.kind === 'read' ? 'Read' : step.kind === 'chapter' ? 'Read the chapter' + (min ? ' · about ' + min + ' min' : '') : step.kind === 'puzzle' ? 'Saturday'
      : step.kind === 'bonus' ? esc('Bonus · find it in ' + sourceLabel(step.q.source) + ' · +' + XP.bonus + ' XP')
      : step.kind === 'insight' ? { quote: '💬 Quote', video: '🎬 Video' }[step.x.kind] || LESSON_KIND.insight : LESSON_KIND[step.kind]}</div>`;
    if (step.kind === 'chapter') {
      // The chapter itself, or, without its text, the way to it in Gospel Library.
      const u = step.u, gl = u.whole ? readLink(u.ch, true) : readLink(u.ref);
      // Its clock starts the first time he opens it, and keeps running while he's away (in Gospel Library).
      // Back from Gospel Library, even after the phone closed the app, "I read it" is still open.
      const log = S.readLog || (S.readLog = {});
      if (!S.read[u.ref] && !(log[u.ref] && log[u.ref].start)) { log[u.ref] = { start: Date.now() }; saveLocal(); }
      if (log[u.ref] && log[u.ref].gl) L.readOk = true;
      html += `<div class="ls-chapter">
        <div class="ls-prompt">${esc(u.ref)}</div>
        ${gl ? `<a class="ls-gl" data-ls="gl" href="${esc(gl)}" target="_blank" rel="noopener noreferrer">${u.verses ? 'Or read it in Gospel Library ↗' : 'Read it in Gospel Library ↗'}</a>` : ''}
        ${listenHtml(u)}
        ${u.verses ? tldrHtml(u, WEEK) + layersBarHtml(u, WEEK) + `<div class="ls-verses">${versesHtml(u, WEEK)}</div>`
                   : `<p class="reel-body">Read ${esc(u.ref)} in Gospel Library, then come back and tap “I read it”.</p>`}
      </div>`;
    } else if (step.kind === 'find') {
      const cls = n => !L.checked ? (L.picked === n ? ' on' : '') : step.right.includes(n) ? ' good' : L.picked === n ? ' bad' : '';
      html += `<div class="ls-prompt">${esc(step.clue)}</div>
        <p class="ls-hint">Which verse of ${esc(step.ch)} says this? Tap it.</p>
        <div class="ls-find">${step.verses.map(v => `<button class="ls-opt${cls(v.n)}" data-ls="pick" data-v="${v.n}"${L.checked ? ' disabled' : ''}><sup>${v.n}</sup>${esc(v.t)}</button>`).join('')}</div>`;
    } else if (step.kind === 'read') {
      const r = step.r, img = r.media && r.media.image;
      html += `<div class="ls-read">
        ${img ? `<img src="${esc(img.src)}" alt="${esc(img.alt)}"><div class="credit" style="margin:-6px 0 10px">Picture: <a href="${esc(img.link)}" target="_blank" rel="noopener noreferrer">${esc(img.credit)}</a></div>` : ''}
        <div class="ls-prompt">${linkRefs(r.hook, r.verse.ref)}</div><p class="reel-body">${linkRefs(r.body, r.verse.ref)}</p>
        ${r.media && r.media.video && (r.media.video.previewed === true || window.TU_NO_EMBED) ? clipHtml(r.media.video) : ''}
        <div class="ls-verse">“${esc(r.verse.text)}”<span class="ls-ref-row"><span class="ref">${linkRefs(r.verse.ref)}</span>${readLink(r.verse.ref) ? `<a href="${esc(readLink(r.verse.ref))}" target="_blank" rel="noopener noreferrer">read the chapter ↗</a>` : ''}</span></div></div>`;
    } else if (step.kind === 'sunintro') {
      const l = step.l, m = step.m;
      html += `<div class="ls-prompt">${esc(l.title)}</div><p class="ls-hint">Chapter ${m.chapter}: ${esc(m.title)} · ${esc(shortDay(l.sunday))}</p>
        <p class="reel-body">${linkRefs(l.intro)}</p>
        <a class="deep-open" href="${esc(l.read)}" target="_blank" rel="noopener noreferrer">Open the lesson in Gospel Library ↗</a>`;
    } else if (step.kind === 'sunread') {
      html += `<div class="ls-read"><div class="ls-prompt">${linkRefs(step.c.hook)}</div><p class="reel-body">${linkRefs(step.c.body)}</p></div>`;
    } else if (step.kind === 'reel' || step.kind === 'recall' || step.kind === 'sunq') {
      html += `<div class="ls-prompt">${step.kind === 'recall' && !L.checked ? esc(step.q) : linkRefs(step.q, step.home)}</div>${step.kind === 'recall' && !step.retry ? '<p class="ls-hint">From earlier this week. No peeking.</p>' : ''}${opts()}`;
    } else if (step.kind === 'blank') {
      const fill = L.checked ? step.right : L.picked || '';
      html += `<div class="ls-verse" style="margin:6px 0 18px">“${esc(step.before)}<span class="ls-blank">${esc(fill) || '&nbsp;'}</span>${esc(step.after)}”<span class="ref">${L.checked ? linkRefs(step.ref) : esc(step.ref)}</span></div>${opts()}`;
    } else if (step.kind === 'match') {
      const doneL = new Set(Object.keys(L.matched)), doneR = new Set(Object.values(L.matched));
      // Each verse opens in Gospel Library, to read before matching.
      const reads = step.right.filter(b => readLink(b))
        .map(b => `<a href="${esc(readLink(b))}" target="_blank" rel="noopener noreferrer">${esc(b)} ↗</a>`).join('');
      html += `<div class="ls-prompt" style="font-size:18px">Tap an idea, then its verse.</div>
        ${reads ? `<div class="ls-reads"><span>Read them first:</span>${reads}</div>` : ''}
        <div class="ls-match"><div class="ls-opts">${step.left.map(a => `<button class="ls-opt${doneL.has(a) ? ' done' : L.sel === a ? ' on' : ''}" data-ls="L" data-v="${esc(a)}"${doneL.has(a) ? ' disabled' : ''}>${esc(a)}</button>`).join('')}</div>
          <div class="ls-opts">${step.right.map(b => `<button class="ls-opt${doneR.has(b) ? ' done' : L.missR === b ? ' miss' : ''}" data-ls="R" data-v="${esc(b)}"${doneR.has(b) ? ' disabled' : ''}>${esc(b)}</button>`).join('')}</div></div>`;
    } else if (step.kind === 'say' || step.kind === 'saywarm') {
      html += `<div class="ls-prompt">“${esc(step.text)}”</div>${opts()}`;
    } else if (step.kind === 'deep') {
      const d = step.d, web = /^https:|^lesson$/.test(d.read);
      const url = d.read === 'lesson' ? WEEK.lesson : web ? d.read : readLink(d.read);
      html += step.retry ? '' : `<div class="ls-prompt">${d.day === 'friday' ? esc(d.title) : 'Read ' + linkRefs(d.read)}</div>
        <p class="reel-body">${linkRefs(d.intro, deepPassage(d))}</p>
        ${url ? `<a class="deep-open" href="${esc(url)}" target="_blank" rel="noopener noreferrer">Open ${esc(web ? sourceLabel(d.read) : d.read)} ↗</a>` : ''}`;
      html += `<div class="ls-q">${linkRefs(step.q, step.home)}</div>${opts()}`;
    } else if (step.kind === 'insight' && step.x.kind === 'quote') {
      // A prophet's or apostle's own words on the verses, and the talk they're from.
      const x = step.x, s = x.source || {};
      // A quote inside the quote takes single marks, as in print.
      html += `<blockquote class="ins-quote">“${esc(x.quote.replace(/“/g, '‘').replace(/”/g, '’'))}”</blockquote>
        <p class="ins-who">${esc(s.who || s.by)}</p>
        <div class="ls-ins-ref">${linkRefs(x.ref)}</div>
        ${step.draft ? '<p class="plain-draft">Draft: not approved yet</p>' : ''}
        ${x.text ? `<p class="reel-body">${linkRefs(x.text, x.ref)}</p>` : ''}
        <a class="ins-src" href="${esc(s.url)}" target="_blank" rel="noopener noreferrer"><span>From ${esc(s.by)}${s.who ? ' · ' + esc(s.who) : ''}</span> <b>${esc(s.title)} ↗</b></a>`;
    } else if (step.kind === 'insight' && step.x.kind === 'video') {
      // A short clip on the reading, from a channel Blake chose, once he's watched it.
      const x = step.x;
      html += `<div class="ls-prompt">${esc(x.title)}</div>
        <div class="ls-ins-ref">${linkRefs(x.ref)}</div>
        ${step.draft ? '<p class="plain-draft">Draft: not approved yet</p>' : ''}
        <p class="reel-body">${linkRefs(x.text, x.ref)}</p>
        ${clipHtml(x.video)}`;
    } else if (step.kind === 'insight') {
      // A point from the page it credits, in our words, and the page to read more.
      const x = step.x, s = x.source || {};
      html += `<div class="ls-prompt">${esc(x.title)}</div>
        <div class="ls-ins-ref">${linkRefs(x.ref)}</div>
        ${step.draft ? '<p class="plain-draft">Draft: not approved yet</p>' : ''}
        <p class="reel-body">${linkRefs(x.text, x.ref)}</p>
        ${diveHtml(x)}
        <a class="ins-src" href="${esc(s.url)}" target="_blank" rel="noopener noreferrer"><span>From ${esc(s.by)}${s.who ? ' · ' + esc(s.who) : ''}</span> <b>${esc(s.title)} ↗</b></a>`;
    } else if (step.kind === 'bonus') {
      const where = sourceLabel(step.q.source);
      html += step.retry ? '' : `<a class="deep-open" style="margin:0 0 4px" href="${esc(sourceLink(step.q.source))}" target="_blank" rel="noopener noreferrer">Open ${esc(where)} ↗</a>`;
      html += `<div class="ls-q">${linkRefs(step.q.q, step.home)}</div>${opts()}`;
    } else if (step.kind === 'note') {
      const r = step.r, n = S.notes[r.id];
      html += `<div class="ls-prompt">${linkRefs(r.hook, r.verse.ref)}</div>
        <div class="ls-verse" style="margin-top:0">“${esc(r.verse.text)}”<span class="ref">${linkRefs(r.verse.ref)}</span></div>
        <label class="note-q" for="lsNote" style="margin-top:16px">${linkRefs(r.note || 'What does this mean for you? Write it in your own words.', r.verse.ref)}</label>
        ${L.checked && n ? `<p class="note-text">${esc(n.text)}</p>`
          : `<textarea id="lsNote" class="field note-input" rows="4" maxlength="600" placeholder="At least ${NOTE_MIN_WORDS} words"></textarea><p class="note-msg" id="lsNoteMsg"></p>`}
        <p class="note-help">Your parents can read your notes.</p>`;
    } else if (step.kind === 'puzzle') {
      const left = reelsLeft();
      html += `<div class="ls-prompt">The weekly puzzle</div>
        <p class="reel-body">${left ? `It opens once the week's reels are answered: ${left === 1 ? '1 is' : left + ' are'} left.`
          : `Sixteen ideas from this week. Put each one in its lesson section, for ${PUZZLE_XP} XP and a streak freeze.`}</p>`;
    }
    body.innerHTML = html;
    body.scrollTop = 0;
    if (step.kind === 'chapter') {
      needTrans(body.querySelector('.ls-chapter')); needOrig(body.querySelector('.ls-chapter'));
      if (!step.resumed) { step.resumed = true; resumeAt(body.querySelector('.ls-chapter'), step.u.ref); }
    }

    // The bottom: Continue, Check, or how it went.
    let footHtml;
    if (step.kind === 'read' || step.kind === 'insight' || step.kind === 'sunintro' || step.kind === 'sunread') footHtml = `<button class="ls-go" data-ls="next">Continue</button>`;
    else if (step.kind === 'note') {
      footHtml = L.checked ? `<div class="ls-say">Saved in your notes${L.earned ? ` <span class="ls-earn">+${L.earned} XP</span>` : ''}</div><button class="ls-go" data-ls="next">Continue</button>`
        : `<button class="ls-go" data-ls="savenote">Save note</button><button class="ls-alt" data-ls="next">Skip</button>`;
    }
    else if (step.kind === 'chapter') {
      // Opens once he's reached the end of the chapter here, or gone to read it in Gospel Library.
      // Quicker than a real read, it asks him first; then the XP.
      if (L.checked) footHtml = `<div class="ls-say">✓ ${esc(step.u.ref)}${L.earned ? ` <span class="ls-earn">+${L.earned} XP</span>` : ''}</div><button class="ls-go" data-ls="next">Continue</button>`;
      else if (L.askRead) footHtml = `<div class="ls-say">That was quick. Did you read all of ${esc(step.u.ref)}?</div>
        <button class="ls-go" data-ls="readyes">Yes, I read every verse</button>
        <button class="ls-alt" data-ls="readnot">Not yet</button>`;
      else footHtml = `<div class="ls-say ls-read-hint"${L.readOk ? ' hidden' : ''}>${step.u.verses ? 'Read to the end, then tap it.' : 'Open it in Gospel Library first.'}</div>
        <button class="ls-go" data-ls="readdone"${L.readOk ? '' : ' disabled'}>I read ${esc(step.u.ref)}</button>`;
    }
    else if (step.kind === 'puzzle') {
      footHtml = reelsLeft() ? `<button class="ls-go" data-ls="next">Continue</button>` : `<button class="ls-go" data-ls="puzzle">Start the puzzle</button>`;
    } else if (step.kind === 'match') {
      const all = Object.keys(L.matched).length === step.pairs.length;
      footHtml = all ? `<div class="ls-say">${L.misses ? 'All matched' : 'Perfect!'}</div><button class="ls-go" data-ls="next">Continue</button>`
                     : `<button class="ls-go" disabled>Match them all</button>`;
      if (all) foot.className = 'ls-foot good';
    } else if (L.checked) {
      const answer = step.kind === 'find' ? step.answer : step.right;
      footHtml = `<div class="ls-say">${L.ok ? ['Nice!', 'Great job!', 'You got it!'][L.at % 3] : 'Correct answer:'}${L.earned ? ` <span class="ls-earn">+${L.earned} XP</span>` : ''}</div>
        ${!L.ok ? `<div class="ls-why" style="font-weight:800;color:#fff">${esc(answer)}</div>` : ''}
        ${step.why ? `<div class="ls-why">${linkRefs(step.why, step.home)}</div>` : ''}
        ${/^say/.test(step.kind) ? `<div class="ls-why">${linkRefs(step.ref)}</div>` : ''}
        ${!L.ok ? `<div class="ls-why">It comes back at the end.</div>` : ''}
        <button class="ls-go" data-ls="next">Continue</button>`;
    } else {
      footHtml = `<button class="ls-go" data-ls="check"${L.picked != null ? '' : ' disabled'}>Check</button>`;
    }
    foot.innerHTML = `<div class="ls-foot-in">${footHtml}</div>`;
    // Once the footer is drawn (it changes how much of the step shows):
    if (step.kind === 'chapter' && step.u.verses && !L.readOk && body.scrollHeight - body.clientHeight < 60) lessonReadOk();   // all on one screen
    if (step.kind === 'find' && L.checked) {       // the right verse, in the middle of what shows
      const good = body.querySelector('.ls-find .good');
      if (good) body.scrollTop = Math.max(0, good.offsetTop - body.offsetTop - Math.max(0, (body.clientHeight - good.offsetHeight) / 2));
    }
  }

  function renderLessonEnd(body, foot) {
    const L = lesson, e = L.entry, secs = Math.round((Date.now() - L.start) / 1000), xp = S.xp - L.xp0, streak = streakNow(), charge = chargeOf(streak), up = nextCharge(streak);
    const next = L.practice || (e && e.kind === 'sunday') ? null : lessonNow();
    const name = e ? entryName(e) : "Today's warm-up";
    // After a day's lesson, its Go further while it has something left; after
    // Go further, the bonus questions still waiting on that day's reels.
    const fk = e && e.kind === 'day' ? furtherKey(e.d) : null;
    const locked = e && e.kind === 'further' ? dayReels(e.d).filter(r => !S.answers[r.id]).reduce((n, r) => n + bonusesOf(r).length, 0) : 0;
    body.innerHTML = `<div class="ls-done"><div class="big">🎉</div>
      <div class="ls-prompt">${L.practice ? 'Practice done!' : 'Lesson complete!'}</div>
      <p class="reel-body">${esc(name)}</p>
      <div class="ls-stats">
        <div class="ls-stat"><b>+${xp}</b><span>XP</span></div>
        <div class="ls-stat"><b>${L.scored ? Math.round(L.right / L.scored * 100) : 100}%</b><span>Right first time</span></div>
        <div class="ls-stat"><b>${Math.floor(secs / 60)}:${String(secs % 60).padStart(2, '0')}</b><span>Time</span></div></div>
      ${streak ? `<p class="ls-streak">🔥 ${streak}-day streak${charge > 1 ? ` · ⚡ XP ×${charge}` : ''}</p>` : ''}
      ${streak && up ? `<p class="fam-note" style="margin-top:4px">${up[0] - streak === 1 ? '1 more day' : up[0] - streak + ' more days'} to ⚡ XP ×${up[1]}</p>` : ''}
      ${L.level ? `<p class="ls-news">⭐ Level ${L.level}: ${esc(LEVEL_TITLES[L.level - 1])}</p>` : ''}
      ${L.rewards.map(t => `<p class="ls-news">🎁 Reward unlocked: ${esc(t)} · show a parent</p>`).join('')}
      ${fk ? `<button class="ls-further" data-ls="further" data-key="${fk}">🔭 Go further<small>${esc(furtherParts(e.d))}</small></button>` : ''}
      ${locked ? `<p class="fam-note">${locked === 1 ? '1 more bonus question opens' : locked + ' more bonus questions open'} once you answer that day's reels.</p>` : ''}
      ${L.practice ? `<p class="fam-note">Practice: this part was already answered, so nothing new was earned.</p>` : ''}
      ${!next && !L.practice ? `<p class="fam-note">${e && e.kind === 'sunday' ? 'Ready for class.' : "That's today's reading done. Come back tomorrow for the next part."}</p>` : ''}</div>`;
    foot.className = 'ls-foot';
    foot.innerHTML = `<div class="ls-foot-in">${next ? `<button class="ls-go" data-ls="nextlesson">Next: ${esc(entryName(next))}</button>
      <button class="ls-alt" data-ls="close">Done for now</button>` : `<button class="ls-go" data-ls="close">Done</button>`}</div>`;
  }

  // "I read it" opens: he reached the end of the chapter, or went to Gospel Library.
  function lessonReadOk() {
    if (!lesson || lesson.readOk) return;
    lesson.readOk = true;
    const b = $('lessonFoot').querySelector('[data-ls="readdone"]'), hint = $('lessonFoot').querySelector('.ls-read-hint');
    if (b) b.disabled = false;
    if (hint) hint.hidden = true;
  }

  // Redraw a chapter step without losing his place in it.
  function keepPlace(draw) { const b = $('lessonBody'), y = b.scrollTop; draw(); b.scrollTop = y; }

  function lessonAction(el) {
    const L = lesson, step = L && L.steps[L.at], act = el.dataset.ls;
    if (!L) return;
    // Check and Continue take each other's place, so a quick double tap
    // would check and move on before he saw the answer.
    if (act === 'check' || act === 'next' || act === 'readdone' || act === 'readyes' || act === 'readnot' || act === 'savenote') {
      if (Date.now() - (L.tapAt || 0) < 400) return;
      L.tapAt = Date.now();
    }
    // Gone to read it in Gospel Library (the link opens as usual): "I read it" opens, and stays open.
    if (act === 'gl') {
      if (step && step.kind === 'chapter') {
        const x = S.readLog && S.readLog[step.u.ref];
        if (x && !S.read[step.u.ref]) { x.gl = true; saveLocal(); }
        lessonReadOk();
      }
      return;
    }
    if (act === 'readdone' || act === 'readyes') {
      if (!L.readOk || L.checked) return;
      const u = step.u;
      if (S.read[u.ref]) { L.at++; lessonReset(); return renderLesson(); }             // practice: read before
      if (act === 'readdone' && readSecs(u.ref) < readMinSecs(u)) { L.askRead = true; return keepPlace(renderLesson); }
      const before = S.xp;
      recordRead(u.ref, act === 'readyes');
      Object.assign(L, { askRead: false, checked: true, ok: true, earned: S.xp - before });
      return keepPlace(renderLesson);
    }
    if (act === 'readnot') { L.askRead = false; return keepPlace(renderLesson); }
    if (act === 'close') return closeLesson();
    if (act === 'nextlesson') { closeLesson(); return openLesson(''); }
    if (act === 'further') { closeLesson(); return openLesson(el.dataset.key); }
    if (act === 'puzzle') { closeLesson(); return startGame('puzzle'); }
    // A note in his own words, as on a reel: kept, and its XP the first time.
    if (act === 'savenote') {
      if (L.checked || !step || step.kind !== 'note') return;
      const text = ($('lsNote') || {}).value || '', problem = noteProblem(text.trim());
      if (problem) { $('lsNoteMsg').textContent = problem; return; }
      const before = S.xp;
      storeNote(step.r, text.trim());
      Object.assign(L, { checked: true, ok: true, earned: S.xp - before });
      return renderLesson();
    }
    if (act === 'next') {
      // An insight card he has seen counts in its day's Go further.
      if (step && step.kind === 'insight' && !(S.insights || {})[step.x.id]) { (S.insights = S.insights || {})[step.x.id] = dayKey(); save(); }
      stopClips(); L.at++; lessonReset(); return renderLesson();
    }
    if (act === 'pick' && !L.checked) L.picked = el.dataset.v;
    else if (act === 'check' && !L.checked) {
      L.ok = Array.isArray(step.right) ? step.right.includes(L.picked) : L.picked === step.right;
      L.checked = true;
      if (!step.retry && SCORED[step.kind]) { L.scored++; if (L.ok) L.right++; }
      L.earned = recordStep(step, L.picked, L.ok);
      // A miss comes back at the end, with its choices in a new order.
      if (!L.ok) L.steps.push(Object.assign({}, step, { retry: true, choices: step.choices && shuffled(step.choices, 'again' + L.steps.length) }));
    } else if (act === 'L') { L.sel = el.dataset.v; L.missR = null; }
    else if (act === 'R' && L.sel) {
      const pair = step.pairs.find(p => p.a === L.sel);
      if (pair && pair.b === el.dataset.v) { L.matched[L.sel] = el.dataset.v; L.sel = null; L.missR = null; }
      else { L.misses++; L.missR = el.dataset.v; }
    }
    renderLesson();
  }

  /* ---------------- developer mode ---------------- */

  // …/TreasureUp-test/#dev, for Blake and the people he adds by name and
  // email, each signed in with Google. It shows each week's content as his
  // son will see it; each piece can be approved or changed, and a finished
  // week published to the live app. Changes are commits to content/weeks.js
  // through the GitHub API, using a token Blake connects once (kept in the
  // test Firebase project, readable only by the people on the list). Every
  // commit runs the content check before it deploys, and the live app
  // refuses anything not approved; what the checker finds comes back here.
  const DEV = { test: 'blakemerrell/TreasureUp-test', live: 'blakemerrell/TreasureUp', file: 'content/weeks.js', owner: 'blakemerrell@gmail.com' };
  const WEEKS_MARK = 'window.TU_WEEKS = ';
  // Plain words for chapters no week reads (content/plain.js; Blake,
  // 2026-10-02: "all of Isaiah"): one more entry in the list of weeks, with
  // only plain words in it, saved to its own file.
  const PLAIN_FILE = 'content/plain.js', PLAIN_MARK = 'window.TU_PLAIN = ', LIB = 'library';

      groups.filter(([, f]) => items.some(f))
        .map(([name, f]) => `<div class="dv-group"><div class="eyebrow">${name}</div>${name === 'Plain words' ? '<p class="dv-small">Each verse of the KJV with its plain words under it, and the BSB to compare. A chapter shows in the app once it’s approved.</p>' : name === 'The short version' ? '<p class="dv-small">The lines at the top of each chapter, each with the KJV verses it sums up under it. A chapter’s card shows in the app once it’s approved.</p>'

  }

  function devItemHtml(w, it) {

    return `<div class="dv-item" data-item="${esc(it.key)}">
      <div class="dv-head"><b>${esc(it.label)}</b>${chip}${unsaved}</div>

  // A piece as he'll see it, compactly, with the right answer marked.
  function devQHtml(q, sourced) {

    if (it.key === 'puzzle') return o.groups.map(g => `<p class="dv-small" style="margin-top:6px"><b>${esc(w.sections[g.section] || '')}</b>: ${g.tiles.map(t => esc(t.text) + ' (' + esc(t.ref) + ')').join(' · ')}</p>`).join('');
    if (it.key.startsWith('say:')) return `<div class="dv-hook">“${esc(o.text)}”</div><p class="dv-small">${esc(o.ref)}</p>
      <ul class="dv-choices"><li class="right">✓ ${esc(o.speaker)}</li>${(o.wrong || []).map(x => `<li>✕ ${esc(x)}</li>`).join('')}</ul><p class="dv-small">Why: ${esc(o.why)}</p>`;
    if (it.key === 'words') return o.map(x => `<p class="dv-small"><b>${esc(x.word)}</b> · ${esc(x.clue)} (${esc(x.ref)})</p>`).join('');
    if (it.key.startsWith('plain:')) {

    }

        <p class="dv-small">From ${esc(s.by)}: <a href="${esc(s.url)}" target="_blank" rel="noopener noreferrer" style="color:var(--gold)">${esc(s.title)} ↗</a> (the quote is found there word for word)</p>`;

    if (it.key.startsWith('insight:')) {
