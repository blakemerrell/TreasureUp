  /* ---------------- HUD ---------------- */

  function renderHud() {
    const L = levelFor(S.xp);
    const capped = L >= LEVEL_TITLES.length;
    const floor = xpAt(L);
    const ceil = capped ? floor : xpAt(L + 1);
    const pct = capped ? 100 : Math.max(0, Math.min(100, ((S.xp - floor) / (ceil - floor)) * 100));

    $('levelNum').textContent = L;
    $('levelTitle').textContent = LEVEL_TITLES[L - 1];
    $('xpText').textContent = fmtN(S.xp) + ' XP · 🎁 ' + fmtN(xpToSpend());
    $('xpFill').style.width = pct + '%';
    $('nextLevel').textContent = capped
      ? 'Top level reached'
      : fmtN(ceil - S.xp) + ' XP to level ' + (L + 1) + ' · ' + LEVEL_TITLES[L];
    const streak = streakNow(), charge = chargeOf(streak);
    $('streakNum').textContent = streak;
    $('chargeNum').hidden = charge <= 1;
    $('chargeNum').textContent = '⚡×' + charge;
    $('freezeNum').hidden = !(S.freezes > 0);
    $('freezeNum').textContent = '❄️' + (S.freezes || 0);
  }

  /* ---------------- XP ---------------- */

  // Every XP he earns, supercharged by the streak (chargeOf).
  function grantXp(amount, reason) {
    const charge = chargeOf(streakNow());
    amount = Math.round(amount * charge);
    const beforeXp = S.xp;
    const before = levelFor(S.xp);
    S.xp += amount;
    const after = levelFor(S.xp);
    const unlocked = P.rewards.filter(r => !r.claimed && beforeXp < r.xp && S.xp >= r.xp);
    // In a lesson the XP shows on the step, and a reward or a new level on
    // its last screen, since the lesson covers the toasts.
    if (lesson) unlocked.forEach(r => lesson.rewards.push(r.text));
    else {
      toast('＋' + amount + ' XP' + (charge > 1 ? ' ⚡×' + charge : ''), reason);
      unlocked.forEach(r => toast('🎁 Reward unlocked', r.text + ' · show a parent'));
    }
    renderHud();
    if (P.rewards.length) refreshHome();
    if (after > before) { if (lesson) lesson.level = after; else levelUp(after); }
  }

  // XP for a record (an answer, a note…), which keeps what it paid: with the
  // supercharge that varies, and the family's merge needs it (mergeProgress).
  function payXp(rec, amount, reason) { const before = S.xp; grantXp(amount, reason); rec.xp = S.xp - before; }

  let lvTimer = null;
  function levelUp(L) {
    $('lvNum').textContent = L;
    $('lvTitle').textContent = LEVEL_TITLES[L - 1];
    $('levelup').classList.add('show');
    clearTimeout(lvTimer);
    lvTimer = setTimeout(closeLevelUp, 5000);
  }
  function closeLevelUp() {
    clearTimeout(lvTimer);
    $('levelup').classList.remove('show');
  }

  function toast(big, small) {
    const wrap = $('toasts');
    while (wrap.children.length >= 2) wrap.firstChild.remove();
    const el = document.createElement('div');
    el.className = 'toast max-w-[86%] flex items-center gap-2.5 rounded-full bg-black/80 backdrop-blur-md px-4 py-2 ring-1 ring-amber-300/40';
    el.innerHTML = '<span class="text-[13px] font-black text-amber-300">' + esc(big) + '</span>' +
                   (small ? '<span class="text-[11px] font-semibold text-white/70 truncate">' + esc(small) + '</span>' : '');
    wrap.appendChild(el);
    setTimeout(() => el.remove(), 2400);
  }

  /* ---------------- answering ---------------- */

  // Recording an answer, from a step in a lesson or a reel looked back at:
  // the first try only. Each returns false if it was already answered.
  function recordReel(id, picked) {
    const r = reelById(id);
    if (!r || S.answers[id]) return false;
    const right = picked === r.question.right;
    S.answers[id] = { right, picked, day: dayKey() };
    markStudied();
    if (right) payXp(S.answers[id], XP.firstTry, 'Got it the first time');
    save();
    return true;
  }
  // A Sunday lesson's card: the first try only. Done on its Sunday, the
  // whole lesson keeps the day, as the reading does on other days.
  function recordSun(id, picked) {
    let f = null;
    for (const m of SUN().youth || []) for (const l of m.lessons || []) { const c = (l.cards || []).find(x => x.id === id); if (c) f = { l, c }; }
    const A = S.sunday || (S.sunday = {});
    if (!f || A[id]) return false;
    const right = picked === f.c.right;
    A[id] = { right, picked, day: dayKey() };
    if (right) payXp(A[id], XP.firstTry, 'Got it the first time');
    if (f.l.sunday === dayKey() && f.l.cards.every(c => A[c.id])) markStudied(true);
    save();
    return true;
  }
  // A reel's bonus `n`: the first try only, once the reel's own is answered.
  function recordBonus(id, n, picked) {
    const r = reelById(id), q = r && bonusesOf(r)[n], key = bonusKey(id, n);
    if (!q || !S.answers[id] || S.bonus[key]) return false;
    const right = picked === q.right;
    S.bonus[key] = { right, picked, day: dayKey() };
    markStudied();
    if (right) payXp(S.bonus[key], XP.bonus, 'Found it in the reading');
    save();
    return true;
  }
  function recordRecall(id, picked) {
    const r = reelById(id);
    if (!r || S.daily.done[id]) return false;
    const right = picked === r.question.right;
    S.daily.done[id] = { right, picked };
    const rc = S.recall[id] || { misses: 0 };
    S.recall[id] = { last: dayKey(), misses: right ? 0 : (rc.misses || 0) + 1 };
    markStudied();
    if (right) grantXp(XP.recall, 'Remembered it');
    save();
    return true;
  }

  function answer(quiz, picked) {
    const id = quiz.dataset.quiz;
    const kind = quiz.dataset.kind;
    if (kind === 'deep') return answerDeep(quiz, id, picked);
    const r = reelById(id);
    if (!r) return;
    if (kind === 'bonus') {
      if (!recordBonus(id, Number(quiz.dataset.n), picked)) return;
      redrawCard(id, reelHtml(r, 0));
    } else if (kind === 'reel') {
      if (!recordReel(id, picked)) return;
      redrawCard(id, reelHtml(r, 0));
    }
    renderHud();
    save();
  }

  /* ---------------- the week's reading ---------------- */

  // Reading first: every chapter of the week's reading block, a day or two's
  // worth each day Monday to Saturday, in order. Each day's lesson opens with
  // that day's chapters, read in the app or in Gospel Library, and its reels
  // are the ones about what he just read. The text is content/reading.js,
  // built at deploy from the scripture data the checker uses
  // (tools/build-reading.mjs); without it, each chapter opens in Gospel Library.
  const READING_DAYS = 6;             // Monday to Saturday; Sunday is church
  const READ_WPM = 120;               // for "about 7 min": a steady pace for an 11-year-old in the KJV
  // Reading a chapter pays the most XP of anything (Blake, 2026-09-30). A
  // clock starts the first time he opens it, and runs while he reads it in
  // Gospel Library; "I read it" sooner than twice that pace (about half the
  // "about N min") asks him first: "That was quick. Did you read all of it?"
  // A few verses get 20 seconds, a chapter without its text here 2 minutes.
  const READ_XP = 50, QUICK_WPM = 240, WEEK_READ_XP = 100;
  const readMinSecs = u => u.words ? Math.max(20, Math.round(u.words / QUICK_WPM * 60)) : 120;
  const readSecs = ref => { const x = S.readLog && S.readLog[ref]; return x && x.start ? (Date.now() - x.start) / 1000 : 0; };
  const countWords = t => (String(t).match(/\S+/g) || []).length;
  let readingCache = null;

  // "Isaiah 13–14; 22" -> Isaiah 13, Isaiah 14, Isaiah 22, each with its verses
  // (a part with verses, like "Genesis 5:21–24", is just those). A block it
  // can't read gives no reading, and the days follow the sections as before.
  // (A past week passes its own reading and text.)
  function readingUnits(reference = WEEK.reference, text = window.TU_READING || {}) {
    const units = [];
    let book = null;
    const unit = (book, c, from, to, part) => {
      const ch = book + ' ' + c, all = Array.isArray(text[ch]) ? text[ch] : null, whole = from == null;
      if (whole) { from = 1; to = all ? all.length : null; }
      const verses = all && to <= all.length ? all.slice(from - 1, to).map((t, k) => ({ n: from + k, t })) : null;
      units.push({ ref: whole ? ch : ch + ':' + from + (to !== from ? '–' + to : ''), ch, book, c, whole, from, to, verses,
                   words: verses ? verses.reduce((n, v) => n + countWords(v.t), 0) : 0 });
    };
    for (const raw of String(reference || '').split(';')) {
      const part = raw.trim();
      if (/^\d? ?[A-Za-z][^\d]*$/.test(part)) {      // a book on its own ("Hosea 1–6; Joel"): every chapter, from the text
        book = part;
        let c = 1;
        for (; Array.isArray(text[book + ' ' + c]); c++) unit(book, c);
        if (c === 1) return [];                        // without the text, its chapters aren't known
        continue;
      }
      const m = /^(?:(.*?[A-Za-z].*?) )?(\d+)(?::(\d+)(?:[–-](\d+))?)?(?:[–-](\d+))?$/.exec(part);
      if (m && m[1]) book = m[1];
      if (!m || !book) return [];
      const last = m[3] ? Number(m[2]) : Number(m[5] || m[2]);
      for (let c = Number(m[2]); c <= last; c++) m[3] ? unit(book, c, Number(m[3]), Number(m[4] || m[3])) : unit(book, c);
    }
    return units;
  }
  // The units split over Monday to Saturday in order, keeping the longest
  // day as short as it can be: its reading, plus the reels and Go-deeper
  // readings that come with it (about 150 words' worth of time each). By
  // chapters, without the text.
  const READ_ITEM_WORDS = 150;
  const readingPlan = () => planOf(WEEK, window.TU_READING);
  // Any week's plan, with its chapters' text (a past week's, for the streak).
  function planOf(week, text) {
    const key = text || null;
    if (readingCache && readingCache.week === week && readingCache.key === key) return readingCache.days;
    const cached = (planOf.weeks = planOf.weeks || new Map()).get(week);
    if (cached && cached.key === key) return cached.days;
    text = text || {};
    const units = readingUnits(week.reference, text), days = DAY_NAMES.map(() => []);
    const n = units.length, k = Math.min(READING_DAYS, n);
    if (n) {
      const extra = u => READ_ITEM_WORDS * (week.reels.filter(r => r.verse.ref.replace(/:.*/, '') === u.ch).length +
        (week.deep || []).filter(x => deepPassage(x) && deepPassage(x).replace(/:.*/, '') === u.ch).length);
      const w = units.map(u => units.every(x => x.words) ? u.words + extra(u) : 1), pre = [0];
      w.forEach(x => pre.push(pre[pre.length - 1] + x));
      // best[j][i]: the longest day when the first i units go in j days; cut[j][i]: where day j starts.
      const best = [[0].concat(Array(n).fill(Infinity))], cut = [[]];
      for (let j = 1; j <= k; j++) {
        best[j] = Array(n + 1).fill(Infinity); cut[j] = [];
        for (let i = j; i <= n; i++) for (let p = j - 1; p < i; p++) {
          const v = Math.max(best[j - 1][p], pre[i] - pre[p]);
          if (v < best[j][i]) { best[j][i] = v; cut[j][i] = p; }
        }
      }
      for (let j = k, i = n; j > 0; j--) { const p = cut[j][i]; days[j - 1] = units.slice(p, i); i = p; }
    }
    if (week === WEEK) readingCache = { week, key, days };
    else planOf.weeks.set(week, { key, days });
    return days;
  }
  const readingAll = () => readingPlan().flat();
  // Whether he has read a chapter of a week: this week's in S.read; an
  // earlier one's, saved when it ended or read since (S.late).
  function weekRead(week, ref) {
    if (week === WEEK) return !!S.read[ref];
    const num = weekNumOf(week), h = recordOf(num), rec = h && h.rec;
    if ((((S.late || {})[num] || {}).read || {})[ref]) return true;
    return !!(rec && (Array.isArray(rec.read) ? rec.read : Object.keys(rec.read || {})).includes(ref));
  }
  // Each day whose planned chapters are all read now counts (S.filled), for
  // every week in weeks.js up to this one, and a past week that's open.
  function fillDays() {
    const f = S.filled = S.filled || {}, today = dayKey();
    const weeks = (window.TU_WEEKS || []).map(w => [w, window.TU_READING]);
    if (past && past.week && !(window.TU_WEEKS || []).includes(past.week)) weeks.push([past.week, past.text]);
    for (const [w, text] of weeks) {
      const start = weekStart(w.dates);
      if (!start || start > today) continue;
      planOf(w, text).forEach((units, d) => {
        const k = dayAdd(start, d);
        if (units.length && !f[k] && units.every(u => weekRead(w, u.ref))) f[k] = 1;
      });
    }
  }
  // The day a verse's chapter is read, or -1.
  function readingDayOf(ref) {
    const m = /^(.+? \d+)(?::(\d+))?/.exec(ref || ''), plan = readingPlan();
    if (!m) return -1;
    const v = m[2] ? Number(m[2]) : null;
    for (let d = 0; d < READING_DAYS; d++) {
      if (plan[d].some(u => u.ch === m[1] && (v == null || u.whole || (v >= u.from && v <= u.to)))) return d;
    }
    return -1;
  }
  const lastReadingDay = () => { const p = readingPlan(); for (let d = READING_DAYS - 1; d >= 0; d--) if (p[d].length) return d; return 0; };

  // What he reads in a chapter: any mix of the KJV, the plain words, the
  // Berean Standard Bible and the notes, each a button at the top of the
  // chapter, remembered on this device; one of the three texts is always on.
  // The KJV is the scripture. The plain words (week.plain) are translated
  // from the Hebrew, with a note where the translations, the Book of Mormon,
  // the Joseph Smith Translation or the New Testament read a verse
  // differently: a chapter's plain words and notes show once Blake has
  // approved them in developer mode, and the test site shows drafts too,
  // marked, so he can read them there. The BSB is the published translation
  // word for word (content/bsb.js, built at deploy), loaded when first on.
  // ES·TL (Blake, 2026-10-03: "Using the Spanish and Tagalog bible sounds
  // great where we can!") is the Spanish Reina-Valera 1909 or the Tagalog
  // 1905 Ang Biblia, both public domain, each verse under the KJV verse it
  // translates (tools/import-bibles.mjs): a tap turns on the Spanish, the
  // next the Tagalog, the next neither. Built and loaded like the BSB.
  const LAYERS_KEY = NS + 'layers';
  const TEST_SITE = /\/TreasureUp-test\//.test(location.pathname);
  // On the test site, every screen says so: an orange frame with a tab, and
  // the page's title (all a browser opened from a link shows). Blake once
  // took it for the live app and thought his progress was gone (2026-10-01).
  if (TEST_SITE) {
    document.title = 'Treasure Up · TEST SITE';
    const frame = document.createElement('div');
    frame.className = 'test-frame';
    frame.innerHTML = '<span>Test site</span>';
    document.body.appendChild(frame);
  }
  const testNoteHtml = () => `<div class="test-note">🧪 <b>Test site.</b> Its progress and family are kept apart from the live app's.
    <a href="${esc(location.origin + '/TreasureUp/')}">Open the live app ›</a></div>`;
  const LAYERS = [['kjv', 'KJV'], ['plain', 'Plain'], ['bsb', 'BSB'], ['lang', 'ES·TL'], ['notes', 'Notes'], ['orig', 'Hebrew']];
  const LAYER_NAMES = { kjv: 'King James Version', plain: 'Plain words', bsb: 'Berean Standard Bible', notes: 'Notes' };
  const LANGS = { es: { label: 'ES', name: 'Spanish', full: 'Reina-Valera 1909', next: 'tl' }, tl: { label: 'TL', name: 'Tagalog', full: 'Ang Biblia 1905', next: '' } };
  const layers = (() => {
    try {
      const saved = JSON.parse(localStorage.getItem(LAYERS_KEY));
      if (saved && typeof saved === 'object') return { kjv: !!saved.kjv, plain: !!saved.plain, bsb: !!saved.bsb, lang: LANGS[saved.lang] ? saved.lang : '', notes: !!saved.notes, orig: !!saved.orig };
      const plain = localStorage.getItem(NS + 'plain') === '1';          // the one switch these replaced
      return { kjv: true, plain, bsb: false, lang: '', notes: plain, orig: false };
    } catch (e) { return { kjv: true, plain: false, bsb: false, lang: '', notes: false, orig: false }; }
  })();
  function plainOf(week, ch) {
    const p = ((week && week.plain) || []).find(x => x.ch === ch);
    if (!p || !Array.isArray(p.verses)) return null;
    const approved = !!p.approved && p.approved === approvalHash(noApproval(p));

  // Saturday's puzzle, and Sunday for church and a family game. Nothing is

  const DAY_NAMES = ['Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday', 'Sunday'];

  // day's lesson is done, never part of Today's.
  function weekPlan() {
    const days = DAY_NAMES.map(() => []), plan = readingPlan();
    for (let d = 0; d < 6; d++) if (plan[d].length || dayReels(d).length || dayDeep(d).length) days[d].push({ kind: 'day', d });
    for (let d = 0; d < 6; d++) if (furtherItems(d).length) days[d].push({ kind: 'further', d });

    if (WEEK.puzzle) days[5].push({ kind: 'puzzle' });

  // The cards one part of the plan asks for, and whether each is done.
  function entryItems(e) {
    if (e.kind === 'day') {

        .concat(dayReels(e.d).map(r => ({ card: r.id, done: !!S.answers[r.id] })))
        .concat(dayDeep(e.d).map(d => ({ card: 'deep-' + d.id, done: !!S.deep[d.id] })));

    if (e.kind === 'friday') return fridayItems().map(d => ({ card: 'deep-' + d.id, done: !!S.deep[d.id] }));
    if (e.kind === 'puzzle') return [{ card: 'puzzle', done: !!S.puzzle && S.puzzle.week === WEEK.title && S.puzzle.status === 'won' }];

  // "hidden in the same row of a green check mark"): its insight cards, its

  // on one of its reels.
  function furtherItems(d) {

  /* ---------------- clips ---------------- */

  // YouTube's player script loads on the first tap, never before.
  let ytReady = null;
  function loadYouTube() {
    if (!ytReady) ytReady = new Promise((resolve, reject) => {
      if (window.YT && window.YT.Player) return resolve();
      const prev = window.onYouTubeIframeAPIReady;
      window.onYouTubeIframeAPIReady = () => { if (prev) prev(); resolve(); };
      const s = document.createElement('script');
      s.src = 'https://www.youtube.com/iframe_api';

    });

  }

  // loads before then. The player plays just start..end inside the
  // reel, and the moment the clip ends it is replaced by a "Watched" card,
  // so YouTube's grid of suggested videos never appears.
  async function playClip(el) {
    const v = { id: el.dataset.clip, start: Number(el.dataset.start), end: Number(el.dataset.end) };
    const card = el.cloneNode(true);              // put back when the clip ends
    const frame = document.createElement('div');
    frame.className = 'clip-frame';
    const mount = document.createElement('div');
    frame.appendChild(mount);
    el.replaceWith(frame);

    try { await loadYouTube(); }
    catch (e) { frame.replaceWith(card); toast('No internet', 'Videos need a connection'); return; }

    let done = false, timer = null, player = null;
    const finish = () => {
      if (done) return;
      done = true;
      player._stop();
      card.classList.add('watched');
      card.querySelector('.clip-play').textContent = '✓';
      card.querySelector('.clip-meta').textContent = 'Watched · tap to watch again';
      frame.replaceWith(card);
    };

    player = new YT.Player(mount, {
      host: 'https://www.youtube-nocookie.com',
      width: '100%', height: '100%',
      videoId: v.id,
      playerVars: { start: v.start, end: v.end, autoplay: 1, rel: 0, playsinline: 1, iv_load_policy: 3 },
      events: { onStateChange: e => { if (e.data === YT.PlayerState.ENDED) finish(); } }
    });
    frame._player = player;
    player._stop = () => { clearInterval(timer); players.delete(player); try { player.destroy(); } catch (e) {} };

      try { if (player.getCurrentTime && player.getCurrentTime() >= v.end - 0.25) finish(); } catch (e) {}
    }, 400);
  }

  // Every Listen row, and the small Pause button that stays on screen. As it

  function drawListen(e) {

  // The Season's days as a grid, a column a week, Monday on top; a tap ticks or unticks a day up to today.

  function savePlan() {

    if (!g.id) { g.id = seaId('g'); g.made = dayKey(); g.status = 'on'; rec.goals.push(g); }
    else { const i = rec.goals.findIndex(x => x.id === g.id); if (i >= 0) rec.goals[i] = Object.assign({}, rec.goals[i], g); else rec.goals.push(g); }

  // The Season's clicks, on Today, the Family tab and the sheet.

  // Seasons over 4 months gone keep each step's tick count, not every day's
  // tick: the family's copy of his progress has to stay small.
  function compactSeasons() {
    const cut = dayAdd(dayKey(), -120);
    for (const [id, rec] of Object.entries(S.seasons || {})) {
      const q = /^(\d{4})-Q(\d)$/.exec(id);
      if (!rec || !rec.ticks || !q) continue;
      if (seasonAt(q[1] + '-' + String((q[2] - 1) * 3 + 1).padStart(2, '0') + '-15').end >= cut) continue;
      rec.tickN = {};
      for (const st in rec.ticks) rec.tickN[st] = Object.values(rec.ticks[st]).filter(v => v > 0).length;

  // Scripture Showdown: a quiz-show board built from this week's checked questions.
  // Columns are the lesson's sections; the reel questions are the low
  // values and the reading-only bonus questions the high ones, with one
  // bonus as a Daily Double. A parent hosts: reads each question out loud,
  // shows the answer, and taps who got it. Scores add up to a family total.
  const BOARD_KEY = NS + 'board';
  let G = null;           // { names, best, games: { [week title]: { players, done } } }
  let boardView = null;   // the open question: { tile, revealed }

  function loadBoard() {
    try {
      const raw = localStorage.getItem(BOARD_KEY);
      if (raw) return Object.assign({ names: [], best: 0, games: {} }, JSON.parse(raw));
    } catch (e) {}
    return { names: [], best: 0, games: {} };
  }
  function saveBoard() {
    try { localStorage.setItem(BOARD_KEY, JSON.stringify(G)); } catch (e) {}
  }

  function boardTiles() {
    const seed = (game() && game().seed) || '';
    const cols = WEEK.sections.map((name, s) => {
      const reels = WEEK.reels.filter(r => r.section === s);
      let low = reels.map(r => ({ id: r.id + ':q', q: r.question }));
      let high = reels.flatMap(r => bonusesOf(r).map((b, n) => ({ id: r.id + ':b' + n, q: b, bonus: true })));
      // "Play again": the tiles in a new order, reel questions still the low values.
      if (seed) { low = shuffled(low, seed + '|' + s); high = shuffled(high, seed + '|' + s + '|b'); }
      const clues = low.concat(high);
      clues.forEach((c, k) => { c.value = 100 * (k + 1); c.col = s; });
      return { name, clues };
    });
    const all = cols.flatMap(c => c.clues);
    const bonuses = all.filter(c => c.bonus);
    const dd = bonuses.length ? bonuses[hash(WEEK.title + seed) % bonuses.length].id : null;
    return { cols, all, dd };
  }

  const boardBest = () => (G.bests || {})[WEEK.title] || 0;

  const byList = d => d.by == null ? [] : Array.isArray(d.by) ? d.by : [d.by];

  const game = () => G.games[WEEK.title];
  const worthOf = (t, dd) => t.id === dd ? t.value * 2 : t.value;

      body.innerHTML = `
