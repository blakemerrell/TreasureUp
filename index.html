      </div>`);
  }

  async function joinLive() {
    const code = $('liveCode').value.trim(), name = $('liveName').value.trim();
    if (!/^\d{4}$/.test(code)) return joinForm(code, 'The code is 4 numbers.');
    if (!name) return joinForm(code, 'Type your name.');
    try { localStorage.setItem(NS + 'live.name', name); } catch (e) {}
    const L = liveConn();
    try { await L.init(); } catch (e) { return joinForm(code, e.message); }
    const err = await L.join(code, name);
    if (err) return joinForm(code, err);
    lv = { role: 'player', code, name, game: null, players: [], picked: {}, unsub: [] };
    lv.unsub.push(L.watchGame(code, g => {
      if (!lv) return;
      if (g && lv.gid !== g.gid) { lv.gid = g.gid; lv.picked = {}; }   // "Play again": a new game
      lv.game = g;
      renderPlayer();
    }));
    lv.unsub.push(L.watchPlayers(code, ps => { if (!lv) return; lv.players = ps; renderPlayer(); }));
  }

  async function playerAnswer(choice) {
    const g = lv && lv.game;
    if (!g || g.state !== 'question' || lv.picked[g.qi] != null) return;
    lv.picked[g.qi] = choice;
    markStudied();               // playing the family game counts for the day (Blake, 2026-10-01), like any answer
    save();
    renderPlayer();
    await liveConn().answer(lv.code, g.qi, choice);
  }

  function renderPlayer() {
    if (!lv || lv.role !== 'player') return;
    const g = lv.game, L = liveConn();
    if (!g) { liveBody('<div class="live-big">The game has ended.</div><p class="live-sub">Thanks for playing!</p>'); return; }
    if (g.week !== WEEK.title) { liveBody('<div class="live-big">This game is for a different week.</div><p class="live-sub">Refresh Treasure Up and join again.</p>'); return; }
    const players = ranked(lv.players);
    const me = players.find(p => p.uid === L.uid()) || { score: 0 };
    const mine = players.find(p => p.uid === L.uid()), place = mine ? placeOf(players, mine) : 0;
    const tied = mine && players.some(p => p !== mine && (p.score || 0) === (mine.score || 0));
    const ord = n => n === 1 ? '1st' : n === 2 ? '2nd' : n === 3 ? '3rd' : n + 'th';
    const standing = `<p class="live-sub">${fmt(me.score)} points${place ? ' · ' + (tied ? 'tied for ' : '') + ord(place) + ' place' : ''}</p>`;
    if (g.state === 'lobby') { liveBody(`<div class="live-big">You're in, ${esc(lv.name)}!</div><p class="live-sub">Watch the TV. The game starts soon.</p>`); return; }
    if (g.state === 'question') {
      const id = g.qs[g.qi], q = liveQuestion(id);
      if (lv.picked[g.qi] != null) { liveBody(`<div class="live-big">Locked in!</div><p class="live-sub">Waiting for the others…</p>`); return; }
      liveBody(`
        <div class="clue">
          <div class="eyebrow">Question ${g.qi + 1} of ${g.qs.length}</div>
          <p class="quiz-q" style="font-size:18px">${esc(q.q)}</p>
          <div class="live-choices">${liveChoices(id).map((c, n) =>
            `<button class="live-choice" style="background:${LIVE_COLORS[n]}" data-lpick="${esc(c)}"><span class="lt">${'ABC'[n]}</span><span>${esc(c)}</span></button>`).join('')}</div>
        </div>`);
      return;
    }
    if (g.state === 'reveal') {
      const right = me.lastRight, answered = me.lastAnswered, id = g.qs[g.qi], q = liveQuestion(id);
      liveBody(`<div class="live-big" style="margin-top:8vh">${right ? 'Right! +' + fmt(me.last) : answered ? 'Not this time' : 'No answer this time'}</div>${standing}
        <div class="clue" style="margin-top:18px"><p class="quiz-why"><b class="ok">Answer:</b> ${esc(q.right)}. ${linkRefs(q.why, homeOfId(id))}</p></div>`);
      return;
    }
    if (g.state === 'final') {
      const total = players.reduce((n, p) => n + (p.score || 0), 0);
      liveBody(`<div class="live-big">${place === 1 ? (tied ? '🥇 You tied for 1st!' : '🥇 You won!') : (tied ? 'You tied for ' : 'You finished ') + ord(place)}</div>
        <p class="live-sub">${fmt(me.score)} points · Together: ${fmt(total)}</p>`);
    }
  }

  /* ---------------- Babylon Falls: the family map game ---------------- */

  // Risk-style, for 2 to 4 players. The map (content/boards.js) is on a
  // computer or TV; everyone plays on their own phone or tablet. The
  // computer runs the game: it holds the whole state, and each phone sends
  // moves, which the computer checks before applying, so a phone can't make
  // a move that isn't allowed. Armies come from the week's checked
  // questions: an easy one (a reel's own question, this week's or an
  // earlier week's) for 3, a hard one (find it in the reading) for 5, a
  // miss for 1, plus 1 for every 3 lands held; a hard one found also earns
  // a 💡 insight (the odds and best moves for one turn). Battles are dice
  // as in Risk; Babylon's gates open in round 2, and a wall stands on the
  // sides that face its near neighbours (board.wallSides): an attack from
  // one of them knocks down the wall's bricks before it can reach the
  // guards. Everything is done by tapping the
  // map, and one narrator card says what happened and what's next. Each
  // round opens with a roll of the dice for the turn order. Take Babylon
  // and hold it until every other kingdom has had a turn to take it back,
  // and you win; if nobody does, after the last round the most points win
  // (a land 1, Babylonia 3). Nothing here changes anyone's XP.
  const RISK = { easy: 3, hard: 5, miss: 1, perLands: 3, start: 4, neutral: 2, wallsNeutral: 3, bricks: 3, hand: 3, returnArmies: 4, waitEvery: { story: 60, pro: 45 }, waitCap: { story: 2, pro: 3 }, waitRound: 2, speedAt: 30, speedTime: 20, speedPrize: 1, nudge: { story: 180, pro: 120 }, insightMax: 3, fort: { easy: 1, hard: 2 }, rounds: [5, 8, 12], time: { easy: 30, hard: 90 }, defend: 10, blitzStop: 3 };
  const BOARD = () => (window.TU_BOARDS || [])[0] || null;

  function RiskLocal() {
    // Between tabs of one browser, like the live game's test mode: each
    // record is its own localStorage key (risk.<code>.game, .p.<uid>,
    // .m.<time>-<n>-<uid>), and a BroadcastChannel says when one changed.
    const PRE = NS + 'risk.';
    const subs = new Set();
    const bc = 'BroadcastChannel' in window ? new BroadcastChannel('treasureup-risk') : null;
    let uid = null, seq = 0;
    try { uid = sessionStorage.getItem(PRE + 'uid'); } catch (e) {}
    if (!uid) { uid = 'u' + Math.random().toString(36).slice(2, 10); try { sessionStorage.setItem(PRE + 'uid', uid); } catch (e) {} }
    const get = k => { try { return JSON.parse(localStorage.getItem(PRE + k)); } catch (e) { return null; } };
    const keys = pre => { const out = []; try { for (let i = 0; i < localStorage.length; i++) { const k = localStorage.key(i); if (k && k.startsWith(PRE + pre)) out.push(k.slice(PRE.length)); } } catch (e) {} return out; };
    const notify = c => { subs.forEach(f => f(c)); if (bc) bc.postMessage(c); };
    const put = (c, k, v) => { try { v == null ? localStorage.removeItem(PRE + k) : localStorage.setItem(PRE + k, JSON.stringify(v)); } catch (e) {} notify(c); };
    if (bc) bc.onmessage = e => subs.forEach(f => f(e.data));
    // The message can arrive before another tab's write has reached this
    // one; the storage event comes once it has, so read again then.
    window.addEventListener('storage', e => { if (e.key && e.key.startsWith(PRE)) { const c = e.key.slice(PRE.length).split('.')[0]; subs.forEach(f => f(c)); } });
    const watch = (c, read, cb) => { const f = x => { if (x === c) cb(read()); }; subs.add(f); cb(read()); return () => subs.delete(f); };
    return {
      kind: 'local',
      uid: () => uid,
      init: async () => uid,
      async create(c, game) {
        if (get(c + '.game')) return false;
        put(c, c + '.game', Object.assign({}, game, { host: uid }));
        return true;
      },
      watchGame: (c, cb) => watch(c, () => get(c + '.game'), cb),
      async save(c, fields) { const g = get(c + '.game'); if (g) put(c, c + '.game', Object.assign(g, fields)); },
      watchPlayers: (c, cb) => watch(c, () => keys(c + '.p.').map(k => Object.assign({ uid: k.split('.p.')[1] }, get(k))), cb),
      async join(c, name) {
        if (!get(c + '.game')) return 'No game with that code.';
        put(c, c + '.p.' + uid, { name });
        return null;
      },
      async move(c, m) { put(c, c + '.m.' + Date.now() + '-' + String(seq++).padStart(4, '0') + '-' + uid, Object.assign({}, m, { uid })); },
      watchMoves: (c, cb) => watch(c, () => keys(c + '.m.').sort().map(k => Object.assign({ id: k }, get(k))).filter(m => m.kind), cb),
      async dropMove(c, id) { put(c, id, null); },
      async end(c) { keys(c + '.').forEach(k => { try { localStorage.removeItem(PRE + k); } catch (e) {} }); notify(c); }
    };
  }

  function RiskFirebase() {
    // /risk/{code}: the game, written only by the computer that hosts it;
    // /players/{uid}: each phone's name; /moves: each phone's moves, which
    // only the host reads, applies and deletes (firestore.rules).
    let db, FV;
    const me = () => firebase.auth().currentUser;
    const ref = c => db.collection('risk').doc(c);
    return {
      kind: 'firebase',
      uid: () => (window.firebase && firebase.apps.length && me() ? me().uid : null),
      async init() {
        const u = await fbUser();
        db = firebase.firestore();
        FV = firebase.firestore.FieldValue;
        return u.uid;
      },
      async create(c, game) {
        try {
          await db.runTransaction(async t => {
            if ((await t.get(ref(c))).exists) throw new Error('taken');
            t.set(ref(c), Object.assign({}, game, { host: me().uid, created: FV.serverTimestamp() }));
          });
          return true;
        } catch (e) { if (e.message === 'taken') return false; throw e; }
      },
      watchGame: (c, cb) => ref(c).onSnapshot(s => cb(s.exists ? s.data() : null), () => cb(null)),
      async save(c, fields) { await ref(c).update(fields); },
      watchPlayers: (c, cb) => ref(c).collection('players').onSnapshot(q => cb(q.docs.map(d => Object.assign({ uid: d.id }, d.data()))), () => cb([])),
      async join(c, name) {

        : role === 'solo' ? '<div class="rk-btns two"><button class="btn" data-rk="soloagain">Play again</button><button class="btn ghost" data-rk="solodone">Done</button></div>' : ''}`;
  }

  // ----- host: the computer with the map -----

  async function riskHost() {
    stopRisk();
    openRisk();
    riskBody('<p class="board-help">Setting up the map…</p>');
    const C = riskConn();
    try { await C.init(); } catch (e) { riskBody(`<div class="clue"><p class="clue-q">Can't start the game</p><p class="board-help">${esc(e.message)}</p></div>`); return; }
    // A reload picks the same game back up.
    let code = null, resumed = null;
    try { code = sessionStorage.getItem(NS + 'risk.host'); } catch (e) {}
    if (code) {
      resumed = await new Promise(ok => { const off = C.watchGame(code, g => { ok(g); setTimeout(() => off && off(), 0); }); });
      if (!resumed || resumed.host !== C.uid()) { code = null; resumed = null; }
    }
    try {
      for (let i = 0; i < 20 && !code; i++) {
        const c = String(1000 + Math.floor(Math.random() * 9000));
        if (await C.create(c, { board: BOARD().id, week: WEEK.title, state: 'lobby', rounds: RISK.rounds[0], timer: true, insightOn: true, seats: [] })) code = c;
      }
    } catch (e) {
      riskBody(`<div class="clue"><p class="clue-q">Can't start the game</p><p class="board-help">${esc(e.message)}</p></div>`);
      return;
    }
    if (!code) { riskBody('<div class="clue"><p class="clue-q">Couldn&rsquo;t get a game code. Try again.</p></div>'); return; }
    try { sessionStorage.setItem(NS + 'risk.host', code); } catch (e) {}
    rk = { role: 'host', code, g: null, players: [], done: new Set(), unsub: [] };
    rk.tick = setInterval(riskTick, 500);
    rk.unsub.push(C.watchGame(code, g => {
      if (!rk) return;
      if (!g) { rk.g = null; return renderRiskHost(); }
      if (!rk.g) rk.g = g;                     // after that, this screen's copy is the one that counts
      renderRiskHost();
    }));
    rk.unsub.push(C.watchPlayers(code, ps => { if (!rk) return; rk.players = ps; riskMoves(rk.moves || []); renderRiskHost(); }));
    rk.unsub.push(C.watchMoves(code, ms => { if (!rk) return; rk.moves = ms; riskMoves(ms); }));
  }

  async function riskSave() {
    const g = rk && rk.g;
    if (!g) return;
    if (g.state === 'play') riskWaitSetup(g);
    const fields = {};
    ['state', 'gid', 'rounds', 'timer', 'insightOn', 'round', 'seats', 'lands', 'bricks', 'deck', 'hands', 'discard', 'played', 'speed', 'boost', 'insight', 'wait', 'fort', 'used', 'turn', 'dice', 'battle', 'told', 'log', 'final', 'say', 'says', 'story', 'order', 'babHeld'].forEach(k => { if (g[k] !== undefined) fields[k] = g[k]; });
    try { await riskConn().save(rk.code, JSON.parse(JSON.stringify(fields))); }
    catch (e) { toast("Couldn't reach the game", 'Check the internet'); }
  }

  function riskMoves(ms) {
    if (!rk || rk.role !== 'host' || !rk.g) return;
    let changed = false;
    for (const m of ms) {
      if (rk.done.has(m.id)) continue;
      if (riskApply(rk.g, m) === 'wait') continue;
      rk.done.add(m.id);
      changed = true;
      riskConn().dropMove(rk.code, m.id).catch(() => {});
    }
    if (changed) { riskSave(); renderRiskHost(); }
  }

  function riskHostAction(act, el) {
    const g = rk && rk.g;
    if (!g) return;
    if (act === 'rounds' && g.state === 'lobby') g.rounds = Number(el.dataset.n) || RISK.rounds[1];
    else if (act === 'timer' && g.state === 'lobby') g.timer = el.dataset.v !== 'off';
    else if (act === 'insight' && g.state === 'lobby') g.insightOn = el.dataset.v !== 'off';
    else if (act === 'begin' && g.state === 'play' && g.story) riskStoryDone(g);
    else if (act === 'start' && g.state === 'lobby' && g.seats.length >= 2) riskBegin(g);
    else if (act === 'fairdeal' && g.state === 'lobby' && g.seats.length === 2) {   // 🎲 the two players' kingdoms, from a fair pair
      const pair = riskFairDealt();
      g.seats = g.seats.map((x, i) => Object.assign({}, x, { k: pair[i] }));
      riskLog(g, '🎲 ' + g.seats.map(x => x.name + ': ' + kingdomOf(x.k).name).join(', '));
    }
    else if (act === 'skip' && g.state === 'play' && !g.story && !riskOrderOpen(g)) riskOrderAll(g);   // (a phone gone quiet mid-roll)
    else if (act === 'skip' && g.state === 'play' && !g.story) { riskLog(g, g.seats[g.turn.i].name + "'s turn was skipped."); riskNextTurn(g); }
    else if (act === 'finish' && g.state === 'play') riskOver(g);
    else if (act === 'again' && g.state === 'over') {
      Object.assign(g, { state: 'lobby', seats: g.seats.map(s => Object.assign({ uid: s.uid, name: s.name, k: s.k }, s.mode ? { mode: s.mode } : {})), turn: null, dice: null, final: null, log: [] });   // Story or Pro carries over
    } else return;
    rk.view = null;
    riskSave();
    renderRiskHost();
  }

  function renderRiskHost() {
    if (!rk || rk.role !== 'host') return;
    const g = rk.g;
    if (!g) { riskBody('<div class="live-big">The game has ended.</div>'); return; }
    riskSeeGame(g);
    riskNoteRoll(g);
    if (g.state === 'lobby') {
      const B = BOARD(), taken = {};
      g.seats.forEach(s => { taken[s.k] = s; });
      const waiting = rk.players.filter(p => !seatOf(g, p.uid));
      // Start comes right after the players, where a TV shows it without
      // scrolling; the choices after it keep their last settings.
      riskBody(`
        <div class="rk-screen tv">
          <div class="rk-mapbox">${riskMap({ lands: null, seats: g.seats })}</div>
          <div class="rk-card">
            <div class="eyebrow">Join code</div>
            <div class="rk-join"><div class="live-code" style="font-size:clamp(48px,6vw,96px)">${esc(rk.code)}</div>
              <div id="rkQr" class="rk-qr" role="img" aria-label="QR code: scan with a phone's camera to join"${rk.qr ? ` data-url="${esc(rk.qr.url)}"` : ''}>${rk.qr ? rk.qr.svg : ''}</div></div>
            <p class="board-help">Scan the square with a phone's camera to join. Or open Treasure Up, tap 🎮, choose <b>Babylon Falls</b>, then <b>Join with a code</b>. Then pick a kingdom.</p>
            <div class="rk-kingdoms">${B.kingdoms.map(k => `<div class="rk-king${taken[k.id] ? ' chosen' : ' open'}"${taken[k.id] ? ` style="border-color:${k.color}"` : ''}><span class="rk-dot" style="background:${k.color}"></span>${esc(k.name)}<small>${taken[k.id] ? esc(taken[k.id].name) : 'open'}</small></div>`).join('')}</div>
            ${waiting.length ? `<p class="board-help">Joined, still choosing: ${waiting.map(p => esc(p.name)).join(', ')}</p>` : ''}
            <div class="board-actions"><button class="btn" data-rkh="start"${g.seats.length >= 2 ? '' : ' disabled style="opacity:.4"'}>Start · ${g.seats.length} ${g.seats.length === 1 ? 'kingdom' : 'kingdoms'}</button></div>
            ${g.seats.length === 2 ? riskFairHtml(g.seats.map(s => s.k), 'data-rkh="fairdeal"') : ''}
            <div class="eyebrow" style="margin-top:14px">How long</div>
            <div class="rk-len">${RISK.rounds.map((n, i) => `<button class="btn ${g.rounds === n ? '' : 'ghost'}" data-rkh="rounds" data-n="${n}">${['Short', 'Standard', 'Long'][i]} · ${n} rounds</button>`).join('')}</div>
            <div class="eyebrow" style="margin-top:14px">Timer (⚡ Pro only)</div>
            <div class="rk-len"><button class="btn ${g.timer !== false ? '' : 'ghost'}" data-rkh="timer" data-v="on">On: ${RISK.time.easy} s, hunts ${RISK.time.hard / 60} min</button><button class="btn ${g.timer === false ? '' : 'ghost'}" data-rkh="timer" data-v="off">Relaxed: no timer</button></div>
            <div class="eyebrow" style="margin-top:14px">💡 Insight</div>
            <div class="rk-len"><button class="btn ${g.insightOn !== false ? '' : 'ghost'}" data-rkh="insight" data-v="on">On: a right hunt earns the odds for a turn</button><button class="btn ${g.insightOn === false ? '' : 'ghost'}" data-rkh="insight" data-v="off">Off</button></div>
            <p class="board-help" style="font-size:13px">${linkRefs(B.intro)}</p>
            ${riskModeNote()}
          </div>
        </div>`);
      if (!rk.qr) riskQr(rk.code);
      return;
    }
    const card = g.state === 'over' ? riskOverCard(g, null) : g.story ? riskStartCard()
      : !riskOrderOpen(g) ? riskSayHtml(g) + '<p class="rk-big rk-read">🎲 Who goes first this round? Tap Roll on your phone.</p>'
      : riskSayHtml(g) + riskCrownHtml(g) + riskWatchHtml(g);
    riskScreen(g, card, g.battle ? { from: g.battle.from, to: g.battle.to } : g.dice ? { from: g.dice.from, to: g.dice.to } : {}, g.state === 'over' ? riskWinHtml(g) : riskChapterHtml(g));
    riskSceneSync(g);
    riskNarrate(g);
    riskMaybeFort(g);
    riskMoment(g);
  }

  // ----- player: a phone or tablet -----

  function riskJoinForm(code, err) {
    stopRisk();
    openRisk();
    let name = '';
    try { name = localStorage.getItem(NS + 'live.name') || ''; } catch (e) {}
    if (!name && F) name = F.name.slice(0, 16);
    riskBody(`
      <div class="clue" style="max-width:420px">
        <p class="clue-q">Join Babylon Falls</p>
        <label class="block text-[12px] text-white/60" for="riskCode">Code on the map screen</label>
        <input id="riskCode" class="field" inputmode="numeric" maxlength="4" autocomplete="off" value="${esc(code || '')}" style="font-size:28px;letter-spacing:.2em;text-align:center">
        <label class="block mt-3 text-[12px] text-white/60" for="riskName">Your name</label>
        <input id="riskName" class="field" maxlength="16" autocomplete="off" value="${esc(name)}">
        ${err ? `<p class="parent-msg">${esc(err)}</p>` : ''}
        <div class="board-actions"><button class="btn" data-rk="joinnow">Join</button></div>
        ${riskModeNote()}
      </div>`);
  }

  async function riskJoin() {
    const code = $('riskCode').value.trim(), name = $('riskName').value.trim();
    if (!/^\d{4}$/.test(code)) return riskJoinForm(code, 'The code is 4 numbers.');
    if (!name) return riskJoinForm(code, 'Type your name.');
    try { localStorage.setItem(NS + 'live.name', name); } catch (e) {}
    const C = riskConn();
    try { await C.init(); } catch (e) { return riskJoinForm(code, e.message); }
    let err = null;
    try { err = await C.join(code, name); } catch (e) { err = e.message; }
    if (err) return riskJoinForm(code, err);
    rk = { role: 'player', code, name, g: null, sel: {}, unsub: [] };
    rk.tick = setInterval(riskTick, 500);
    riskWake();
    const myTurn = x => !!(x && x.state === 'play' && !x.story && x.turn && x.seats[x.turn.i] && x.seats[x.turn.i].uid === C.uid() && riskOrderOpen(x));
    const at = x => x && x.turn ? x.turn.i + '|' + x.turn.phase : '';
    const turnOf = x => x && x.turn ? x.round + '|' + x.turn.i : '';    // (the dice can give him the next round's first turn right after his last)
    rk.unsub.push(C.watchGame(code, g => {
      if (!rk) return;
      const before = rk.g, begins = myTurn(g) && (!myTurn(before) || turnOf(before) !== turnOf(g));
      rk.g = g;
      const sig = JSON.stringify(g);
      if (sig !== rk.gSig) { rk.gSig = sig; rk.busy = 0; }               // the map screen has answered (the game changed): taps go again
      // A new turn or phase clears what was picked on the map; his own turn
      // (or the game starting or ending) closes the ⋯ menu so he sees it.
      if (at(before) !== at(g)) { rk.sel = {}; rk.cardSee = rk.cardPick = null; }
      if (begins || (before && g && (before.state !== g.state || before.story !== g.story))) rk.view = null;
      renderRiskPlayer();
      if (begins) riskTurnAlert(g, C.uid());                               // his turn: a chime and a flash
      else if (myTurn(g) && g.turn.nudged && rk.nudged !== riskTurnKey(g)) { rk.nudged = riskTurnKey(g); riskTurnAlert(g, C.uid()); }   // ⏳ finish up
    }));
  }

  const riskMe = () => rk && rk.role === 'solo' ? (rk.g.turn ? rk.g.seats[rk.g.turn.i].uid : null) : riskConn().uid();
  const riskRender = () => rk && (rk.role === 'solo' ? renderRiskSolo() : rk.role === 'player' ? renderRiskPlayer() : renderRiskHost());
  // Taps that move the game on are held (a) on a phone, until its last move
  // has come back from the map screen (or RISK_BUSY ms, if it was refused),
  // so tapping again while the screen lags doesn't send more; (b) for
  // RISK_ARM ms after new buttons appear, so taps meant for the last screen
  // don't land on the next one; and (c) within RISK_QUICK ms of the last
  // one, so a run of quick taps counts as one (dice go a tap each, though,
  // and Pro's +1s on the map). Undo, Cancel, 🔊 and the like are never held.
  const RISK_BUSY = 2500, RISK_ARM = 600, RISK_QUICK = 400;
  const RISK_HOLD = new Set(['level', 'ans', 'go', 'roll', 'proroll', 'blitz', 'done', 'end', 'offer', 'promove', 'fortask', 'wait', 'fortput', 'fortsave', 'speed', 'defend', 'allhere', 'soloready', 'cardplay', 'map', 'palace', 'palaceans', 'orderroll']);
  const RISK_EACH = new Set(['roll', 'proroll', 'defend', 'map', 'orderroll']);
  const riskBusy = () => !!rk && rk.role === 'player' && Date.now() - (rk.busy || 0) < RISK_BUSY;
  function riskHeld(act) {
    if (!rk || !RISK_HOLD.has(act)) return false;
    const now = Date.now();
    if (now < (rk.armUntil || 0) || (act !== 'map' && riskBusy())) return true;
    if (RISK_EACH.has(act)) return false;
    const quick = now - (rk.lastGo || 0) < RISK_QUICK;
    rk.lastGo = now;                                                     // (still tapping: still held)
    return quick;
  }
  // A move: sent to the computer with the map, or on the one shared screen,
  // checked and applied right here by the same rules.
  function riskSend(m) {
    if (rk.role !== 'solo') {
      rk.busy = Date.now();                                                // taps wait till the map screen answers (riskHeld)
      setTimeout(() => { if (rk && rk.busy && Date.now() - rk.busy >= RISK_BUSY) riskRender(); }, RISK_BUSY + 50);
      return riskConn().move(rk.code, m).catch(() => { if (rk) { rk.busy = 0; rk.waitSent = rk.fortSent = rk.askSent = rk.rollSent = rk.defSent = rk.goSent = null; riskRender(); } toast("Couldn't reach the game", 'Check the internet'); });
    }
    const g = rk.g, at = () => g.turn ? g.turn.i + '|' + g.turn.phase : '', before = at(), was = g.turn ? g.turn.i : -1;
    riskApply(g, Object.assign({}, m, { uid: riskMe() }));
    if (at() !== before) { rk.sel = {}; rk.cardSee = rk.cardPick = null; }
    if (g.turn && g.turn.i !== was) { rk.pass = true; rk.view = null; }  // hand the screen on
    if (g.state !== 'play') rk.view = null;
    riskSoloSave();
  }

  // What can be tapped on the map right now, on the turn's own screen.
  // Story: where its soldiers can go, and when moving, a land to move from
  // and then one of yours next to it (attacks are big buttons). Pro: your
  // lands, and once one is picked, where it can attack or move to.
  function riskCan(g, me) {
    const t = g.turn, sel = rk.sel;
    if (g.battle || rk.blitz) return [];
    if (!t || g.story || !g.seats[t.i] || g.seats[t.i].uid !== me) return [];
    if (t.phase === 'return') return riskReturnLands(g);                  // back from exile: a land nobody holds
    if (rk.cardPick) return landsOf(g, me).filter(id => rk.cardPick !== 'lions' || id !== BOARD().walls);   // a card that goes on one of your lands (🦁 not Babylon)
    if (t.phase === 'place') return landsOf(g, me);
    if (t.phase !== 'attack' && t.phase !== 'move') return [];
    const ownNext = sel.from ? nearOf(sel.from).filter(id => g.lands[id].o === me) : [];
    if (!riskPro()) return t.phase === 'move' ? [...new Set(riskMovers(g, me).concat(ownNext))] : [];
    const attackers = t.phase === 'attack' ? riskAttackers(g, me) : [];
    const foes = attackers.flatMap(f => nearOf(f).filter(n => g.lands[n].o !== me && riskGateOpen(g, n)));
    return [...new Set(attackers.concat(riskMovers(g, me), foes, ownNext))];
  }
  // Forget a pick the map no longer allows: a land that fell, or that is
  // down to 1 soldier (or, moving, has none free to move).
  function riskSelFix(g, me) {
    const t = g.turn, sel = rk.sel;
    if (sel.from && (!g.lands[sel.from] || g.lands[sel.from].o !== me || (t.phase === 'move' ? riskMovable(g, sel.from) < 1 : g.lands[sel.from].a < 2))) sel.from = sel.to = null;
    if (sel.to && (!sel.from || !adjacent(sel.from, sel.to) || (t.phase === 'move' && g.lands[sel.to].o !== me))) sel.to = null;
  }
  const riskMapUi = (g, me) => {
    const t = g.turn, sel = rk.sel, ui = { can: riskCan(g, me) };
    if (t.phase === 'place' && !riskPro()) { const spot = riskGoodSpot(g, me); if (spot) ui.hint = spot.land; }   // Story's good spot
    if (riskPro() && sel.from && t.phase === 'attack') {                     // Pro: the odds of every attack from here
      ui.odds = {};
      nearOf(sel.from).forEach(id => { if (g.lands[id].o !== me && riskGateOpen(g, id) && g.lands[sel.from].a >= 2) ui.odds[id] = (riskHitsWall(g, sel.from, id) ? '🧱' : riskNeedsPalace(g, sel.from, id) ? '📜' : '') + Math.round(takeOdds(g.lands[sel.from].a, riskFoes(g, sel.from, id), riskDefDice(g, sel.from, id)).win * 100) + '%'; });
    }
    ui.from = sel.from || null;
    ui.to = sel.to || null;
    return ui;
  };

  // A tap on the map. Story: puts all the new soldiers on one of your lands
  // (↩️ Undo takes them back). Pro: +1 on a land (twice quickly: all the
  // rest); then your land and theirs for the odds, or two of yours to move.
  // While waiting, a phone picks the land to fortify.
  function riskTap(id) {
    const g = rk && rk.g, me = riskMe();
    if (!g || rk.role === 'host' || rk.view) return;
    const w = rk.role === 'player' && (g.wait || {})[me];
    if (w && riskCanFort(g, me)) {
      if (riskFortLands(g, me).includes(id)) { rk.fortSel = id; riskRender(); }
      return;
    }
    if (!riskCan(g, me).includes(id)) return;
    const t = g.turn, sel = rk.sel, own = g.lands[id].o === me;
    if (t.phase === 'return') { riskSend({ kind: 'return', a: id }); return riskRender(); }
    if (rk.cardPick) { const c = rk.cardPick; rk.cardPick = rk.cardSee = null; riskSend({ kind: 'card', a: c, b: id }); return riskRender(); }
    if (t.phase === 'place') {
      const key = g.gid + '|' + riskWaitKey(g) + '|' + id + '|' + t.armies;   // this turn's, so next turn's same tap isn't taken for it
      if (!own || riskLocked(rk.placeSent, key)) return;
      if (!riskPro()) { riskLock('placeSent', key); riskSend({ kind: 'place', a: id, n: t.armies }); return riskRender(); }
      const now = Date.now(), twice = rk.lastTap && rk.lastTap.id === id && now - rk.lastTap.at < 450;
      rk.lastTap = { id, at: now };
      rk.lastPlace = id;
      riskSend({ kind: 'place', a: id, n: twice ? t.armies : 1 });
      return riskRender();
    }
    if (own) {
      if (sel.from === id) sel.from = sel.to = null;
      else if (sel.from && adjacent(sel.from, id) && riskMovable(g, sel.from) >= 1) { sel.to = id; sel.n = Math.max(1, Math.floor(riskMovable(g, sel.from) / 2)); }
      else { sel.from = id; sel.to = null; }
    } else if (sel.from && adjacent(sel.from, id)) sel.to = id;
    else {                                                                   // an enemy land first: attack it from the strongest land next to it
      const f = nearOf(id).filter(n => g.lands[n].o === me && g.lands[n].a >= 2).sort((a, b) => g.lands[b].a - g.lands[a].a)[0];
      if (f) { sel.from = f; sel.to = id; }
    }
    riskRender();
  }
  // Pro: a drag from one of your lands to another land picks both at once.
  function riskDrag(from, to) {
    const g = rk && rk.g, me = riskMe();
    if (!g || !riskPro() || from === to || !g.lands[from] || g.lands[from].o !== me) return;
    rk.sel = { from };
    if (riskCan(g, me).includes(to)) riskTap(to); else riskRender();
  }

  // A waiting phone's part of the card: quick or deep; then the question;
  // then, if it was right, why, while he taps his lands for the armies;
  // if not, the answer and why.
  function riskWaitHtml(g, me) {
    const w = (g.wait || {})[me];
    if (!w || !riskWaiting(g, me)) return '';
    return riskSpeedHtml(g, me) + riskFortHtml(g, me, w);
  }
  // ⚡ The speed round on a waiting phone: the same question on every
  // waiting phone; the first right answer wins.
  function riskSpeedHtml(g, me) {
    const sp = g.speed;
    if (!sp || sp.key !== riskWaitKey(g)) return '';
    const Q = gameQuestion(sp.q), out = sp.out.includes(me) || !riskWaitLeft(g, me), busy = riskLocked(rk.speedSent, sp.tok);
    if (sp.over) return sp.win ? `<div class="rk-speed done"><b>⚡ ${sp.win === me ? 'You won the speed round! +' + RISK.speedPrize : esc((seatOf(g, sp.win) || {}).name || '') + ' won the speed round.'}</b></div>` : '';
    return `<div class="rk-speed"><div class="eyebrow">⚡ Speed round: first right answer wins ${soldiers(RISK.speedPrize)}</div>
      <p class="rk-q">${esc(Q.text)}</p>
      ${out ? `<p class="rk-note">${riskWaitLeft(g, me) ? 'Not that one. Wait for the others…' : `You’ve earned your ${RISK.waitRound} this round, so this one is for the others.`}</p>` : `<div class="rk-btns">${riskChoices(sp.q).map(c => `<button class="ls-opt" data-rk="speed" data-v="${esc(c)}"${busy ? ' disabled' : ''}>${esc(c)}</button>`).join('')}</div>`}</div>`;
  }
  function riskFortHtml(g, me, w) {
    const got = riskGotRound(g, w), left = riskWaitLeft(g, me);
    const saved = (w.bank ? `<p class="rk-note">🤫 Saved for your turn: ${soldiers(w.bank)}.</p>` : '') + (got ? `<p class="rk-note">This round: ${got} of ${RISK.waitRound}${left ? '' : '. More next round.'}</p>` : '');
    const box = html => `<div class="rk-wait"><div class="eyebrow">🛡️ While you wait: fortify</div>${html}${saved}</div>`;
    const next = riskNextChance(g), nextLine = next == null ? 'Your next chance comes on the next turn.' : next > 0 ? `Another chance in about ${next} seconds.` : 'Another chance is coming…';
    const last = w.last && gameQuestion(w.last.q);
    if (w.ready > 0 && last) {
      const busy = riskLocked(rk.fortSent, w.n + '|' + w.ready), pick = rk.fortSel && riskFortLands(g, me).includes(rk.fortSel) ? rk.fortSel : null, none = !riskFortLands(g, me).length;
      return box(`<p class="rk-note">${linkRefs(last.text, last.home)}</p>
        <p class="rk-result ok">Right! ${busy ? 'Putting your soldier down…' : pick ? `Put ${w.ready === 1 ? 'your soldier' : 'a soldier'} on ${esc(landName(pick))}?` : none ? `Babylon can’t be fortified while you wait: save ${w.ready === 1 ? 'your soldier' : 'them'} for your turn.` : `Defend now: tap one of your lands on the map to put ${w.ready === 1 ? 'a soldier' : w.ready + ' soldiers'} there (not Babylon). Or save ${w.ready === 1 ? 'it' : 'them'} to attack on your turn.`}</p>
        ${!busy ? `<div class="rk-btns${pick ? ' two' : ''}">${pick ? `<button class="btn" data-rk="fortput">🛡️ Put 1 on ${esc(landName(pick))}</button>` : ''}<button class="btn ghost" data-rk="fortsave">🤫 Save ${w.ready === 1 ? 'it' : 'all ' + w.ready} for my turn</button></div>` : ''}
        <p class="quiz-why">${linkRefs(last.q.why, last.home)}</p>`);
    }
    if (last && !w.last.right && rk.waitSeen !== w.n) {
      return box(`<p class="rk-note">${linkRefs(last.text, last.home)}</p>
        <p class="rk-result no">Not this time. The answer: ${esc(last.q.right)}.</p>
        <p class="quiz-why">${linkRefs(last.q.why, last.home)}</p>
        <p class="rk-note">${nextLine}</p>
        <div class="rk-btns"><button class="btn ghost" data-rk="waitnext">OK</button></div>`);
    }
    if (w.q) {
      const Q = gameQuestion(w.q), read = w.level === 'hard' && riskReading(Q), busy = riskLocked(rk.waitSent, w.tok);
      return box(`<p class="rk-note">${w.level === 'hard' ? `Deep: find it in ${read ? esc(read.label) : 'the reading'}, for ${RISK.fort.hard} soldiers.` : `Quick: ${RISK.fort.easy} soldier if you know it.`} Your answer counts until your own turn starts.</p>
        <p class="rk-q">${esc(Q.text)}</p>
        ${read ? `<a class="deep-open" href="${esc(read.url)}" target="_blank" rel="noopener noreferrer">Open ${esc(read.label)} ↗</a>` : ''}
        <div class="rk-btns">${riskChoices(w.q).map(c => `<button class="ls-opt" data-rk="wait" data-v="${esc(c)}"${busy ? ' disabled' : ''}>${esc(c)}</button>`).join('')}</div>`);
    }
    if (riskCanChoose(g, me)) {
      const busy = riskLocked(rk.askSent, riskWaitKey(g) + '|' + riskUsed(g, w)) ? ' disabled' : '', deep = riskPools().hard.length;
      const hard = Math.min(RISK.fort.hard, left);
      return box(`<p class="rk-note">A chance to fortify: answer right for soldiers, to put on your lands now or save for your turn. Up to ${soldiers(RISK.waitRound)} a round.</p>
        <div class="rk-btns${deep ? ' two' : ''}"><button class="btn" data-rk="fortask" data-v="easy"${busy}>Quick · ${soldiers(Math.min(RISK.fort.easy, left))}</button>${deep ? `<button class="btn" data-rk="fortask" data-v="hard"${busy}>Deep · ${soldiers(hard)}${hard < RISK.fort.hard ? ' (this round’s last)' : ''}</button>` : ''}</div>`);
    }
    // Nothing open: when the next chance comes (and what's saved).
    if (riskWaitOpen(g) && !left) return box('<p class="rk-note">You’ve earned all you can while waiting this round.</p>');
    if (riskWaitOpen(g) && (next != null || w.bank)) return box(`<p class="rk-note">${nextLine}</p>`);
    return '';
  }

  // Where a tap on a [data-rk] control goes (and a flicked tray).
  function riskRoute(el) {
    const act = el.dataset.rk;
    if (act === 'sceneskip') riskSceneSkip();
    else if (act === 'host') riskHost();
    else if (act === 'join') riskJoinForm('');
    else if (act === 'joinnow') riskJoin();
    else if (act === 'solo') riskSoloSetup();
    else if (act === 'solostart') riskSoloStart();
    else if (act === 'solocontinue') riskSoloContinue();
    else if (act === 'solofair') riskSoloFair();
    else if (/^solo/.test(act) && rk && rk.role === 'solo') riskSoloAction(act);
    else if (rk && (rk.role === 'player' || rk.role === 'solo')) riskPlayerAction(act, el);
  }
  // A flick: the dice leave the phone (copies fly off the top of the screen,
  // since the card redraws at once), a buzz where phones can, and the roll.
  // Story rolls one die a flick; Pro and the guards throw them all.
  function riskFlick(el) {
    rk.flicked = performance.now();
    try { if (navigator.vibrate) navigator.vibrate(25); } catch (e) {}
    const all = [...el.querySelectorAll('.rk-tray-die')], dice = el.dataset.rk === 'roll' && !el.dataset.n ? all.slice(0, 1) : all;
    if (!reduceMotion()) dice.forEach((d, i) => {
      const r = d.getBoundingClientRect(), c = document.createElement('span');
      c.className = 'rk-flyer ' + (d.classList.contains('def') ? 'def' : 'att');
      c.style.left = r.left + 'px'; c.style.top = r.top + 'px';
      document.body.appendChild(c);
      c.animate([{ transform: 'none', opacity: 1 }, { transform: `translate(${(i - (dice.length - 1) / 2) * 16}px, ${-Math.max(260, r.top + 80)}px) rotate(${540 + i * 90}deg)`, opacity: 0 }],
        { duration: 520, easing: 'cubic-bezier(.2,.7,.3,1)', fill: 'forwards' }).finished.then(() => c.remove(), () => c.remove());
    });
    riskRoute(el);
  }

  function riskPlayerAction(act, el) {
    const g = rk && rk.g, sel = rk.sel;
    if (act === 'read') return riskReadAloud();
    if (act === 'chapterclose') { if (rk.g) rk.chapterShut = rk.g.gid + '|' + rk.g.round; return riskRender(); }
    if (act === 'mode') { riskPickMode(el.dataset.v); return riskRender(); }
    if (!g) return;
    if (act === 'orderroll') {
      riskWakeAudio();
      if (rk.role !== 'solo') return riskSend({ kind: 'order' });
      riskOrderTap(g, el.dataset.uid);
      riskSoloSave();
      return renderRiskSolo();
    }
    const t = g.turn, dn = (g.dice && g.dice.n) || 0;
    const w = (g.wait || {})[riskConn().uid()];
    if (act === 'wait' && w && w.q && !riskLocked(rk.waitSent, w.tok)) { riskLock('waitSent', w.tok); riskSend({ kind: 'wait', a: el.dataset.v, b: w.tok }); }
    else if (act === 'fortask' && w && !riskLocked(rk.askSent, riskWaitKey(g) + '|' + riskUsed(g, w))) { riskLock('askSent', riskWaitKey(g) + '|' + riskUsed(g, w)); riskSend({ kind: 'fortask', a: el.dataset.v }); }
    else if (act === 'speed' && g.speed && !riskLocked(rk.speedSent, g.speed.tok)) { riskLock('speedSent', g.speed.tok); riskSend({ kind: 'speed', a: el.dataset.v, b: g.speed.tok }); }
    else if (act === 'fortsave' && w && w.ready > 0) { rk.fortSel = null; riskSend({ kind: 'fortsave' }); }
    else if (act === 'waitnext' && w) rk.waitSeen = w.n;
    else if (act === 'pick') { riskSend({ kind: 'pick', a: el.dataset.k }); if (riskModeChosen()) riskSend({ kind: 'mode', a: riskModeOf() }); }
    else if (act === 'level') riskSend({ kind: 'level', a: el.dataset.v });
    else if (act === 'ans') { sel.answered = true; riskSend({ kind: 'answer', a: el.dataset.v }); }
    else if (act === 'palace' && t && !t.palaceQ && !t.palaceTried) { rk.sel = {}; riskSend({ kind: 'palace' }); }
    else if (act === 'palaceans' && t && t.palaceQ) riskSend({ kind: 'palaceans', a: el.dataset.v });
    else if (act === 'allhere' && t) riskSend({ kind: 'place', a: el.dataset.land, n: t.armies });
    else if (act === 'unplace') { rk.placeSent = null; riskSend({ kind: 'unplace' }); }
    else if (act === 'go' && !g.battle && !riskLocked(rk.goSent, 'go|' + dn)) { riskLock('goSent', 'go|' + dn); rk.advice = false; riskSend({ kind: 'attack', a: el.dataset.from, b: el.dataset.to }); }
    else if ((act === 'proroll' || act === 'blitz') && sel.from && sel.to && !g.battle) {
      const key = sel.from + '|' + sel.to + '|' + dn;
      if (!riskLocked(rk.goSent, key)) {
        riskLock('goSent', key);
        rk.autoRoll = true;                                                // its dice go as soon as the guards have rolled
        rk.blitz = act === 'blitz' ? { from: sel.from, to: sel.to, wall: riskHitsWall(g, sel.from, sel.to) } : null;
        riskSend({ kind: 'attack', a: sel.from, b: sel.to });
      }
    }
    else if (act === 'blitzstop') rk.blitz = rk.autoRoll = null;
    else if (act === 'less' || act === 'more') sel.n = Math.max(1, Math.min(sel.from ? riskMovable(g, sel.from) : 1, (sel.n || 1) + (act === 'more' ? 1 : -1)));
    else if (act === 'moveall' && sel.from) sel.n = riskMovable(g, sel.from);
    else if (act === 'movecancel') rk.sel = {};
    else if (act === 'unshift' || act === 'reattack') { rk.sel = {}; riskSend({ kind: act }); }
    else if (act === 'cardsee') { rk.cardSee = rk.cardSee === el.dataset.v ? null : el.dataset.v || null; rk.cardPick = null; }
    else if (act === 'cardplay' && el.dataset.v) {
      if (RISK_LAND_CARDS.includes(el.dataset.v)) { rk.cardPick = el.dataset.v; rk.sel = {}; }   // then a tap on one of your lands
      else { rk.cardSee = null; riskSend({ kind: 'card', a: el.dataset.v }); }
    }
    else if (act === 'cardcancel') rk.cardPick = rk.cardSee = null;
    else if (act === 'promove' && sel.from && sel.to && t) {
      riskSend({ kind: 'shift', a: sel.from, b: sel.to, n: Number(el.dataset.n) || 1 });   // (it ends the attacking too)
      rk.sel = {};
    }
    else if (act === 'offer') riskSend({ kind: 'shift', a: el.dataset.from, b: el.dataset.to, n: Number(el.dataset.n) || 1 });
    else if (act === 'nooffer') rk.noOffer = riskTurnKey(g);
    else if (act === 'fortput' && w && rk.fortSel && !riskLocked(rk.fortSent, w.n + '|' + w.ready)) { riskLock('fortSent', w.n + '|' + w.ready); riskSend({ kind: 'fort', a: rk.fortSel }); }
    else if (act === 'roll' && g.battle && !riskLocked(rk.rollSent, g.battle.n + '|' + g.battle.shown)) { riskLock('rollSent', g.battle.n + '|' + g.battle.shown); riskSend({ kind: 'roll', n: Number(el.dataset.n) || 1 }); }
    else if (act === 'defend' && g.battle && !g.battle.d && !riskLocked(rk.defSent, g.battle.n)) { riskLock('defSent', g.battle.n); riskSend({ kind: 'defend' }); }
    else if (act === 'advice') rk.advice = !rk.advice;
    else if (act === 'insight') riskSend({ kind: act });
    else if (act === 'done') riskSend({ kind: 'done' });
    else if (act === 'end') riskEndSoon();
    else if (act === 'endundo') { clearTimeout(rk.endTimer); rk.ending = null; }
    riskRender();
  }

  // Pro's Roll and Blitz, carried on after each redraw: the dice go as soon
  // as the guards have rolled; Blitz attacks again until the land falls or
  // the land it attacks from is down to RISK.blitzStop.
  function riskAuto() {
    const g = rk && rk.g, me = rk && riskMe();
    if (!g || rk.role === 'host' || (!rk.autoRoll && !rk.blitz)) return;
    const t = g.turn;
    if (g.state !== 'play' || !t || !g.seats[t.i] || g.seats[t.i].uid !== me || t.phase !== 'attack') { rk.autoRoll = rk.blitz = null; return; }
    const b = g.battle;
    if (b) {
      if (b.by === me && b.d && b.shown < b.a.length && !riskLocked(rk.rollSent, b.n + '|' + b.shown)) { riskLock('rollSent', b.n + '|' + b.shown); riskSend({ kind: 'roll', n: 3 }); riskRender(); }
      return;
    }
    rk.autoRoll = null;
    const z = rk.blitz;
    if (!z || riskWatchingNow(g)) return;                                       // (again once the last round's been played out)
    const A = g.lands[z.from], D = g.lands[z.to], key = z.from + '|' + z.to + '|' + ((g.dice && g.dice.n) || 0);
    if (!A || !D || D.o === me || A.o !== me || A.a <= RISK.blitzStop || !!z.wall !== riskHitsWall(g, z.from, z.to)) { rk.blitz = null; return riskRender(); }   // (a wall knocked down ends a Blitz on it)
    if (riskLocked(rk.goSent, key)) return;
    riskLock('goSent', key);
    rk.autoRoll = true;
    riskSend({ kind: 'attack', a: z.from, b: z.to });
    riskRender();
  }

  function renderRiskPlayer() {
    if (!rk || rk.role !== 'player') return;
    const g = rk.g, me = riskConn().uid(), B = BOARD();
    if (!g) { riskBody('<div class="live-big">The game has ended.</div><p class="live-sub">Thanks for playing!</p>'); return; }
    riskSeeGame(g);
    riskNoteRoll(g);
    const seat = seatOf(g, me);
    if (g.state === 'lobby') {
      const taken = {}, k = seat && kingdomOf(seat.k);
      g.seats.forEach(s => { taken[s.k] = s; });
      riskBody(`${seat ? `<div class="rk-me"><span class="rk-dot" style="background:${k.color}"></span><b>${esc(seat.name)}</b> · ${esc(k.name)}</div>` : ''}
        <div class="clue"><p class="clue-q">${seat ? "You're in! Watch the map." : 'Pick your kingdom'}</p>
        <div class="rk-kingdoms">${B.kingdoms.map(x => {
          const who = taken[x.id], mine = who && who.uid === me;
          return `<button class="rk-king${mine ? ' mine' : ''}${who && !mine ? ' taken' : ''}" data-rk="pick" data-k="${x.id}"${who && !mine ? ' disabled' : ''}>
            <span class="rk-dot" style="background:${x.color}"></span>${esc(x.name)}<small>${mine ? 'yours' : who ? esc(who.name) : 'home: ' + esc(landName(x.home))}</small></button>`;
        }).join('')}</div>
        <p class="board-help">${seat ? 'You can still switch until the game starts.' : ''}</p>${g.seats.length <= 2 ? riskFairHtml(g.seats.map(s => s.k), '') : ''}</div>
        ${seat ? riskModePicker() : ''}`);
      return;
    }
    const mine = g.state === 'play' && !g.story && seat && !seat.out && g.seats[g.turn.i].uid === me && riskOrderOpen(g);
    let card, ui = {};
    if (g.state === 'over') card = riskOverCard(g, me);
    else if (g.story) card = riskStartCard();
    else if (g.state === 'play' && seat && !seat.out && !riskOrderOpen(g)) card = riskOrderCard(g, me);
    else if (mine) { riskSelFix(g, me); card = riskCrownHtml(g, me) + riskMyCard(g, me); ui = riskMapUi(g, me); }
    else {
      card = (!seat ? '<p class="rk-note">You joined after the game started. Watch the map!</p>'
        : seat.out ? '<p class="rk-note">Your kingdom has fallen. Watch how it ends!</p>' : '') + riskSayHtml(g) + riskCrownHtml(g, me) + riskWatchHtml(g, riskWaitHtml(g, me), me);
      const w = (g.wait || {})[me];
      if (g.battle) ui = { from: g.battle.from, to: g.battle.to };                       // the two lands in the battle, as on the map screen
      if (w && riskCanFort(g, me) && !riskLocked(rk.fortSent, w.n + '|' + w.ready) && !rk.view)
        ui = Object.assign(ui, { can: riskFortLands(g, me) }, rk.fortSel && riskFortLands(g, me).includes(rk.fortSel) ? { from: rk.fortSel } : {});   // where the armies can go (not Babylon), and the land picked
    }
    riskScreen(g, card, Object.assign({ me }, ui));
    riskMaybeFort(g);
    clearTimeout(rk.autoT);
    if (rk.autoRoll || rk.blitz) rk.autoT = setTimeout(riskAuto, 400);   // Pro's Roll and Blitz carry on
  }
  // Story or Pro, on a phone that has picked its kingdom (and in ⋯).
  const riskModePicker = () => { const m = riskModeOf(), chosen = riskModeChosen();
    return `<div class="clue rk-modes"><p class="clue-q">How do you want to play?</p>
      <button class="rk-mode${chosen && m === 'story' ? ' on' : ''}" data-rk="mode" data-v="story"><b>📖 Story</b><small>I'm learning the game. One step at a time in plain words, with a good move shown, and 🔊 to hear it read aloud. No timer.</small></button>
      <button class="rk-mode${chosen && m === 'pro' ? ' on' : ''}" data-rk="mode" data-v="pro"><b>⚡ Pro</b><small>I know the game. Tap, tap, done: the odds on the map, every die at once, and Blitz.</small></button>
      <p class="board-help">Everyone plays the same game. You can switch in ⋯ any time.</p></div>`; };

  // ----- one screen: a phone, tablet or computer passed around -----

  // No TV and no join code: everyone's turn is played on this screen, by the
  // same rules. The game is kept on this device, so it can be continued later.
  const SOLO_KEY = NS + 'risk.solo';
  function riskSoloSave() {
    try { localStorage.setItem(SOLO_KEY, JSON.stringify(Object.assign({}, rk.g, { code: rk.code, pass: !!rk.pass }))); } catch (e) {}
  }
  function riskSoloSaved() {
    try { const g = JSON.parse(localStorage.getItem(SOLO_KEY)); return g && g.state === 'play' && g.board === BOARD().id && (g.seats || []).every(s => kingdomOf(s.k)) ? g : null; } catch (e) { return null; }
  }

  // ⚖️ Two players: some match-ups are fairer than others (board.fairPairs,
  // from simulation; Lydia vs Egypt leans about 60–40). A tip names the
  // fair ones, and 🎲 deals one at random.
  const riskFairPairs = () => BOARD().fairPairs || [];
  const riskPairIsFair = (a, b) => riskFairPairs().some(p => p.includes(a) && p.includes(b));
  const riskFairText = () => andList(riskFairPairs().map(p => p.map(k => kingdomOf(k).name).join(' vs ')));
  function riskFairDealt() {
    const ps = riskFairPairs(), p = ps[Math.floor(Math.random() * ps.length)];
    return Math.random() < 0.5 ? p.slice() : p.slice().reverse();
  }
  // The tip for a 2-player table: fair already, or which match-ups are (and the 🎲).
  function riskFairHtml(ks, deal) {
    if (!riskFairPairs().length) return '';
    if (ks.length === 2 && riskPairIsFair(ks[0], ks[1])) return `<p class="rk-fair ok">⚖️ ${esc(ks.map(k => kingdomOf(k).name).join(' vs '))}: a fair match-up for 2 players.</p>`;
    return `<div class="rk-fair"><p>⚖️ Playing with 2? The fairest match-ups are ${esc(riskFairText())}. The others lean up to 60–40.</p>${deal ? `<button class="btn ghost" ${deal}>🎲 Deal a fair match-up</button>` : ''}</div>`;
  }
  // One screen: the two names typed go to a fair pair, at random.
  function riskSoloFair() {
    const ins = [...document.querySelectorAll('[data-solo-k]')], names = ins.map(i => i.value.trim()).filter(Boolean), msg = $('riskFairMsg');
    if (names.length !== 2) { if (msg) msg.textContent = 'Type 2 names first, then deal.'; return; }
    const pair = riskFairDealt();
    if (Math.random() < 0.5) names.reverse();
    ins.forEach(i => { const at = pair.indexOf(i.dataset.soloK); i.value = at < 0 ? '' : names[at]; });
    if (msg) msg.textContent = `🎲 ${names[0]} plays ${kingdomOf(pair[0]).name}, ${names[1]} plays ${kingdomOf(pair[1]).name}.`;
  }
  function riskSoloSetup(err, names) {
    stopRisk();
    openRisk();
    const B = BOARD(), saved = riskSoloSaved(), n = names || {};
    riskBody(`
      <div class="clue" style="max-width:560px">
        <p class="clue-q">Play on this one screen</p>
        <p class="board-help">Type a name next to each kingdom that's playing (2 to 4), then pass this phone, tablet or computer around: each turn is played here.</p>
        ${saved ? `<div class="board-actions"><button class="btn" data-rk="solocontinue">Continue your game · round ${saved.round} of ${saved.rounds}</button></div>` : ''}
        <div class="rk-soloset">${B.kingdoms.map(k => `<label class="rk-soloking"><span class="rk-dot" style="background:${k.color}"></span><b>${esc(k.name)}</b>
          <input class="field" data-solo-k="${k.id}" maxlength="16" placeholder="Name" autocomplete="off" value="${esc(n[k.id] || '')}"></label>`).join('')}</div>
        ${riskFairHtml([], 'data-rk="solofair"')}<p class="board-help" id="riskFairMsg" aria-live="polite"></p>
        <label class="block mt-3 text-[12px] text-white/60" for="riskSoloRounds">How long</label>
        <select id="riskSoloRounds" class="field">${RISK.rounds.map((r, i) => `<option value="${r}"${i === 0 ? ' selected' : ''}>${['Short', 'Standard', 'Long'][i]} · ${r} rounds</option>`).join('')}</select>
        <label class="block mt-3 text-[12px] text-white/60" for="riskSoloMode">How to play</label>
        <select id="riskSoloMode" class="field"><option value="story"${riskModeOf() === 'story' ? ' selected' : ''}>📖 Story: read along, one step at a time</option><option value="pro"${riskModeOf() === 'pro' ? ' selected' : ''}>⚡ Pro: tap, tap, done</option></select>
        <label class="block mt-3 text-[12px] text-white/60" for="riskSoloTimer">Timer (⚡ Pro only)</label>
        <select id="riskSoloTimer" class="field"><option value="on">On: ${RISK.time.easy} seconds, hunts ${RISK.time.hard / 60} minutes</option><option value="off">Relaxed: no timer</option></select>
        <label class="block mt-3 text-[12px] text-white/60" for="riskSoloInsight">💡 Insight</label>
        <select id="riskSoloInsight" class="field"><option value="on">On: a right hunt earns the odds for a turn</option><option value="off">Off</option></select>
        ${err ? `<p class="parent-msg">${esc(err)}</p>` : ''}
        <div class="board-actions"><button class="btn" data-rk="solostart">${saved ? 'Start a new game' : 'Start'}</button></div>
      </div>`);
  }

  function riskSoloStart() {
    const names = {};
    const seats = [...document.querySelectorAll('[data-solo-k]')].map(i => ({ k: i.dataset.soloK, name: i.value.trim() }))
      .filter(x => { names[x.k] = x.name; return x.name; }).map((x, n) => ({ uid: 'p' + (n + 1), name: x.name, k: x.k }));
    if (seats.length < 2) return riskSoloSetup('Type at least 2 names.', names);
    const mode = $('riskSoloMode').value === 'pro' ? 'pro' : 'story';
    try { localStorage.setItem(NS + 'risk.mode', mode); } catch (e) {}
    seats.forEach(s => { s.mode = mode; });                                 // (a Story screen's questions have no clock)
    rk = { role: 'solo', code: 'solo' + Date.now(), g: { board: BOARD().id, state: 'lobby', rounds: Number($('riskSoloRounds').value) || RISK.rounds[1], timer: $('riskSoloTimer').value !== 'off', insightOn: $('riskSoloInsight').value !== 'off', seats }, sel: {}, unsub: [] };
    rk.tick = setInterval(riskTick, 500);
    riskBegin(rk.g);
    riskSoloSave();
    renderRiskSolo();
  }
  function riskSoloContinue() {
    const g = riskSoloSaved();
    if (!g) return riskSoloSetup();
    rk = { role: 'solo', code: g.code || 'solo', g, sel: {}, pass: !!g.pass, unsub: [] };
    rk.tick = setInterval(riskTick, 500);
    renderRiskSolo();
  }
  function riskSoloAction(act) {
    const g = rk.g;
    if (act === 'soloready') rk.pass = false;
    else if (act === 'solobegin' && g.story) riskStoryDone(g);
    else if (act === 'soloskip' && g.state === 'play' && !g.story) { riskLog(g, g.seats[g.turn.i].name + "'s turn was skipped."); riskNextTurn(g); rk.sel = {}; rk.pass = g.state === 'play'; }
    else if (act === 'solofinish' && g.state === 'play') riskOver(g);
    else if (act === 'soloagain') {
      rk.g = { board: g.board, state: 'lobby', rounds: g.rounds, timer: g.timer, insightOn: g.insightOn, seats: g.seats.map(x => ({ uid: x.uid, name: x.name, k: x.k, mode: riskModeOf() })) };
      rk.code = 'solo' + Date.now();
      riskBegin(rk.g);
      rk.sel = {};
      rk.pass = false;
    } else if (act === 'solodone') {
      try { localStorage.removeItem(SOLO_KEY); } catch (e) {}
      return closeRisk();
    }
    rk.view = null;
    riskSoloSave();
    renderRiskSolo();
  }

  function renderRiskSolo() {
    if (!rk || rk.role !== 'solo') return;
    const g = rk.g;
    riskSeeGame(g);
    riskNoteRoll(g);
    let card, ui = g.dice ? { from: g.dice.from, to: g.dice.to } : {};
    if (g.state === 'over') card = riskOverCard(g, null);
    else if (g.story) card = riskStartCard();
    else if (!riskOrderOpen(g)) card = `${riskSayHtml(g)}<p class="rk-big rk-read">🎲 Who goes first this round? Each of you, tap Roll on your own die.</p>`;
    else if (rk.pass) {
      const s = g.seats[g.turn.i], k = kingdomOf(s.k);
      card = `${riskSayHtml(g)}${riskCrownHtml(g)}<div class="rk-pass" style="border-color:${k.color}"><p class="rk-q">Pass to ${esc(s.name)}</p><p class="rk-note">${esc(k.name)}'s turn.</p>
        <div class="rk-btns"><button class="btn" data-rk="soloready">I'm ${esc(s.name)}: go</button></div></div>`;
    } else {
      const me = g.seats[g.turn.i].uid;
      riskSelFix(g, me);
      card = riskCrownHtml(g, me) + riskMyCard(g, me);
      ui = riskMapUi(g, me);
    }
    riskScreen(g, card, ui, g.state === 'over' ? riskWinHtml(g) : riskChapterHtml(g));
    riskSceneSync(g);
    riskNarrate(g);
    riskMoment(g);
    clearTimeout(rk.autoT);
    if (rk.autoRoll || rk.blitz) rk.autoT = setTimeout(riskAuto, 400);
  }

  // ----- a player's own turn: Story or Pro -----

  // How this device plays, remembered here: Story (read along, one step at
  // a time, for a young reader) unless it chose Pro (tap, tap, done). On the
  // one screen passed around it's the whole screen's.
  // (Kept per player too, so tabs of one browser, as in test mode, can differ.)
  const riskModeKey = () => rk && rk.role === 'player' ? NS + 'risk.mode.' + riskConn().uid() : NS + 'risk.mode';
  const riskModeSaved = () => { try { return localStorage.getItem(riskModeKey()) || localStorage.getItem(NS + 'risk.mode'); } catch (e) { return null; } };
  const riskModeOf = () => riskModeSaved() === 'pro' ? 'pro' : 'story';
  const riskModeChosen = () => !!riskModeSaved();
  const riskPro = () => !!rk && rk.role !== 'host' && riskModeOf() === 'pro';
  function riskPickMode(mode) {
    try { localStorage.setItem(NS + 'risk.mode', mode); localStorage.setItem(riskModeKey(), mode); } catch (e) {}
    if (!rk) return;
    rk.sel = {};
    rk.blitz = rk.autoRoll = null;
    if (rk.role === 'player' && rk.g && seatOf(rk.g, riskConn().uid())) riskSend({ kind: 'mode', a: mode });
    if (rk.role === 'solo' && rk.g) { rk.g.seats.forEach(s => { s.mode = mode; }); riskSoloSave(); }
  }

  // Where a turn is, for Story's four steps: Question, Soldiers, Attack, Move.
  const riskStep = t => ({ choose: 0, answer: 0, place: 1, attack: 2, move: 3 })[t.phase] || 0;
  const riskSteps = t => `<ol class="rk-steps">${['Question', 'Soldiers', 'Attack', 'Move'].map((x, i) => { const cur = riskStep(t); return `<li class="${i === cur ? 'now' : i < cur ? 'done' : ''}"><b>${i < cur ? '✓' : i + 1}</b>${x}</li>`; }).join('')}</ol>`;
  const riskStoryTop = g => { const c = riskChapter(g, g.round); return `<div class="rk-storytop">${c ? `<span class="rk-chap">📖 Chapter ${c.n} · ${esc(c.title)}</span>` : '<span></span>'}<button class="rk-read-btn" data-rk="read">🔊 Read to me</button></div>`; };
  const soldiers = n => n + (n === 1 ? ' soldier' : ' soldiers'), guards = n => n + (n === 1 ? ' guard' : ' guards');

  // Every land this player could attack now, each from their strongest land
  // next to it, with the chance of taking it by attacking until it falls.
  // Babylon can be two: its wall (from a walled side) and its guards (from
  // an open side, or once the wall is down).
  function riskTargets(g, me) {
    const out = {};
    riskAttackers(g, me).forEach(f => nearOf(f).forEach(to => {
      if (g.lands[to].o === me || !riskGateOpen(g, to)) return;
      const wall = riskHitsWall(g, f, to), key = to + (wall ? '|wall' : '');
      if (!out[key] || g.lands[f].a > g.lands[out[key].from].a) out[key] = { from: f, to, wall };
    }));
    return Object.values(out).map(x => Object.assign(x, { win: takeOdds(g.lands[x.from].a, riskFoes(g, x.from, x.to), riskDefDice(g, x.from, x.to)).win, region: riskRegionIf(g, me, x.to), palace: riskNeedsPalace(g, x.from, x.to) }))
      .sort((a, b) => b.win - a.win || landName(a.to).localeCompare(landName(b.to)));
  }
  const riskChance = p => p >= 0.7 ? ['Good chance', 3] : p >= 0.4 ? ['Maybe', 2] : ['Hard', 1];
  const riskChanceHtml = p => { const [label, bars] = riskChance(p); return `<span class="rk-chance" aria-label="${label}"><span>${[0, 1, 2].map(i => `<i class="${i < bars ? 'on' : ''}"></i>`).join('')}</span>${label}</span>`; };
  // A good spot for new soldiers: one of your lands next to the weakest land
  // you could attack (the one with more soldiers already, on a tie).
  function riskGoodSpot(g, me) {
    let best = null;
    landsOf(g, me).forEach(f => nearOf(f).forEach(to => {
      if (g.lands[to].o === me || !riskGateOpen(g, to)) return;
      const d = riskFoes(g, f, to), reg = d <= 3 ? riskRegionIf(g, me, to) : null;   // (Babylon from a walled side: its bricks)
      const better = !best || (!!reg !== !!best.reg ? !!reg : d < best.d || (d === best.d && g.lands[f].a > g.lands[best.f].a));
      if (better) best = { f, d, to, reg };
    }));
    if (!best) return null;
    if (best.reg) return { land: best.f, text: `Good spot: ${landName(best.f)}. Take ${landName(best.to)} from there and you hold all of ${regionIn(best.reg)}: +${best.reg.bonus} every turn!` };
    return { land: best.f, text: `Good spot: ${landName(best.f)} is next to ${andList(nearOf(best.f).filter(n => g.lands[n].o !== me && riskGateOpen(g, n)).map(landName).sort())}.` };
  }
  // After attacking, a move worth making: soldiers from one of your lands
  // to a weaker neighbour of yours that an enemy borders (half the gap, of
  // the soldiers free to move).
  function riskOffer(g, me) {
    let best = null;
    landsOf(g, me).forEach(t => {
      if (!nearOf(t).some(n => g.lands[n].o !== me)) return;
      nearOf(t).forEach(f => {
        if (g.lands[f].o !== me) return;
        const n = Math.min(riskMovable(g, f), Math.floor((g.lands[f].a - g.lands[t].a) / 2));
        if (n >= 1 && (!best || n > best.n)) best = { from: f, to: t, n };
      });
    });
    return best;
  }
  // Who plays after this turn, for "Next: Mom".
  const riskNextSeat = g => { const o = riskOrder(g); for (let k = o.indexOf(g.turn.i) + 1; k < o.length; k++) { const s = g.seats[o[k]]; if (!s.out) return s; } return null; };
  // End turn is one tap; for 3 seconds it can be taken back. (The tests
  // shorten it with window.TU_END_MS when there's no Firebase.)
  const riskEndMs = () => !FIREBASE_CONFIG && typeof window.TU_END_MS === 'number' ? window.TU_END_MS : 3000;
  const riskEndLeft = () => rk.ending ? Math.max(0, Math.ceil((riskEndMs() - (Date.now() - rk.ending.at)) / 1000)) : 0;
  const riskTurnKey = g => g && g.turn ? g.gid + '|' + riskWaitKey(g) : '';
  function riskEndSoon() {
    const key = riskTurnKey(rk.g);
    clearTimeout(rk.endTimer);
    rk.ending = { at: Date.now(), key };
    rk.endTimer = setTimeout(() => {
      if (!rk || !rk.ending || rk.ending.key !== key) return;
      rk.ending = null;
      if (riskTurnKey(rk.g) === key) riskSend({ kind: 'end' });         // still this turn: not skipped meanwhile
      riskRender();
    }, riskEndMs());
  }
  // Flick to roll: a tray of dice (red, the attacker's; white, the guards').
  // Flick them up, or tap; the same move as the old Roll button.
  function riskTrayHtml(act, count, kind, label, dis, n) {
    const dice = Array.from({ length: Math.max(1, count) }, () => `<span class="rk-tray-die ${kind}"></span>`).join('');
    return `<div class="rk-tray" data-rk="${act}"${n ? ` data-n="${n}"` : ''} role="button" tabindex="0" aria-label="${esc(label)}: flick up or tap"${dis || ''}>
      <span class="rk-tray-dice">${dice}</span><span class="rk-tray-hint">${esc(label)}</span><small><b aria-hidden="true">↑</b>Flick up · or tap</small></div>`;
  }
  function riskEndHtml(g, label) {
    if (rk.ending && rk.ending.key === riskTurnKey(g)) return `<div class="rk-ending"><span>Your turn ends in <b id="rkEndClock">${riskEndLeft()}</b>…</span><button class="btn" data-rk="endundo">↩️ Undo</button></div>`;
    const next = riskNextSeat(g);
    const after = next ? 'Next: ' + esc(next.name) : g.round < g.rounds ? 'Next: 🎲 a new round' : 'The last turn!';
    return `<button class="rk-end-btn" data-rk="end"><b>${label}</b><small>${after}</small></button>`;
  }
  // The last roll on this turn, in dice: "6 5 ✓  2 3 ✗ · Arabia held".
  function riskLastRoll(g, me) {
    const d = g.dice;
    if (!d || d.by !== me || d.turn !== riskWaitKey(g)) return '';
    const pairs = d.a.slice(0, d.d.length).map((x, i) => `<span class="rk-lr">${dieHtml(x, 'att ' + (x > d.d[i] ? 'win' : 'lose'))}${dieHtml(d.d[i], 'def')}</span>`).join('');
    return `<div class="rk-last"><small>Last</small>${pairs}<span>${esc(d.won ? landName(d.to) + ' taken' : [d.ld ? landName(d.to) + ' −' + d.ld : '', d.la ? landName(d.from) + ' −' + d.la : ''].filter(Boolean).join(' · '))}</span></div>`;
  }
  // Someone just fortified a land next to where this player could attack.
  function riskFortAlert(g, me, near) {
    const f = g.fort, hit = f && f.key === riskWaitKey(g) && g.lands[f.land] && g.lands[f.land].o !== me && seatOf(g, f.uid) && near(f.land) ? f : null;
    return hit ? `<p class="rk-alert">🛡️ ${esc(seatOf(g, hit.uid).name)} just fortified ${esc(landName(hit.land))}: ${guards(g.lands[hit.land].a)} there now.</p>` : '';
  }
  const riskQLabel = (g, read) => { const Q = gameQuestion(g.turn.q); return Q.week && Q.week !== WEEK ? `A review from ${esc(Q.week.title)}` : read ? `Hard question: find it in ${esc(read.label)}` : 'Easy question'; };

  // 📜 The palace question on the turn's own screen: the question (a hunt
  // in the chapter), then, until the next battle, whether the writing was
  // read.
  function riskPalaceHtml(g, me, pro) {
    const t = g.turn, G = riskGuard(g) || { name: 'Babylon’s guards' };
    if (t.palaceQ) {
      const Q = gameQuestion(t.palaceQ), read = riskReading(Q);
      return `<div class="rk-palace"><div class="eyebrow">📜 The writing on the wall</div>
        <p class="rk-note${pro ? '' : ' rk-read'}">Answer right and you can attack ${esc(G.name)} this turn. One try a turn${read ? `: find it in ${esc(read.label)}` : ''}.</p>
        <p class="rk-q${pro ? '' : ' rk-bigq rk-read'}">${esc(Q.text)}</p>
        ${read ? `<a class="deep-open" href="${esc(read.url)}" target="_blank" rel="noopener noreferrer">Open ${esc(read.label)} ↗</a>` : ''}
        <div class="rk-btns">${riskChoices(t.palaceQ).map((c, n) => `<button class="ls-opt${pro ? '' : ' rk-ans'}" data-rk="palaceans" data-v="${esc(c)}">${pro ? '' : `<b>${'ABC'[n]}</b>`}${esc(c)}</button>`).join('')}</div>
        <button class="today-alt" data-rk="palaceans" data-v="">I don't know</button></div>`;
    }
    const L = t.palaceLast;
    if (!L || L.n !== ((g.dice && g.dice.n) || 0) || g.battle) return '';
    const Q = gameQuestion(L.q);
    return `<div class="rk-okbox${L.right ? '' : ' no'}"><b>${L.right ? `📜 You read the writing! Attack ${esc(G.name)} this turn.` : `📜 Not this time. The answer: ${esc(Q.q.right)}. Try again next turn.`}</b><span class="quiz-why">${linkRefs(Q.q.why, Q.home)}</span></div>`;
  }
  function riskMyCard(g, me) {
    const t = g.turn, pro = riskModeOf() === 'pro';
    if (t.phase === 'return') return riskReturnHtml(g, pro);
    const c = rk.cardPick && riskCard(rk.cardPick);
    if (c) return `${pro ? '' : riskStoryTop(g)}<div class="rk-cardinfo"><p class="rk-big rk-read">${c.icon} Tap one of your lands for ${esc(c.name)}.</p><p class="rk-note">${esc(c.does)}</p>
      <div class="rk-btns"><button class="btn ghost" data-rk="cardcancel">Cancel</button></div></div>`;
    return (pro ? riskProCard(g, me) : riskStoryCard(g, me)) + riskCardsHtml(g, me);
  }
  // Back from exile: a land nobody holds, tapped on the map.
  function riskReturnHtml(g, pro) {
    const say = (BOARD().moments || {}).returns;
    return `${pro ? '' : riskStoryTop(g)}${riskSayHtml(g)}<p class="rk-big rk-read">🕊️ Your kingdom comes back from exile!</p>
      <p class="rk-plain rk-read">Tap a glowing land nobody holds. You come back there with ${soldiers(RISK.returnArmies)}.</p>${say ? `<p class="rk-note">${linkRefs(say)}</p>` : ''}`;
  }
  // 📜 The prophecy cards in this player's hand: tap one to read it, then
  // Play it (or why it can't be played now).
  function riskCardsHtml(g, me) {
    const t = g.turn, hand = (g.hands || {})[me] || [];
    if (!hand.length || !['place', 'attack', 'move'].includes(t.phase) || g.battle || riskWatchingNow(g)) return '';
    const see = rk.cardSee && hand.includes(rk.cardSee) ? riskCard(rk.cardSee) : null, why = see && riskCardWhyNot(g, me, see.id);
    return `<div class="rk-cards"><div class="eyebrow">📜 Your prophecy cards</div>
      <div class="rk-cardrow">${hand.map(id => { const c = riskCard(id); return c ? `<button class="rk-pcard${see && see.id === id ? ' on' : ''}" data-rk="cardsee" data-v="${id}"><span aria-hidden="true">${c.icon}</span>${esc(c.name)}</button>` : ''; }).join('')}</div>
      ${see ? `<div class="rk-cardinfo"><p class="rk-plain rk-read">${see.icon} <b>${esc(see.name)}</b>: ${esc(see.does)}</p><p class="rk-note">${linkRefs(see.quote)}</p>
        ${why ? `<p class="rk-note"><b>Not now:</b> ${esc(why)}</p>` : `<div class="rk-btns two"><button class="btn" data-rk="cardplay" data-v="${see.id}">Play it</button><button class="btn ghost" data-rk="cardsee" data-v="">Not now</button></div>`}</div>` : ''}</div>`;
  }

  // Story: one step at a time, in plain words, with a good move shown. The
  // map takes one tap to put soldiers down; everything else is a big button.
  function riskStoryCard(g, me) {
    const t = g.turn, s = seatOf(g, me), top = riskStoryTop(g) + riskSteps(t), sel = rk.sel;
    const have = (g.insight || {})[me] || 0, insightBtn = !t.insight && have ? `<button class="btn ghost" data-rk="insight">💡 Show the odds (${have} left)</button>` : '';
    const coach = t.insight ? `<div class="rk-coach"><div class="eyebrow">💡 Insight</div>${riskCoach(g, me)}</div>` : '';
    if (t.phase === 'choose') {
      return `${top}${riskSayHtml(g)}<p class="rk-big rk-read">Your turn, ${esc(s.name)}!</p>
        <p class="rk-plain rk-read">First, answer a question. A right answer gets you soldiers.</p>
        <div class="rk-btns"><button class="rk-choice-btn" data-rk="level" data-v="easy"><b>Easy question</b><small>Get ${RISK.easy} soldiers</small></button>
        <button class="rk-choice-btn ghost" data-rk="level" data-v="hard"><b>Hard question</b><small>Find it in the reading. Get ${RISK.hard} soldiers${g.insightOn !== false ? ' and a 💡 insight' : ''}.</small></button></div>
        <p class="rk-note">Wrong answer? You still get ${soldiers(RISK.miss)}.</p>`;
    }
    if (t.phase === 'answer') {
      const Q = gameQuestion(t.q), read = t.level === 'hard' && riskReading(Q);
      return `${top}<div class="rk-qhead"><div class="eyebrow" style="color:var(--gold)">${riskQLabel(g, read)}</div>${t.limit ? `<div class="rk-clock" id="rkClock">${fmtClock(riskLeft(t))}</div>` : '<span class="rk-chip">No timer</span>'}</div>
        <p class="rk-q rk-bigq rk-read">${esc(Q.text)}</p>
        ${read ? `<a class="deep-open" href="${esc(read.url)}" target="_blank" rel="noopener noreferrer">Open ${esc(read.label)} ↗</a>` : ''}
        <div class="rk-btns">${riskChoices(t.q).map((c, n) => `<button class="ls-opt rk-ans" data-rk="ans" data-v="${esc(c)}"${sel.answered ? ' disabled' : ''}><b>${'ABC'[n]}</b>${esc(c)}</button>`).join('')}</div>
        <button class="today-alt" data-rk="ans" data-v=""${sel.answered ? ' disabled' : ''}>I don't know</button>`;
    }
    if (t.phase === 'place') {
      const Q = gameQuestion(t.q), r = t.result, n = t.armies, spot = riskGoodSpot(g, me);
      const extra = [r.bonus ? `+${r.bonus} for your lands` : '', ...(r.regions || []).map(x => `+${x.bonus} for ${esc(regionIn(x))}`), r.faint ? '+1 for the smallest kingdom' : '', r.saved ? `+${r.saved} you fortified` : '', r.insight ? '💡 You earned an insight' : ''].filter(Boolean).join(' · ');
      return `${top}<div class="rk-okbox${r.right ? '' : ' no'}"><b>${r.right ? `Right! You get ${soldiers(r.got)}.` : `${r.timeout ? 'Time’s up' : 'Not this time'}. The answer: ${esc(Q.q.right)}. You still get ${soldiers(r.got)}.`}</b>${extra ? `<small>${extra}</small>` : ''}<span class="quiz-why">${linkRefs(Q.q.why, Q.home)}</span></div>
        <p class="rk-big rk-read">Tap one of your lands. ${n === 1 ? 'Your soldier goes' : `All ${n} soldiers go`} there.</p>
        ${spot ? `<p class="rk-hint rk-read">⭐ ${esc(spot.text)}</p>` : ''}
        <p class="rk-ready">${'🛡️'.repeat(Math.min(n, 6))} ${soldiers(n)} ready</p>
        ${(t.placed || []).length ? '<div class="rk-btns"><button class="btn ghost" data-rk="unplace">↩️ Undo</button></div>' : ''}${insightBtn ? `<div class="rk-btns">${insightBtn}</div>` : ''}${coach}`;
    }
    const b = g.battle;
    if (t.phase === 'attack' && b && b.by === me) {
      const ds = seatOf(g, b.def), busy = riskLocked(rk.rollSent, b.n + '|' + b.shown) ? ' disabled' : '';
      let words;
      if (!b.d) words = `<p class="rk-plain rk-read">${esc(ds ? ds.name : 'The defender')} is rolling for ${esc(landName(b.to))}'s guards…</p><p class="rk-note">Their dice roll by themselves in <b id="rkDefClock">${riskDefLeft(b)}</b>s.</p>`;
      else if (!b.shown) words = `<p class="rk-plain rk-read">${esc(landName(b.to))}'s guards rolled ${andList(b.d)}. ${esc(riskKidIntro(b, 'you', 'their'))}</p><p class="rk-note rk-need">${esc(riskNeed(b, 'you', 'their', true))}</p>`;
      else { const st = riskKidStory(b, 'you', 'their'); words = `<p class="rk-plain rk-story rk-read">${esc(st.line)}</p>${st.next ? `<p class="rk-note rk-need">${esc(st.next)}</p>` : ''}`; }
      return `${top}<p class="rk-big">⚔️ Battle for ${esc(landName(b.to))}!</p>${b.story ? riskSayBox(b.story) : ''}${riskBattleHtml(g, me)}${words}
        <p class="rk-rules"><span>Bigger number wins</span><span>Same number? The guards win.</span></p>
        ${b.d ? riskTrayHtml('roll', b.a.length - b.shown, 'att', `🎲 Roll! (${b.shown + 1} of ${b.a.length})`, busy) : ''}
        <div class="rk-btns"><button class="btn ghost" data-rk="advice" aria-expanded="${!!rk.advice}">🤔 What do I need?</button></div>
        ${rk.advice ? `<div class="rk-advice">${riskAdvice(g)}</div>` : ''}`;
    }
    if (t.phase === 'attack' && riskWatchingNow(g)) return top + riskWatchBox(g);
    if (t.phase === 'attack' && t.palaceQ) return top + riskSayHtml(g) + riskPalaceHtml(g, me, false);
    if (t.phase === 'attack') {
      const d = g.dice, settled = riskDiceHtml(g, me), targets = riskTargets(g, me), B = BOARD(), G = riskGuard(g);
      const won = settled && d && d.won && d.by === me ? `<p class="rk-big rk-won">🎉 ${esc(landName(d.to))} is yours!</p>` : '';

  /* ---------------- family: accounts, progress, chat ---------------- */

  // A family is optional. Without one, everything stays on this device
  // exactly as before. With one:
  //   - Parents and other grown-ups sign in with Google or an email link.
  //     Children don't sign in: a parent makes a one-time link, and opening
  //     it on the child's phone or tablet joins that device as the child.
  //   - Each person's progress is saved to the family, so a new device
  //     picks up where the old one left off, and everyone sees how the
  //     week is going.
  //   - One family chat. Everyone in it sees every message; there are no
  //     private messages, links or photos. A parent can hide a message:
  //     everyone sees that it was hidden, and parents can still read it.
  // firestore.rules is what actually enforces all of this.
  const FAM_KEY = NS + 'family';        // this device's place in a family
  const INVITE_DAYS = 7;
  const LINKS = /(https?:|www\.|[a-z0-9-]+\.(com|net|org|io|ly|gg|tv|me|co|app|us|xyz|link|site|info|biz)([^a-z]|$))/i;

  let pendingAdopt = null, adoptTimer = null, claimAsked = false;

  function loadFam() {

  // The Family tab is the family's way in: signed out, it offers sign-in and

  // On boot: a device already in a family connects in the background to

  // A parent on a new phone: the account remembers which family it's in.

  /* ----- progress: whose it is, saved to the family, merged across devices ----- */

  // Progress lives on the device (S). S.owner says whose it is: a family
  // member's pid, or null for progress not linked to anyone (a device used
  // before it joined a family). A device only ever saves or loads its
  // owner's family copy, so a different person signing in never mixes two

  const slotKey = owner => STORE_KEY + '@' + (owner || 'local');
